# Deny linter for host Python under scripts/. Formatter stays off.
target-version = "py311"
src = ["../scripts"]
extend-exclude = ["../_build", "../_cache", "../node_modules", "../site/dist"]

[lint]
select = ["ALL"]
ignore = [
  # Missing annotations / docstring / quote / import-sort / trailing-comma.
  # Same reason Biome's formatter is off: this gate is not a rewrite of style.
  "ANN",
  "C4",
  "C901",
  "COM812",
  "D",
  "E501",
  "EM101",
  "EM102",
  "FBT",
  "FURB",
  "I001",
  "ISC",
  "N",
  "PERF",
  "PIE",
  "PLC0415",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  # Host gates inspect returncode themselves and invoke known argv tools.
  "PLW1510",
  "PT",
  "PTH",
  "Q",
  "RET504",
  "RUF005",
  "RUF015",
  "S101",
  "S603",
  "S607",
  "SIM",
  "T201",
  "T203",
  "TRY003",
  "TRY004",
  "TRY301",
  "UP006",
  "UP015",
  "UP022",
  "UP035",
  "UP037",
  "UP045",
]
