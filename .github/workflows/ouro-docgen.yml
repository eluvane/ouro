name: Docgen (diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [codef/list-builder-after-collect-docgen]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  generate-api:
    name: Generate API reference
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_CCACHE: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Generate API reference
        run: sh scripts/doc_suite.sh --regen

      - name: Upload generated API reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-api-${{ github.sha }}
          path: docs/api/*.md
          if-no-files-found: error
          retention-days: 14
