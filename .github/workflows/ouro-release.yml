name: Release

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      run_profile:
        description: Local CI profile to run before packaging
        required: true
        type: choice
        default: manual
        options:
          - manual
          - kernel
          - stage-loop
      package_only:
        description: Build release package but do not publish a GitHub Release
        required: true
        type: boolean
        default: true
      weekly_snapshot:
        description: Publish a weekly main snapshot after packaging
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ouro-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  groups:
    name: Select groups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select complete profile inventory
        id: groups
        env:
          PROFILE: ${{ inputs.run_profile || 'manual' }}
        run: |
          matrix=$(python3 scripts/ci_gate.py --profile "$PROFILE" --list-groups)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  release-validation:
    name: Validate (${{ matrix.group }})
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.matrix) }}
    permissions:
      contents: read
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "10"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
      OURO_STAGE_MAX: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install check tools
        run: |
          python3 -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Run checks
        env:
          PROFILE: ${{ inputs.run_profile || 'manual' }}
          GROUP: ${{ matrix.group }}
        run: python3 scripts/ci_gate.py --profile "$PROFILE" --group "$GROUP" --out "_build/ci/release-$PROFILE-$GROUP"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-${{ matrix.group }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.txt
            _build/**/*.err
            _build/**/*.sarif
            _build/**/*.md
            _build/**/gate.log

  release-gates-and-package:
    name: Build
    needs: release-validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "10"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
      OURO_STAGE_MAX: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show context
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          cc --version || true
          git --no-pager log -1 --oneline || true
          git status --short

      - name: Check project
        run: python3 scripts/github_project_gate.py --work _build/github_project_gate

      - name: Build package metadata
        run: |
          args=(--out _build/release)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--expect-tag "$GITHUB_REF_NAME")
          fi
          python3 scripts/release_package.py "${args[@]}"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-meta-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            _build/release/ouro-*-release-manifest.json
            _build/release/release-notes.md

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-logs-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.txt
            _build/**/*.err
            _build/**/*.sarif
            _build/**/*.md
            _build/**/gate.log

  toolchain:
    name: Toolchain
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin
          - os: macos-latest
            platform: darwin_aarch64
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux_aarch64
          - os: windows-latest
            platform: windows
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "10"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up packaging Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Windows gcc
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          choco install mingw --yes --no-progress
          found=""
          for d in \
            /c/ProgramData/mingw64/mingw64/bin \
            /c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin \
            /c/mingw64/bin
          do
            if [ -x "$d/gcc.exe" ]; then
              echo "$d" >> "$GITHUB_PATH"
              export PATH="$d:$PATH"
              found=1
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "release toolchain: gcc not found after MinGW install" >&2
            exit 1
          fi
          gcc --version

      - name: Build host compiler
        run: |
          set -euo pipefail
          python -m venv _build/release-venv
          if [ -x _build/release-venv/bin/python ]; then
            PYTHON="$PWD/_build/release-venv/bin/python"
          else
            PYTHON="$PWD/_build/release-venv/Scripts/python.exe"
          fi
          "$PYTHON" -m pip install --disable-pip-version-check --quiet zstandard==0.23.0
          "$PYTHON" --version
          cc --version || gcc --version
          "$PYTHON" scripts/ouro_build.py build --verbosity quiet
          compiler="_build/c/ouro1"
          if [ ! -f "$compiler" ] && [ -f "${compiler}.exe" ]; then
            compiler="${compiler}.exe"
          fi
          if [ ! -f "$compiler" ]; then
            echo "release toolchain: host compiler missing after build: $compiler" >&2
            exit 1
          fi
          "$PYTHON" scripts/release_package.py \
            --toolchain \
            --platform "${{ matrix.platform }}" \
            --compiler "$compiler" \
            --out _build/release

      - name: Upload toolchain archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            _build/release/ouro-*-${{ matrix.platform }}.tar.zst
            _build/release/ouro-*-${{ matrix.platform }}.zip

  assemble-release-files:
    name: Assemble
    runs-on: ubuntu-latest
    needs:
      - release-gates-and-package
      - toolchain
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-meta-${{ github.run_id }}
          path: _build/gh_release

      - name: Download toolchains
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: toolchain-*
          path: _build/gh_release
          merge-multiple: true

      - name: Verify archives and checksums
        run: python3 scripts/release_package.py --verify-dir --checksums-only --out _build/gh_release

      - name: Upload assembled release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: _build/gh_release/*

  publish-draft-release:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - assemble-release-files
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files-${{ github.run_id }}
          path: _build/release_bundle

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find _build/release_bundle -type f | sort
          test -f _build/release_bundle/SHA256SUMS
          test -f _build/release_bundle/release-notes.md
          mapfile -t archives < <(find _build/release_bundle -maxdepth 1 -type f \( -name 'ouro-*.tar.zst' -o -name 'ouro-*.zip' \) | sort)
          test "${#archives[@]}" -eq 10
          gh release create "$GITHUB_REF_NAME" \
            "${archives[@]}" \
            _build/release_bundle/ouro-*-release-manifest.json \
            _build/release_bundle/SHA256SUMS \
            _build/release_bundle/release-notes.md \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file _build/release_bundle/release-notes.md

  publish-weekly-release:
    name: Weekly
    runs-on: ubuntu-latest
    needs:
      - assemble-release-files
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.weekly_snapshot)) }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files-${{ github.run_id }}
          path: _build/release_bundle

      - name: Publish weekly snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find _build/release_bundle -type f | sort
          test -f _build/release_bundle/SHA256SUMS
          mapfile -t archives < <(find _build/release_bundle -maxdepth 1 -type f \( -name 'ouro-*.tar.zst' -o -name 'ouro-*.zip' \) | sort)
          test "${#archives[@]}" -eq 10
          tag="weekly-$(date -u +%Y%m%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'weekly snapshot already published: %s\n' "$tag"
            exit 0
          fi
          prev="$(gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("weekly-"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty')"
          notes="_build/weekly-notes.md"
          mkdir -p _build
          if [ -n "$prev" ]; then
            git fetch origin "refs/tags/${prev}:refs/tags/${prev}"
            if [ "$(git rev-list --count "${prev}..HEAD")" = "0" ]; then
              printf 'no commits since %s\n' "$prev"
              exit 0
            fi
            {
              printf '# Weekly snapshot %s\n\n' "$tag"
              printf "Automatic host toolchain snapshot of \`main\` at \`%s\`.\n" "$(git rev-parse --short HEAD)"
              printf 'Project version is unchanged. This is not a semver release.\n\n'
              printf '## Changes since %s\n\n' "$prev"
              git log --pretty=format:'- %s (%h)' "${prev}..HEAD"
              printf '\n'
            } > "$notes"
          else
            if [ "$(git rev-list --count --since='8 days ago' HEAD)" = "0" ]; then
              printf 'no commits in the last 8 days\n'
              exit 0
            fi
            {
              printf '# Weekly snapshot %s\n\n' "$tag"
              printf "Automatic host toolchain snapshot of \`main\` at \`%s\`.\n" "$(git rev-parse --short HEAD)"
              printf 'Project version is unchanged. This is not a semver release.\n\n'
              printf '## Changes\n\n'
              git log --pretty=format:'- %s (%h)' --since='8 days ago' HEAD
              printf '\n'
            } > "$notes"
          fi
          gh release create "$tag" \
            "${archives[@]}" \
            _build/release_bundle/ouro-*-release-manifest.json \
            _build/release_bundle/SHA256SUMS \
            --latest=false \
            --title "Weekly $tag" \
            --notes-file "$notes"
