name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      run_profile:
        description: Local CI profile to run before packaging
        required: true
        type: choice
        default: manual
        options:
          - manual
          - kernel
          - stage-loop
      package_only:
        description: Build release package but do not publish a GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ouro-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-gates-and-package:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "10"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
      OURO_STAGE_MAX: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show context
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          cc --version || true
          git --no-pager log -1 --oneline || true
          git status --short

      - name: Check project
        run: python3 scripts/github_project_gate.py --work _build/github_project_gate

      - name: Run checks
        run: |
          profile="${{ inputs.run_profile || 'manual' }}"
          python3 scripts/ci_gate.py --profile "$profile" --out "_build/ci/release-$profile"

      - name: Build package
        run: |
          args=(--out _build/release)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--expect-tag "$GITHUB_REF_NAME")
          fi
          python3 scripts/release_package.py "${args[@]}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            _build/release/**
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.txt
            _build/**/*.err
            _build/**/*.sarif
            _build/**/*.md
            _build/**/gate.log

  publish-draft-release:
    name: Publish
    runs-on: ubuntu-latest
    needs: release-gates-and-package
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: _build/release_bundle

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find _build/release_bundle -type f | sort
          test -f _build/release_bundle/release/SHA256SUMS
          test -f _build/release_bundle/release/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            _build/release_bundle/release/ouro-*-source.tar.gz \
            _build/release_bundle/release/ouro-*-source.zip \
            _build/release_bundle/release/ouro-*-release-manifest.json \
            _build/release_bundle/release/SHA256SUMS \
            _build/release_bundle/release/release-notes.md \
            --draft \
            --verify-tag \
            --title "Ouro $GITHUB_REF_NAME" \
            --notes-file _build/release_bundle/release/release-notes.md
