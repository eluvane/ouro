name: Dependencies

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ouro-dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dependency-review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_gate.py --select-paths --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Select dependency manifests
        id: dependency-manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=false
          while IFS= read -r -d '' path; do
            case "$path" in
              Ouro.seal|editors/vscode/package.json|editors/vscode/package-lock.json|site/package.json|site/package-lock.json)
                changed=true
                ;;
            esac
          done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" --)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "DEPENDENCY_MANIFESTS changed=$changed"

      - name: Dependency review
        if: ${{ steps.dependency-manifests.outputs.changed == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Check workflows
        if: ${{ steps.changes.outputs.dependency == 'true' }}
        run: python3 scripts/github_workflow_gate.py --work _build/github_workflow_gate

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependencies
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.txt
            _build/**/*.sarif
            _build/**/*.md
