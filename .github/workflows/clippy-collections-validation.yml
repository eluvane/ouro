name: Clippy collections validation

on:
  push:
    branches: [clippy/collections-performance-expansion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clippy-collections-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semantic:
    if: github.repository == 'eluvane/ouro'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: "1"
      OURO_JOBS: "2"
      OURO_CCACHE: disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native Clippy check
        run: sh scripts/ouro1.sh check tools/clippy/main.ouro 60000
      - name: Targeted native semantic laws
        if: always()
        run: python3 scripts/clippy_grade_suite.py --laws-only --out _build/quality/collections-laws
      - name: Targeted semantic identity fixtures
        if: always()
        run: python3 scripts/clippy_grade_suite.py --precision-only --out _build/quality/collections-precision
      - name: Clippy grade suite
        if: always()
        run: python3 scripts/clippy_grade_suite.py
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: collections-validation-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.stdout
            _build/**/*.stderr
