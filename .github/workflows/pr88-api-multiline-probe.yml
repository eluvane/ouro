name: Multiline API signature probe

on:
  push:
    branches: [ codef/pr88-api-multiline-probe ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr88-api-multiline-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  PRODUCT_SHA: 75accf1b3461e6c28db66a622eec689e24cc9c16
  BASE_SHA: 83daa56fafb7aa56ffd5fa9ab687c2d867aa1ddf

jobs:
  api:
    name: "API signatures (${{ matrix.check }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [ focused, analyzer, analysis, python ]
    steps:
      - name: Checkout diagnostic child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Verify lineage and exact product blobs
        run: |
          set -euo pipefail
          mkdir -p _build/ci/api-multiline
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/pr88-api-multiline-probe.yml
          test "$(git rev-parse "$PRODUCT_SHA^")" = "$BASE_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          product = os.environ["PRODUCT_SHA"]
          base = os.environ["BASE_SHA"]
          blobs = {
              "CHANGELOG.md": "046364bed1a8feb04881debdfc7d678680716b37",
              "docs/ci.md": "d5d3a007dc018bb6c3c1ef00d1860ff75e09bb2f",
              "docs/quality.md": "13cb9bcb9f1aeaa0fe21bd9dd1777d07075b7aca",
              "quality/api_surface.tsv": "8233582413aee81dfb2ca1bef355fe3ef37a332a",
              "scripts/api_baseline_regen.py": "3fde14909a852897117000207e445ed88906baba",
              "scripts/api_baseline_regen_test.py": "0528a766c8150644bc3ccbb0fee10659c6cee624",
              "tests/analyze/api_surface.tsv": "9d4d3d315b71b3f693e923caad08d4423fa4c135",
              "tests/analyze/api_surface_bad/public.ouro": "5dcb1370bffe964c2ac03c58457874ec882b2936",
              "tests/analyze/api_surface_good/public.ouro": "55395a204a4aa2b9c99dcbf161b6cf93df0788c2",
              "tests/analyze/golden/api_surface_bad.txt": "c2e5251dad9efd5ffa161742f85582c51a6238d4",
              "tests/analyze/golden/api_surface_good.txt": "ededafb1820fffe778303a80f8ebd9414740f138",
              "tests/analyze/precision/imports.ouro": "2d801cab107ecdd3e6c5926647cf70ce3a940472",
              "tools/analyze/extract.ouro": "98ed1712a2d2579aeaf7b465b2511ecadc3fc569",
              "tools/analyze/main.ouro": "c3e381a1fb791355ae21e067cf16927980c0e5ee",
              "scripts/analyze_precision_suite.sh": "9122ae9507eb3358b62e4519d0892d8055d5a127",
              "scripts/analyze_core_checks.py": "7bcd6e929af98d34c731197f9b81ad53ecae7e90",
              "scripts/build_tool.sh": "ff83eec44937a8d9aa37c5af67aae2d57b93f4c3",
              "scripts/ci_gate.py": "16ea86bf60a3d3347c30af2f562a6b6b500b89ef",
              "scripts/native_tool_build.py": "0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce",
              "scripts/bootstrap_compiler.py": "937f93c11a055e42c0ecb22f8c10fce2d748817c",
              "scripts/ouro1.sh": "9665ebb00049d05c097a29d77ec5083b524f9e2d",
          }
          paths = subprocess.check_output(["git", "diff", "--name-only", base, product], text=True).splitlines()
          assert paths == sorted(list(blobs)[:14]), paths
          for path, expected in blobs.items():
              actual = subprocess.check_output(["git", "rev-parse", product + ":" + path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          report = {"workflow_sha": os.environ["GITHUB_SHA"], "product_sha": product,
                    "base_sha": base, "product_tree": subprocess.check_output(
                        ["git", "rev-parse", product + "^{tree}"], text=True).strip(),
                    "changed_paths": paths, "blobs": blobs,
                    "host_run": 36357871841, "host_artifact": 10945092404}
          Path("_build/ci/api-multiline/source.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
          git checkout --detach "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Select canonical gates from the product diff
        id: source
        run: |
          set -euo pipefail
          python3 scripts/ci_gate.py --select-paths --base "$BASE_SHA" --head "$PRODUCT_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Verify the source-bound Linux compiler input key
        if: ${{ matrix.check != 'python' }}
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci_gate.py --compiler-artifact key >_build/ci/api-multiline/key.stdout 2>_build/ci/api-multiline/key.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/api-multiline/key.rc
          cat _build/ci/api-multiline/key.stdout
          cat _build/ci/api-multiline/key.stderr >&2
          test "$rc" -eq 0
          test "$(cat _build/ci/api-multiline/key.stdout)" = key=321c369d5ad5efe4b8c26cbd47c80973a223f750189a4bf0fe3d9814041ad428

      - name: Download verified Host compiler
        if: ${{ matrix.check != 'python' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10945092404
          run-id: 36357871841
          github-token: ${{ github.token }}
          path: _build/ci
          merge-multiple: true

      - name: Verify and install the official Host artifact
        id: import
        if: ${{ matrix.check != 'python' }}
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 3435db2adf6ab885c4279e56f2b2d24e0f54117cb997784bf12fdbe52567044d >_build/ci/api-multiline/import.stdout 2>_build/ci/api-multiline/import.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/api-multiline/import.rc
          cat _build/ci/api-multiline/import.stdout
          cat _build/ci/api-multiline/import.stderr >&2
          test "$rc" -eq 0
          grep -Fx 'CI_COMPILER: PASS current source, host compiler, binary and bootstrap evidence' _build/ci/api-multiline/import.stdout
          sha256sum _build/c/ouro1 >_build/ci/api-multiline/compiler.sha256
          test "$(cut -d ' ' -f 1 _build/ci/api-multiline/compiler.sha256)" = f3ff7228e72b20d4c065ea079e6716dcb4012280e203123900383b444916f5e7

      - name: Check the owning native source and precision root
        if: ${{ always() && matrix.check == 'focused' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          python3 scripts/analyze_core_checks.py --out _build/ci/api-multiline/core tools/analyze/extract.ouro tests/analyze/precision/imports.ouro >_build/ci/api-multiline/core.stdout 2>_build/ci/api-multiline/core.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/api-multiline/core.rc
          cat _build/ci/api-multiline/core.stdout
          cat _build/ci/api-multiline/core.stderr >&2
          test "$rc" -eq 0

      - name: Run all 19 native import and API header laws
        if: ${{ always() && matrix.check == 'focused' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          OURO_BUILD_TOOL_MODE=native sh scripts/build_tool.sh tests/analyze/precision/imports.ouro _build/ci/api-multiline/precision-imports >_build/ci/api-multiline/precision-build.stdout 2>_build/ci/api-multiline/precision-build.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/api-multiline/precision-build.rc
          cat _build/ci/api-multiline/precision-build.stdout
          cat _build/ci/api-multiline/precision-build.stderr >&2
          test "$rc" -eq 0
          set +e
          _build/ci/api-multiline/precision-imports >_build/ci/api-multiline/precision.stdout 2>_build/ci/api-multiline/precision.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/api-multiline/precision.rc
          cat _build/ci/api-multiline/precision.stdout
          cat _build/ci/api-multiline/precision.stderr >&2
          test "$rc" -eq 0
          test "$(grep -c '^PRECISION_OK ' _build/ci/api-multiline/precision.stdout)" -eq 19
          grep -Fx 'PRECISION_SUITE imports rows=19' _build/ci/api-multiline/precision.stdout
          ! grep -q 'PRECISION_FAIL' _build/ci/api-multiline/precision.stdout _build/ci/api-multiline/precision.stderr

      - name: Compare strict API positive and negative fixtures with exact goldens
        if: ${{ always() && matrix.check == 'focused' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          for form in good bad; do
            set +e
            sh scripts/ouro1.sh analyze --strict --include-fixtures --api-baseline tests/analyze/api_surface.tsv --scope "tests/analyze/api_surface_$form" >"_build/ci/api-multiline/api-$form.raw" 2>"_build/ci/api-multiline/api-$form.stderr"
            rc=$?
            set -e
            printf '%s\n' "$rc" >"_build/ci/api-multiline/api-$form.rc"
            tr -d '\r' <"_build/ci/api-multiline/api-$form.raw" >"_build/ci/api-multiline/api-$form.stdout"
            cat "_build/ci/api-multiline/api-$form.stdout"
            cat "_build/ci/api-multiline/api-$form.stderr" >&2
          done
          test "$(cat _build/ci/api-multiline/api-good.rc)" -eq 0
          test "$(cat _build/ci/api-multiline/api-bad.rc)" -eq 1
          diff -u tests/analyze/golden/api_surface_good.txt _build/ci/api-multiline/api-good.stdout >_build/ci/api-multiline/api-good.diff
          diff -u tests/analyze/golden/api_surface_bad.txt _build/ci/api-multiline/api-bad.stdout >_build/ci/api-multiline/api-bad.diff
          grep -F 'public.ouro:9:5: error[OURO-API003]' _build/ci/api-multiline/api-bad.stdout
          ! grep -q '^ANALYZE_OK ' _build/ci/api-multiline/api-bad.stdout

      - name: Run the complete canonical PR group
        if: ${{ matrix.check == 'analyzer' || matrix.check == 'analysis' }}
        env:
          CHANGED_PATHS: ${{ steps.source.outputs.changed_paths }}
          SELECTION_KEY: ${{ steps.source.outputs.selection_key }}
          CI_GROUP: ${{ matrix.check }}
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci_gate.py --profile pr --group "$CI_GROUP" --changed-paths-json "$CHANGED_PATHS" --selection-key "$SELECTION_KEY" --out "_build/ci/pr-$CI_GROUP" >_build/ci/api-multiline/group.stdout 2>_build/ci/api-multiline/group.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/api-multiline/group.rc
          cat _build/ci/api-multiline/group.stdout
          cat _build/ci/api-multiline/group.stderr >&2
          test "$rc" -eq 0

      - name: Run Python header laws and complete baseline drift check
        if: ${{ matrix.check == 'python' }}
        run: |
          set -euo pipefail
          set +e
          python3 scripts/api_baseline_regen_test.py >_build/ci/api-multiline/python.stdout 2>_build/ci/api-multiline/python.stderr
          tests_rc=$?
          python3 scripts/api_baseline_regen.py --check --report _build/ci/api-multiline/api-baseline.json >_build/ci/api-multiline/baseline.stdout 2>_build/ci/api-multiline/baseline.stderr
          baseline_rc=$?
          set -e
          printf '%s\n' "$tests_rc" >_build/ci/api-multiline/python.rc
          printf '%s\n' "$baseline_rc" >_build/ci/api-multiline/baseline.rc
          cat _build/ci/api-multiline/python.stdout _build/ci/api-multiline/baseline.stdout
          cat _build/ci/api-multiline/python.stderr _build/ci/api-multiline/baseline.stderr >&2
          test "$tests_rc" -eq 0
          test "$baseline_rc" -eq 0
          grep -E '^Ran 10 tests in ' _build/ci/api-multiline/python.stderr

      - name: Verify the imported compiler remains unchanged
        if: ${{ always() && matrix.check != 'python' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          sha256sum --check _build/ci/api-multiline/compiler.sha256

      - name: Upload complete source and suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-multiline-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/ci/api-multiline/
            _build/ci/pr-analyzer/
            _build/ci/pr-analysis/
            _build/analyze_precision/
            _build/memory/
            _build/c_static_analysis/
            _build/lsp_suite/
            _build/api_baseline/
            _build/c/ouro1.bootstrap.json
            _build/bootstrap/**/inputs.json
            _build/bootstrap/**/report.json
          if-no-files-found: error
          retention-days: 14
