      - name: Relink immutable P2 C with only the disposable observer
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from ourosmith.limits import run_limited
          out=Path('_build/ci/native-lower-bounds-observer')
          argv=[sys.executable,'-B','_build/diag-inputs/relink_diagnostic.py',
                '--checkout',str(Path.cwd()),'--observed-link','_build/diag-inputs/frontend_link.observed.c']
          launcher=['sh','-c','ulimit -s unlimited 2>/dev/null || true; exec "$@"','diagnostic-relink',*argv]
          child_env=dict(os.environ,OURO_JOBS='1',OURO_FRONTEND_JOBS='1',
                         OURO_CACHE='0',OURO_ROOT=str(Path.cwd()),PYTHONDONTWRITEBYTECODE='1')
          allowed=os.sched_getaffinity(0)
          os.sched_setaffinity(0,{min(allowed)})
          record={'phase':'diagnostic-relink','status':'running','pass':False,'argv':argv,
                  'policy':{'timeout_s':1800,'memory_mib':3072,'cpu_count':1,'stack':'stock unlimited'}}
          def save():
              (out/'relink.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          try:
              result=run_limited(launcher,timeout_s=1800,memory_mb=3072,
                                 cwd=Path.cwd(),env=child_env,stdin_text='')
              (out/'relink.stdout').write_text(result.stdout)
              (out/'relink.stderr').write_text(result.stderr)
              (out/'relink.rc').write_text(str(result.returncode)+'\n')
              record.update(status=result.status,rc=result.returncode,elapsed_s=result.elapsed_s,
                            peak_rss_mb=result.peak_rss_mb,peak_rss_measured=False,**{'pass':result.ok})
              save()
              assert result.ok,record
          finally:
              os.sched_setaffinity(0,allowed)
          PY

      - name: Require exact stock and default observer GOOD BAD protocols
        run: |
          set -euo pipefail
          OURO_MEM_TRACE=0 python3 -B _build/diag-inputs/run_default_controls.py --checkout "$PWD"

