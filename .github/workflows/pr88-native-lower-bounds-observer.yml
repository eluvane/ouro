name: Native lowering bounded callback observation

on:
  push:
    branches: [codef/pr88-native-lower-bounds-observer]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr88-native-lower-bounds-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "1"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  SOURCE_SHA: 4af755e9d63c5489ae1c376d080a2928c769f34b
  SOURCE_TREE_SHA: 590089efcd041ff37d27394e8df48bd3c6493cca
  SOURCE_INPUTS_HASH: cd58e3667cf71953dfa6aabb0790f1705853610419765662c1c0c45be78e90ed
  COLLECT_CORE_BLOB: 19199382403083ae7fa030f9ae12e8e7f2f0c718
  BRIDGE_MANIFEST_BLOB: c02f937d0b9f260b8d1a75906f6df7a3ee5cb567
  BRIDGE_ARCHIVE_BLOB: 3c8842972f03032ff8661b5b7feeaf30a04961fb
  PREPROCESS_RECORD_EXPR_BLOB: 68f0bbc269cea67164c89a168b648606958c7603
  NATIVE_LOWER_BLOB: 31cede9df5ee2f5257ff68ccd7a1735b5deeccfe
  UNIT_LIST_SHA256: 922d005625231872baef23ff332e7f5f7db8a423131614415baea7934dd4078c
  PRODUCER_RUN: "36398476620"
  PRODUCER_SHA: 2a49d56c99a4f5b6ced1fda992c37f79e67f8045
  HOST_JOB: "108850407925"
  HOST_ARTIFACT: "10960212688"
  HOST_ZIP_SHA256: 82e3d136dd8562b41c549607dade2715f749936d2f0e2f99c959d46f2033f86e
  HOST_ARCHIVE_SHA256: a7f4d757c2babd472889528321fad9c865014e09627a419d62426d12b4739c1e
  HOST_BINARY_SHA256: 8aeb79293661c123de7b3f021d34dc77c60598fd9c7dc5702d71d2eed9afe814
  HOST_KEY: 92e2bc0e98a475bf262cc67ec3f9cf6394d3b3e96459b28f84ef550e0ec16a6e

  STOCK_RUN: "36407834479"
  STOCK_SHA: e5ce7557337194b75d5f4162bbe06c1e5ab032ac
  STOCK_JOB: "108880699994"
  STOCK_ARTIFACT: "10963083629"
  STOCK_ZIP_SHA256: 7b80ce520d061574a0a8c4a97dac1c50d7d07a9382f59a7254705f6d3fb2b0cf
  OBSERVED_LINK_SHA256: 1162a2e2e49f5f52f2830f7cb7c91b271cd944cfef69d00701b6f11f2e489071
  OBSERVED_PATCH_SHA256: 5c0925709929b771517840abe313f5a193d0033b64a207acdb8563e80244f85b

jobs:
  native-lower-bounds:
    name: Verified P2 bounds observer
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Require workflow-only child and exact complete source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/pr88-native-lower-bounds-observer.yml
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE_SHA"
          test "$(git rev-parse "$SOURCE_SHA:tools/collect_core.ouro")" = "$COLLECT_CORE_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:compiler/bootstrap/c-bootstrap-v1.json")" = "$BRIDGE_MANIFEST_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:compiler/bootstrap/c-bootstrap-v1.tar.gz")" = "$BRIDGE_ARCHIVE_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:compiler/preprocess_record_expr.ouro")" = "$PREPROCESS_RECORD_EXPR_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:tests/native_lower_tests.ouro")" = "$NATIVE_LOWER_BLOB"
          git checkout --detach "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p _build/ci/native-lower-bounds-observer
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import frontend_regen as frontend
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          out = Path('_build/ci/native-lower-bounds-observer')
          units = frontend.collect_units('tests/native_lower_tests.ouro')
          listing = ''.join(unit+'\n' for unit in units)
          paths = sorted(set(units) | {'tools/collect.ouro', 'tools/collect_core.ouro',
              'scripts/ouro1.sh', 'scripts/build_tool.sh', 'scripts/native_tool_build.py',
              'scripts/frontend_regen.py', 'scripts/ourosmith/limits.py', 'scripts/ourosmith/exec_child.py',
              'tools/test/process_model.ouro', 'tools/native_sibling_model.ouro',
              'runtime/bootstrap.c', 'runtime/frontend_link.c', 'runtime/ouro_rt.c'})
          rows = [{'path': path, 'blob': git('rev-parse', 'HEAD:'+path),
                   'sha256': hashlib.sha256(Path(path).read_bytes()).hexdigest()} for path in paths]
          (out/'source.json').write_text(json.dumps({'workflow_sha': os.environ['GITHUB_SHA'],
              'source_sha': git('rev-parse', 'HEAD'), 'source_tree': git('rev-parse', 'HEAD^{tree}'),
              'ordered_units': units, 'inputs': rows}, indent=2, sort_keys=True)+'\n')
          (out/'expected.units').write_text(listing)
          assert len(units) == 172 and len(set(units)) == 172
          assert units[-1] == 'tests/native_lower_tests.ouro'
          assert hashlib.sha256(listing.encode()).hexdigest() == os.environ['UNIT_LIST_SHA256']
          PY

      - name: Require exact successful collection and allocator OOM stock evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          out = Path('_build/ci/native-lower-bounds-observer')
          def api(path, name):
              raw = subprocess.check_output(['gh','api','repos/eluvane/ouro/'+path])
              (out/name).write_bytes(raw)
              return json.loads(raw)
          run = api('actions/runs/'+os.environ['STOCK_RUN'],'stock-run.json')
          jobs = api('actions/runs/'+os.environ['STOCK_RUN']+'/jobs?per_page=100','stock-jobs.json')
          items = api('actions/runs/'+os.environ['STOCK_RUN']+'/artifacts?per_page=100','stock-artifacts.json')
          assert run['head_sha'] == os.environ['STOCK_SHA'] and run['status'] == 'completed' and run['run_attempt'] == 1
          job = [j for j in jobs['jobs'] if j['id'] == int(os.environ['STOCK_JOB'])]
          assert len(job) == 1 and job[0]['status'] == 'completed' and job[0]['conclusion'] == 'failure'
          name = 'native-lower-memory-phases-36407834479-1'
          matches = [a for a in items['artifacts'] if a['name'] == name]
          assert len(matches) == 1
          record = api('actions/artifacts/'+os.environ['STOCK_ARTIFACT'],'stock-artifact.json')
          assert matches[0]['id'] == record['id'] == int(os.environ['STOCK_ARTIFACT']) and not record['expired']
          assert record['name'] == name and record['workflow_run']['id'] == int(os.environ['STOCK_RUN'])
          assert record['workflow_run']['head_sha'] == os.environ['STOCK_SHA']
          assert record['digest'] == 'sha256:'+os.environ['STOCK_ZIP_SHA256']
          archive = out/'stock-phases.zip'
          with archive.open('wb') as stream:
              subprocess.run(['gh','api','repos/eluvane/ouro/actions/artifacts/'+os.environ['STOCK_ARTIFACT']+'/zip'],
                             check=True,stdout=stream)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['STOCK_ZIP_SHA256']
          current = json.loads((out/'source.json').read_text())
          with zipfile.ZipFile(archive) as zipped:
              def report(name): return json.loads(zipped.read(name))
              source, manifest = report('source.json'), report('manifest.json')
              assert source['workflow_sha'] == manifest['workflow_sha'] == os.environ['STOCK_SHA']
              for field in ('source_sha','source_tree','ordered_units','inputs'):
                  assert source[field] == manifest[field] == current[field]
              listing = (out/'expected.units').read_bytes()
              assert zipped.read('expected.units') == zipped.read('actual.units') == listing
              assert hashlib.sha256(listing).hexdigest() == os.environ['UNIT_LIST_SHA256']
              assert manifest['pass'] is False and manifest['check_only'] is True
              assert len(manifest['integrity']) == 5 and all(v is True for v in manifest['integrity'].values())
              for phase in ('collector-build','collection'):
                  row = manifest['processes'][phase]
                  assert row['status'] == 'ok' and row['rc'] == 0 and not row['allocator_oom']
              checked = manifest['processes']['compiler-check']
              assert checked['status'] == 'ok' and checked['rc'] == 1 and checked['allocator_oom'] is True
              expected = ['_build/c/ouro1','check','tests/native_lower_tests.ouro','999999']
              for unit in current['ordered_units']: expected.extend(['--unit',unit])
              assert checked['argv'] == expected
              assert 'ouro_rt: out of memory (' in zipped.read('compiler-check.stderr').decode()
              assert manifest['policy']['compile_timeout_s'] == 1800 and manifest['policy']['memory_mib'] == 3072
              assert manifest['policy']['cpu_count'] == 1 and manifest['policy']['stack'] == 'stock unlimited'
              assert manifest['host']['key'] == os.environ['HOST_KEY']
              assert manifest['host']['binary_sha256'] == os.environ['HOST_BINARY_SHA256']
              assert manifest['host']['archive_sha256'] == os.environ['HOST_ARCHIVE_SHA256']
              (out/'stock-condition.json').write_text(json.dumps({'pass':True,'run':run['id'],'artifact_id':record['id'],
                  'artifact_digest':record['digest'],'collection_pass_units':172,'compiler_allocator_oom':True,
                  'compiler_elapsed_s':checked['elapsed_s'],'integrity':manifest['integrity'],
                  'not_a_compiler_acceptance_pass':True},indent=2)+'\n')
          PY

      - name: Verify the completed producer and official artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path('_build/ci/native-lower-bounds-observer')
          def api(path, name):
              raw = subprocess.check_output(['gh', 'api', 'repos/eluvane/ouro/'+path])
              (out/name).write_bytes(raw)
              return json.loads(raw)
          run = api('actions/runs/'+os.environ['PRODUCER_RUN'], 'producer-run.json')
          jobs = api('actions/runs/'+os.environ['PRODUCER_RUN']+'/jobs?per_page=100', 'producer-jobs.json')
          artifact = api('actions/artifacts/'+os.environ['HOST_ARTIFACT'], 'producer-artifact.json')
          assert run['head_sha'] == os.environ['PRODUCER_SHA'] and run['status'] == 'completed'
          assert run['run_attempt'] == 1
          host = [job for job in jobs['jobs'] if job['id'] == int(os.environ['HOST_JOB'])]
          assert len(host) == 1 and host[0]['status'] == 'completed' and host[0]['conclusion'] == 'success'
          assert artifact['id'] == int(os.environ['HOST_ARTIFACT']) and not artifact['expired']
          assert artifact['name'] == 'host-compiler-36398476620-1'
          assert artifact['workflow_run']['id'] == int(os.environ['PRODUCER_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['PRODUCER_SHA']
          assert artifact['digest'] == 'sha256:'+os.environ['HOST_ZIP_SHA256']
          PY

      - name: Download the verified predecessor Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36398476620-1
          run-id: 36398476620
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Require canonical source-bound compiler import
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$HOST_ARCHIVE_SHA256" _build/ci/host-compiler.tar.gz | sha256sum --check
          python3 -B scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$HOST_ARCHIVE_SHA256"
          python3 -B scripts/ci_gate.py --compiler-artifact key > _build/ci/native-lower-bounds-observer/key-before.stdout
          sha256sum _build/c/ouro1 > _build/ci/native-lower-bounds-observer/compiler.sha256
          cp _build/c/ouro1.bootstrap.json _build/ci/native-lower-bounds-observer/receipt-before.json
          python3 -B - <<'PY'
          import argparse, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import bootstrap_compiler as bootstrap
          import ouro_build as build
          from repo_support import hash_json
          out = Path('_build/ci/native-lower-bounds-observer')
          selected = bootstrap.current_inputs(Path.cwd(), build.load_config(argparse.Namespace()), build)
          receipt = json.loads((out/'receipt-before.json').read_text())
          projection = {name: selected[name] for name in ('kind', 'roots', 'unit_graph', 'sources',
              'source_form', 'archive_sha256', 'manifest_sha256', 'stage0')}
          (out/'current-inputs-before.json').write_text(json.dumps(selected, indent=2, sort_keys=True)+'\n')
          (out/'source-inputs.json').write_text(json.dumps(projection, indent=2, sort_keys=True)+'\n')
          assert receipt['selected'] == selected and receipt['key'] == os.environ['HOST_KEY']
          assert receipt['binary_sha256'] == os.environ['HOST_BINARY_SHA256']
          assert hashlib.sha256(Path('_build/c/ouro1').read_bytes()).hexdigest() == os.environ['HOST_BINARY_SHA256']
          assert len(selected['sources']) == 180 and sum(name.endswith('.ouro') for name in selected['sources']) == 149
          assert len(selected['roots']) == 15 and len(selected['unit_graph']) == 19 and len(selected['stage0']) == 2
          assert hash_json(projection) == os.environ['SOURCE_INPUTS_HASH']
          assert (out/'key-before.stdout').read_text() == 'key='+os.environ['HOST_KEY']+'\n'
          (out/'host-proof.json').write_text(json.dumps({'producer_run': os.environ['PRODUCER_RUN'],
              'producer_sha': os.environ['PRODUCER_SHA'], 'artifact_id': os.environ['HOST_ARTIFACT'],
              'archive_sha256': os.environ['HOST_ARCHIVE_SHA256'], 'binary_sha256': os.environ['HOST_BINARY_SHA256'],
              'key': receipt['key'], 'selected_source_hash': hash_json(projection)}, indent=2, sort_keys=True)+'\n')
          PY

