name: Multiline documentation signature probe

on:
  push:
    branches: [ codef/doc-multiline-signatures-fix-probe ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: doc-multiline-signatures-fix-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  PRODUCT_SHA: 08ad2b0b8b4385fc0b12e01725468be6846f4540
  BASE_SHA: 83daa56fafb7aa56ffd5fa9ab687c2d867aa1ddf

jobs:
  doc:
    name: "Doc signatures (${{ matrix.suite }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [ doc, lsp ]
    steps:
      - name: Checkout diagnostic child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Verify clean replay lineage and exact source blobs
        run: |
          set -euo pipefail
          mkdir -p _build/ci/doc-multiline
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/doc-multiline-signatures-fix-probe.yml
          test "$(git rev-parse "$PRODUCT_SHA^")" = "$BASE_SHA"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          product = os.environ["PRODUCT_SHA"]
          base = os.environ["BASE_SHA"]
          blobs = {
              "CHANGELOG.md": "d18098cebcdc4426c4b564c26edc6dc63223d2ab",
              "scripts/lsp_suite.sh": "a9f4e9817bc245ee152433ebb9c79cc1a70f6747",
              "scripts/ourosmith/native_inputs.py": "7279f4e6d4214125a91adfddd46c665f6a1c6657",
              "scripts/ourosmith/surface/doc_contract.py": "85273546239acbe383ffdc6ec651043d5b02bb76",
              "scripts/ourosmith/surface/tools.py": "3a036a6b815f0e20577b92da6a4247ac053b28bc",
              "tools/doc_model.ouro": "9834824946d30df7285cea37986d4eb973fae83c",
              "tools/doc.ouro": "f06d09e1d39dc2af90df091d38e9684018b2eff3",
              "tools/lsp.ouro": "92dd5df476d1bdb5817214bb8b4b6420f8f489e1",
              "tools/lsp_model.ouro": "313f09eff1b6853af248142314c29a692fc76f1a",
              "tools/lsp_process_model.ouro": "d96f41d19baac7df86e5c83e0c901a6e4a31ce02",
              "scripts/doc_suite.sh": "4a132cc94e774775957cba4ea2b0ec3a5ee3c7fd",
              "scripts/ci_gate.py": "16ea86bf60a3d3347c30af2f562a6b6b500b89ef",
              "scripts/ouro1.sh": "9665ebb00049d05c097a29d77ec5083b524f9e2d",
              "scripts/bootstrap_compiler.py": "937f93c11a055e42c0ecb22f8c10fce2d748817c",
              "scripts/native_tool_build.py": "0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce",
              "scripts/build_tool.sh": "ff83eec44937a8d9aa37c5af67aae2d57b93f4c3",
              "Ouro.seal": "f078fbe47670a948c96a1d8076761c2140455bbe",
              "scripts/ouro_smith.py": "e3ee39185a464afc28c269965cc940a14cde896a",
              "scripts/ourosmith/__init__.py": "caab58b443774a9a443c8682ccf1a167297f8f1f",
              "scripts/ourosmith/surface/gen.py": "eca764ccafa340f46cc065b1af805540fec49981",
              "scripts/python.sh": "10aa75dd1d4497cb90a1a7d225ff709cf60a4dd1",
              "tests/analyze/precision/absint.ouro": "e5e66a5704ef912e91d00987e9766b519514de3b",
          }
          paths = subprocess.check_output(["git", "diff", "--name-only", base, product], text=True).splitlines()
          assert paths == sorted(list(blobs)[:6]), paths
          for path, expected in blobs.items():
              actual = subprocess.check_output(["git", "rev-parse", product + ":" + path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          names = [path for path in subprocess.check_output(
              ["git", "ls-files", "--", "std"], text=True).splitlines() if path.endswith(".ouro")]
          sources = []
          for path in names:
              data = subprocess.check_output(["git", "show", product + ":" + path])
              assert Path(path).read_bytes() == data, path
              sources.append({"path": path, "sha256": hashlib.sha256(data).hexdigest(),
                              "blob": subprocess.check_output(
                                  ["git", "rev-parse", product + ":" + path], text=True).strip()})
          assert len(sources) == 69, len(sources)
          report = {"workflow_sha": os.environ["GITHUB_SHA"], "product_sha": product,
                    "base_sha": base, "product_tree": subprocess.check_output(
                        ["git", "rev-parse", product + "^{tree}"], text=True).strip(),
                    "changed_paths": paths, "blobs": blobs, "std_sources": sources,
                    "host_run": 36357871841, "host_artifact": 10945092404,
                    "compiler_archive_sha256": "3435db2adf6ab885c4279e56f2b2d24e0f54117cb997784bf12fdbe52567044d"}
          Path("_build/ci/doc-multiline/source.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
          git checkout --detach "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify the source-bound Linux compiler input key
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci_gate.py --compiler-artifact key >_build/ci/doc-multiline/key.stdout 2>_build/ci/doc-multiline/key.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/doc-multiline/key.rc
          cat _build/ci/doc-multiline/key.stdout
          cat _build/ci/doc-multiline/key.stderr >&2
          test "$rc" -eq 0
          test "$(cat _build/ci/doc-multiline/key.stdout)" = key=321c369d5ad5efe4b8c26cbd47c80973a223f750189a4bf0fe3d9814041ad428

      - name: Download verified Host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10945092404
          run-id: 36357871841
          github-token: ${{ github.token }}
          path: _build/ci
          merge-multiple: true

      - name: Verify and install the official Host artifact
        id: import
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 3435db2adf6ab885c4279e56f2b2d24e0f54117cb997784bf12fdbe52567044d >_build/ci/doc-multiline/import.stdout 2>_build/ci/doc-multiline/import.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/doc-multiline/import.rc
          cat _build/ci/doc-multiline/import.stdout
          cat _build/ci/doc-multiline/import.stderr >&2
          test "$rc" -eq 0
          grep -Fx 'CI_COMPILER: PASS current source, host compiler, binary and bootstrap evidence' _build/ci/doc-multiline/import.stdout
          sha256sum _build/c/ouro1 >_build/ci/doc-multiline/compiler.sha256
          test "$(cut -d ' ' -f 1 _build/ci/doc-multiline/compiler.sha256)" = f3ff7228e72b20d4c065ea079e6716dcb4012280e203123900383b444916f5e7

      - name: Run canonical documentation contract and regenerate API pages
        id: doc
        if: ${{ matrix.suite == 'doc' }}
        env:
          DOC_SUITE_OUT: _build/doc_suite
        run: |
          set -euo pipefail
          set +e
          sh scripts/doc_suite.sh --regen >_build/ci/doc-multiline/doc.stdout 2>_build/ci/doc-multiline/doc.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/doc-multiline/doc.rc
          cat _build/ci/doc-multiline/doc.stdout
          cat _build/ci/doc-multiline/doc.stderr >&2
          test "$rc" -eq 0
          grep -E '^DOC_SUITE: PASS rows=5 out=' _build/ci/doc-multiline/doc.stdout
          grep -Fx 'DOC_REGEN docs/api files=69' _build/ci/doc-multiline/doc.stdout
          ! grep -E 'DOC_SUITE: SKIP|DOC_SUITE: FAIL' _build/ci/doc-multiline/doc.stdout _build/ci/doc-multiline/doc.stderr

      - name: Run independent canonical LSP protocol suite
        if: ${{ matrix.suite == 'lsp' }}
        env:
          LSP_SUITE_OUT: _build/lsp_suite
        run: |
          set -euo pipefail
          set +e
          sh scripts/lsp_suite.sh >_build/ci/doc-multiline/lsp.stdout 2>_build/ci/doc-multiline/lsp.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/doc-multiline/lsp.rc
          cat _build/ci/doc-multiline/lsp.stdout
          cat _build/ci/doc-multiline/lsp.stderr >&2
          test "$rc" -eq 0
          grep -E '^LSP_SUITE: PASS rows=[0-9]+ out=' _build/ci/doc-multiline/lsp.stdout
          ! grep -E 'LSP_SUITE: SKIP|LSP_SUITE: FAIL|LSP_FAIL' _build/ci/doc-multiline/lsp.stdout _build/ci/doc-multiline/lsp.stderr

      - name: Preserve all regenerated pages with exact source provenance
        if: ${{ always() && matrix.suite == 'doc' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root = Path("_build/ci/doc-multiline")
          source = json.loads((root / "source.json").read_text())
          product = os.environ["PRODUCT_SHA"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == product
          inputs = {row["path"]: row for row in source["std_sources"]}
          for path, row in inputs.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == row["sha256"], path
          names = subprocess.check_output(["git", "diff", "--name-only", "--", "docs/api"], text=True).splitlines()
          out = root / "pages"
          out.mkdir(parents=True, exist_ok=True)
          pages = []
          for name in names:
              path = Path(name)
              assert path.parent == Path("docs/api") and path.name != "README.md" and path.suffix == ".md", name
              data = path.read_bytes()
              first = data.decode("utf-8").splitlines()[0]
              assert first.startswith("# "), (name, first)
              owner = first[2:]
              assert owner in inputs, (name, owner)
              assert path.name == owner[:-5].replace("/", "_") + ".md", (name, owner)
              previous = subprocess.check_output(["git", "show", product + ":" + name])
              target = out / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
              pages.append({"path": name, "sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data),
                            "previous_sha256": hashlib.sha256(previous).hexdigest(),
                            "source_path": owner, "source_sha256": inputs[owner]["sha256"],
                            "source_blob": inputs[owner]["blob"]})
          rc_path = root / "doc.rc"
          rc = int(rc_path.read_text().strip()) if rc_path.is_file() else None
          manifest = {**source, "command": "DOC_SUITE_OUT=_build/doc_suite sh scripts/doc_suite.sh --regen",
                      "doc_suite_rc": rc, "expected_changed_pages": 21, "pages": pages}
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (root / "generated-paths.txt").write_text("\n".join(names) + "\n")
          print("DOC_GENERATED pages=" + str(len(pages)) + " source=" + product + " rc=" + str(rc))
          assert len(pages) == 21, len(pages)
          assert rc == 0, rc
          assert subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines() == names
          assert Path("_build/doc_suite/std.list").read_text().splitlines() == sorted(inputs)
          PY

      - name: Verify the imported compiler remains unchanged
        if: ${{ always() && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          sha256sum --check _build/ci/doc-multiline/compiler.sha256

      - name: Upload complete regenerated pages and source manifest
        if: ${{ always() && matrix.suite == 'doc' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-multiline-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/ci/doc-multiline/pages/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload complete source and suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-multiline-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/ci/doc-multiline/
            _build/doc_suite/
            _build/lsp_suite/
            _build/c/ouro1.bootstrap.json
            _build/bootstrap/**/inputs.json
            _build/bootstrap/**/report.json
          if-no-files-found: error
          retention-days: 14
