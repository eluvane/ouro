name: Strict top-form indentation gate probe

on:
  push:
    branches: [codef/strict-top-form-gate-probe]

permissions:
  contents: read
  actions: read

jobs:
  strict-memory-and-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and compiler snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "ca3ef220c9f2f8a955f23ba822c15b6842937e74"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/strict-top-form-gate-probe.yml"
          test "$(git rev-parse HEAD:compiler/source_text.ouro)" = "eba30d65d1c1a4ad34f1de77efcbfa4dd27dbe36"
          test "$(git rev-parse HEAD:tools/strict/scan.ouro)" = "f5befd299c5694c40fa37b6416f12c66cb5ae518"
          test "$(git rev-parse HEAD:tools/strict/lexlike.ouro)" = "f9b847002556b2945ff205785abebc331044eac9"
          test "$(git rev-parse HEAD:tests/quality_input_tests.ouro)" = "75d5fd62a47092565a1b9fe6e14680b9400d7ad4"
          test "$(git rev-parse HEAD:scripts/lint_suite.sh)" = "d13bb6aed9fe020fbb086a2681ee5d9221b20861"
          test "$(git rev-parse HEAD:quality/memory_budgets.json)" = "9257b185a175b64474d9c014086771035ac8394f"
          test "$(git rev-parse HEAD:compiler/ast.ouro)" = "933f1f4cf57e3d72cbafff318957558baedd991b"
          test "$(python3 scripts/ci_gate.py --compiler-artifact key)" = "key=b8d31b04dc1d01b29e49134936608c61a4557c4b5d54ec08450e565836d8f6d7"

      - name: Download verified host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36311470304-1
          run-id: 36311470304
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install host compiler
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 10c96480783621387e90627b36cebb0e3d5880b38611e563bc3de01a7209b75f

      - name: Download verified canonical scanner output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: strict-stage-profile
          run-id: 36317306844
          github-token: ${{ github.token }}
          path: _build/baseline

      - name: Measure unchanged release strict quality gate
        env:
          OURO_BUILD_TOOL_MODE: auto
        run: python3 scripts/memory_budget_suite.py --case strict-quality-gate --out _build/memory

      - name: Check quality input shapes and exact lint count
        if: always()
        shell: bash
        run: |
          test -x _build/c/ouro1
          mkdir -p _build/memory
          python3 scripts/native_tool_build.py --compiler _build/c/ouro1 \
            tests/quality_input_tests.ouro _build/c/quality-input-tests \
            > _build/memory/quality-input-build.log 2>&1
          _build/c/quality-input-tests _build/memory/quality-input-fixtures \
            > _build/memory/quality-input.out 2> _build/memory/quality-input.err
          test ! -s _build/memory/quality-input.err
          tr -d '\r' < _build/memory/quality-input.out |
            grep -Fx 'QUALITY_INPUT_TESTS rows=28 failures=0'

      - name: Compare candidate scanner with verified canonical output
        if: always()
        shell: bash
        env:
          OURO_ROOT: ${{ github.workspace }}
        run: |
          test -x _build/c/ouro-strict-quality-firewall
          _build/c/ouro-strict-quality-firewall \
            --scan-source compiler/ast.ouro --profile release \
            < compiler/ast.ouro > _build/memory/strict-candidate.json \
            2> _build/memory/strict-candidate.err
          test ! -s _build/memory/strict-candidate.err
          test "$(sha256sum _build/baseline/memory/strict-canonical.json | cut -d' ' -f1)" = \
            "5239a7754876b9a70871c45e41f1bd9abbd91ed2de67af926c1cfcc9c9377d51"
          cmp _build/baseline/memory/strict-canonical.json \
            _build/memory/strict-candidate.json

      - name: Upload gate and shape reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-top-form-gate-probe
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/memory/*.json
            _build/memory/*.log
            _build/memory/*.md
            _build/memory/*.out
            _build/memory/*.err
            _build/c/quality-input-tests.build.json
            _build/c/ouro-strict-quality-firewall.build.json
