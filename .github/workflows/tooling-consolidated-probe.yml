name: Consolidated API LSP and documentation acceptance

on:
  push:
    branches: [codef/tooling-consolidated-probe]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tooling-consolidated-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  PRODUCT_SHA: 25486377be6b24f49f5480f6aca842d3f8eace3d
  BASE_SHA: 27034c84ddc8ed97d18fae7036983cdbe4fa9501
  SOURCE_BASE_SHA: 973c3a21342e9d6e029479fb33ed7207d010c1bd

jobs:
  tooling:
    name: "Tooling (${{ matrix.check }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [python, api-focused, lsp, doc]
    steps:
      - name: Checkout workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 12
          persist-credentials: false

      - name: Verify frozen tooling snapshot and source ownership
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/tooling-consolidated-probe.yml
          test "$(git rev-parse "$PRODUCT_SHA^")" = 5e9ec1d5c5ab7e5f3ad1bda0fb84584c317fdfe4
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --detach "$PRODUCT_SHA"
          mkdir -p _build/ci/tooling-consolidated
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          product = os.environ['PRODUCT_SHA']
          assert git('rev-parse', 'HEAD') == product
          assert git('rev-parse', 'HEAD^{tree}') == '9d8080998a07f15fa6604b3673fd1aa9945ebd8d'
          assert not git('status', '--porcelain')
          changed_blobs = {
              "CHANGELOG.md": "5a1703e55247de867289e3ce1515b93b6e257863",
              "docs/api/README.md": "ce0cbc7f82c36872a72a23aa41e16ac96a6d9fb2",
              "docs/api/std_char.md": "3c913e348151fab08fd0c50f4d3619ffab42d900",
              "docs/api/std_cli.md": "ed83a99a9e2496405f4abe7f06ea02479357f195",
              "docs/api/std_collections.md": "a523d4aaf5f77921de084ef93b2ae6a6be8b61a3",
              "docs/api/std_configx.md": "e1bc72e9e22c2b183061146ae78c4c912a04f264",
              "docs/api/std_executable_model.md": "fd6fb53daf57dbaff9786880b992d967b95feb34",
              "docs/api/std_fs.md": "991afbe930280b99455f8168edb03ccae2530be9",
              "docs/api/std_fs_create_model.md": "665a712abcf4ea50f35aa9b5b44eee1d3a67bef6",
              "docs/api/std_fs_walk.md": "b53a5eafe56156939e61149a8d35783b5ee76d63",
              "docs/api/std_fsx.md": "ff5e99039e69c52025c1826a4efa7493909e8282",
              "docs/api/std_http.md": "832143288377b0ade3c332402e71821f2b977445",
              "docs/api/std_io.md": "38e06c59d0bc1ee530fdfdd0d6ad5e10c30ed270",
              "docs/api/std_iter.md": "ed532984799a2e648243e462813ab760a4dcb665",
              "docs/api/std_listx.md": "b981582360d7ba35c6e5cc47b230ec4ab896ac4e",
              "docs/api/std_map.md": "c6e416f9d8cfa173b15ccfc37ce26661da39f9a9",
              "docs/api/std_parse.md": "3f70fff2f6d028615c368c37159a57fbb6f5edf0",
              "docs/api/std_pathx.md": "b7013ef2a492cb83adbc9b1b3745056c79c311cb",
              "docs/api/std_process.md": "de4606da71353e05aaeec2f32047d5838b43aea5",
              "docs/api/std_processx.md": "8da338eb19722286159514693f0b5faee743c558",
              "docs/api/std_range.md": "f6f4403d52e0f335b5528b085ab1be758025765e",
              "docs/api/std_result.md": "747a03381856319657a68f68d183c0f9ace2508b",
              "docs/api/std_runtime.md": "c3711098b552a0522af88c7cbc86c703acb2e4eb",
              "docs/api/std_table.md": "a499dcfd72bb7e19236ece759f97af056f960893",
              "docs/ci.md": "d5d3a007dc018bb6c3c1ef00d1860ff75e09bb2f",
              "docs/quality.md": "13cb9bcb9f1aeaa0fe21bd9dd1777d07075b7aca",
              "docs/tooling.md": "d80daddfe009ab0271dd3bfc5af8e83c3a6a7205",
              "quality/api_surface.tsv": "8233582413aee81dfb2ca1bef355fe3ef37a332a",
              "scripts/analyze_bounded.py": "5563831d110465df780cb0cfc54f1b650ac68ee9",
              "scripts/api_baseline_regen.py": "3fde14909a852897117000207e445ed88906baba",
              "scripts/api_baseline_regen_test.py": "0528a766c8150644bc3ccbb0fee10659c6cee624",
              "scripts/lsp_suite.sh": "a416ef1ab7e1797cd1563c3b0dded02f9478d993",
              "scripts/ourosmith/native_inputs.py": "7279f4e6d4214125a91adfddd46c665f6a1c6657",
              "scripts/ourosmith/surface/doc_contract.py": "85273546239acbe383ffdc6ec651043d5b02bb76",
              "scripts/ourosmith/surface/tools.py": "3a036a6b815f0e20577b92da6a4247ac053b28bc",
              "tests/analyze/api_surface.tsv": "9d4d3d315b71b3f693e923caad08d4423fa4c135",
              "tests/analyze/api_surface_bad/public.ouro": "5dcb1370bffe964c2ac03c58457874ec882b2936",
              "tests/analyze/api_surface_good/public.ouro": "55395a204a4aa2b9c99dcbf161b6cf93df0788c2",
              "tests/analyze/golden/api_surface_bad.txt": "c2e5251dad9efd5ffa161742f85582c51a6238d4",
              "tests/analyze/golden/api_surface_good.txt": "ededafb1820fffe778303a80f8ebd9414740f138",
              "tests/analyze/precision/imports.ouro": "2d801cab107ecdd3e6c5926647cf70ce3a940472",
              "tools/analyze/extract.ouro": "98ed1712a2d2579aeaf7b465b2511ecadc3fc569",
              "tools/analyze/main.ouro": "c3e381a1fb791355ae21e067cf16927980c0e5ee",
              "tools/doc_model.ouro": "9834824946d30df7285cea37986d4eb973fae83c",
              "tools/lsp.ouro": "9b892fcbba0258e8d09d1e32cd5c4cce76505bc1",
              "tools/lsp_model.ouro": "bf99dddc99af6b3af9c5df175752ccc0dc2af61d"
          }
          owner_blobs = {
              "tools/doc.ouro": "f06d09e1d39dc2af90df091d38e9684018b2eff3",
              "scripts/doc_suite.sh": "4a132cc94e774775957cba4ea2b0ec3a5ee3c7fd",
              "scripts/ci_gate.py": "16ea86bf60a3d3347c30af2f562a6b6b500b89ef",
              "scripts/build_tool.sh": "ff83eec44937a8d9aa37c5af67aae2d57b93f4c3",
              "scripts/native_tool_build.py": "0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce",
              "scripts/bootstrap_compiler.py": "937f93c11a055e42c0ecb22f8c10fce2d748817c",
              "scripts/bootstrap_inputs.py": "e49f21cc8df6b7dac89fc853631a75d0a7e47458",
              "scripts/analyze_core_checks.py": "7bcd6e929af98d34c731197f9b81ad53ecae7e90",
              "scripts/python.sh": "10aa75dd1d4497cb90a1a7d225ff709cf60a4dd1",
              "scripts/ouro1.sh": "9665ebb00049d05c097a29d77ec5083b524f9e2d",
              "scripts/ouro_smith.py": "e3ee39185a464afc28c269965cc940a14cde896a",
              "Ouro.seal": "f078fbe47670a948c96a1d8076761c2140455bbe",
              "compiler/bootstrap/c-bootstrap-v1.json": "68c3c0dc631df88abf86402d859715dd8caf4f6c",
              "compiler/bootstrap/c-bootstrap-v1.tar.gz": "459b32b2e676accf4670b5627f36ae3a26995981"
          }
          paths = git('diff', '--name-only', os.environ['BASE_SHA'], product).splitlines()
          assert len(paths) == 46 and paths == sorted(changed_blobs), paths
          for path, expected in {**changed_blobs, **owner_blobs}.items():
              assert git('hash-object', path) == expected, path
          generated = {path: {'sha256': hashlib.sha256(Path(path).read_bytes()).hexdigest(),
              'blob': git('hash-object', path)} for path in git('ls-files', '--', 'docs/api').splitlines()}
          std_sources = [{'path': path, 'sha256': hashlib.sha256(Path(path).read_bytes()).hexdigest(),
              'blob': git('hash-object', path)} for path in git('ls-files', '--', 'std').splitlines()
              if path.endswith('.ouro')]
          assert len(generated) == 70 and 'docs/api/README.md' in generated
          assert len(std_sources) == 69
          source = {'workflow_sha': os.environ['GITHUB_SHA'], 'product_sha': product,
              'base_sha': os.environ['BASE_SHA'], 'source_base_sha': os.environ['SOURCE_BASE_SHA'],
              'original_heads': {'94': '42c8e81af4ef1095b7e0d23b56960aad789c45c0',
                  '96': '19182a5102fb0d6f850c426541d417aa6cccc9bb',
                  '97': '2c21903f53866717ca446304b986eeb227b86718'},
              'product_tree': '9d8080998a07f15fa6604b3673fd1aa9945ebd8d', 'changed_paths': paths,
              'changed_blobs': changed_blobs, 'owner_blobs': owner_blobs,
              'generated_before': generated, 'std_sources': std_sources,
              'host_run': 36360415225, 'host_artifact': 10946340921,
              'compiler_archive_sha256': 'e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7'}
          Path('_build/ci/tooling-consolidated/source.json').write_text(json.dumps(source, indent=2)+'\n')
          print('TOOLING_SOURCE: PASS exact46 paths,70 generated outputs,69 std sources')
          PY

      - name: Require matching Linux compiler inputs
        if: ${{ matrix.check != 'python' }}
        run: |
          set -euo pipefail
          python3 scripts/ci_gate.py --compiler-artifact key >_build/ci/tooling-consolidated/key.stdout 2>_build/ci/tooling-consolidated/key.stderr
          cat _build/ci/tooling-consolidated/key.stdout
          cat _build/ci/tooling-consolidated/key.stderr >&2
          grep -Fx 'key=f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c' _build/ci/tooling-consolidated/key.stdout

      - name: Download official verified matching Host
        if: ${{ matrix.check != 'python' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10946340921
          run-id: 36360415225
          github-token: ${{ github.token }}
          path: _build/ci
          merge-multiple: true

      - name: Canonical source-bound Host import
        id: import
        if: ${{ matrix.check != 'python' }}
        run: |
          set -euo pipefail
          rc=0
          python3 scripts/ci_gate.py --compiler-artifact import \
            --compiler-sha256 e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7 \
            >_build/ci/tooling-consolidated/import.stdout 2>_build/ci/tooling-consolidated/import.stderr || rc=$?
          printf '%s\n' "$rc" >_build/ci/tooling-consolidated/import.rc
          cat _build/ci/tooling-consolidated/import.stdout
          cat _build/ci/tooling-consolidated/import.stderr >&2
          test "$rc" -eq 0
          grep -Fx 'CI_COMPILER: PASS current source, host compiler, binary and bootstrap evidence' _build/ci/tooling-consolidated/import.stdout
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          receipt=json.loads(Path('_build/c/ouro1.bootstrap.json').read_bytes())
          selected=receipt['selected']
          assert receipt['kind']=='ouro.current-c-bootstrap.v1'
          assert receipt['key']=='f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c'
          assert receipt['binary_sha256']=='460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c'
          assert len(selected['sources'])==177 and len(selected['stage0'])==2
          for path, expected in {**selected['sources'], **selected['stage0'],
              'compiler/bootstrap/c-bootstrap-v1.tar.gz': selected['archive_sha256'],
              'compiler/bootstrap/c-bootstrap-v1.json': selected['manifest_sha256']}.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected, path
          Path('_build/ci/tooling-consolidated/compiler-inputs.json').write_text(json.dumps(
              {'key':receipt['key'],'sources':selected['sources'],'stage0':selected['stage0'],
                  'archive_sha256':selected['archive_sha256'],'manifest_sha256':selected['manifest_sha256']},indent=2)+'\n')
          PY
          echo '460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c  _build/c/ouro1' | sha256sum -c -

      - name: Run Python header laws and baseline check
        if: ${{ matrix.check == 'python' }}
        run: |
          set -euo pipefail
          out=_build/ci/tooling-consolidated
          run_logged() {
            label=$1; shift
            rc=0
            "$@" >"$out/$label.stdout" 2>"$out/$label.stderr" || rc=$?
            printf '%s\n' "$rc" >"$out/$label.rc"
            cat "$out/$label.stdout"
            cat "$out/$label.stderr" >&2
            return "$rc"
          }
          run_logged skeleton python3 scripts/analyze_bounded.py --self-test
          run_logged python python3 scripts/api_baseline_regen_test.py
          run_logged baseline python3 scripts/api_baseline_regen.py --check --report "$out/api-baseline.json"
          grep -Fx 'ANALYZE_DISCOVERY_SUITE rows=6 import-skeletons=18 api-header-skeletons=24' "$out/skeleton.stdout"
          grep -E '^Ran 10 tests in ' "$out/python.stderr"

      - name: Check owning API source and all native import laws
        if: ${{ always() && matrix.check == 'api-focused' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          out=_build/ci/tooling-consolidated
          run_logged() {
            label=$1; shift
            rc=0
            "$@" >"$out/$label.stdout" 2>"$out/$label.stderr" || rc=$?
            printf '%s\n' "$rc" >"$out/$label.rc"
            cat "$out/$label.stdout"
            cat "$out/$label.stderr" >&2
            return "$rc"
          }
          run_logged core python3 scripts/analyze_core_checks.py --out "$out/core" tools/analyze/extract.ouro tests/analyze/precision/imports.ouro
          OURO_BUILD_TOOL_MODE=native run_logged precision-build sh scripts/build_tool.sh tests/analyze/precision/imports.ouro "$out/precision-imports"
          run_logged precision "$out/precision-imports"
          test "$(grep -c '^PRECISION_OK ' "$out/precision.stdout")" -eq 19
          grep -Fx 'PRECISION_SUITE imports rows=19' "$out/precision.stdout"
          ! grep -q 'PRECISION_FAIL' "$out/precision.stdout" "$out/precision.stderr"

      - name: Require exact strict API good and bad goldens
        if: ${{ always() && matrix.check == 'api-focused' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          out=_build/ci/tooling-consolidated
          for form in good bad; do
            rc=0
            sh scripts/ouro1.sh analyze --strict --include-fixtures --api-baseline tests/analyze/api_surface.tsv \
              --scope "tests/analyze/api_surface_$form" >"$out/api-$form.raw" 2>"$out/api-$form.stderr" || rc=$?
            printf '%s\n' "$rc" >"$out/api-$form.rc"
            tr -d '\r' <"$out/api-$form.raw" >"$out/api-$form.stdout"
            cat "$out/api-$form.stdout"
            cat "$out/api-$form.stderr" >&2
          done
          test "$(cat "$out/api-good.rc")" -eq 0
          test "$(cat "$out/api-bad.rc")" -eq 1
          diff -u tests/analyze/golden/api_surface_good.txt "$out/api-good.stdout" >"$out/api-good.diff"
          diff -u tests/analyze/golden/api_surface_bad.txt "$out/api-bad.stdout" >"$out/api-bad.diff"
          grep -F 'public.ouro:9:5: error[OURO-API003]' "$out/api-bad.stdout"
          ! grep -q '^ANALYZE_OK ' "$out/api-bad.stdout"

      - name: Run complete canonical LSP or documentation suite
        id: suite
        if: ${{ always() && (matrix.check == 'lsp' || matrix.check == 'doc') && steps.import.outcome == 'success' }}
        env:
          TOOLING_CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          out=_build/ci/tooling-consolidated
          rc=0
          case "$TOOLING_CHECK" in
            lsp)
              OURO_BUILD_TOOL_MODE=native LSP_SUITE_OUT=_build/lsp_suite \
                sh scripts/lsp_suite.sh >"$out/lsp.stdout" 2>"$out/lsp.stderr" || rc=$?
              ;;
            doc)
              OURO_BUILD_TOOL_MODE=native DOC_SUITE_OUT=_build/doc_suite \
                sh scripts/doc_suite.sh >"$out/doc.stdout" 2>"$out/doc.stderr" || rc=$?
              ;;
            *) exit 2 ;;
          esac
          printf '%s\n' "$rc" >"$out/$TOOLING_CHECK.rc"
          cat "$out/$TOOLING_CHECK.stdout"
          cat "$out/$TOOLING_CHECK.stderr" >&2
          test "$rc" -eq 0

      - name: Require canonical suite verdict without skips
        if: ${{ always() && steps.suite.outcome != 'skipped' && (matrix.check == 'lsp' || matrix.check == 'doc') }}
        env:
          TOOLING_CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          out=_build/ci/tooling-consolidated
          case "$TOOLING_CHECK" in
            lsp)
              test "$(cat "$out/lsp.rc")" -eq 0
              grep -E '^LSP_SUITE: PASS rows=[0-9]+ out=' "$out/lsp.stdout"
              test ! -s "$out/lsp.stderr"
              ! grep -E 'LSP_SUITE: SKIP|LSP_SUITE: FAIL' "$out/lsp.stdout" "$out/lsp.stderr"
              ;;
            doc)
              test "$(cat "$out/doc.rc")" -eq 0
              grep -Fx 'DOC_OK api modules=69' "$out/doc.stdout"
              grep -E '^DOC_SUITE: PASS rows=5 out=' "$out/doc.stdout"
              test ! -s "$out/doc.stderr"
              ! grep -E 'DOC_SUITE: SKIP|DOC_SUITE: FAIL|DOC_REGEN' "$out/doc.stdout" "$out/doc.stderr"
              python3 - <<'PY'
          from pathlib import Path
          import csv, json
          source=json.loads(Path('_build/ci/tooling-consolidated/source.json').read_bytes())
          names=Path('_build/doc_suite/std.list').read_text().splitlines()
          assert names==sorted(row['path'] for row in source['std_sources'])
          rows=list(csv.DictReader(Path('_build/doc_suite/selftest-report.tsv').read_text().splitlines(), delimiter='\t'))
          assert [row['name'] for row in rows]==['fixture','missing-file','missing-files-from','files-from','api modules=69']
          assert all(row['pass']=='true' and not row['issue'] for row in rows)
          print('DOC_TOOLING: PASS exact5 rows and69 modules')
          PY
              ;;
            *) exit 2 ;;
          esac

      - name: Verify source and generated bytes remain unchanged
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          out=Path('_build/ci/tooling-consolidated')
          source=json.loads((out/'source.json').read_bytes())
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          generated={path:{'sha256':hashlib.sha256(Path(path).read_bytes()).hexdigest(),
              'blob':git('hash-object',path)} for path in git('ls-files','--','docs/api').splitlines()}
          drift=git('diff','--name-only').splitlines()
          (out/'tracked-drift.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          result={'head':git('rev-parse','HEAD'),'tracked_drift':drift,
              'generated_after':generated,'generated_unchanged':generated==source['generated_before']}
          (out/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          assert result['head']==source['product_sha']
          assert result['generated_unchanged'] and not drift
          assert not git('status','--porcelain')
          for row in source['std_sources']:
              assert hashlib.sha256(Path(row['path']).read_bytes()).hexdigest()==row['sha256'],row['path']
          for path,expected in {**source['changed_blobs'],**source['owner_blobs']}.items():
              assert git('hash-object',path)==expected,path
          print('TOOLING_BYTES: PASS unchanged sources and70 generated outputs')
          PY

      - name: Verify imported compiler remains unchanged
        if: ${{ always() && matrix.check != 'python' && steps.import.outcome == 'success' }}
        run: echo '460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c  _build/c/ouro1' | sha256sum -c -

      - name: Upload source receipts and complete focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tooling-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            _build/ci/tooling-consolidated/
            _build/lsp_suite/
            _build/doc_suite/
            _build/api_baseline/
            _build/c/ouro1.bootstrap.json
