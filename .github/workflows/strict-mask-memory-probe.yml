name: Strict mask memory probe

on:
  push:
    branches: [codef/strict-mask-memory-probe]

permissions:
  contents: read

jobs:
  strict-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "4faf1dd836971c3a5621b61df68785f1968c4c0b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/strict-mask-memory-probe.yml"
          test "$(git rev-parse HEAD:tools/strict/scan_more.ouro)" = "52983d37d526acd9a56efe5dad0a431dc0662281"
      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet
      - name: Measure release strict quality gate
        env:
          OURO_BUILD_TOOL_MODE: auto
        run: python3 scripts/memory_budget_suite.py --case strict-quality-gate --out _build/memory
      - name: Upload measurement and build receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-mask-memory-probe
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/memory/**/*.json
            _build/memory/**/*.log
            _build/c/ouro-strict-quality-firewall.build.json
