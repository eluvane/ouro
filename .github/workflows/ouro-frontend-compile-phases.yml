name: Frontend check-item names (diagnostic)

on:
  push:
    branches: [codef/frontend-check-item-names]
    paths:
      - runtime/frontend_link.c
      - .github/workflows/ouro-frontend-compile-phases.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  host-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify diagnostic source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = d1421114478b4694d6fecedca3288f4b3c06b15b
          test "$(git hash-object runtime/frontend_link.c)" = d516a5f26bd1104abffe636b78c58f757e9599a7
          test "$(git hash-object runtime/bootstrap.c)" = 9513799a3d30e1564c11b98d5d8c66d9b66ac9fd
          test "$(git hash-object scripts/native_tool_build.py)" = 0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce

      - name: Build and verify host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Export compiler with bootstrap evidence
        id: bundle
        run: |
          python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"
          echo "artifact=host-compiler-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload verified compiler
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-compiler-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/ci/host-compiler.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload bootstrap reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-check-item-names-bootstrap
          path: |
            _build/bootstrap/**/*.json
            _build/bootstrap/**/*.log
          if-no-files-found: warn
          retention-days: 7

  frontend-host:
    needs: host-compiler
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify diagnostic source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = d1421114478b4694d6fecedca3288f4b3c06b15b
          test "$(git hash-object runtime/frontend_link.c)" = d516a5f26bd1104abffe636b78c58f757e9599a7
          test "$(git hash-object runtime/bootstrap.c)" = 9513799a3d30e1564c11b98d5d8c66d9b66ac9fd
          test "$(git hash-object scripts/native_tool_build.py)" = 0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce

      - name: Download matching host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.host-compiler.outputs.artifact }}
          path: _build/ci

      - name: Verify and install host compiler
        env:
          COMPILER_SHA256: ${{ needs.host-compiler.outputs.sha256 }}
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256"

      - name: Run unchanged frontend-security gate with check-item names
        env:
          FRONTEND_SECURITY_OUT: _build/frontend_security
          OURO_DIAG_EMIT_PHASES: "1"
          OURO_DIAG_FE_STAGES: "1"
        run: |
          test -z "${OURO_EMIT_IO_SHIMS+x}"
          sh scripts/frontend_security_suite.sh

      - name: Upload small frontend reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-check-item-names-reports
          path: |
            _build/frontend_security/frontend-host.json
            _build/frontend_security/host/**/report.json
            _build/frontend_security/host/**/emit.*.err
            _build/frontend_security/host/**/build.stderr
            _build/frontend_security/host/**/caller-output.stderr
          if-no-files-found: warn
          retention-days: 7
