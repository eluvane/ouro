name: Clippy logic and numeric validation

on:
  push:
    branches: [clippy/logic-numeric-expansion]

permissions:
  contents: read

concurrency:
  group: clippy-logic-numeric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture exact validation source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/ouro-logic-source.tar.gz" HEAD
      - name: Upload exact validation source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ouro-logic-source
          path: ${{ runner.temp }}/ouro-logic-source.tar.gz
          retention-days: 1
      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet
      - name: Check Clippy
        if: ${{ !cancelled() }}
        run: sh scripts/ouro1.sh check tools/clippy/main.ouro 60000
      - name: Clippy grade suite
        if: ${{ !cancelled() }}
        run: python3 scripts/clippy_grade_suite.py
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clippy-logic-numeric-validation
          if-no-files-found: ignore
          retention-days: 7
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.err
