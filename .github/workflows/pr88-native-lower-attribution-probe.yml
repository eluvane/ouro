name: PR88 paired native lowering attribution

on:
  push:
    branches: [codef/pr88-native-lower-attribution-probe]
    paths: [.github/workflows/pr88-native-lower-attribution-probe.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr88-native-lower-attribution-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "1"
  OURO_FRONTEND_JOBS: "1"
  OURO_CACHE: "1"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  OURO_MEM_TRACE: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  guard:
    name: Workflow-only guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require exact old source and one workflow delta
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 973c3a21342e9d6e029479fb33ed7207d010c1bd
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/pr88-native-lower-attribution-probe.yml
          git diff --check HEAD^ HEAD

  native-lower:
    name: Native lowering ${{ matrix.target }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: old-177
            source: 973c3a21342e9d6e029479fb33ed7207d010c1bd
            tree: 2b4b6d86eba6b80060132c4f40ba80bff0106a14
            source_count: 177
            closure_count: 169
            run_id: 36360415225
            artifact: host-reviewed-36360415225-1
            artifact_id: 10946340921
            archive: e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7
            binary: 460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c
            key: f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c
            report: ac2d38b146d8ee3aa91ae4b6641ce1f0c69da0ec61475ccf0a8c75a35015dd1f
            lower_blob: 13f4fc2fab55f8e6928fff31c9cd993767c8873e
            bridge_manifest_blob: 68c3c0dc631df88abf86402d859715dd8caf4f6c
            bridge_archive_blob: 459b32b2e676accf4670b5627f36ae3a26995981
          - target: nat-178
            source: 6b1bfb211199415b1a4a60771796037ad460e504
            tree: 9987dd2d567be1515f0efa0e51b7f9806ccf3718
            source_count: 178
            closure_count: 170
            run_id: 36374509780
            artifact: nat-host-36374509780-1
            artifact_id: 10950729500
            archive: 242aaa2e79c2e86af6b6b6d4d9b68d58f13f5c365766ec3f8de9f2865f3c8da0
            binary: e158c87c98fd46ea56f9f45f8f66a3514b16160e0d16624fe019662f8be18fe2
            key: 5f11472dafd95f289cfb21598316c1f6eeef8288a4226dfae07f78ca47f4cf15
            report: 2cdb7932d47e78e1a76c36fa15fd7b4a9e479cd74374d9da4b5f845b87f4c7e0
            lower_blob: eba95f38d456969cd0550e65e2ff7aad1532e190
            bridge_manifest_blob: f3b14f5028a701028d29c79dc9b0fc2327a484ce
            bridge_archive_blob: b0d9871286450364ac6da322a1c4c8f65ab9368e
    env:
      CONTROL_TARGET: ${{ matrix.target }}
      SOURCE_SHA: ${{ matrix.source }}
      SOURCE_TREE: ${{ matrix.tree }}
      SOURCE_COUNT: ${{ matrix.source_count }}
      CLOSURE_COUNT: ${{ matrix.closure_count }}
      HOST_KEY: ${{ matrix.key }}
      HOST_BINARY_SHA256: ${{ matrix.binary }}
      HOST_REPORT_SHA256: ${{ matrix.report }}
      HOST_ARTIFACT_ID: ${{ matrix.artifact_id }}
      HOST_RUN_ID: ${{ matrix.run_id }}
      LOWER_BLOB: ${{ matrix.lower_blob }}
      BRIDGE_MANIFEST_BLOB: ${{ matrix.bridge_manifest_blob }}
      BRIDGE_ARCHIVE_BLOB: ${{ matrix.bridge_archive_blob }}
    steps:
      - name: Checkout the exact verifier root for this Host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind unchanged fixture, diagnostic owners and full source closure
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['SOURCE_SHA']
          assert git('rev-parse', 'HEAD^{tree}') == os.environ['SOURCE_TREE']
          assert not git('status', '--porcelain')
          blobs = {
              'tests/native_lower_tests.ouro': '0faa51165cd6a1565d6ee3ba89145c4d47ddab49',
              'tests/native_lower_fixtures.ouro': '5994994bcea2bbee8e8bca4bbb176eee5eefa3d2',
              'tests/native_lower_raw_fixtures.ouro': '8adb4adbba906b1f1114603cd611a5f83ffc3605',
              'tests/native_lower_loop_fixtures.ouro': 'a9216d8e8a67fba80c0fd256a77fade126c9522d',
              'tests/native_lower_constant_fixtures.ouro': 'b5a67606f5cc57c0d699d71292915180f59f415f',
              'tests/compiler_program_lookup.ouro': '3bcdfc56e69197b2e69f3fe26ff6482796ed2ff4',
              'tests/native_lower_error_code.ouro': 'aebcb4b3818349caa1363cbdabd3946eb3eb9359',
              'compiler/native/diagnostics.ouro': 'c4275d3ab3fbfcd65e2e06d1b5100c3f40b2782a',
              'compiler/pipeline.ouro': '470f65814e57200b02580131a0df786fa74b2e18',
              'compiler/pipeline_support.ouro': 'ce04ad29ec81655e471aab29ad7310b1f6aba384',
              'compiler/lower_support.ouro': '5975a3460c1e395b35dd8d298ea77a11c16af5ef',
              'compiler/lower_env.ouro': '56776adc3e2683aa51e01c9c54a608e18459b94a',
              'compiler/lower_implicit.ouro': 'd6b712898f76eb5c57987398aa22be8f03bb305e',
              'compiler/lower_implicit_function.ouro': 'd2b568efa8be3dc1646c14847c6876c466e7eda0',
              'compiler/lower_decl_types.ouro': '9f03346412a7f5bad88600449b49f6b469b98c73',
              'runtime/bootstrap.c': '5272a92d85d3f693407ec1f5d0e091fe461f8018',
              'runtime/frontend_link.c': 'f10104eb4bc30055dabb3163a82f181c6eae9f1a',
              'runtime/ouro_rt.c': '5fa7a64f29ef9b25f23b9e322d111e7070516b36',
              'scripts/ouro1.sh': '9665ebb00049d05c097a29d77ec5083b524f9e2d',
              'scripts/build_tool.sh': 'ff83eec44937a8d9aa37c5af67aae2d57b93f4c3',
              'scripts/ci_gate.py': '16ea86bf60a3d3347c30af2f562a6b6b500b89ef',
              'scripts/bootstrap_compiler.py': '937f93c11a055e42c0ecb22f8c10fce2d748817c',
              'scripts/bootstrap_inputs.py': 'e49f21cc8df6b7dac89fc853631a75d0a7e47458',
              'scripts/ouro_build.py': 'd42206ac82042ab3eddf2542689716e8a0c77cd4',
              'scripts/frontend_regen.py': 'c585f858e9c75a17e6a797c25befa3f2773cc765',
              'scripts/selfhost_module_cache.py': '5aee60ad85de1001ad6802e310e053c8cea8b930',
              'scripts/ourosmith/limits.py': 'aa92339539ea580b0a2569d7df7f085f94765156',
              'scripts/ourosmith/exec_child.py': 'f04496548bed88cbe99f47eb951e7ece945138b7',
              'tools/collect.ouro': '371a3667bd3b67ef28a146bf8918578370897245',
              'tools/test/process_model.ouro': 'eb8cae5afe7d2f3183d3dcaab861d263decce164',
              'tools/test/process.ouro': 'a665d892b8a285305f58d4166fc3501ff084d8a7',
              'tools/native_sibling_model.ouro': '72ec0751141db68977967dcde4890710f75ad1db',
              'tools/native_sibling.ouro': 'd133b2ffc20dc7e967da4ffb2aac74b0672a6dde',
              'std/data.ouro': 'b0525f0b9f90f1692adbe6cd38af963e88d73022',
              'Ouro.seal': 'f078fbe47670a948c96a1d8076761c2140455bbe',
              'compiler/lower.ouro': os.environ['LOWER_BLOB'],
              'compiler/bootstrap/c-bootstrap-v1.json': os.environ['BRIDGE_MANIFEST_BLOB'],
              'compiler/bootstrap/c-bootstrap-v1.tar.gz': os.environ['BRIDGE_ARCHIVE_BLOB'],
          }
          if os.environ['CONTROL_TARGET'] == 'nat-178':
              blobs['compiler/lower_nat.ouro'] = 'a106c758642f92c5329b81912a2f58b6582da411'
          for path, digest in blobs.items(): assert git('hash-object', path) == digest, path
          sys.path.insert(0, 'scripts')
          import frontend_regen
          units = frontend_regen.collect_units('tests/native_lower_tests.ouro')
          assert len(units) == len(set(units)) == int(os.environ['CLOSURE_COUNT'])
          assert units[-1] == 'tests/native_lower_tests.ouro'
          source_hashes = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in units}
          out = Path('_build/native_lower_probe')
          out.mkdir(parents=True)
          (out / 'source.json').write_text(json.dumps({
              'target': os.environ['CONTROL_TARGET'], 'source_sha': os.environ['SOURCE_SHA'],
              'source_tree': os.environ['SOURCE_TREE'], 'workflow_sha': os.environ['GITHUB_SHA'],
              'blobs': blobs, 'units': units, 'sources': source_hashes,
              'import_inventory_only': True, 'acceptance_owner': 'native compiler'}, indent=2) + '\n')
          assert not Path('_build/c/ouro1').exists()
          print('NATIVE_LOWER_SOURCE: PASS exact verifier root and unchanged fixture')
          PY
      - name: Require matching system C compiler and Host key
        run: |
          command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1
          python3 scripts/ci_gate.py --compiler-artifact key > _build/native_lower_probe/key-before.stdout
          test "$(cat _build/native_lower_probe/key-before.stdout)" = "key=$HOST_KEY"
      - name: Download this control's frozen official Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run_id }}
          repository: eluvane/ouro
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _build/ci
      - name: Canonical source-bound compiler import
        env:
          COMPILER_SHA256: ${{ matrix.archive }}
        run: |
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256" > _build/native_lower_probe/import.stdout 2> _build/native_lower_probe/import.stderr
          python3 scripts/ci_gate.py --compiler-artifact key > _build/native_lower_probe/key.stdout
          test "$(cat _build/native_lower_probe/key.stdout)" = "key=$HOST_KEY"
          test "$(sha256sum _build/c/ouro1 | cut -d ' ' -f 1)" = "$HOST_BINARY_SHA256"
      - name: Verify full selected inputs and frozen stage equality evidence
        run: |
          python3 - <<'PY'
          import argparse, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import bootstrap_compiler as bootstrap
          import ouro_build as build
          from repo_support import sha256_file
          root = Path.cwd()
          cfg = build.load_config(argparse.Namespace())
          assert cfg.get_bool('cache_enabled')
          selected = bootstrap.current_inputs(root, cfg, build)
          binary = root / '_build/c/ouro1'
          receipt_path = binary.with_name('ouro1.bootstrap.json')
          receipt = json.loads(receipt_path.read_text())
          assert bootstrap.installed_current(binary, receipt_path, selected)
          assert receipt['selected'] == selected and receipt['key'] == os.environ['HOST_KEY']
          assert receipt['binary_sha256'] == sha256_file(binary) == os.environ['HOST_BINARY_SHA256']
          assert selected['source_form'] == 'original'
          assert len(selected['sources']) == int(os.environ['SOURCE_COUNT']) and len(selected['stage0']) == 2
          for path, digest in {**selected['sources'], **selected['stage0']}.items():
              assert sha256_file(root / path) == digest, path
          work = Path(receipt['work'])
          report_path = work / 'report.json'
          assert sha256_file(report_path) == receipt['report_sha256'] == os.environ['HOST_REPORT_SHA256']
          report = json.loads(report_path.read_text())
          assert report['pass'] and report['changed_inputs'] == [] and report['key'] == receipt['key']
          assert [p['phase'] for p in report['phases']] == ['c0', 'bridge', 'p1', 'p2']
          assert all(p['pass'] for p in report['phases'])
          equality = report['complete_generated_c_comparison']
          assert set(equality) == {'backend_u.c', 'driver_u.c'}
          for name, row in equality.items():
              assert row['p1_sha256'] == row['p2_sha256']
              for phase in ['p1', 'p2']:
                  assert sha256_file(work / 'out' / phase / name) == row[phase + '_sha256']
          out = root / '_build/native_lower_probe'
          (out / 'compiler-before.sha256').write_text(sha256_file(binary) + '\n')
          (out / 'inputs.json').write_text(json.dumps(selected, indent=2) + '\n')
          (out / 'host-report.json').write_bytes(report_path.read_bytes())
          (out / 'host.json').write_text(json.dumps({
              'artifact_id': os.environ['HOST_ARTIFACT_ID'], 'run_id': os.environ['HOST_RUN_ID'],
              'key': receipt['key'], 'binary_sha256': receipt['binary_sha256'],
              'report_sha256': receipt['report_sha256'], 'current_inputs_verified': True}, indent=2) + '\n')
          print('NATIVE_LOWER_HOST: PASS canonical import and complete selected inputs')
          PY
      - name: Check only unchanged native_lower with existing phase tracing
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          from dataclasses import asdict
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from ourosmith.limits import run_limited
          root = Path.cwd()
          out = root / '_build/native_lower_probe'
          source = json.loads((out / 'source.json').read_text())
          cpu = min(os.sched_getaffinity(0))
          os.sched_setaffinity(0, {cpu})
          env = dict(os.environ, OURO_MEM_TRACE='1')
          command = ['sh', 'scripts/ouro1.sh', 'check', 'tests/native_lower_tests.ouro', '999999']
          result = run_limited(command, cwd=root, env=env, timeout_s=1800, memory_mb=3072)
          (out / 'check.stdout').write_text(result.stdout)
          (out / 'check.stderr').write_text(result.stderr)
          (out / 'check.rc').write_text(str(result.returncode) + '\n')
          phases = [line for line in result.stderr.splitlines() if line.startswith('OURO_MEM_HEAP ')]
          (out / 'heap-phases.log').write_text('\n'.join(phases) + ('\n' if phases else ''))
          diagnostics = '\n'.join(line for line in result.stderr.splitlines() if not line.startswith('OURO_MEM_HEAP '))
          (out / 'diagnostics.stderr').write_text(diagnostics + ('\n' if diagnostics else ''))
          current_binary = hashlib.sha256((root / '_build/c/ouro1').read_bytes()).hexdigest()
          changed = [path for path, digest in source['sources'].items()
                     if hashlib.sha256((root / path).read_bytes()).hexdigest() != digest]
          drift = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()
          streams_bounded = all(len(text.encode('utf-8')) <= 16777216 for text in [result.stdout, result.stderr])
          checked = result.ok and result.stdout == 'CHECK_OK\n' and 'CHECK_FAIL' not in result.stderr
          summary = asdict(result)
          summary.pop('stdout'); summary.pop('stderr')
          summary.update({'source_sha': source['source_sha'], 'target': source['target'],
              'fuel': 999999, 'timeout_s': 1800, 'memory_mib': 3072, 'workers': 1, 'cpu': cpu,
              'trace_env': '1', 'phase_count': len(phases), 'phase_trace_may_include_native_collector': True,
              'pre_remap_error_or_failing_declaration_available': False,
              'stdout_sha256': hashlib.sha256(result.stdout.encode('utf-8')).hexdigest(),
              'stderr_sha256': hashlib.sha256(result.stderr.encode('utf-8')).hexdigest(),
              'binary_sha256_after': current_binary, 'changed_inputs': changed, 'tracked_drift': drift,
              'streams_within_owner_capture_bytes': streams_bounded, 'check_ok': checked})
          (out / 'check.json').write_text(json.dumps(summary, indent=2) + '\n')
          print('NATIVE_LOWER_CHECK: ' + json.dumps(summary, sort_keys=True), flush=True)
          if result.stderr: print(result.stderr, file=sys.stderr, end='')
          assert current_binary == (out / 'compiler-before.sha256').read_text().strip()
          assert not changed and not drift and streams_bounded
          assert checked, 'native compiler rejected native_lower or check did not complete'
          PY
      - name: Preserve attribution evidence after success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-lower-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            _build/native_lower_probe/
            _build/c/ouro-collect.build.json
            _build/c/ouro-collect.build.log
