name: PR89 compiler-14 red-green (diagnostic)

on:
  push:
    branches: [codef/pr89-compiler14-after-pr88]
    paths:
      - .github/workflows/ouro-pr89-compiler14-isolated.yml

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  compiler-14:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: red
            product_sha: 08de21e0322f1b45eb983ed6a8232dda0277b204
            fixture_blob: 1e5bf738fd000deb50d594977b1b1263204eeb28
            scanner_blob: c49ad90c230e5431ddf664f56f4d40dd2912ffcb
          - variant: green
            product_sha: 3818faab63b4b6a1c4ec7cf08cde0739d4397f8c
            fixture_blob: 597ed9026d411d1feaa5298d4234767849686299
            scanner_blob: 10cd42b3641f0398b7b69e38d19f8bbef403cfb5
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.product_sha }}
          persist-credentials: false

      - name: Verify exact product source
        env:
          EXPECTED_SOURCE_SHA: ${{ matrix.product_sha }}
          EXPECTED_FIXTURE_BLOB: ${{ matrix.fixture_blob }}
          EXPECTED_SCANNER_BLOB: ${{ matrix.scanner_blob }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git hash-object tests/compiler_driver_tests.ouro)" = "$EXPECTED_FIXTURE_BLOB"
          test "$(git hash-object compiler/preprocess_record_expr.ouro)" = "$EXPECTED_SCANNER_BLOB"
          test "$(git hash-object runtime/bootstrap.c)" = 5272a92d85d3f693407ec1f5d0e091fe461f8018

      - name: Build and verify matching host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Export matching host evidence
        id: bundle
        run: python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"

      - name: Verify and install matching host compiler
        env:
          EXPECTED_BUNDLE_SHA: ${{ steps.bundle.outputs.sha256 }}
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$EXPECTED_BUNDLE_SHA"

      - name: Upload bootstrap reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr89-bootstrap-${{ matrix.variant }}
          path: |
            _build/bootstrap/**/*.json
            _build/bootstrap/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run exact compiler-14 gate
        run: python3 scripts/ci_gate.py --profile pr --group compiler-14 --fail-fast --out _build/ci/pr-compiler-14

      - name: Upload compiler-14 reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr89-compiler-14-${{ matrix.variant }}
          path: |
            _build/ci/pr-compiler-14/**
            _build/compiler_check_suite_14/**
          if-no-files-found: warn
          retention-days: 7
