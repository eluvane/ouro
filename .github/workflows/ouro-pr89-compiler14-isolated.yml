name: PR89 compiler-14 red-green (diagnostic)

on:
  push:
    branches: [codef/pr89-compiler14-isolated]
    paths:
      - .github/workflows/ouro-pr89-compiler14-isolated.yml

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  compiler-14:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: red
            product_sha: 323fbb810b32fd436062448688d6e8234d91e3ba
            fixture_blob: 0f29b722e2482c590fc2aab4d6fe210eaa5daf4a
            scanner_blob: c49ad90c230e5431ddf664f56f4d40dd2912ffcb
            host_run: 36302360354
            bundle_sha: 141de8520ba1a730569c351b7f434889ccfa2d9d376f31f400327da1627bb245
          - variant: green
            product_sha: 360a77b9af7e06cfc54916c131bede1f4b7b170e
            fixture_blob: dbc767096e2ea9b7ce50997ecd8db6b57de1745a
            scanner_blob: 10cd42b3641f0398b7b69e38d19f8bbef403cfb5
            host_run: 36302397928
            bundle_sha: 4262ed9fb0fe09ec8149504022ed6892d4889d64d04c8b49ae657bc1fe98a343
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.product_sha }}
          persist-credentials: false

      - name: Verify exact product source
        env:
          EXPECTED_SOURCE_SHA: ${{ matrix.product_sha }}
          EXPECTED_FIXTURE_BLOB: ${{ matrix.fixture_blob }}
          EXPECTED_SCANNER_BLOB: ${{ matrix.scanner_blob }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git hash-object tests/compiler_driver_tests.ouro)" = "$EXPECTED_FIXTURE_BLOB"
          test "$(git hash-object compiler/preprocess_record_expr.ouro)" = "$EXPECTED_SCANNER_BLOB"

      - name: Download matching verified host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-${{ matrix.host_run }}-1
          run-id: ${{ matrix.host_run }}
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install matching host compiler
        env:
          EXPECTED_BUNDLE_SHA: ${{ matrix.bundle_sha }}
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$EXPECTED_BUNDLE_SHA"

      - name: Run exact compiler-14 gate
        run: python3 scripts/ci_gate.py --profile pr --group compiler-14 --fail-fast --out _build/ci/pr-compiler-14

      - name: Upload compiler-14 reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr89-compiler-14-${{ matrix.variant }}
          path: |
            _build/ci/pr-compiler-14/**
            _build/compiler_check_suite_14/**
          if-no-files-found: warn
          retention-days: 7
