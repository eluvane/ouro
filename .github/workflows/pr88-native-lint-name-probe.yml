name: PR88 native lint warning name probe

on:
  push:
    branches: [codef/pr88-native-lint-unbound-name]

permissions:
  contents: read
  actions: read

jobs:
  native-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "1"
      OURO_FRONTEND_JOBS: "1"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact PR88 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify candidate lineage and source
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "83daa56fafb7aa56ffd5fa9ab687c2d867aa1ddf"
          changed="$(git diff --name-only HEAD^ HEAD)"
          expected="$(printf '%s\n' '.github/workflows/pr88-native-lint-name-probe.yml' 'tools/lint_host.ouro')"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:tools/lint_host.ouro)" = "1d692f96e44a5bb65faeefed6fe144a34347d692"
          test "$(git rev-parse HEAD:tests/compiler_native_lint_tests.ouro)" = "a2e26f7d0fbb4541f045650ed23f1ea9a333b39d"
          test "$(git rev-parse HEAD:scripts/build_tool.sh)" = "ff83eec44937a8d9aa37c5af67aae2d57b93f4c3"
          test "$(git rev-parse HEAD:scripts/ci_gate.py)" = "16ea86bf60a3d3347c30af2f562a6b6b500b89ef"

      - name: Restore the PR compiler-14 cache prefix
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _cache/ouro
            _build/c
          key: ouro-pr-compiler-14-${{ runner.os }}-${{ hashFiles('Ouro.seal', 'scripts/**', 'compiler/**', 'runtime/**', 'tools/**', 'tests/**', 'std/**', 'quality/smith/**', 'docs/generated_artifact_hashes.sha256') }}
          restore-keys: |
            ouro-pr-compiler-14-${{ runner.os }}-
            ouro-pr-${{ runner.os }}-

      - name: Download exact verified Host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36334723667-1
          run-id: 36334723667
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install Host compiler
        shell: bash
        run: |
          echo "565c82bdf5c0dc9d5afab272db9b75fe800330a62c64fc0658ed9d3d9fc79e9a  _build/ci/host-compiler.tar.gz" | sha256sum -c -
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 565c82bdf5c0dc9d5afab272db9b75fe800330a62c64fc0658ed9d3d9fc79e9a

      - name: Run unchanged compiler native lint fixture
        shell: bash
        run: |
          mkdir -p _build/diag-native-lint
          OURO_BUILD_TOOL_MODE=native sh scripts/build_tool.sh tests/compiler_native_lint_tests.ouro _build/diag-native-lint/native-lint-test >_build/diag-native-lint/build.out 2>_build/diag-native-lint/build.err
          set +e
          _build/diag-native-lint/native-lint-test >_build/diag-native-lint/fixture.out 2>_build/diag-native-lint/fixture.err
          status=$?
          set -e
          test "$status" -eq 0
          test ! -s _build/diag-native-lint/fixture.err
          test "$(grep -c '^PRECISION_OK ' _build/diag-native-lint/fixture.out)" -eq 44
          test "$(wc -l < _build/diag-native-lint/fixture.out)" -eq 45
          grep -Fxq 'PRECISION_SUITE compiler-native-lint rows=44' _build/diag-native-lint/fixture.out

      - name: Upload exact fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-native-lint-name-verdict
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/diag-native-lint/*.out
            _build/diag-native-lint/*.err
            _build/diag-native-lint/*.json
