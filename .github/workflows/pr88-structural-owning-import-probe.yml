name: PR88 structural owning import verification

on:
  push:
    branches: [codef/pr88-structural-owning-import]
    paths: [.github/workflows/pr88-structural-owning-import-probe.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr88-structural-owning-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [structural-native, compiler-11]
    env:
      OURO_CI: '1'
      OURO_CACHE: '1'
      OURO_CCACHE: disabled
      PYTHONDONTWRITEBYTECODE: '1'
      OURO_JOBS: '1'
      OURO_REPRODUCIBLE: '1'
      OURO_BUILD_TOOL_MODE: native
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout diagnostic workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Require the workflow-only chain from reviewed source
        run: |
          test "$(git rev-parse HEAD^)" = 68cd97803129720c7a152b5f1b16712c92bddce5
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/pr88-structural-owning-import-probe.yml
      - name: Checkout unchanged product source in the official receipt root
        run: git checkout --detach 68cd97803129720c7a152b5f1b16712c92bddce5
      - name: Guard source, fixture and compiler owners
        run: |
          test "$(git rev-parse HEAD)" = 68cd97803129720c7a152b5f1b16712c92bddce5
          test "$(git rev-parse HEAD^)" = 9619ab39d51c2bff4f92a5dbfcb4f1dfc7c0af39
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = tests/compiler_structural_tests.ouro
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          blobs = {
              'compiler/ast.ouro': '933f1f4cf57e3d72cbafff318957558baedd991b',
              'std/types.ouro': '0d286e8b2be9ff9966ffb6485f50a4dd01ae7b11',
              'compiler/lower_support.ouro': '5975a3460c1e395b35dd8d298ea77a11c16af5ef',
              'tests/compiler_structural_tests.ouro': 'cb2c0a17de53ffa8d83f6f65a6aa73001d5abc26',
              'compiler/lower_env.ouro': '56776adc3e2683aa51e01c9c54a608e18459b94a',
              'compiler/lower.ouro': '13f4fc2fab55f8e6928fff31c9cd993767c8873e',
              'compiler/lower_named.ouro': '6d6a481c698fcc390a40bfa807441be8a6828878',
              'compiler/core.ouro': '9c854884896b4385c2046e61e3729b07d78c9476',
              'runtime/frontend_link.c': 'f10104eb4bc30055dabb3163a82f181c6eae9f1a',
              'scripts/bootstrap_compiler.py': '937f93c11a055e42c0ecb22f8c10fce2d748817c',
              'scripts/ci_gate.py': '16ea86bf60a3d3347c30af2f562a6b6b500b89ef',
              'scripts/ouro1.sh': '9665ebb00049d05c097a29d77ec5083b524f9e2d',
              'scripts/ourosmith/limits.py': 'aa92339539ea580b0a2569d7df7f085f94765156',
              'tools/test/suites.ouro': '8d97994c3f3877fa94acb8797811ac17e87d78a0',
              'tests/compiler_native_syntax_tests.ouro': '9dc2f50b464829d3e8fd51e3597a5d0530022e8b',
              'scripts/build_tool.sh': 'ff83eec44937a8d9aa37c5af67aae2d57b93f4c3',
          }
          for path, digest in blobs.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == digest, (path, actual)
          fixture = Path('tests/compiler_structural_tests.ouro').read_bytes()
          original = subprocess.check_output(['git', 'show', '9619ab39d51c2bff4f92a5dbfcb4f1dfc7c0af39:tests/compiler_structural_tests.ouro'])
          marker = b'  "../compiler/lower_support.ouro",'
          assert original.count(marker) == 1
          assert fixture == original.replace(marker, b'  "../compiler/lower.ouro",\n' + marker)
          assert hashlib.sha256(fixture).hexdigest() == '554926bfc382d65f35d9b41396f5ad484d09eb73440eb8cd8573b8ea7fac8e7a'
          Path('_build/ci/structural-owning-import').mkdir(parents=True)
          PY
          python3 scripts/ci_gate.py --compiler-artifact key > _build/ci/structural-owning-import/key.stdout
          test "$(cat _build/ci/structural-owning-import/key.stdout)" = key=f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c
      - name: Download official matching Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 10946340921
          run-id: 36360415225
          github-token: ${{ github.token }}
          path: _build/ci
          merge-multiple: true
      - name: Import with the unchanged source-bound verifier
        run: |
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path('_build/c/ouro1.bootstrap.json').read_text())
          selected = receipt['selected']
          assert receipt['kind'] == 'ouro.current-c-bootstrap.v1'
          assert receipt['key'] == 'f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c'
          assert receipt['binary_sha256'] == '460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c'
          assert hashlib.sha256(Path('_build/c/ouro1').read_bytes()).hexdigest() == receipt['binary_sha256']
          assert len(selected['sources']) == 177 and len(selected['stage0']) == 2
          for inputs in (selected['sources'], selected['stage0']):
              for path, digest in inputs.items():
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          report = json.loads((Path(receipt['work']) / 'report.json').read_text())
          assert report['pass'] and not report['changed_inputs']
          comparisons = report['complete_generated_c_comparison']
          assert set(comparisons) == {'driver_u.c', 'backend_u.c'}
          for row in comparisons.values():
              assert row['p1_sha256'] == row['p2_sha256']
          evidence = {'source_sha': '68cd97803129720c7a152b5f1b16712c92bddce5',
                      'key': receipt['key'], 'binary_sha256': receipt['binary_sha256'],
                      'sources': selected['sources'], 'stage0': selected['stage0'],
                      'complete_generated_c_comparison': comparisons}
          Path('_build/ci/structural-owning-import/host-receipt.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Require the native compiler toolchain
        run: |
          command -v cc || command -v gcc
          command -v /usr/bin/time
      - name: Check, build and run all unchanged Structural laws
        if: matrix.group == 'structural-native'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          from scripts.ourosmith.limits import run_limited
          out = Path('_build/ci/structural-owning-import')
          fixture = Path('tests/compiler_structural_tests.ouro')
          source = fixture.read_text(encoding='utf-8')
          labels = re.findall(r'assert_(?:true|eq)(?:\s*\(\s*|\s+)"([^"\n]+)"', source)
          groups = re.findall(r'structural_test_\w+', source[source.index('def main :'):])
          assert groups == ['structural_test_paths', 'structural_test_source', 'structural_test_uses',
                            'structural_test_lower_hints', 'structural_test_implicit',
                            'structural_test_implicit_defs', 'structural_test_named_calls',
                            'structural_test_lookup'], groups
          assert len(labels) == 120 and len(set(labels)) == 120, labels
          expected = ''.join('ok ' + label + '\n' for label in labels)
          (out / 'structural.expected.stdout').write_text(expected, encoding='utf-8')
          binary = Path('_build/structural-owning-import/structural')
          cpu = str(min(os.sched_getaffinity(0)))
          def phase(name, command):
              argv = ['/usr/bin/time', '-v', '-o', str(out / (name + '.time')),
                      'taskset', '-c', cpu, *command]
              result = run_limited(argv, cwd=Path.cwd(), env=os.environ.copy(),
                                   timeout_s=1800, memory_mb=2944)
              (out / (name + '.stdout')).write_text(result.stdout, encoding='utf-8')
              (out / (name + '.stderr')).write_text(result.stderr, encoding='utf-8')
              row = {'argv': argv, 'status': result.classify(), 'returncode': result.returncode,
                     'elapsed_s': result.elapsed_s, 'peak_rss_mb': result.peak_rss_mb,
                     'timeout_s': 1800, 'memory_mib': 2944, 'cpu': cpu,
                     'source_sha256': hashlib.sha256(fixture.read_bytes()).hexdigest(), 'laws': len(labels)}
              (out / (name + '.json')).write_text(json.dumps(row, indent=2) + '\n')
              print('STRUCTURAL_PHASE ' + json.dumps(row), flush=True)
              assert result.ok, (name, row)
              return result
          checked = phase('native-check', ['sh', 'scripts/ouro1.sh', 'check', str(fixture), '999999'])
          assert checked.stdout == 'CHECK_OK\n' and checked.stderr == '', (checked.stdout, checked.stderr)
          phase('native-build', ['sh', 'scripts/build_tool.sh', str(fixture), str(binary), '999999'])
          assert binary.is_file() and os.access(binary, os.X_OK), binary
          result = phase('native-run', [str(binary)])
          assert result.stdout == expected and result.stderr == '', (result.stdout, result.stderr)
          evidence = {'source_sha': '68cd97803129720c7a152b5f1b16712c92bddce5', 'laws': len(labels),
                      'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                      'stdout_sha256': hashlib.sha256(result.stdout.encode()).hexdigest(),
                      'compiler_checked': True, 'native_built': True, 'all_assertions_executed': True}
          (out / 'structural-verdict.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print('STRUCTURAL_NATIVE_PASS laws=' + str(len(labels)), flush=True)
          PY
      - name: Run the unchanged adjacent compiler-11 gate
        if: matrix.group == 'compiler-11'
        env:
          TEST_SUITE_OUT: _build/ci/structural-owning-import/compiler11-native
        run: |
          python3 scripts/ci_gate.py --profile pr --group compiler-11 --fail-fast --out _build/ci/structural-owning-import/compiler11
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('_build/ci/structural-owning-import/compiler11/ci-summary.json').read_text())
          assert data['pass'] and not data['blocking_failures'] and not data['not_run']
          assert len(data['gates']) == 1 and data['gates'][0]['name'] == 'compiler-checking-11'
          assert data['gates'][0]['status'] == 'pass' and data['gates'][0]['returncode'] == 0
          print('CANONICAL_COMPILER11_PASS')
          PY
      - name: Upload focused receipts, outputs and limits
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr88-structural-owning-import-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            _build/ci/structural-owning-import/**/*.json
            _build/ci/structural-owning-import/**/*.stdout
            _build/ci/structural-owning-import/**/*.stderr
            _build/ci/structural-owning-import/**/*.time
            _build/ci/structural-owning-import/**/*.log
            _build/ci/structural-owning-import/**/*.out
            _build/ci/structural-owning-import/**/*.err
            _build/ci/structural-owning-import/**/*.tsv
            _build/ci/structural-owning-import/key.stdout
