name: Clippy pure parse result probe

on:
  push:
    branches: [ codef/clippy-pure-parse-result-probe ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clippy-pure-parse-result-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  probe:
    name: Pure parse result laws and precision
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact product snapshot
        run: |
          mkdir -p _build/clippy-pure-parse-result
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          product = "3f37c3387d83a1aa3ac1721f65fca62b50734267"
          assert git("rev-parse", "HEAD^") == product
          assert git("diff", "--name-only", "HEAD^", "HEAD") == ".github/workflows/clippy-pure-parse-result-probe.yml"
          assert not git("status", "--porcelain", "--untracked-files=no")
          expected = {
              "tools/clippy/semantic_calls.ouro": "a58f5797e15d062f047864e444236720ea347af8",
              "tools/clippy/semantic_model.ouro": "c7087cf9eacc28b35e19174cda6d5a81054f5473",
              "tools/clippy/semantic_proof.ouro": "6bf538cdeeacd051add6c7c3f5f6aee688c9414d",
              "tools/clippy/semantic_definition.ouro": "252e4d069d0410f750997eb3afc29e2ad3a06d3b",
              "tools/clippy/semantic_rules.ouro": "86e3657ed38be5513399d3eb258be90e2ab5046d",
              "tests/clippy_semantic/proofs.ouro": "5934398cfc04ba66f1b5203f041c5b6340a10ae3",
              "tests/clippy_semantic/pure_parse_laws.ouro": "1656689e49d2b0fae9ef8905543e6c37f1ee68d2",
              "tests/clippy_semantic/performance.ouro": "15d2cd23f235696e562643c9fbd8869b09e95796",
              "tests/clippy_semantic/cases.json": "13818a62d8b8a31d300729de4f8c0e0585410794",
              "quality/clippy_grade_rules.json": "40aa1b918f89ea012c890ee3934aaaa94345df55",
          }
          actual = {path: git("rev-parse", "HEAD:" + path) for path in expected}
          assert actual == expected, actual
          report = {"product": product, "probe": git("rev-parse", "HEAD"), "blobs": actual}
          pathlib.Path("_build/clippy-pure-parse-result/source.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Build and verify host compiler
        id: host
        run: |
          python3 scripts/ouro_build.py build --verbosity quiet 2>&1 | tee _build/clippy-pure-parse-result/host.log

      - name: Run native semantic laws
        if: ${{ always() && steps.host.outcome == 'success' }}
        run: |
          python3 scripts/clippy_grade_suite.py --laws-only --out _build/clippy-pure-parse-result/laws 2>&1 | tee _build/clippy-pure-parse-result/laws.log

      - name: Run native semantic precision
        if: ${{ always() && steps.host.outcome == 'success' }}
        run: |
          python3 scripts/clippy_grade_suite.py --precision-only --out _build/clippy-pure-parse-result/precision 2>&1 | tee _build/clippy-pure-parse-result/precision.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clippy-pure-parse-result-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/clippy-pure-parse-result/source.json
            _build/clippy-pure-parse-result/host.log
            _build/clippy-pure-parse-result/laws.log
            _build/clippy-pure-parse-result/precision.log
            _build/clippy-pure-parse-result/laws/*.json
            _build/clippy-pure-parse-result/laws/*.log
            _build/clippy-pure-parse-result/laws/*.stdout
            _build/clippy-pure-parse-result/laws/*.stderr
            _build/clippy-pure-parse-result/laws/**/*.json
            _build/clippy-pure-parse-result/laws/**/*.log
            _build/clippy-pure-parse-result/laws/**/*.stdout
            _build/clippy-pure-parse-result/laws/**/*.stderr
            _build/clippy-pure-parse-result/precision/*.json
            _build/clippy-pure-parse-result/precision/*.log
            _build/clippy-pure-parse-result/precision/*.stdout
            _build/clippy-pure-parse-result/precision/*.stderr
            _build/clippy-pure-parse-result/precision/**/*.json
            _build/clippy-pure-parse-result/precision/**/*.log
            _build/clippy-pure-parse-result/precision/**/*.stdout
            _build/clippy-pure-parse-result/precision/**/*.stderr
            _build/bootstrap/**/*.json
            _build/bootstrap/**/*.log
            _build/bootstrap/**/*.stderr
