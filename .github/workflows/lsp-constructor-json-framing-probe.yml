name: LSP constructor JSON framing probe

on:
  push:
    branches: [ codef/lsp-constructor-json-framing-probe ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lsp-constructor-json-framing-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  lsp:
    name: "Exact #94 LSP suite"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact product snapshot
        run: |
          test "$(git rev-parse HEAD^)" = 6521d5b6f9c68a046244f5410cf8dc404d09fc90
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/lsp-constructor-json-framing-probe.yml
          test "$(git hash-object tools/lsp.ouro)" = 9b892fcbba0258e8d09d1e32cd5c4cce76505bc1
          test "$(git hash-object tools/lsp_model.ouro)" = bf99dddc99af6b3af9c5df175752ccc0dc2af61d
          test "$(git hash-object tools/lsp_process_model.ouro)" = d96f41d19baac7df86e5c83e0c901a6e4a31ce02
          test "$(git hash-object scripts/lsp_suite.sh)" = e7a8221d1f475ee62cec76321297300d97b320ba
          test "$(git hash-object scripts/ci_gate.py)" = 16ea86bf60a3d3347c30af2f562a6b6b500b89ef
          test "$(git hash-object scripts/bootstrap_compiler.py)" = 937f93c11a055e42c0ecb22f8c10fce2d748817c
          test "$(git hash-object scripts/build_tool.sh)" = ff83eec44937a8d9aa37c5af67aae2d57b93f4c3
          test "$(git hash-object scripts/native_tool_build.py)" = 0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce
          test "$(git hash-object Ouro.seal)" = f078fbe47670a948c96a1d8076761c2140455bbe
          test "$(python3 scripts/ci_gate.py --compiler-artifact key)" = key=321c369d5ad5efe4b8c26cbd47c80973a223f750189a4bf0fe3d9814041ad428

      - name: Download verified exact-head Host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10945092404
          run-id: 36357871841
          github-token: ${{ github.token }}
          path: _build/ci
          merge-multiple: true

      - name: Verify and install Host compiler
        run: |
          mkdir -p _build/lsp_probe
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 3435db2adf6ab885c4279e56f2b2d24e0f54117cb997784bf12fdbe52567044d >_build/lsp_probe/import.stdout 2>_build/lsp_probe/import.stderr
          cat _build/lsp_probe/import.stdout
          cat _build/lsp_probe/import.stderr >&2

      - name: Run canonical LSP suite
        run: |
          mkdir -p _build/lsp_probe
          set +e
          sh scripts/lsp_suite.sh >_build/lsp_probe/suite.stdout 2>_build/lsp_probe/suite.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/lsp_probe/suite.rc
          cat _build/lsp_probe/suite.stdout
          cat _build/lsp_probe/suite.stderr >&2
          test "$rc" -eq 0
          grep -q '^LSP_SUITE: PASS rows=64 out=' _build/lsp_probe/suite.stdout
          ! grep -E 'LSP_SUITE: SKIP|LSP_SUITE: FAIL|LSP_FAIL' _build/lsp_probe/suite.stdout _build/lsp_probe/suite.stderr
          test -s _build/lsp_suite/constructors.jsonl
          ! grep -E '"code":-32700|"message":"invalid JSON"' _build/lsp_suite/constructors.jsonl

      - name: Upload complete LSP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsp-constructor-json-framing-${{ github.run_id }}
          path: |
            _build/lsp_probe/
            _build/lsp_suite/
            _build/c/ouro1.bootstrap.json
            _build/bootstrap/**/inputs.json
            _build/bootstrap/**/report.json
          if-no-files-found: error
          retention-days: 14
