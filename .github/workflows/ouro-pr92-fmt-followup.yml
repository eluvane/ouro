name: Diagnostic formatter follow-up

on:
  push:
    branches: [codef/pr92-fmt-followup-probe]
    paths:
      - .github/workflows/ouro-pr92-fmt-followup.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: pr92-fmt-followup-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  FMT_SUITE_OUT: _build/fmt_suite

jobs:
  fmt:
    name: Run source-bound formatter suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact formatter follow-up
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Guard exact source and diagnostic-only workflow commit
        run: |
          test "$(git rev-parse HEAD^)" = 029e1750e422fe2cb42e836f89ca6dcb5e761e01
          test "$(git rev-parse HEAD^^)" = 4e829f4e482cc2833e408fc5b503119e52ffdad8
          test "$(git rev-parse HEAD:tools/fmt.ouro)" = 83432dbe5bb799b2a32b659ebb8dc57b12965516
          test "$(git rev-parse HEAD:tools/fmt_pipeline.ouro)" = 8937a69a68cb7c98c06a16c9f918446868ded8a8
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True
          ).splitlines()
          if changed != ['.github/workflows/ouro-pr92-fmt-followup.yml']:
              raise SystemExit(f'unexpected diagnostic paths: {changed}')
          PY

      - name: Download Host from exact PR 92 parent run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: eluvane/ouro
          run-id: 36340601516
          github-token: ${{ github.token }}
          name: host-compiler-36340601516-1
          path: _build/ci

      - name: Verify artifact bytes and current source receipt
        run: |
          echo 'c0376c71a09ebf35ef31bcca601ed3ea8080278ef213d995e92c4ed40b47bef3  _build/ci/host-compiler.tar.gz' | sha256sum --check -
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 c0376c71a09ebf35ef31bcca601ed3ea8080278ef213d995e92c4ed40b47bef3

      - name: Require a system C compiler
        run: command -v cc || command -v gcc

      - name: Run unchanged formatter suite, including selftest and idempotence
        run: sh scripts/fmt_suite.sh

      - name: Require the built native formatter
        run: test -x _build/fmt_suite/ouro-fmt || test -x _build/fmt_suite/ouro-fmt.exe

      - name: Upload formatter reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr92-fmt-followup-${{ github.run_attempt }}
          path: |
            _build/fmt_suite/*.log
            _build/fmt_suite/*.out
            _build/fmt_suite/*.err
            _build/fmt_suite/**/*.out
            _build/fmt_suite/**/*.err
          if-no-files-found: ignore
          retention-days: 14
