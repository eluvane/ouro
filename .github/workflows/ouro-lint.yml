name: Lint

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ouro-lint-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Run lint suite
        run: python3 scripts/ci_gate.py --profile pr --group lint --out _build/ci/lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.txt
            _build/**/*.err
            _build/**/*.sarif
            _build/**/*.md
