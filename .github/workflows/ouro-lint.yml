name: Frontend host performance probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ouro-lint-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  lint:
    name: Frontend host performance probe
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Measure frontend host build (diagnostic only)
        run: |
          mkdir -p _build/frontend_host_perf
          (
            while true; do
              printf 'PROBE_TICK time=%s\n' "$(date -u +%FT%TZ)"
              ps -eo pid,ppid,etime,%cpu,rss,args | grep -E 'frontend_host_suite.py|ouro1|cc1' | grep -v grep || true
              find _build/frontend_host_perf -name backend.gen.c -printf 'PROBE_EMIT bytes=%s file=%p\n'
              sleep 30
            done
          ) >_build/frontend_host_perf/progress.log 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          python3 scripts/frontend_host_suite.py \
            --compiler _build/c/ouro1 --out _build/frontend_host_perf \
            --jobs 1 --build-timeout 1800

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.stdout
            _build/**/*.txt
            _build/**/*.err
            _build/**/*.stderr
            _build/**/*.sarif
            _build/**/*.md
