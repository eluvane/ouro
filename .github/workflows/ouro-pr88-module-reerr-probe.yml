name: PR88 module resolver stage (diagnostic)

on:
  push:
    branches: [codef/pr88-module-test-probe]
    paths:
      - .github/workflows/ouro-pr88-module-reerr-probe.yml

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  resolver-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and compiler inputs
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 83daa56fafb7aa56ffd5fa9ab687c2d867aa1ddf
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = .github/workflows/ouro-pr88-module-reerr-probe.yml
          test "${changed[1]}" = tests/compiler_module_reerr_probe.ouro
          test "$(git hash-object tests/compiler_module_reerr_probe.ouro)" = 5b5e8d1f0fa90d0e7bd798139ff5070d1527f923
          test "$(git hash-object compiler/module_registry.ouro)" = 30ee6499335e1bbf1bafeb7778e0a2316b3f1e90
          test "$(git hash-object compiler/module_names.ouro)" = 09ba60947c29605fdbebf47a2f9a75630dfb0d26
          test "$(git hash-object runtime/bootstrap.c)" = 5272a92d85d3f693407ec1f5d0e091fe461f8018
          test "$(git hash-object scripts/ci_gate.py)" = 16ea86bf60a3d3347c30af2f562a6b6b500b89ef

      - name: Download exact PR88 host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36331124412-1
          run-id: 36331124412
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install source-matching host compiler
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 e337fb7e0780c124ec6fbd2837c07c75f6f963802d0134c7d7751ba505221cfa

      - name: Check and build diagnostic root
        run: |
          mkdir -p _build/pr88-module-reerr
          sh scripts/ouro1.sh check tests/compiler_module_reerr_probe.ouro \
            >_build/pr88-module-reerr/check.stdout \
            2>_build/pr88-module-reerr/check.stderr
          grep -Fxq CHECK_OK _build/pr88-module-reerr/check.stdout
          sh scripts/build_tool.sh tests/compiler_module_reerr_probe.ouro \
            _build/pr88-module-reerr/probe \
            >_build/pr88-module-reerr/build.stdout \
            2>_build/pr88-module-reerr/build.stderr

      - name: Run three resolver probes
        run: |
          _build/pr88-module-reerr/probe \
            >_build/pr88-module-reerr/run.stdout \
            2>_build/pr88-module-reerr/run.stderr
          cat _build/pr88-module-reerr/run.stdout
          test ! -s _build/pr88-module-reerr/run.stderr
          test "$(wc -l <_build/pr88-module-reerr/run.stdout)" -eq 3
          grep -Eq '^qualified original=8/23 stage=(18|19|20|21|22|23|24|25|26)/23$' _build/pr88-module-reerr/run.stdout
          grep -Eq '^literal original=8/16 stage=(18|19|20|21|22|23|24|25|26)/16$' _build/pr88-module-reerr/run.stdout
          grep -Eq '^selected original=8/22 stage=(18|19|20|21|22|23|24|25|26)/22$' _build/pr88-module-reerr/run.stdout

      - name: Upload small diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-module-reerr-stage
          path: |
            _build/pr88-module-reerr/*.stdout
            _build/pr88-module-reerr/*.stderr
          if-no-files-found: warn
          retention-days: 7
