name: PR88 canceled gate verdict probe

on:
  push:
    branches: [codef/pr88-cancelled-gates-probe]

permissions:
  contents: read
  actions: read

jobs:
  exact-gate:
    name: PR88 (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [compiler-14, analyzer, tests]
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact PR88 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "83daa56fafb7aa56ffd5fa9ab687c2d867aa1ddf"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr88-cancelled-gates-probe.yml"
          test "$(git rev-parse HEAD:scripts/ci_gate.py)" = "16ea86bf60a3d3347c30af2f562a6b6b500b89ef"
          test "$(git rev-parse HEAD:tests/analyze/precision/absint.ouro)" = "e5e66a5704ef912e91d00987e9766b519514de3b"

      - name: Restore the PR group cache prefix
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _cache/ouro
            _build/c
          key: ouro-pr-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('Ouro.seal', 'scripts/**', 'compiler/**', 'runtime/**', 'tools/**', 'tests/**', 'std/**', 'quality/smith/**', 'docs/generated_artifact_hashes.sha256') }}
          restore-keys: |
            ouro-pr-${{ matrix.group }}-${{ runner.os }}-
            ouro-pr-${{ runner.os }}-

      - name: Download exact verified Host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36334723667-1
          run-id: 36334723667
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install Host compiler
        shell: bash
        run: |
          echo "565c82bdf5c0dc9d5afab272db9b75fe800330a62c64fc0658ed9d3d9fc79e9a  _build/ci/host-compiler.tar.gz" | sha256sum -c -
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 565c82bdf5c0dc9d5afab272db9b75fe800330a62c64fc0658ed9d3d9fc79e9a

      - name: Run the unchanged PR group
        shell: bash
        env:
          CHANGED_PATHS: "[]"
          SELECTION_KEY: 4cb54de5f19e7cdb059b8d12451d12378784b2e63a13235abd99e5ddaebe16a6
          CI_GROUP: ${{ matrix.group }}
        run: python3 scripts/ci_gate.py --profile pr --group "$CI_GROUP" --changed-paths-json "$CHANGED_PATHS" --selection-key "$SELECTION_KEY" --fail-fast --out "_build/ci/pr-$CI_GROUP"

      - name: Upload exact gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-${{ matrix.group }}-verdict
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.txt
            _build/**/*.err
            _build/**/*.stdout
            _build/**/*.stderr
            _build/**/*.sarif
            _build/**/*.md
            _build/**/gate.log
