name: Strict scan phase probe

on:
  push:
    branches: [codef/strict-scan-phase-probe]

permissions:
  contents: read

jobs:
  strict-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "bb4e16b31ca97b832e4f2a6bd6a8abb7e8f7c045"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/strict-scan-phase-probe.yml"
          test "$(git rev-parse HEAD:tools/strict/main.ouro)" = "a1f8f91064446a800f514170388915d67f463004"
      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet
      - name: Measure release strict quality gate
        env:
          OURO_BUILD_TOOL_MODE: auto
        run: python3 scripts/memory_budget_suite.py --case strict-quality-gate --out _build/memory
      - name: Stream native phase trace under the same memory budget
        if: always()
        shell: bash
        env:
          OURO_ROOT: ${{ github.workspace }}
        run: |
          test -x _build/c/ouro-strict-quality-firewall
          python3 scripts/memory_watch.py \
            --label strict-native-phase-probe --budget-kb 1024000 \
            --cwd . --json _build/memory/strict-native-phase-probe.json \
            -- ./_build/c/ouro-strict-quality-firewall \
            --profile release \
            --report _build/memory/strict-quality-firewall.direct.json \
            --sarif _build/memory/strict-quality-firewall.direct.sarif \
            --migration-report _build/memory/strict-quality-migration.direct.md \
            > _build/memory/strict-native-phase-probe.log 2>&1
      - name: Upload measurement and build receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-scan-phase-probe
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/memory/**/*.json
            _build/memory/**/*.log
            _build/c/ouro-strict-quality-firewall.build.json
