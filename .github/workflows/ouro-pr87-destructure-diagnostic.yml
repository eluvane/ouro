name: PR87 destructuring cases (diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [codef/pr87-destructure-diagnostic]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  destructure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CCACHE: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact product source
        run: |
          test "$(git rev-parse HEAD^)" = "00a1a6aed338551cb73f9c34406eb40f1debbf84"
          test "$(git hash-object tests/language_ergonomics/cases.json)" = "24cabcc54398a996692a7f2ed05a0cfed7470015"
          python3 scripts/language_ergonomics_suite.py --validate-manifest

      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Run targeted destructuring manifest
        run: python3 scripts/ouro_smith.py manifest --prefix=ERGO.expansion-destructure- --out=_build/pr87-destructure-diagnostic --label=PR87_DESTRUCTURE

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr87-destructure-${{ github.sha }}
          path: |
            _build/pr87-destructure-diagnostic/gate.log
            _build/pr87-destructure-diagnostic/native/manifest-report.json
            _build/pr87-destructure-diagnostic/native/rows.tsv
            _build/pr87-destructure-diagnostic/native/ERGO.expansion-destructure-*.out
          if-no-files-found: warn
          retention-days: 7
