name: Compiler-14 source preflight (diagnostic)

on:
  push:
    branches: [codef/byte-compiler14-preflight-diagnostic]
    paths:
      - .github/workflows/ouro-byte-compiler14-preflight.yml

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
      EXPECTED_SOURCE_SHA: 5b4b4ba2613e0ea40d64cc0920f1d26d091635a5
      EXPECTED_PARENT_SHA: 59fce01fcb206431ad743179b0f7a7c4a0e3337e
      EXPECTED_DRIVER_BLOB: 20affd42d96fe9eb07be78a9a4b979e135db8e55
      EXPECTED_LINT_BLOB: c5a9f6fe544c378a8a898816fe97a177c220fdb1
      EXPECTED_HOST_KEY: 669273c1601fbd51d6668fbe6f0a48bc819b57c375c2ad83d93afe47b3e1c519
      EXPECTED_BUNDLE_SHA: 940ebe31b476f3776eb9a94f68548f50ea681d91cec3a27952a55f27b250f3a0
    steps:
      - name: Checkout exact test-source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5b4b4ba2613e0ea40d64cc0920f1d26d091635a5
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact source and unchanged compiler inputs
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git hash-object tests/compiler_driver_tests.ouro)" = "$EXPECTED_DRIVER_BLOB"
          test "$(git hash-object tests/compiler_native_lint_tests.ouro)" = "$EXPECTED_LINT_BLOB"
          changed="$(git diff --name-only HEAD^ HEAD)"
          expected="$(printf 'tests/compiler_driver_tests.ouro\ntests/compiler_native_lint_tests.ouro')"
          test "$changed" = "$expected"

      - name: Download matching verified host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36301541621-1
          run-id: 36301541621
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install matching host compiler
        run: |
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$EXPECTED_BUNDLE_SHA"
          python3 - <<'PY'
          import json
          import os
          with open('_build/c/ouro1.bootstrap.json', encoding='utf-8') as handle:
              actual = json.load(handle)['key']
          assert actual == os.environ['EXPECTED_HOST_KEY'], (actual, os.environ['EXPECTED_HOST_KEY'])
          PY

      - name: Check the two affected compiler-14 sources
        run: |
          mkdir -p _build/ci/compiler14-preflight
          set +e
          sh scripts/ouro1.sh check tests/compiler_driver_tests.ouro \
            >_build/ci/compiler14-preflight/driver.out \
            2>_build/ci/compiler14-preflight/driver.err
          driver_rc=$?
          sh scripts/ouro1.sh check tests/compiler_native_lint_tests.ouro \
            >_build/ci/compiler14-preflight/native-lint.out \
            2>_build/ci/compiler14-preflight/native-lint.err
          lint_rc=$?
          set -e
          cat _build/ci/compiler14-preflight/driver.out
          cat _build/ci/compiler14-preflight/driver.err >&2
          cat _build/ci/compiler14-preflight/native-lint.out
          cat _build/ci/compiler14-preflight/native-lint.err >&2
          printf 'driver rc=%s; native-lint rc=%s\n' "$driver_rc" "$lint_rc"
          test "$driver_rc" -eq 0
          test "$lint_rc" -eq 0
          grep -Fxq CHECK_OK _build/ci/compiler14-preflight/driver.out
          grep -Fxq CHECK_OK _build/ci/compiler14-preflight/native-lint.out

      - name: Upload preflight reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byte-compiler14-preflight
          path: _build/ci/compiler14-preflight/**
          if-no-files-found: warn
          retention-days: 7
