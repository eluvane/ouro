      - name: Relink immutable P2 C with only disposable six-site checker glue
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from ourosmith.limits import run_limited
          out=Path('_build/ci/native-lower-checker-phases')
          argv=[sys.executable,'-B','_build/diag-inputs/relink_checker_phases.py',
                '--checkout',str(Path.cwd()),
                '--observed-link','_build/diag-inputs/checker-phases/frontend_link.observed.c',
                '--observed-runtime','_build/diag-inputs/checker-phases/ouro_rt.observed.c',
                '--trace-table','_build/diag-inputs/checker-phases/checker_trace_table.c.inc',
                '--phase-proof','_build/diag-inputs/checker-phases/checker-phases-proof.json']
          launcher=['sh','-c','ulimit -s unlimited 2>/dev/null || true; exec "$@"','diagnostic-relink',*argv]
          child_env=dict(os.environ,OURO_JOBS='1',OURO_FRONTEND_JOBS='1',
                         OURO_CACHE='0',OURO_ROOT=str(Path.cwd()),PYTHONDONTWRITEBYTECODE='1')
          allowed=os.sched_getaffinity(0)
          os.sched_setaffinity(0,{min(allowed)})
          record={'phase':'diagnostic-relink','status':'running','pass':False,'argv':argv,
                  'policy':{'timeout_s':1800,'memory_mib':3072,'cpu_count':1,'stack':'stock unlimited'}}
          def save():
              (out/'relink.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          try:
              result=run_limited(launcher,timeout_s=1800,memory_mb=3072,
                                 cwd=Path.cwd(),env=child_env,stdin_text='')
              (out/'relink.stdout').write_text(result.stdout)
              (out/'relink.stderr').write_text(result.stderr)
              (out/'relink.rc').write_text(str(result.returncode)+'\n')
              record.update(status=result.status,rc=result.returncode,elapsed_s=result.elapsed_s,
                            peak_rss_mb=result.peak_rss_mb,peak_rss_measured=False,**{'pass':result.ok})
              save()
              assert result.ok,record
          finally:
              os.sched_setaffinity(0,allowed)
          PY

      - name: Require exact stock and default observer GOOD BAD protocols
        run: |
          set -euo pipefail
          OURO_MEM_TRACE=0 python3 -B _build/diag-inputs/run_default_controls.py --checkout "$PWD"

      - name: Observe selected raw checker phases with all 172 units and retained limits
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import argparse, hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import bootstrap_compiler as bootstrap
          import ouro_build as build
          from ourosmith.limits import run_limited
          out=Path('_build/ci/native-lower-checker-phases')
          source=json.loads((out/'source.json').read_text())
          diagnostic=Path('_build/diag/native-lower-bounds/ouro1-bounds-diagnostic')
          diag=json.loads((diagnostic.parent/'diagnostic-manifest.json').read_text())
          assert diag['compiler_receipt'] is False and diag['official_inputs_and_receipt_unchanged'] is True
          assert diag['observer_sha256']==os.environ['CHECKER_LINK_SHA256']
          assert diag['observer_runtime_sha256']==os.environ['CHECKER_RUNTIME_SHA256']
          assert diag['phase_proof_sha256']==os.environ['CHECKER_PROOF_SHA256']
          assert diag['fixed_function_table_sha256']==os.environ['CHECKER_TABLE_SHA256']
          assert diag['generated_shard_bytes_unchanged'] is True
          assert diag['target']=={'item':2540,'sid':5063,'name':'collect_lower_env_from'}
          assert [site['phase'] for site in diag['phase_sites']]==['input','annotation','body','refine','close','check']
          assert hashlib.sha256(diagnostic.read_bytes()).hexdigest()==diag['binary_sha256']
          units=source['ordered_units']
          assert len(units)==172 and hashlib.sha256((''.join(u+'\n' for u in units)).encode()).hexdigest()==os.environ['UNIT_LIST_SHA256']
          argv=[str(diagnostic.resolve()),'check',units[-1],'999999']
          for unit in units: argv.extend(['--unit',unit])
          launcher=['sh','-c','ulimit -s unlimited 2>/dev/null || true; exec "$@"','compiler-check',*argv]
          child_env=dict(os.environ,OURO_JOBS='1',OURO_FRONTEND_JOBS='1',OURO_BUILD_TOOL_MODE='native',
                         OURO_CACHE='0',OURO_MEM_TRACE='1',OURO_ROOT=str(Path.cwd()),PYTHONDONTWRITEBYTECODE='1')
          allowed=os.sched_getaffinity(0)
          os.sched_setaffinity(0,{min(allowed)})
          record={'status':'not-run','pass':False,'check_only':True,'compiler_receipt':False,
                  'checker':'OBSERVATIONAL_RUN','canonical_acceptance':'NOT_TESTED','canonical_gate':'NOT_RUN',
                  'diagnostic_complete':False,'expected_current_failure':'raw checker malloc-phase OOM',
                  'target':diag['target'],'phase_sites':diag['phase_sites'],
                  'source_sha':source['source_sha'],'source_tree':source['source_tree'],'ordered_units':units,
                  'policy':{'timeout_s':1800,'memory_mib':3072,'cpu_count':1,'trace':'1','stack':'stock unlimited'},
                  'argv':argv,'diagnostic_binary_sha256':diag['binary_sha256']}
          def save():
              (out/'manifest.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          save()
          try:
              record['status']='running'; save()
              result=run_limited(launcher,timeout_s=1800,memory_mb=3072,cwd=Path.cwd(),env=child_env,stdin_text='')
              (out/'compiler-check.stdout').write_text(result.stdout)
              (out/'compiler-check.stderr').write_text(result.stderr)
              (out/'compiler-check.rc').write_text(str(result.returncode)+'\n')
              heaps=[line for line in result.stderr.splitlines() if line.startswith('OURO_MEM_HEAP ')]
              bounds=[line for line in heaps if 'label=bound/' in line]
              pattern=re.compile(r'^OURO_MEM_HEAP label=checker/(input|annotation|body|refine|close|check)/(\d+)/(before|after)/item-2540/name-5063 ')
              phases=[line for line in heaps if pattern.match(line)]
              phase_counts={site:{point:sum(bool((m:=pattern.match(line)) and m.group(1)==site and m.group(3)==point) for line in phases) for point in ('before','after')} for site in ('input','annotation','body','refine','close','check')}
              reached=any('label=bound/check_item/2540/before/name-1-5063/' in line for line in bounds)
              target_unreturned=reached and not any(f'label=bound/check_item/2540/{point}/' in line for line in bounds for point in ('raw','clone','reset'))
              predecessor_reset_complete=any('label=bound/check_item/2539/reset/' in line for line in bounds)
              (out/'checker-phases-trace.json').write_text(json.dumps({'records':phases,'record_count':len(phases),
                  'phase_counts':phase_counts,'last_phase':phases[-1] if phases else None,
                  'target_reached':reached,'target_unreturned':target_unreturned,
                  'predecessor_reset_complete':predecessor_reset_complete,'last_heap':heaps[-1] if heaps else None,
                  'canonical_acceptance':'NOT_TESTED','canonical_gate':'NOT_RUN'},indent=2)+'\n')
              (out/'bounds-trace.json').write_text(json.dumps({'records':bounds,'record_count':len(bounds),
                  'last_heap':heaps[-1] if heaps else None,'allocator_oom':'ouro_rt: out of memory (' in result.stderr},
                  indent=2)+'\n')
              record.update(status=result.status,rc=result.returncode,elapsed_s=result.elapsed_s,
                  peak_rss_mb=result.peak_rss_mb,peak_rss_measured=False,stdout_bytes=len(result.stdout.encode()),
                  stderr_bytes=len(result.stderr.encode()),bound_records=len(bounds),
                  allocator_oom='ouro_rt: out of memory (' in result.stderr,
                  malloc_phase_oom='ouro_rt: out of memory (malloc-phase ' in result.stderr,
                  checker_phase_records=len(phases),phase_counts=phase_counts,target_reached=reached,
                  target_unreturned=target_unreturned,predecessor_reset_complete=predecessor_reset_complete)
              save()
              assert record['stdout_bytes']<=16*1024*1024 and record['stderr_bytes']<=16*1024*1024
              expected=(result.status=='ok' and result.returncode==1 and result.stdout==''
                  and record['malloc_phase_oom'] and target_unreturned and predecessor_reset_complete and bool(phases))
              record.update(observed_expected_failure=expected,diagnostic_complete=expected)
              save()
              assert expected,record
          finally:
              os.sched_setaffinity(0,allowed)
              after=bootstrap.current_inputs(Path.cwd(),build.load_config(argparse.Namespace()),build)
              (out/'current-inputs-after.json').write_text(json.dumps(after,indent=2,sort_keys=True)+'\n')
              integrity={
                  'selected_inputs_unchanged':after==json.loads((out/'current-inputs-before.json').read_text()),
                  'compiler_unchanged':hashlib.sha256(Path('_build/c/ouro1').read_bytes()).hexdigest()==os.environ['HOST_BINARY_SHA256'],
                  'source_inputs_unchanged':all(hashlib.sha256(Path(r['path']).read_bytes()).hexdigest()==r['sha256'] for r in source['inputs']),
                  'tracked_tree_unchanged':not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],text=True).strip(),
                  'no_cache_files':not any(p.is_file() for p in Path('_cache').rglob('*')),
              }
              record.update(integrity=integrity,diagnostic_complete=record['diagnostic_complete'] and all(integrity.values()))
              save()
              assert all(integrity.values()),integrity
          print('NATIVE_LOWER_CHECKER_PHASES: observational failure recorded; canonical acceptance NOT_TESTED')
          raise SystemExit(result.returncode)
          PY
          sha256sum --check _build/ci/native-lower-checker-phases/compiler.sha256

      - name: Preserve raw checker failure phases and immutable provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-lower-checker-phases-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/ci/native-lower-checker-phases/*.json
            _build/ci/native-lower-checker-phases/*.stdout
            _build/ci/native-lower-checker-phases/*.stderr
            _build/ci/native-lower-checker-phases/*.rc
            _build/ci/native-lower-checker-phases/*.sha256
            _build/ci/native-lower-checker-phases/*.units
            _build/diag-inputs/observer-proof.json
            _build/diag-inputs/payload-proof.json
            _build/diag-inputs/checker-phases/checker-phases-proof.json
            _build/diag/native-lower-bounds/diagnostic-manifest.json
            _build/diag/native-lower-bounds/c_build_report.json
            _build/diag/native-lower-bounds/generated_c_shards_report.json
            _build/diag/native-lower-bounds/default-controls.json
            _build/diag/native-lower-bounds/*-good.stdout
            _build/diag/native-lower-bounds/*-good.stderr
            _build/diag/native-lower-bounds/*-bad.stdout
            _build/diag/native-lower-bounds/*-bad.stderr
          if-no-files-found: error
          retention-days: 14
