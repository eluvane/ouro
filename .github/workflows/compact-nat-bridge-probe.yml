name: Compact large Nat source bridge acceptance probe

on:
  push:
    branches: [ codef/compact-nat-bridge-probe ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: compact-nat-bridge-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  host-compiler:
    name: Fresh matching Nat Host compiler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: false

      - name: Verify reviewed product and retained base
        run: |
          test "$(git rev-parse HEAD^)" = 6b1bfb211199415b1a4a60771796037ad460e504
          test "$(git rev-parse HEAD^^)" = a9cfa54f09c3b02ffb22ff1b423c04a78d380764
          test "$(git rev-parse HEAD^^^)" = 973c3a21342e9d6e029479fb33ed7207d010c1bd
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/compact-nat-bridge-probe.yml
          python3 - <<'PY'
          import json, subprocess
          expected = json.loads('["CHANGELOG.md", "compiler/bootstrap/c-bootstrap-v1.json", "compiler/bootstrap/c-bootstrap-v1.tar.gz", "compiler/lower.ouro", "compiler/lower_nat.ouro", "docs/build.md", "docs/syntax.md", "scripts/refresh_nat_bridge.py", "scripts/refresh_nat_bridge_test.py", "tests/compact_nat_runtime.ouro", "tests/compiler_nat_literal_tests.ouro", "tools/test/suites.ouro"]')
          actual = subprocess.check_output(['git', 'diff', '--name-only', '973c3a21342e9d6e029479fb33ed7207d010c1bd', '6b1bfb211199415b1a4a60771796037ad460e504'], text=True).splitlines()
          assert actual == expected, (actual, expected)
          refresh = subprocess.check_output(['git', 'diff', '--name-only', 'a9cfa54f09c3b02ffb22ff1b423c04a78d380764', '6b1bfb211199415b1a4a60771796037ad460e504'], text=True).splitlines()
          assert refresh == json.loads('["compiler/bootstrap/c-bootstrap-v1.json", "compiler/bootstrap/c-bootstrap-v1.tar.gz", "docs/build.md", "scripts/refresh_nat_bridge.py", "scripts/refresh_nat_bridge_test.py"]'), refresh
          PY
          test "$(git hash-object CHANGELOG.md)" = 7e221debb718ddbff97cb659bc99a7f8c772dc09
          test "$(git hash-object compiler/lower.ouro)" = eba95f38d456969cd0550e65e2ff7aad1532e190
          test "$(git hash-object compiler/lower_nat.ouro)" = a106c758642f92c5329b81912a2f58b6582da411
          test "$(git hash-object docs/syntax.md)" = e44fae6984fbcd45c709a2c0f9590a90ee290c85
          test "$(git hash-object tests/compact_nat_runtime.ouro)" = d1b3872ba36d5bb02203e2410228ca151b9d3c3d
          test "$(git hash-object tests/compiler_nat_literal_tests.ouro)" = 635e947688bf77efa841977b7b9eab83ca05e25c
          test "$(git hash-object tools/test/suites.ouro)" = c3e7348a79969d8199a459049d9ba8caa1798335
          test "$(git hash-object compiler/core.ouro)" = 9c854884896b4385c2046e61e3729b07d78c9476
          test "$(git hash-object compiler/lower_support.ouro)" = 5975a3460c1e395b35dd8d298ea77a11c16af5ef
          test "$(git hash-object compiler/lower_env.ouro)" = 56776adc3e2683aa51e01c9c54a608e18459b94a
          test "$(git hash-object compiler/pipeline_abi.ouro)" = fe13cdaeb13617501ad217cfe751c8e41d884ac2
          test "$(git hash-object compiler/file_check_work.ouro)" = ffb661db478eca99c415bdfc3f31403aa3f60d29
          test "$(git hash-object compiler/extract.ouro)" = 5daa5432d28e003b38d41774124224cbc8366435
          test "$(git hash-object compiler/print_c.ouro)" = 5059d66b148bcd51f9ac0a121ea450d22b602a09
          test "$(git hash-object compiler/lexer.ouro)" = b73355a657c9cd09dd83d26c36eb128cfe004207
          test "$(git hash-object compiler/module_registry.ouro)" = e84c2d27c597e5e3617e9b1466983862acdb78e8
          test "$(git hash-object docs/tcb.md)" = 725c3c038f60f5816cb1523ded225041ab093e4b
          test "$(git hash-object quality/memory_budgets.json)" = 9257b185a175b64474d9c014086771035ac8394f
          test "$(git hash-object scripts/ci_gate.py)" = 16ea86bf60a3d3347c30af2f562a6b6b500b89ef
          test "$(git hash-object scripts/build_tool.sh)" = ff83eec44937a8d9aa37c5af67aae2d57b93f4c3
          test "$(git hash-object compiler/bootstrap/c-bootstrap-v1.json)" = f3b14f5028a701028d29c79dc9b0fc2327a484ce
          test "$(git hash-object compiler/bootstrap/c-bootstrap-v1.tar.gz)" = b0d9871286450364ac6da322a1c4c8f65ab9368e
          test "$(git hash-object scripts/refresh_nat_bridge.py)" = 5430f2eb26ab2783fceeb19f0ec1da18349afe1d
          test "$(git hash-object scripts/refresh_nat_bridge_test.py)" = e737cce52975f7ba95a7f93419651da8c495c340
          test "$(git hash-object docs/build.md)" = 13dfc39c4e46c7ec8a1040ce398566e3d2889ebc
          test "$(git hash-object compiler/lower_fallible.ouro)" = ac181c88253e532b7ea7e6938729dbbf8c280c05
          test "$(git hash-object compiler/lower_named.ouro)" = 6d6a481c698fcc390a40bfa807441be8a6828878
          test "$(git hash-object compiler/lower_spread.ouro)" = ad0dcafb4fcc0eda264d4f8bc373dc91282cf41b
          test "$(git hash-object scripts/bootstrap_inputs.py)" = e49f21cc8df6b7dac89fc853631a75d0a7e47458
          test "$(git hash-object scripts/bootstrap_compiler.py)" = 937f93c11a055e42c0ecb22f8c10fce2d748817c
          python3 - <<'PY'
          from pathlib import Path
          import json, re, sys
          sys.path.insert(0, 'scripts')
          import ci_gate, bootstrap_inputs, refresh_nat_bridge
          manifest, contents = bootstrap_inputs.read_bundle()
          bootstrap_inputs.verify_stage0(Path.cwd(), manifest)
          assert len(contents) == 68
          assert manifest['archive_sha256'] == refresh_nat_bridge.NEW_ARCHIVE
          assert manifest['stage0'] == refresh_nat_bridge.SEED
          assert manifest['provenance']['compact_nat_refresh']['source_blobs'] == refresh_nat_bridge.SOURCE_BLOBS
          refresh_nat_bridge.load_sources(Path.cwd())
          inventory = ci_gate.compiler_fixture_roots(Path.cwd())
          assert len(inventory) == 98, len(inventory)
          assert 'tests/compiler_nat_literal_tests.ouro' in ci_gate.compiler_shard_entries(inventory, 6)
          assert 'tests/compact_nat_runtime.ouro' in ci_gate.compiler_shard_entries(inventory, 7)
          assert ci_gate.compiler_shard_entries(inventory, 16) == ['tests/source_span_tests.ouro']
          assert json.loads(Path('quality/memory_budgets.json').read_text())['budgets']['strict-quality-gate']['peak_rss_kb'] == 1024000
          for name, count in [('tests/compiler_nat_literal_tests.ouro', 24), ('tests/compact_nat_runtime.ouro', 6)]:
              assert len(re.findall(r'assert_true\s+"([^"]+)"', Path(name).read_text())) == count
          PY

      - name: Verify source-owned bridge reproducibility
        run: |
          mkdir -p _build
          python3 -B -m unittest discover -s scripts -p refresh_nat_bridge_test.py >_build/nat_bridge_sources.log 2>&1
          python3 -B -m unittest discover -s scripts -p bootstrap_inputs_test.py >>_build/nat_bridge_sources.log 2>&1
          python3 -B scripts/bootstrap_inputs.py verify >>_build/nat_bridge_sources.log 2>&1
          python3 -B scripts/bootstrap_inputs.py unpack --out _build/nat_bridge_inputs >>_build/nat_bridge_sources.log 2>&1
          python3 -B scripts/bootstrap_inputs.py repack --source _build/nat_bridge_inputs --out _build/nat_bridge.reproduced.tar.gz >>_build/nat_bridge_sources.log 2>&1
          cmp compiler/bootstrap/c-bootstrap-v1.tar.gz _build/nat_bridge.reproduced.tar.gz
          cat _build/nat_bridge_sources.log

      - name: Build fresh matching Host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Export verified Host and bootstrap evidence
        id: bundle
        run: |
          python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"
          echo "artifact=nat-host-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload verified Host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nat-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/ci/host-compiler.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Host reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nat-host-reports-${{ github.run_id }}
          path: |
            _build/nat_bridge_sources.log
            _build/c/ouro1.bootstrap.json
            _build/bootstrap/**/*.json
            _build/bootstrap/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  acceptance:
    name: "Nat (${{ matrix.group }})"
    needs: host-compiler
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [ native-laws, native-runtime, compiler-6, compiler-7, compiler-16, kernel-checks, ergonomics, strict ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: false

      - name: Verify reviewed product and retained base
        run: |
          test "$(git rev-parse HEAD^)" = 6b1bfb211199415b1a4a60771796037ad460e504
          test "$(git rev-parse HEAD^^)" = a9cfa54f09c3b02ffb22ff1b423c04a78d380764
          test "$(git rev-parse HEAD^^^)" = 973c3a21342e9d6e029479fb33ed7207d010c1bd
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/compact-nat-bridge-probe.yml
          python3 - <<'PY'
          import json, subprocess
          expected = json.loads('["CHANGELOG.md", "compiler/bootstrap/c-bootstrap-v1.json", "compiler/bootstrap/c-bootstrap-v1.tar.gz", "compiler/lower.ouro", "compiler/lower_nat.ouro", "docs/build.md", "docs/syntax.md", "scripts/refresh_nat_bridge.py", "scripts/refresh_nat_bridge_test.py", "tests/compact_nat_runtime.ouro", "tests/compiler_nat_literal_tests.ouro", "tools/test/suites.ouro"]')
          actual = subprocess.check_output(['git', 'diff', '--name-only', '973c3a21342e9d6e029479fb33ed7207d010c1bd', '6b1bfb211199415b1a4a60771796037ad460e504'], text=True).splitlines()
          assert actual == expected, (actual, expected)
          refresh = subprocess.check_output(['git', 'diff', '--name-only', 'a9cfa54f09c3b02ffb22ff1b423c04a78d380764', '6b1bfb211199415b1a4a60771796037ad460e504'], text=True).splitlines()
          assert refresh == json.loads('["compiler/bootstrap/c-bootstrap-v1.json", "compiler/bootstrap/c-bootstrap-v1.tar.gz", "docs/build.md", "scripts/refresh_nat_bridge.py", "scripts/refresh_nat_bridge_test.py"]'), refresh
          PY
          test "$(git hash-object CHANGELOG.md)" = 7e221debb718ddbff97cb659bc99a7f8c772dc09
          test "$(git hash-object compiler/lower.ouro)" = eba95f38d456969cd0550e65e2ff7aad1532e190
          test "$(git hash-object compiler/lower_nat.ouro)" = a106c758642f92c5329b81912a2f58b6582da411
          test "$(git hash-object docs/syntax.md)" = e44fae6984fbcd45c709a2c0f9590a90ee290c85
          test "$(git hash-object tests/compact_nat_runtime.ouro)" = d1b3872ba36d5bb02203e2410228ca151b9d3c3d
          test "$(git hash-object tests/compiler_nat_literal_tests.ouro)" = 635e947688bf77efa841977b7b9eab83ca05e25c
          test "$(git hash-object tools/test/suites.ouro)" = c3e7348a79969d8199a459049d9ba8caa1798335
          test "$(git hash-object compiler/core.ouro)" = 9c854884896b4385c2046e61e3729b07d78c9476
          test "$(git hash-object compiler/lower_support.ouro)" = 5975a3460c1e395b35dd8d298ea77a11c16af5ef
          test "$(git hash-object compiler/lower_env.ouro)" = 56776adc3e2683aa51e01c9c54a608e18459b94a
          test "$(git hash-object compiler/pipeline_abi.ouro)" = fe13cdaeb13617501ad217cfe751c8e41d884ac2
          test "$(git hash-object compiler/file_check_work.ouro)" = ffb661db478eca99c415bdfc3f31403aa3f60d29
          test "$(git hash-object compiler/extract.ouro)" = 5daa5432d28e003b38d41774124224cbc8366435
          test "$(git hash-object compiler/print_c.ouro)" = 5059d66b148bcd51f9ac0a121ea450d22b602a09
          test "$(git hash-object compiler/lexer.ouro)" = b73355a657c9cd09dd83d26c36eb128cfe004207
          test "$(git hash-object compiler/module_registry.ouro)" = e84c2d27c597e5e3617e9b1466983862acdb78e8
          test "$(git hash-object docs/tcb.md)" = 725c3c038f60f5816cb1523ded225041ab093e4b
          test "$(git hash-object quality/memory_budgets.json)" = 9257b185a175b64474d9c014086771035ac8394f
          test "$(git hash-object scripts/ci_gate.py)" = 16ea86bf60a3d3347c30af2f562a6b6b500b89ef
          test "$(git hash-object scripts/build_tool.sh)" = ff83eec44937a8d9aa37c5af67aae2d57b93f4c3
          test "$(git hash-object compiler/bootstrap/c-bootstrap-v1.json)" = f3b14f5028a701028d29c79dc9b0fc2327a484ce
          test "$(git hash-object compiler/bootstrap/c-bootstrap-v1.tar.gz)" = b0d9871286450364ac6da322a1c4c8f65ab9368e
          test "$(git hash-object scripts/refresh_nat_bridge.py)" = 5430f2eb26ab2783fceeb19f0ec1da18349afe1d
          test "$(git hash-object scripts/refresh_nat_bridge_test.py)" = e737cce52975f7ba95a7f93419651da8c495c340
          test "$(git hash-object docs/build.md)" = 13dfc39c4e46c7ec8a1040ce398566e3d2889ebc
          test "$(git hash-object compiler/lower_fallible.ouro)" = ac181c88253e532b7ea7e6938729dbbf8c280c05
          test "$(git hash-object compiler/lower_named.ouro)" = 6d6a481c698fcc390a40bfa807441be8a6828878
          test "$(git hash-object compiler/lower_spread.ouro)" = ad0dcafb4fcc0eda264d4f8bc373dc91282cf41b
          test "$(git hash-object scripts/bootstrap_inputs.py)" = e49f21cc8df6b7dac89fc853631a75d0a7e47458
          test "$(git hash-object scripts/bootstrap_compiler.py)" = 937f93c11a055e42c0ecb22f8c10fce2d748817c
          python3 - <<'PY'
          from pathlib import Path
          import json, re, sys
          sys.path.insert(0, 'scripts')
          import ci_gate, bootstrap_inputs, refresh_nat_bridge
          manifest, contents = bootstrap_inputs.read_bundle()
          bootstrap_inputs.verify_stage0(Path.cwd(), manifest)
          assert len(contents) == 68
          assert manifest['archive_sha256'] == refresh_nat_bridge.NEW_ARCHIVE
          assert manifest['stage0'] == refresh_nat_bridge.SEED
          assert manifest['provenance']['compact_nat_refresh']['source_blobs'] == refresh_nat_bridge.SOURCE_BLOBS
          refresh_nat_bridge.load_sources(Path.cwd())
          inventory = ci_gate.compiler_fixture_roots(Path.cwd())
          assert len(inventory) == 98, len(inventory)
          assert 'tests/compiler_nat_literal_tests.ouro' in ci_gate.compiler_shard_entries(inventory, 6)
          assert 'tests/compact_nat_runtime.ouro' in ci_gate.compiler_shard_entries(inventory, 7)
          assert ci_gate.compiler_shard_entries(inventory, 16) == ['tests/source_span_tests.ouro']
          assert json.loads(Path('quality/memory_budgets.json').read_text())['budgets']['strict-quality-gate']['peak_rss_kb'] == 1024000
          for name, count in [('tests/compiler_nat_literal_tests.ouro', 24), ('tests/compact_nat_runtime.ouro', 6)]:
              assert len(re.findall(r'assert_true\s+"([^"]+)"', Path(name).read_text())) == count
          PY

      - name: Download matching verified Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.host-compiler.outputs.artifact }}
          path: _build/ci

      - name: Verify and install source-bound Host
        env:
          COMPILER_SHA256: ${{ needs.host-compiler.outputs.sha256 }}
        run: |
          mkdir -p _build/nat_probe
          rc=0
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256" >_build/nat_probe/import.stdout 2>_build/nat_probe/import.stderr || rc=$?
          printf '%s\n' "$rc" >_build/nat_probe/import.rc
          cat _build/nat_probe/import.stdout
          cat _build/nat_probe/import.stderr >&2
          test "$rc" -eq 0

      - name: Run retained acceptance gate
        env:
          PROBE_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p _build/nat_probe
          run_logged() {
            probe_label=$1
            shift
            probe_status=0
            "$@" >"_build/nat_probe/$probe_label.stdout" 2>"_build/nat_probe/$probe_label.stderr" || probe_status=$?
            printf '%s\n' "$probe_status" >"_build/nat_probe/$probe_label.rc"
            cat "_build/nat_probe/$probe_label.stdout"
            cat "_build/nat_probe/$probe_label.stderr" >&2
            return "$probe_status"
          }
          case "$PROBE_GROUP" in
            native-laws|native-runtime)
              ulimit -s 131072
              case "$PROBE_GROUP" in
                native-laws) entry=tests/compiler_nat_literal_tests.ouro; rows=24 ;;
                native-runtime) entry=tests/compact_nat_runtime.ouro; rows=6 ;;
              esac
              run_logged native-check sh scripts/ouro1.sh check "$entry" 16000
              printf 'CHECK_OK\n' | cmp - _build/nat_probe/native-check.stdout
              test ! -s _build/nat_probe/native-check.stderr
              OURO_BUILD_TOOL_MODE=native run_logged native-build sh scripts/build_tool.sh "$entry" "_build/c/$PROBE_GROUP" 60000
              run_logged native-run "_build/c/$PROBE_GROUP"
              NAT_ENTRY="$entry" NAT_ROWS="$rows" python3 - <<'PY'
          import os, re
          from pathlib import Path
          labels = re.findall(r'assert_true\s+"([^"]+)"', Path(os.environ['NAT_ENTRY']).read_text())
          assert len(labels) == int(os.environ['NAT_ROWS']), labels
          expected = ''.join('ok ' + label + '\n' for label in labels).encode()
          actual = Path('_build/nat_probe/native-run.stdout').read_bytes()
          assert actual == expected, actual.decode(errors='replace')
          assert not Path('_build/nat_probe/native-run.stderr').read_bytes()
          print('NAT_NATIVE_OUTPUT_OK rows=' + os.environ['NAT_ROWS'])
          PY
              ;;
            compiler-6|compiler-7|compiler-16)
              run_logged "$PROBE_GROUP" python3 scripts/ci_gate.py --profile pr --group "$PROBE_GROUP" --fail-fast --out "_build/ci/nat-$PROBE_GROUP"
              ;;
            kernel-checks)
              run_logged kernel-checks python3 scripts/ci_gate.py --profile kernel --group checks --fail-fast --out _build/ci/nat-kernel-checks
              ;;
            ergonomics)
              run_logged ergonomics python3 scripts/ouro_smith.py manifest --prefix=ERGO.,REC. --out=_build/ergonomics_suite --label=ERGONOMICS_SUITE
              ;;
            strict)
              run_logged strict python3 scripts/memory_budget_suite.py --case strict-quality-gate --out _build/memory
              ;;
            *) exit 2 ;;
          esac

      - name: Upload complete acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nat-${{ matrix.group }}-${{ github.run_id }}
          path: |
            _build/nat_probe/
            _build/ci/nat-*/
            _build/compiler_check_suite_6/
            _build/compiler_check_suite_7/
            _build/compiler_check_suite_16/
            _build/ergonomics_suite/
            _build/memory/
            _build/kernel/
            _build/c/ouro1.bootstrap.json
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.err
            _build/**/*.stdout
            _build/**/*.stderr
            _build/**/*.sarif
            _build/**/*.md
          if-no-files-found: error
          retention-days: 14
