name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ouro-nightly-full-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  host-compiler:
    name: Host compiler
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    permissions:
      contents: read
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "10"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
      OURO_STAGE_MAX: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Identify compiler inputs
        id: inputs
        run: python3 scripts/ci_gate.py --compiler-artifact key >> "$GITHUB_OUTPUT"

      - name: Restore compiler and bootstrap evidence
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/c/ouro1
            _build/c/ouro1.bootstrap.json
            _build/bootstrap/*/report.json
            _build/bootstrap/*/inputs.json
            _build/bootstrap/*/out/p1/*.c
            _build/bootstrap/*/out/p2/*.c
          key: ouro-host-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.key }}

      - name: Build and verify host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Export compiler with bootstrap evidence
        id: bundle
        run: |
          python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"
          echo "artifact=nightly-host-compiler-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Save compiler and bootstrap evidence
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))) && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/c/ouro1
            _build/c/ouro1.bootstrap.json
            _build/bootstrap/*/report.json
            _build/bootstrap/*/inputs.json
            _build/bootstrap/*/out/p1/*.c
            _build/bootstrap/*/out/p2/*.c
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Upload verified compiler
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-host-compiler-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/ci/host-compiler.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload bootstrap reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-host-compiler-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/bootstrap/**/*.json
            _build/bootstrap/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  validation:
    name: ${{ matrix.label }}
    needs: host-compiler
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: checks
            label: Checks
          - group: checks-parity
            label: Checks parity
          - group: checks-quality
            label: Checks quality
          - group: analysis
            label: Analysis
          - group: analyzer
            label: Analyzer
          - group: lint-fixtures
            label: Lint fixtures
          - group: lint-production-1
            label: Lint production (1/4)
          - group: lint-production-2
            label: Lint production (2/4)
          - group: lint-production-3
            label: Lint production (3/4)
          - group: lint-production-4
            label: Lint production (4/4)
          - group: lint-clippy
            label: Lint Clippy
          - group: tests
            label: Tests
          - group: samples-1
            label: Samples (1/2)
          - group: samples-2
            label: Samples (2/2)
          - group: kernel
            label: Kernel
          - group: smith-selftest
            label: Smith harness self-test
          - group: trust
            label: Stage-loop and OuroSmith
          - group: compiler-1
            label: Compiler (1/16)
          - group: compiler-2
            label: Compiler (2/16)
          - group: compiler-3
            label: Compiler (3/16)
          - group: compiler-4
            label: Compiler (4/16)
          - group: compiler-5
            label: Compiler (5/16)
          - group: compiler-6
            label: Compiler (6/16)
          - group: compiler-7
            label: Compiler (7/16)
          - group: compiler-8
            label: Compiler (8/16)
          - group: compiler-9
            label: Compiler (9/16)
          - group: compiler-10
            label: Compiler (10/16)
          - group: compiler-11
            label: Compiler (11/16)
          - group: compiler-12
            label: Compiler (12/16)
          - group: compiler-13
            label: Compiler (13/16)
          - group: compiler-14
            label: Compiler (14/16)
          - group: compiler-15
            label: Compiler (15/16)
          - group: compiler-16
            label: Compiler (16/16)
    permissions:
      contents: read
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "10"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
      OURO_STAGE_MAX: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore cache
        id: ouro-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _cache/ouro
            _build/c
            _build/stage_loop
          key: ouro-nightly-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('Ouro.seal', 'scripts/**', 'compiler/**', 'runtime/**', 'tools/**', 'tests/**', 'std/**', 'quality/smith/**', 'docs/generated_artifact_hashes.sha256') }}
          restore-keys: |
            ouro-nightly-${{ matrix.group }}-${{ runner.os }}-

      - name: Install check-only tools
        if: ${{ matrix.group == 'checks' }}
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          cc --version || true

      - name: Download host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.host-compiler.outputs.artifact }}
          path: _build/ci

      - name: Verify and install host compiler
        env:
          COMPILER_SHA256: ${{ needs.host-compiler.outputs.sha256 }}
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256"

      - name: Run checks
        run: python3 scripts/ci_gate.py --profile nightly --group "${{ matrix.group }}" --out "_build/ci/nightly-${{ matrix.group }}"

      - name: Save cache
        if: ${{ github.event_name != 'pull_request' && steps.ouro-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _cache/ouro
            _build/c
            _build/stage_loop
          key: ${{ steps.ouro-cache.outputs.cache-primary-key }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.group }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.txt
            _build/**/*.err
            _build/**/*.sarif
            _build/**/*.md
            _build/**/gate.log

  full-validation:
    name: Full
    needs: validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every validation group
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
