name: Strict mask linear gate probe

on:
  push:
    branches: [codef/strict-mask-linear-gate-probe]

permissions:
  contents: read
  actions: read

jobs:
  strict-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and compiler snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "e6e05ef70b49875a66477b75a0ce7a0ad28bd4a2"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/strict-mask-linear-gate-probe.yml"
          test "$(git rev-parse HEAD:compiler/source_text.ouro)" = "eba30d65d1c1a4ad34f1de77efcbfa4dd27dbe36"
          test "$(git rev-parse HEAD:tools/strict/main.ouro)" = "5b39fcf4649ac8300ee2e033f127749936348d26"
          test "$(python3 scripts/ci_gate.py --compiler-artifact key)" = "key=b8d31b04dc1d01b29e49134936608c61a4557c4b5d54ec08450e565836d8f6d7"

      - name: Download verified host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36311470304-1
          run-id: 36311470304
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install host compiler
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 10c96480783621387e90627b36cebb0e3d5880b38611e563bc3de01a7209b75f

      - name: Measure unchanged release strict quality gate
        env:
          OURO_BUILD_TOOL_MODE: auto
        run: python3 scripts/memory_budget_suite.py --case strict-quality-gate --out _build/memory

      - name: Upload measurement and build receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-mask-linear-gate-probe
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/memory/*.json
            _build/memory/*.log
            _build/memory/*.md
            _build/c/ouro-strict-quality-firewall.build.json
