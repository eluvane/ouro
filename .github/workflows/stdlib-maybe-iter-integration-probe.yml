name: Maybe after Iter owner regeneration
on:
  push:
    branches: [codef/stdlib-maybe-iter-integration-probe]
    paths: [.github/workflows/stdlib-maybe-iter-integration-probe.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: stdlib-maybe-iter-integration-${{ github.ref }}
  cancel-in-progress: false
env:
  OURO_CI: '1'
  OURO_CACHE: '1'
  OURO_CCACHE: disabled
  PYTHONDONTWRITEBYTECODE: '1'
  OURO_JOBS: '1'
  OURO_REPRODUCIBLE: '1'
  OURO_BUILD_TOOL_MODE: native
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [regeneration, practical]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Guard workflow lineage
        run: |
          test "$(git rev-parse HEAD^)" = bd2b7947ea5eb16b4541bca64f1af0b80b2a2914
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/stdlib-maybe-iter-integration-probe.yml
          git checkout --detach bd2b7947ea5eb16b4541bca64f1af0b80b2a2914
      - name: Guard exact combined source and all 69 std inputs
        run: |
          test "$(git rev-parse HEAD)" = bd2b7947ea5eb16b4541bca64f1af0b80b2a2914
          test "$(git rev-parse HEAD^)" = d7e68510a967bf5db3ad96055c8247b41249aa54
          test "$(git rev-parse HEAD^^)" = a31ec24a422d9903a0db5d5c24044590eac3a635
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          blobs = {
              'std/data.ouro': '05ad66ae1f6abf7aa98584a8976926a1c69214fe',
              'std/iter.ouro': '2403a09a43177dba7946e7fa348bd939c4ef2f49',
              'tests/practical_stdlib_tests.ouro': '55b1aa187dfec583944b98073a975e6fbe7c9d52',
              'quality/api_surface.tsv': 'aa0a1eb84892ef92810ca948b756b377a5d3d51d',
              'docs/api/std_data.md': '97c74d8ce1fff25138fb04814602e503578996e6',
              'docs/api/std_iter.md': 'a79a1556ebf4ecaae63db0c1fd71b1a354dff7b4',
              'docs/api/README.md': '27eef83b4b6fd8bdda834b0d4e54aa452b1bbf7b',
              'scripts/api_baseline_regen.py': '3fde14909a852897117000207e445ed88906baba',
              'scripts/api_baseline_regen_test.py': '0528a766c8150644bc3ccbb0fee10659c6cee624',
              'scripts/analyze_bounded.py': '5563831d110465df780cb0cfc54f1b650ac68ee9',
              'tools/doc_model.ouro': '9834824946d30df7285cea37986d4eb973fae83c',
              'tools/doc.ouro': 'f06d09e1d39dc2af90df091d38e9684018b2eff3',
              'scripts/doc_suite.sh': '4a132cc94e774775957cba4ea2b0ec3a5ee3c7fd',
              'scripts/build_tool.sh': 'ff83eec44937a8d9aa37c5af67aae2d57b93f4c3',
              'scripts/ouro1.sh': '9665ebb00049d05c097a29d77ec5083b524f9e2d',
              'scripts/bootstrap_compiler.py': 'eaf8231a881688aae81476c709714ade58bc6e02',
              'scripts/ci_gate.py': '16ea86bf60a3d3347c30af2f562a6b6b500b89ef',
              'scripts/ourosmith/limits.py': 'aa92339539ea580b0a2569d7df7f085f94765156',
              'std/test.ouro': '41c96ea8df93905a9a6455f43535e09e47eb2401',
          }
          for path, digest in blobs.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == digest, path
          paths = subprocess.check_output(['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD'], text=True).splitlines()
          assert paths == ['scripts/bootstrap_compiler.py', 'scripts/bootstrap_compiler_test.py'], paths
          paths = subprocess.check_output(['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD^'], text=True).splitlines()
          assert paths == ['CHANGELOG.md', 'docs/practical_stdlib.md', 'std/data.ouro', 'tests/practical_stdlib_tests.ouro'], paths
          sources = {p.as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('std').rglob('*.ouro'))}
          assert len(sources) == 69
          digest = hashlib.sha256(json.dumps(sources, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          assert digest == '51db8776f7a20a1e3d9893514ca194635551b41947908962cd24ccb4cbc66afe'
          out = Path('_build/ci/maybe-iter-integration')
          out.mkdir(parents=True)
          (out / 'source.json').write_text(json.dumps({
              'source_sha': 'bd2b7947ea5eb16b4541bca64f1af0b80b2a2914',
              'parent_sha': 'd7e68510a967bf5db3ad96055c8247b41249aa54',
              'base_sha': 'a31ec24a422d9903a0db5d5c24044590eac3a635',
              'std_sources': sources, 'std_manifest_sha256': digest,
              'owner_blobs': blobs}, indent=2) + '\n')
          PY
          python3 scripts/ci_gate.py --compiler-artifact key > _build/ci/maybe-iter-integration/key.stdout
          test "$(cat _build/ci/maybe-iter-integration/key.stdout)" = key=3b3caacaa4e1fc063d02d0260ca1693c3f5b314a6b7e613ef2d9f235dc173860
      - name: Download verified source-matching Maybe Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 10952119016
          run-id: 36377563359
          github-token: ${{ github.token }}
          path: _build/ci
          merge-multiple: true
      - name: Import with the retained source-bound verifier
        id: import
        run: |
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 719c93e9983abb3253f23916c20c5dde894b68d747945199b14bab259e8ceb38
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path('_build/c/ouro1.bootstrap.json').read_text())
          assert receipt['kind'] == 'ouro.current-c-bootstrap.v1'
          assert receipt['key'] == '3b3caacaa4e1fc063d02d0260ca1693c3f5b314a6b7e613ef2d9f235dc173860'
          assert receipt['binary_sha256'] == '20408e5d4e874823d4dcbc719fb75bc17af607c5b8b744abd02d21ff67aebcb3'
          assert hashlib.sha256(Path('_build/c/ouro1').read_bytes()).hexdigest() == receipt['binary_sha256']
          selected = receipt['selected']
          assert len(selected['sources']) == 177 and len(selected['stage0']) == 2
          assert 'std/iter.ouro' not in selected['sources'] and 'std/data.ouro' in selected['sources']
          for inputs in (selected['sources'], selected['stage0']):
              for path, digest in inputs.items():
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          report = json.loads((Path(receipt['work']) / 'report.json').read_text())
          assert report['pass'] and not report['changed_inputs']
          comparisons = report['complete_generated_c_comparison']
          expected = {'driver_u.c': '4e4e3f5e5bbe2dec61df7dbd0af6baa8cfbf13fd523600ac0202f167a792f8f9',
                      'backend_u.c': 'dccf5f4b6d721ab28bf6877d792b38aa3391404d05b8ae1b1d16d686b2135168'}
          assert set(comparisons) == set(expected)
          for name, digest in expected.items():
              assert comparisons[name]['p1_sha256'] == comparisons[name]['p2_sha256'] == digest
          out = Path('_build/ci/maybe-iter-integration')
          (out / 'compiler.sha256').write_text(receipt['binary_sha256'] + '  _build/c/ouro1\n')
          (out / 'host-receipt.json').write_text(json.dumps({
              'source_sha': 'bd2b7947ea5eb16b4541bca64f1af0b80b2a2914',
              'archive_sha256': '719c93e9983abb3253f23916c20c5dde894b68d747945199b14bab259e8ceb38',
              'key': receipt['key'], 'binary_sha256': receipt['binary_sha256'],
              'selected': selected, 'complete_generated_c_comparison': comparisons}, indent=2) + '\n')
          PY
      - name: Require a native C compiler
        run: command -v cc || command -v gcc
      - name: Run canonical complete-header contracts
        if: matrix.suite == 'regeneration'
        run: |
          python3 scripts/api_baseline_regen_test.py
          python3 scripts/analyze_bounded.py --self-test
      - name: Generate and check the complete API baseline
        id: baseline
        if: matrix.suite == 'regeneration'
        run: |
          python3 scripts/api_baseline_regen.py --report _build/ci/maybe-iter-integration/api-write.json
          python3 scripts/api_baseline_regen.py --check --report _build/ci/maybe-iter-integration/api-check.json
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import api_baseline_regen as api
          def rows(text):
              return {tuple(line.split('\t')[:2]): line for line in text.splitlines() if line and not line.startswith('#')}
          before = rows(subprocess.check_output(['git', 'show', 'HEAD:quality/api_surface.tsv'], text=True))
          after = rows(Path('quality/api_surface.tsv').read_text())
          report = json.loads(Path('_build/ci/maybe-iter-integration/api-check.json').read_text())
          assert report['pass'] and report['check_only'] and not report['drift']
          assert len(before) == 1173 and len(after) == report['rows'] == 1174 and report['std_sources'] == 69
          assert after.keys() - before.keys() == {('std/data.ouro', 'maybe_bind')}
          assert all(after[key] == row for key, row in before.items())
          row = after[('std/data.ouro', 'maybe_bind')].split('\t')
          signature = next(sig for path, name, digest, sig in api.rows_for(api.ROOT / 'std/data.ouro') if name == 'maybe_bind')
          assert row[2] == '909c1a6000ba1b0c' and row[3:5] == ['std', 'public']
          assert row[5] == '# ' + signature
          Path('_build/ci/maybe-iter-integration/new-api.json').write_text(json.dumps({
              'source_sha': 'bd2b7947ea5eb16b4541bca64f1af0b80b2a2914', 'name': 'maybe_bind',
              'owner': 'std/data.ouro', 'signature': signature, 'fnv1a64': row[2],
              'baseline_rows': 1174, 'std_sources': 69}, indent=2) + '\n')
          print('API_GENERATION: PASS rows=1174 sources=69 added=maybe_bind')
          PY
      - name: Regenerate native Doc output for all 69 std modules
        id: doc_regen
        if: matrix.suite == 'regeneration'
        env:
          DOC_SUITE_OUT: _build/doc_suite
        run: |
          sh scripts/doc_suite.sh --regen > _build/ci/maybe-iter-integration/doc-regenerate.stdout 2> _build/ci/maybe-iter-integration/doc-regenerate.stderr
          test -x _build/doc_suite/ouro-doc
      - name: Verify current native Doc output
        id: doc_check
        if: matrix.suite == 'regeneration'
        env:
          DOC_SUITE_OUT: _build/doc_suite
        run: |
          sh scripts/doc_suite.sh > _build/ci/maybe-iter-integration/doc-check.stdout 2> _build/ci/maybe-iter-integration/doc-check.stderr
          test -x _build/doc_suite/ouro-doc
      - name: Package only this source tree's exact three owner outputs
        if: ${{ always() && matrix.suite == 'regeneration' && steps.baseline.outcome == 'success' && steps.doc_check.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import csv, hashlib, json, shutil, subprocess
          from pathlib import Path
          out = Path('_build/ci/maybe-iter-integration')
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'quality/api_surface.tsv', 'docs/api/README.md', 'docs/api/std_data.md'}
          assert changed == expected, (changed, expected)
          pages = sorted(Path('docs/api').glob('*.md'))
          assert len(pages) == 70 and Path('_build/doc_suite/ouro-doc').is_file()
          modules = [line for line in Path('_build/doc_suite/std.list').read_text().splitlines() if line]
          assert len(modules) == 69 and set(modules) == {p.as_posix() for p in Path('std').rglob('*.ouro')}
          with Path('_build/doc_suite/selftest-report.tsv').open() as handle:
              rows = list(csv.DictReader(handle, delimiter='\t'))
          assert len(rows) == 5 and all(row['pass'] == 'true' and row['issue'] == '' for row in rows), rows
          assert rows[-1]['name'] == 'api modules=69', rows
          oracle = json.loads((out / 'new-api.json').read_text())
          text = Path('docs/api/std_data.md').read_text()
          assert 'Declarations: 16.' in text
          section = text.split('## def maybe_bind\n', 1)[1]
          assert ' '.join(section.split(chr(96) * 3, 2)[1].split()) == oracle['signature']
          index = Path('docs/api/README.md').read_text()
          assert '- [std/data.ouro](std_data.md) \u2014 16 declarations' in index
          dest = Path('_build/maybe-iter-owner-output')
          for path in sorted(expected):
              target = dest / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
          manifest = [{'path': p.as_posix(), 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                      for p in [Path('quality/api_surface.tsv'), *pages]]
          (dest / 'manifest.json').write_text(json.dumps({
              **oracle, 'changed_paths': sorted(changed), 'files': manifest,
              'doc_modules': 69, 'doc_pages_with_index': 70}, indent=2) + '\n')
          print('OWNER_OUTPUT: PASS exact_source=bd2b7947 rows=1174 modules=69 changed=3')
          PY
      - name: Check both helpers and the complete practical import closure
        if: matrix.suite == 'practical'
        run: |
          for owner in std/data.ouro std/iter.ouro tests/practical_stdlib_tests.ouro; do
            case "$owner" in std/data.ouro) label=maybe;; std/iter.ouro) label=iter;; *) label=practical;; esac
            sh scripts/ouro1.sh check "$owner" > "_build/ci/maybe-iter-integration/$label-check.stdout" 2> "_build/ci/maybe-iter-integration/$label-check.stderr"
            python3 - "$label" <<'PY'
          import sys
          from pathlib import Path
          out = Path('_build/ci/maybe-iter-integration')
          assert (out / (sys.argv[1] + '-check.stdout')).read_text() == 'CHECK_OK\n'
          assert (out / (sys.argv[1] + '-check.stderr')).read_bytes() == b''
          PY
          done
          sh scripts/build_tool.sh tests/practical_stdlib_tests.ouro _build/practical-stdlib-integration > _build/ci/maybe-iter-integration/practical-build.stdout 2> _build/ci/maybe-iter-integration/practical-build.stderr
          test -x _build/practical-stdlib-integration
      - name: Execute all 88 practical shape assertions with retained runtime limits
        if: matrix.suite == 'practical'
        run: |
          python3 - <<'PY'
          import dataclasses, hashlib, json, os, re
          from pathlib import Path
          from scripts.ourosmith.limits import run_limited
          source = Path('tests/practical_stdlib_tests.ouro').read_text()
          rx = r'\bassert_(?:true|eq)\s+"([^"\n]+)"'
          labels = re.findall(rx, source)
          assert labels == re.findall(rx, source[source.index('def main :'):])
          assert len(labels) == len(set(labels)) == 88
          out = Path('_build/ci/maybe-iter-integration')
          cpu = min(os.sched_getaffinity(0))
          binary = Path('_build/practical-stdlib-integration')
          result = run_limited(['taskset', '-c', str(cpu), str(binary.resolve())],
                               timeout_s=300, memory_mb=3072, cwd=Path.cwd())
          (out / 'practical-run.stdout').write_text(result.stdout)
          (out / 'practical-run.stderr').write_text(result.stderr)
          (out / 'practical-run.json').write_text(json.dumps({
              **dataclasses.asdict(result), 'source_sha': 'bd2b7947ea5eb16b4541bca64f1af0b80b2a2914',
              'expected_rows': 88, 'timeout_s': 300, 'memory_mib': 3072, 'cpu_count': 1,
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest()}, indent=2) + '\n')
          assert result.ok and result.returncode == 0
          assert result.stdout == ''.join('ok ' + label + '\n' for label in labels) and result.stderr == ''
          print('PRACTICAL_SHAPES: PASS source=bd2b7947 rows=88')
          PY
      - name: Require the imported compiler to remain unchanged
        if: ${{ always() && steps.import.outcome == 'success' }}
        run: sha256sum --check _build/ci/maybe-iter-integration/compiler.sha256
      - name: Upload exact owner-generated files
        if: ${{ always() && matrix.suite == 'regeneration' && steps.baseline.outcome == 'success' && steps.doc_check.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maybe-iter-owner-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/maybe-iter-owner-output/
          if-no-files-found: error
      - name: Upload source, compiler and native suite receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maybe-iter-${{ matrix.suite }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            _build/ci/maybe-iter-integration/**/*.json
            _build/ci/maybe-iter-integration/**/*.stdout
            _build/ci/maybe-iter-integration/**/*.stderr
            _build/ci/maybe-iter-integration/**/*.sha256
            _build/doc_suite/**/*.tsv
            _build/doc_suite/**/*.log
            _build/doc_suite/**/*.diff
