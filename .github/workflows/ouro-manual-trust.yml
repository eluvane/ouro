name: Manual

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Local CI profile to run
        required: true
        type: choice
        default: manual
        options:
          - manual
          - kernel
          - stage-loop
      disable_cache:
        description: Disable Ouro build caches for this run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs-api:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_JOBS: "2"
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate API reference
        run: sh scripts/doc_suite.sh --regen
      - name: Check documentation
        run: sh scripts/doc_suite.sh
      - name: Upload API reference and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-api-generated
          if-no-files-found: error
          retention-days: 7
          path: |
            docs/api/**
            _build/doc_suite/**
