name: Manual

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Local CI profile to run
        required: true
        type: choice
        default: manual
        options:
          - manual
          - kernel
          - stage-loop
      disable_cache:
        description: Disable Ouro build caches for this run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs-api:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_JOBS: "2"
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate API reference
        run: sh scripts/doc_suite.sh --regen
      - name: Diagnose bootstrap source rejection
        if: failure()
        timeout-minutes: 10
        run: |
          python3 -B - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import frontend_regen
          from ourosmith.limits import clean_env, run_limited
          from repo_support import configure_native_stack
          configure_native_stack()
          snapshots = sorted(Path('_build/bootstrap').glob('*/inputs.json'))
          for snapshot_path in snapshots:
              snapshot = json.loads(snapshot_path.read_text())
              work = snapshot_path.parent.resolve()
              producer = work / 'out/bridge/ouro1'
              original = work / 'o'
              if not producer.is_file():
                  continue
              frontend_regen.ROOT = original
              for root in ('std/utf8_scalar.ouro', 'compiler/source_text.ouro', 'compiler/lexer.ouro', 'compiler/pipeline.ouro'):
                  units = frontend_regen.collect_units(root)
                  argv = [str(producer), 'check', root, '999999']
                  argv += [part for unit in units for part in ('--unit', unit)]
                  result = run_limited(argv, cwd=original, env=clean_env(), timeout_s=120, memory_mb=3072)
                  print(root, result.classify(), result.returncode, flush=True)
                  print(result.stdout, end='', flush=True)
                  print(result.stderr, end='', flush=True)
          PY
      - name: Check documentation
        run: sh scripts/doc_suite.sh
      - name: Upload API reference and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-api-generated
          if-no-files-found: error
          retention-days: 7
          path: |
            docs/api/**
            _build/doc_suite/**
            _build/bootstrap/*/report.json
            _build/bootstrap/*/inputs.json
            _build/bootstrap/*/out/*/*.stderr
            _build/bootstrap/*/out/*/*.stdout
