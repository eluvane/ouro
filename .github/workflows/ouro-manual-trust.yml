name: Manual

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Local CI profile to run
        required: true
        type: choice
        default: manual
        options:
          - manual
          - kernel
          - stage-loop
      disable_cache:
        description: Disable Ouro build caches for this run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ouro-manual-trust-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  groups:
    name: Select groups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select complete profile inventory
        id: groups
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          matrix=$(python3 scripts/ci_gate.py --profile "$PROFILE" --list-groups)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  manual-validation:
    name: ${{ inputs.profile }} (${{ matrix.group }})
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.matrix) }}
    permissions:
      contents: read
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "10"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
      OURO_STAGE_MAX: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore cache
        if: ${{ !inputs.disable_cache }}
        id: ouro-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _cache/ouro
            _build/c
            _build/stage_loop
          key: ouro-manual-${{ runner.os }}-${{ inputs.profile }}-${{ matrix.group }}-${{ hashFiles('Ouro.seal', 'scripts/**', 'compiler/**', 'runtime/**', 'tools/**', 'tests/**', 'std/**', 'quality/smith/**', 'docs/generated_artifact_hashes.sha256') }}
          restore-keys: |
            ouro-manual-${{ runner.os }}-${{ inputs.profile }}-
            ouro-manual-${{ runner.os }}-

      - name: Disable cache
        if: ${{ inputs.disable_cache }}
        run: echo "OURO_CACHE=0" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check --quiet ruff==0.15.21
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          cc --version || true

      - name: Run profile
        run: python3 scripts/ci_gate.py --profile "${{ inputs.profile }}" --group "${{ matrix.group }}" --out "_build/ci/${{ inputs.profile }}-${{ matrix.group }}"

      - name: Save cache
        if: ${{ !inputs.disable_cache && github.event_name != 'pull_request' && steps.ouro-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _cache/ouro
            _build/c
            _build/stage_loop
          key: ${{ steps.ouro-cache.outputs.cache-primary-key }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-${{ inputs.profile }}-${{ matrix.group }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.txt
            _build/**/*.err
            _build/**/*.sarif
            _build/**/*.md
            _build/**/gate.log
