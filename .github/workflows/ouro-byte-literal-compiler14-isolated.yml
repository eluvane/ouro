name: Byte literal compiler-14 (diagnostic)

on:
  push:
    branches: [codef/byte-literal-compiler14-isolated]
    paths:
      - .github/workflows/ouro-byte-literal-compiler14-isolated.yml

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  compiler-14:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
      EXPECTED_SOURCE_SHA: 59fce01fcb206431ad743179b0f7a7c4a0e3337e
      EXPECTED_FIXTURE_BLOB: f1d2c473c07580aaadcc34aa8d26924598de8bc5
      EXPECTED_BUNDLE_SHA: 940ebe31b476f3776eb9a94f68548f50ea681d91cec3a27952a55f27b250f3a0
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 59fce01fcb206431ad743179b0f7a7c4a0e3337e
          persist-credentials: false

      - name: Verify exact diagnostic source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git hash-object tests/compiler_driver_tests.ouro)" = "$EXPECTED_FIXTURE_BLOB"

      - name: Download matching verified host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36301541621-1
          run-id: 36301541621
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install matching host compiler
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$EXPECTED_BUNDLE_SHA"

      - name: Run exact compiler-14 gate
        run: python3 scripts/ci_gate.py --profile pr --group compiler-14 --fail-fast --out _build/ci/pr-compiler-14

      - name: Upload compiler-14 reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byte-literal-compiler-14
          path: |
            _build/ci/pr-compiler-14/**
            _build/compiler_check_suite_14/**
          if-no-files-found: warn
          retention-days: 7
