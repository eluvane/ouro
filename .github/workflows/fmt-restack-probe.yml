                    'blobs': {'CHANGELOG.md': {'blob': '2accc4d1ee9bca7f82468e5c6ac7f57e1219d53c',
                                               'sha256': 'fcfb141eb958faf785b1fdb61d8c65f580a769b13a24764526c31e3e434fa751'},
                              'docs/tooling.md': {'blob': '9af3eb2d42933c3e060a9c862c95bda5dc8b43f1',
                                                  'sha256': 'affb5d04f831789c73a5c6fef08c2c140bfce66987a8857bd7cf1bd16fd0af40'},
                              'scripts/build_tool.sh': {'blob': 'ff83eec44937a8d9aa37c5af67aae2d57b93f4c3',
                                                        'sha256': 'e810245ccd66fdb90896180c53142db3b18d2a3557045d654f9966c376c80ac6'},
                              'scripts/ci_gate.py': {'blob': '16ea86bf60a3d3347c30af2f562a6b6b500b89ef',
