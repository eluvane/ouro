          run-id: 36360415225
          github-token: ${{ github.token }}
          name: host-reviewed-36360415225-1
          path: _build/ci

      - name: Verify archive, 177 source digests, two stage0 digests and canonical import
        id: host
        run: |
          echo 'e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7  _build/ci/host-compiler.tar.gz' | sha256sum --check -
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          key = 'f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c'
          binary = '460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c'
          with tarfile.open('_build/ci/host-compiler.tar.gz', 'r:gz') as archive:
              receipt = json.load(archive.extractfile('_build/c/ouro1.bootstrap.json'))
          assert receipt['key'] == key and receipt['binary_sha256'] == binary
          selected = receipt['selected']
          assert len(selected['sources']) == 177 and len(selected['stage0']) == 2
          for group in ('sources', 'stage0'):
              for path, expected in selected[group].items():
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          report = {'run_id': 36360415225, 'artifact_id': 10946340921,
                    'archive_sha256': 'e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7',
                    'key': key, 'binary_sha256': binary, 'source_count': 177, 'stage0_count': 2}
          Path('_build/fmt-restack/host.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          test "$(python3 scripts/ci_gate.py --compiler-artifact key)" = 'key=f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c'
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7
          echo '460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c  _build/c/ouro1' | sha256sum --check -
          command -v cc || command -v gcc

      - name: Run canonical formatter suite
        id: fmt
        if: ${{ always() && steps.host.outcome == 'success' }}
        run: |
          set +e
          sh scripts/fmt_suite.sh >_build/fmt-restack/fmt.stdout 2>_build/fmt-restack/fmt.stderr
          status=$?
          set -e
          printf '%s\n' "$status" >_build/fmt-restack/fmt.rc
          cat _build/fmt-restack/fmt.stdout
          cat _build/fmt-restack/fmt.stderr >&2
          exit "$status"

      - name: Verify complete formatter selftest rows
        id: fmt_evidence
        if: ${{ always() && steps.fmt.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import csv, json, os, re
          from pathlib import Path
          report = json.loads(Path('_build/fmt-restack/source.json').read_text())
          assert Path('_build/fmt-restack/fmt.rc').read_text().strip() == '0'
          with Path('_build/fmt_suite/selftest-report.tsv').open(newline='') as stream:
              reader = csv.DictReader(stream, delimiter='\t')
              assert reader.fieldnames == ['name', 'pass', 'issue']
              rows = list(reader)
          assert rows == [{'name': name, 'pass': 'true', 'issue': ''} for name in report['fmt_rows']], rows
          assert Path('_build/fmt_suite/ouro-fmt').is_file()
          assert os.access('_build/fmt_suite/ouro-fmt', os.X_OK)
          stdout = Path('_build/fmt-restack/fmt.stdout').read_text()
          matches = re.findall(r'^FMT_SUITE: PASS rows=(\d+) out=.+$', stdout, re.MULTILINE)
          assert matches == [str(len(rows))], matches
          assert 'FMT_SUITE: SKIP' not in stdout + Path('_build/fmt-restack/fmt.stderr').read_text()
          print('FMT_EVIDENCE: PASS rows=' + str(len(rows)))
          PY

      - name: Run canonical fixer suite independently
        id: fix
        if: ${{ always() && steps.host.outcome == 'success' }}
        run: |
