           'pr93': {'sha': 'ae3d5b6882e60c3419c0e033a171ed86cdc486d3',
                    'history': ['ae3d5b6882e60c3419c0e033a171ed86cdc486d3'],
                    'product_paths': ['CHANGELOG.md',
