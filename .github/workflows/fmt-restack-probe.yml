name: Source-bound formatter restack probe

on:
  push:
    branches: [codef/fmt-restack-probe]
    paths: [.github/workflows/fmt-restack-probe.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: fmt-restack-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  OURO_BUILD_TOOL_MODE: native
  FMT_SUITE_OUT: _build/fmt_suite
  FIX_SUITE_OUT: _build/fix_suite

jobs:
  format:
    name: Formatter/fixer (${{ matrix.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: pr92
            source: 84e256b6ac58e11a70693361acca2a350129cc6b
          - product: pr93
            source: ae3d5b6882e60c3419c0e033a171ed86cdc486d3
    env:
      PRODUCT: ${{ matrix.product }}
      SOURCE_SHA: ${{ matrix.source }}
      DIAGNOSTIC_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false

