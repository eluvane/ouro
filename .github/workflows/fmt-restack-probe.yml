          base = '973c3a21342e9d6e029479fb33ed7207d010c1bd'
          diagnostic_parent = '84e256b6ac58e11a70693361acca2a350129cc6b'
          workflow = '.github/workflows/fmt-restack-probe.yml'
          product = products[os.environ['PRODUCT']]
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['SOURCE_SHA'] == product['sha'] == git('rev-parse', 'HEAD')
          diagnostic = os.environ['DIAGNOSTIC_SHA']
          assert git('rev-parse', diagnostic + '^') == diagnostic_parent
          assert git('diff', '--name-only', diagnostic + '^', diagnostic).splitlines() == [workflow]
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          assert git('rev-list', '--reverse', base + '..HEAD').splitlines() == product['history']
          assert git('diff', '--name-only', base, 'HEAD').splitlines() == product['product_paths']
          for path, expected in product['blobs'].items():
              assert git('rev-parse', 'HEAD:' + path) == expected['blob'], path
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected['sha256'], path
          fixture = Path('tests/analyze/precision/format_fix.ouro').read_text(encoding='utf-8')
          labels = re.findall(r'MkPair String Bool "([^"]+)"', fixture.split('def precision_format_cases', 1)[1])
          assert labels == product['precision_labels']
          assert len(labels) == (36 if os.environ['PRODUCT'] == 'pr92' else 41)
          if os.environ['PRODUCT'] == 'pr92':
              source = Path('tools/fmt.ouro').read_text(encoding='utf-8')
              body = source.split('def fmt_selftest_multiline_calls', 1)[1].split('] in', 1)[0]
              assert body.count('MkPair String String') == product['multiline_pairs'] == 8
          out = Path('_build/fmt-restack')
          out.mkdir(parents=True, exist_ok=True)
          report = {'kind': 'ouro.fmt-restack-probe.v1', 'diagnostic_sha': diagnostic,
                    'base': base, 'product': os.environ['PRODUCT'], **product}
          (out / 'source.json').write_text(json.dumps(report, indent=2) + '\n')
          expected = ''.join('PRECISION_OK ' + label + '\n' for label in labels)
          expected += 'PRECISION_SUITE format-fix rows=' + str(len(labels)) + '\n'
          (out / 'precision.expected').write_text(expected, encoding='utf-8', newline='')
          print('SOURCE_GUARD: PASS product=' + os.environ['PRODUCT'] + ' precision_rows=' + str(len(labels)))
