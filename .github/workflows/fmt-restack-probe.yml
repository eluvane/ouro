           'fix-unused-bind',
           'fix-unused-parameter']
          safety = ['empty-cone-at-zero-budget', 'incomplete-cone-is-an-error',
                    'cyclic-cone-keeps-lowercase-constructors', 'missing-import-never-writes',
                    'transitive-group-keeps-lowercase-constructors', 'malformed-root-import-is-an-error',
                    'malformed-transitive-import-is-an-error', 'missing-second-import-never-writes']
          assert Path('_build/fmt-restack/fix.rc').read_text().strip() == '0'
          stdout = Path('_build/fmt-restack/fix.stdout').read_text()
          assert re.findall(r'^FIX_OK (.+)$', stdout, re.MULTILINE) == names
          assert re.findall(r'^FIX_SAFE_OK (.+)$', stdout, re.MULTILINE) == safety
          assert re.findall(r'^FIX_SUITE: PASS rows=(\d+) out=.+$', stdout, re.MULTILINE) == ['47']
          assert 'FIX_SUITE: SKIP' not in stdout + Path('_build/fmt-restack/fix.stderr').read_text()
          print('FIX_EVIDENCE: PASS fixture_rows=47 safety_rows=8')
          PY

      - name: Build and run every native format/fix precision case
        id: precision
        if: ${{ always() && steps.host.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          out = Path('_build/fmt-restack')
          binary = Path('_build/c/format-fix-precision')
          with (out / 'precision.build.log').open('wb') as log:
              built = subprocess.run(['sh', 'scripts/build_tool.sh',
                  'tests/analyze/precision/format_fix.ouro', str(binary)], stdout=log, stderr=subprocess.STDOUT)
          (out / 'precision.build.rc').write_text(str(built.returncode) + '\n')
          if built.returncode:
              print((out / 'precision.build.log').read_text(errors='replace')[-12000:], file=sys.stderr)
              raise SystemExit(built.returncode)
          ran = subprocess.run([str(binary.resolve())], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          (out / 'precision.stdout').write_bytes(ran.stdout)
          (out / 'precision.stderr').write_bytes(ran.stderr)
          (out / 'precision.rc').write_text(str(ran.returncode) + '\n')
          expected = (out / 'precision.expected').read_bytes()
          report = {'returncode': ran.returncode, 'stdout_equal': ran.stdout == expected,
                    'stderr_empty': not ran.stderr,
                    'rows': len(json.loads((out / 'source.json').read_text())['precision_labels'])}
          (out / 'precision.json').write_text(json.dumps(report, indent=2) + '\n')
          sys.stdout.buffer.write(ran.stdout)
          sys.stderr.buffer.write(ran.stderr)
          if ran.returncode != 0 or ran.stdout != expected or ran.stderr:
              raise SystemExit('FORMAT_PRECISION: FAIL exact rc/stdout/stderr contract')
          PY

      - name: Record observed independent step outcomes
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          HOST_OUTCOME: ${{ steps.host.outcome }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          FMT_EVIDENCE_OUTCOME: ${{ steps.fmt_evidence.outcome }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
          FIX_EVIDENCE_OUTCOME: ${{ steps.fix_evidence.outcome }}
          PRECISION_OUTCOME: ${{ steps.precision.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('_build/fmt-restack')
          out.mkdir(parents=True, exist_ok=True)
          names = ['SOURCE', 'HOST', 'FMT', 'FMT_EVIDENCE', 'FIX', 'FIX_EVIDENCE', 'PRECISION']
          report = {name.lower(): os.environ[name + '_OUTCOME'] for name in names}
          (out / 'outcomes.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Upload complete source and gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fmt-restack-${{ matrix.product }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/fmt-restack/
            _build/c/ouro1.bootstrap.json
            _build/c/format-fix-precision.build.json
            _build/smith/fixtures/fmt-*/*.in
            _build/smith/fixtures/fmt-*/*.golden
            _build/smith/fixtures/fix-*/*.in
            _build/smith/fixtures/fix-*/*.golden
            _build/fmt_suite/*.log
            _build/fmt_suite/*.out
            _build/fmt_suite/*.err
            _build/fmt_suite/*.tsv
            _build/fmt_suite/*.diff
            _build/fmt_suite/*.idem
            _build/fmt_suite/*.again
            _build/fmt_suite/**/*.log
            _build/fmt_suite/**/*.out
            _build/fmt_suite/**/*.err
            _build/fmt_suite/**/*.json
            _build/fmt_suite/source-transactions/
            _build/fix_suite/*.log
            _build/fix_suite/*.out
            _build/fix_suite/*.err
            _build/fix_suite/*.report
            _build/fix_suite/*.again
            _build/fix_suite/*.json
            _build/fix_suite/**/*.log
            _build/fix_suite/**/*.out
            _build/fix_suite/**/*.err
            _build/fix_suite/**/*.json
            _build/fix_suite/source-transactions/
          if-no-files-found: warn
          retention-days: 14
