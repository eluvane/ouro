name: Strict definition spans stage profile

on:
  push:
    branches: [codef/strict-def-spans-stage-profile]

permissions:
  contents: read
  actions: read

jobs:
  strict-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact traced candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and compiler snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "ee4282840a956043458bb91eac00ed50ee5d314a"
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' '.github/workflows/strict-def-spans-stage-profile.yml' 'scripts/memory_watch.py' 'tools/strict/fixtures.ouro' 'tools/strict/main.ouro')"
          test "$(git rev-parse HEAD:compiler/source_text.ouro)" = "eba30d65d1c1a4ad34f1de77efcbfa4dd27dbe36"
          test "$(git rev-parse HEAD:tools/strict/scan.ouro)" = "f5befd299c5694c40fa37b6416f12c66cb5ae518"
          test "$(git rev-parse HEAD:tests/quality_input_tests.ouro)" = "76f186f9e4800a5422ce4234b5331aef08dd5882"
          test "$(git rev-parse HEAD:quality/memory_budgets.json)" = "9257b185a175b64474d9c014086771035ac8394f"
          test "$(git rev-parse HEAD:tools/strict/main.ouro)" = "bcdc6af245bfa9d71943b4055eabb843c568b7d4"
          test "$(git rev-parse HEAD:tools/strict/fixtures.ouro)" = "1c137b37bada4b2c05635106655089ec86140389"
          test "$(git rev-parse HEAD:scripts/memory_watch.py)" = "91318be6eb359d33b596dfa5561a5082c7479bb0"
          test "$(python3 scripts/ci_gate.py --compiler-artifact key)" = "key=b8d31b04dc1d01b29e49134936608c61a4557c4b5d54ec08450e565836d8f6d7"

      - name: Download verified host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36311470304-1
          run-id: 36311470304
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install host compiler
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 10c96480783621387e90627b36cebb0e3d5880b38611e563bc3de01a7209b75f

      - name: Measure unchanged release strict quality gate
        env:
          OURO_BUILD_TOOL_MODE: auto
        run: python3 scripts/memory_budget_suite.py --case strict-quality-gate --out _build/memory

      - name: Stream native phase trace under the same memory budget
        if: always()
        shell: bash
        env:
          OURO_ROOT: ${{ github.workspace }}
          OURO_MEM_TRACE: "1"
        run: |
          test -x _build/c/ouro-strict-quality-firewall
          trace_status=0
          python3 scripts/memory_watch.py \
            --label strict-native-phase-probe --budget-kb 1024000 \
            --cwd . --progress-file _build/memory/strict-native-phase-probe.log \
            --json _build/memory/strict-native-phase-probe.json \
            -- ./_build/c/ouro-strict-quality-firewall \
            --profile release \
            --report _build/memory/strict-quality-firewall.direct.json \
            --sarif _build/memory/strict-quality-firewall.direct.sarif \
            --migration-report _build/memory/strict-quality-migration.direct.md \
            > _build/memory/strict-native-phase-probe.log 2>&1 || trace_status=$?
          tail -n 24 _build/memory/strict-native-phase-probe.log
          exit "$trace_status"

      - name: Compare canonical and staged scanner on a small source
        if: always()
        shell: bash
        env:
          OURO_ROOT: ${{ github.workspace }}
        run: |
          test -x _build/c/ouro-strict-quality-firewall
          _build/c/ouro-strict-quality-firewall \
            --scan-source compiler/ast.ouro --profile release \
            < compiler/ast.ouro > _build/memory/strict-canonical.json \
            2> _build/memory/strict-canonical.err
          OURO_STRICT_STAGE_COMPARE=1 _build/c/ouro-strict-quality-firewall \
            --scan-source compiler/ast.ouro --profile release \
            < compiler/ast.ouro > _build/memory/strict-staged.json \
            2> _build/memory/strict-staged.err
          cmp _build/memory/strict-canonical.json _build/memory/strict-staged.json
          test ! -s _build/memory/strict-canonical.err

      - name: Upload measurement and trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-def-spans-stage-profile
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _build/memory/*.json
            _build/memory/*.log
            _build/memory/*.md
            _build/memory/strict-native-phase-probe.log
            _build/memory/strict-canonical.err
            _build/memory/strict-staged.err
            _build/c/ouro-strict-quality-firewall.build.json
