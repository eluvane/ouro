name: PR88 absint list context probe

on:
  push:
    branches: [codef/pr88-absint-list-context-probe]

permissions:
  contents: read
  actions: read

jobs:
  absint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "f8ff1d36ea8334f37bc6fb1f21fb10d54e769c85"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr88-absint-list-context-probe.yml"
          test "$(git rev-parse HEAD:tests/analyze/precision/absint.ouro)" = "d8fe91370644ecb33226244b305925122e3a68ff"
          test "$(git rev-parse HEAD:compiler/preprocess_record.ouro)" = "6df6174e456b6416fd67c40a3e61ec0ac4f0efd6"
          test "$(git rev-parse HEAD:scripts/ouro1.sh)" = "9665ebb00049d05c097a29d77ec5083b524f9e2d"
          test "$(git rev-parse HEAD:scripts/ci_gate.py)" = "16ea86bf60a3d3347c30af2f562a6b6b500b89ef"

      - name: Download exact verified Host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36323936191-1
          run-id: 36323936191
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install Host compiler
        shell: bash
        run: |
          echo "0268db29471266308e4880a04659c215c3cfecd64c036a10ac7b6b2e2bb9bd8f  _build/ci/host-compiler.tar.gz" | sha256sum -c -
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 0268db29471266308e4880a04659c215c3cfecd64c036a10ac7b6b2e2bb9bd8f

      - name: Check absint fixture
        shell: bash
        run: |
          mkdir -p _build/diag-absint
          rc=0
          sh scripts/ouro1.sh check tests/analyze/precision/absint.ouro 200000 \
            > _build/diag-absint/check.out 2> _build/diag-absint/check.err || rc=$?
          printf '%s\n' "$rc" > _build/diag-absint/check.rc
          cat _build/diag-absint/check.out _build/diag-absint/check.err
          test "$rc" -eq 0
          grep -Fx CHECK_OK _build/diag-absint/check.out
          test ! -s _build/diag-absint/check.err

      - name: Upload absint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-absint-list-context-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: _build/diag-absint/
