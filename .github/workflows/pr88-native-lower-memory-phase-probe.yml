name: Native lowering check memory attribution

on:
  push:
    branches: [codef/pr88-native-lower-memory-phase-probe]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr88-native-lower-memory-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  SOURCE_SHA: 4af755e9d63c5489ae1c376d080a2928c769f34b
  SOURCE_TREE_SHA: 590089efcd041ff37d27394e8df48bd3c6493cca
  SOURCE_INPUTS_HASH: cd58e3667cf71953dfa6aabb0790f1705853610419765662c1c0c45be78e90ed
  COLLECT_CORE_BLOB: 19199382403083ae7fa030f9ae12e8e7f2f0c718
  BRIDGE_MANIFEST_BLOB: c02f937d0b9f260b8d1a75906f6df7a3ee5cb567
  BRIDGE_ARCHIVE_BLOB: 3c8842972f03032ff8661b5b7feeaf30a04961fb
  PREPROCESS_RECORD_EXPR_BLOB: 68f0bbc269cea67164c89a168b648606958c7603
  NATIVE_LOWER_BLOB: 31cede9df5ee2f5257ff68ccd7a1735b5deeccfe
  UNIT_LIST_SHA256: 922d005625231872baef23ff332e7f5f7db8a423131614415baea7934dd4078c
  PRODUCER_RUN: "36398476620"
  PRODUCER_SHA: 2a49d56c99a4f5b6ced1fda992c37f79e67f8045
  HOST_JOB: "108850407925"
  HOST_ARTIFACT: "10960212688"
  HOST_ZIP_SHA256: 82e3d136dd8562b41c549607dade2715f749936d2f0e2f99c959d46f2033f86e
  HOST_ARCHIVE_SHA256: a7f4d757c2babd472889528321fad9c865014e09627a419d62426d12b4739c1e
  HOST_BINARY_SHA256: 8aeb79293661c123de7b3f021d34dc77c60598fd9c7dc5702d71d2eed9afe814
  HOST_KEY: 92e2bc0e98a475bf262cc67ec3f9cf6394d3b3e96459b28f84ef550e0ec16a6e

jobs:
  native-lower-phases:
    name: Collector and full compiler check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Require workflow-only child and exact complete source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/pr88-native-lower-memory-phase-probe.yml
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE_SHA"
          test "$(git rev-parse "$SOURCE_SHA:tools/collect_core.ouro")" = "$COLLECT_CORE_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:compiler/bootstrap/c-bootstrap-v1.json")" = "$BRIDGE_MANIFEST_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:compiler/bootstrap/c-bootstrap-v1.tar.gz")" = "$BRIDGE_ARCHIVE_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:compiler/preprocess_record_expr.ouro")" = "$PREPROCESS_RECORD_EXPR_BLOB"
          test "$(git rev-parse "$SOURCE_SHA:tests/native_lower_tests.ouro")" = "$NATIVE_LOWER_BLOB"
          git checkout --detach "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p _build/ci/native-lower-memory
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import frontend_regen as frontend
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          out = Path('_build/ci/native-lower-memory')
          units = frontend.collect_units('tests/native_lower_tests.ouro')
          listing = ''.join(unit+'\n' for unit in units)
          paths = sorted(set(units) | {'tools/collect.ouro', 'tools/collect_core.ouro',
              'scripts/ouro1.sh', 'scripts/build_tool.sh', 'scripts/native_tool_build.py',
              'scripts/frontend_regen.py', 'scripts/ourosmith/limits.py', 'scripts/ourosmith/exec_child.py',
              'tools/test/process_model.ouro', 'tools/native_sibling_model.ouro',
              'runtime/bootstrap.c', 'runtime/frontend_link.c', 'runtime/ouro_rt.c'})
          rows = [{'path': path, 'blob': git('rev-parse', 'HEAD:'+path),
                   'sha256': hashlib.sha256(Path(path).read_bytes()).hexdigest()} for path in paths]
          (out/'source.json').write_text(json.dumps({'workflow_sha': os.environ['GITHUB_SHA'],
              'source_sha': git('rev-parse', 'HEAD'), 'source_tree': git('rev-parse', 'HEAD^{tree}'),
              'ordered_units': units, 'inputs': rows}, indent=2, sort_keys=True)+'\n')
          (out/'expected.units').write_text(listing)
          assert len(units) == 172 and len(set(units)) == 172
          assert units[-1] == 'tests/native_lower_tests.ouro'
          assert hashlib.sha256(listing.encode()).hexdigest() == os.environ['UNIT_LIST_SHA256']
          PY

      - name: Verify the completed producer and official artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path('_build/ci/native-lower-memory')
          def api(path, name):
              raw = subprocess.check_output(['gh', 'api', 'repos/eluvane/ouro/'+path])
              (out/name).write_bytes(raw)
              return json.loads(raw)
          run = api('actions/runs/'+os.environ['PRODUCER_RUN'], 'producer-run.json')
          jobs = api('actions/runs/'+os.environ['PRODUCER_RUN']+'/jobs?per_page=100', 'producer-jobs.json')
          artifact = api('actions/artifacts/'+os.environ['HOST_ARTIFACT'], 'producer-artifact.json')
          assert run['head_sha'] == os.environ['PRODUCER_SHA'] and run['status'] == 'completed'
          assert run['run_attempt'] == 1
          host = [job for job in jobs['jobs'] if job['id'] == int(os.environ['HOST_JOB'])]
          assert len(host) == 1 and host[0]['status'] == 'completed' and host[0]['conclusion'] == 'success'
          assert artifact['id'] == int(os.environ['HOST_ARTIFACT']) and not artifact['expired']
          assert artifact['name'] == 'host-compiler-36398476620-1'
          assert artifact['workflow_run']['id'] == int(os.environ['PRODUCER_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['PRODUCER_SHA']
          assert artifact['digest'] == 'sha256:'+os.environ['HOST_ZIP_SHA256']
          PY

      - name: Download the verified predecessor Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36398476620-1
          run-id: 36398476620
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Require canonical source-bound compiler import
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$HOST_ARCHIVE_SHA256" _build/ci/host-compiler.tar.gz | sha256sum --check
          python3 -B scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$HOST_ARCHIVE_SHA256"
          python3 -B scripts/ci_gate.py --compiler-artifact key > _build/ci/native-lower-memory/key-before.stdout
          sha256sum _build/c/ouro1 > _build/ci/native-lower-memory/compiler.sha256
          cp _build/c/ouro1.bootstrap.json _build/ci/native-lower-memory/receipt-before.json
          python3 -B - <<'PY'
          import argparse, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import bootstrap_compiler as bootstrap
          import ouro_build as build
          from repo_support import hash_json
          out = Path('_build/ci/native-lower-memory')
          selected = bootstrap.current_inputs(Path.cwd(), build.load_config(argparse.Namespace()), build)
          receipt = json.loads((out/'receipt-before.json').read_text())
          projection = {name: selected[name] for name in ('kind', 'roots', 'unit_graph', 'sources',
              'source_form', 'archive_sha256', 'manifest_sha256', 'stage0')}
          (out/'current-inputs-before.json').write_text(json.dumps(selected, indent=2, sort_keys=True)+'\n')
          (out/'source-inputs.json').write_text(json.dumps(projection, indent=2, sort_keys=True)+'\n')
          assert receipt['selected'] == selected and receipt['key'] == os.environ['HOST_KEY']
          assert receipt['binary_sha256'] == os.environ['HOST_BINARY_SHA256']
          assert hashlib.sha256(Path('_build/c/ouro1').read_bytes()).hexdigest() == os.environ['HOST_BINARY_SHA256']
          assert len(selected['sources']) == 180 and sum(name.endswith('.ouro') for name in selected['sources']) == 149
          assert len(selected['roots']) == 15 and len(selected['unit_graph']) == 19 and len(selected['stage0']) == 2
          assert hash_json(projection) == os.environ['SOURCE_INPUTS_HASH']
          assert (out/'key-before.stdout').read_text() == 'key='+os.environ['HOST_KEY']+'\n'
          (out/'host-proof.json').write_text(json.dumps({'producer_run': os.environ['PRODUCER_RUN'],
              'producer_sha': os.environ['PRODUCER_SHA'], 'artifact_id': os.environ['HOST_ARTIFACT'],
              'archive_sha256': os.environ['HOST_ARCHIVE_SHA256'], 'binary_sha256': os.environ['HOST_BINARY_SHA256'],
              'key': receipt['key'], 'selected_source_hash': hash_json(projection)}, indent=2, sort_keys=True)+'\n')
          PY

      - name: Measure collector build collection and full compiler check separately
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import argparse, hashlib, json, os, subprocess, sys, time
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import bootstrap_compiler as bootstrap
          import ouro_build as build
          from ourosmith.limits import run_limited
          out = Path('_build/ci/native-lower-memory')
          source = json.loads((out/'source.json').read_text())
          collector = Path('_build/c/ouro-collect')
          records = {name: {'status': 'not-run'} for name in ('collector-build', 'collection', 'compiler-check')}
          policy = {'compile_timeout_s': 1800, 'memory_mib': 3072, 'cpu_count': 1,
                    'stream_bytes': 16*1024*1024, 'mem_trace': '1', 'cache': '0', 'stack': 'stock unlimited',
                    'owners': ['tools/test/process_model.ouro', 'tools/native_sibling_model.ouro']}
          child_env = dict(os.environ, OURO_JOBS='1', OURO_FRONTEND_JOBS='1',
              OURO_BUILD_TOOL_MODE='native', OURO_CACHE='0', OURO_MEM_TRACE='1',
              OURO_ROOT=str(Path.cwd()), PYTHONDONTWRITEBYTECODE='1')
          allowed = os.sched_getaffinity(0)
          os.sched_setaffinity(0, {min(allowed)})
          passed = False
          failure = None
          def write_json(name, value):
              (out/name).write_text(json.dumps(value, indent=2, sort_keys=True)+'\n')
          def run(name, argv):
              started = time.monotonic()
              launcher = ['sh', '-c', 'ulimit -s unlimited 2>/dev/null || true; exec "$@"', name, *argv]
              records[name] = {'argv': argv, 'launcher_argv': launcher,
                               'status': 'running', 'started_monotonic_s': started,
                               'started_utc': datetime.now(timezone.utc).isoformat()}
              write_json('processes.json', records)
              print('NATIVE_LOWER_PHASE_BEGIN '+name, flush=True)
              result = run_limited(launcher, timeout_s=policy['compile_timeout_s'], memory_mb=policy['memory_mib'],
                                   cwd=Path.cwd(), env=child_env, stdin_text='')
              (out/(name+'.stdout')).write_text(result.stdout)
              (out/(name+'.stderr')).write_text(result.stderr)
              (out/(name+'.rc')).write_text(str(result.returncode)+'\n')
              records[name].update(status=result.status, rc=result.returncode, elapsed_s=result.elapsed_s,
                  ended_monotonic_s=time.monotonic(), ended_utc=datetime.now(timezone.utc).isoformat(),
                  peak_rss_mb=result.peak_rss_mb, peak_rss_measured=False,
                  stdout_bytes=len(result.stdout.encode()), stderr_bytes=len(result.stderr.encode()),
                  allocator_oom='ouro_rt: out of memory (' in result.stderr,
                  heap_trace=[line for line in result.stderr.splitlines() if line.startswith('OURO_MEM_HEAP ')])
              write_json('processes.json', records)
              print(result.stdout, end='', flush=True)
              print(result.stderr, end='', file=sys.stderr, flush=True)
              print('NATIVE_LOWER_PHASE_END '+name+' status='+result.status+' rc='+str(result.returncode), flush=True)
              assert result.ok, records[name]
              assert records[name]['stdout_bytes'] <= policy['stream_bytes']
              assert records[name]['stderr_bytes'] <= policy['stream_bytes']
              return result
          try:
              assert not collector.exists() and not Path(str(collector)+'.exe').exists()
              run('collector-build', ['sh', 'scripts/build_tool.sh', 'tools/collect.ouro', str(collector)])
              assert collector.is_file() and os.access(collector, os.X_OK)
              assert collector.read_bytes()[:4] == b'\x7fELF'
              (out/'collector.sha256').write_text(hashlib.sha256(collector.read_bytes()).hexdigest()+'\n')
              for suffix in ('.sources', '.build.json'):
                  (out/('collector'+suffix)).write_bytes(Path(str(collector)+suffix).read_bytes())
              collected = run('collection', [str(collector.resolve()), 'tests/native_lower_tests.ouro'])
              # collect_unit_lines strips CR and command-substitution trailing LF, then prints one LF.
              listing = collected.stdout.rstrip('\n').replace('\r', '')+'\n'
              (out/'actual.units').write_text(listing)
              units = listing.splitlines()
              assert units == source['ordered_units'] and len(units) == 172 and len(set(units)) == 172
              assert hashlib.sha256(listing.encode()).hexdigest() == os.environ['UNIT_LIST_SHA256']
              argv = ['_build/c/ouro1', 'check', units[-1], '999999']
              for unit in units:
                  argv.extend(['--unit', unit])
              checked = run('compiler-check', argv)
              assert checked.stdout == 'CHECK_OK\n' and 'CHECK_FAIL' not in checked.stderr
              passed = True
          except Exception as exc:
              failure = type(exc).__name__+': '+str(exc)
              raise
          finally:
              os.sched_setaffinity(0, allowed)
              manifest = {**source, 'pass': False, 'check_only': True, 'policy': policy,
                          'processes': records, 'failure': failure,
                          'host': json.loads((out/'host-proof.json').read_text())}
              write_json('manifest.json', manifest)
              after = bootstrap.current_inputs(Path.cwd(), build.load_config(argparse.Namespace()), build)
              write_json('current-inputs-after.json', after)
              integrity = {
                  'selected_inputs_unchanged': after == json.loads((out/'current-inputs-before.json').read_text()),
                  'compiler_unchanged': hashlib.sha256(Path('_build/c/ouro1').read_bytes()).hexdigest() == os.environ['HOST_BINARY_SHA256'],
                  'source_inputs_unchanged': all(hashlib.sha256(Path(row['path']).read_bytes()).hexdigest() == row['sha256'] for row in source['inputs']),
                  'tracked_tree_unchanged': not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).strip(),
                  'no_cache_files': not any(path.is_file() for path in Path('_cache').rglob('*')),
              }
              manifest.update(integrity=integrity, **{'pass': passed and all(integrity.values())})
              write_json('manifest.json', manifest)
              assert all(integrity.values()), integrity
          print('NATIVE_LOWER_PHASES: CHECK_OK units=172')
          PY
          sha256sum --check _build/ci/native-lower-memory/compiler.sha256

      - name: Preserve actual outcomes and phase traces on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-lower-memory-phases-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/ci/native-lower-memory/*.json
            _build/ci/native-lower-memory/*.stdout
            _build/ci/native-lower-memory/*.stderr
            _build/ci/native-lower-memory/*.rc
            _build/ci/native-lower-memory/*.sha256
            _build/ci/native-lower-memory/*.units
            _build/ci/native-lower-memory/*.sources
          if-no-files-found: error
          retention-days: 14
