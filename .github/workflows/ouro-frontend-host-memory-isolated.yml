name: Frontend host memory exact source (diagnostic)

on:
  push:
    branches: [codef/frontend-host-memory-isolated]
    paths:
      - .github/workflows/ouro-frontend-host-memory-isolated.yml

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  frontend-host:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact runtime candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 24095ed6a30409f3e84dd9e6d72896524592d5a3
          persist-credentials: false

      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = 24095ed6a30409f3e84dd9e6d72896524592d5a3
          test "$(git hash-object runtime/bootstrap.c)" = 5272a92d85d3f693407ec1f5d0e091fe461f8018

      - name: Download matching host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36303030441-1
          run-id: 36303030441
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install host compiler
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 e666dc8b2c37d1197316cb3db714aa01c0cd03a7ae2a1cde0e2fe9855b9f7403

      - name: Run unchanged frontend-security gate
        env:
          FRONTEND_SECURITY_OUT: _build/frontend_security
        run: sh scripts/frontend_security_suite.sh

      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-host-memory-24095ed
          path: |
            _build/frontend_security/**/*.json
            _build/frontend_security/**/*.log
            _build/frontend_security/**/*.out
            _build/frontend_security/**/*.err
            _build/frontend_security/**/*.stdout
            _build/frontend_security/**/*.stderr
          if-no-files-found: warn
          retention-days: 7
