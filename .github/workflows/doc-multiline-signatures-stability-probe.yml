name: Multiline documentation stability probe

on:
  push:
    branches: [codef/doc-multiline-signatures-stability-probe]
    paths: [.github/workflows/doc-multiline-signatures-stability-probe.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: doc-multiline-signatures-stability-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  PRODUCT_SHA: d8cccf959e422054a1823b9360fff118f8fd6b99
  SOURCE_SHA: 08ad2b0b8b4385fc0b12e01725468be6846f4540
  BASE_SHA: 83daa56fafb7aa56ffd5fa9ab687c2d867aa1ddf

jobs:
  doc-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Verify exact product lineage, source and generated bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/doc-multiline-signatures-stability-probe.yml
          test "$(git rev-parse "$PRODUCT_SHA^")" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^")" = "$BASE_SHA"
          git checkout --detach "$PRODUCT_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          product = os.environ["PRODUCT_SHA"]
          assert git("rev-parse", "HEAD") == product
          assert git("rev-parse", "HEAD^{tree}") == "16f21a97ad4db1bd3fcc4e422bf20655d76aa03b"
          assert not git("status", "--porcelain")
          changed_blobs = {
              "CHANGELOG.md": "d18098cebcdc4426c4b564c26edc6dc63223d2ab",
              "docs/api/README.md": "ce0cbc7f82c36872a72a23aa41e16ac96a6d9fb2",
              "docs/api/std_char.md": "3c913e348151fab08fd0c50f4d3619ffab42d900",
              "docs/api/std_cli.md": "ed83a99a9e2496405f4abe7f06ea02479357f195",
              "docs/api/std_collections.md": "a523d4aaf5f77921de084ef93b2ae6a6be8b61a3",
              "docs/api/std_configx.md": "e1bc72e9e22c2b183061146ae78c4c912a04f264",
              "docs/api/std_executable_model.md": "fd6fb53daf57dbaff9786880b992d967b95feb34",
              "docs/api/std_fs.md": "991afbe930280b99455f8168edb03ccae2530be9",
              "docs/api/std_fs_create_model.md": "665a712abcf4ea50f35aa9b5b44eee1d3a67bef6",
              "docs/api/std_fs_walk.md": "b53a5eafe56156939e61149a8d35783b5ee76d63",
              "docs/api/std_fsx.md": "ff5e99039e69c52025c1826a4efa7493909e8282",
              "docs/api/std_http.md": "832143288377b0ade3c332402e71821f2b977445",
              "docs/api/std_io.md": "38e06c59d0bc1ee530fdfdd0d6ad5e10c30ed270",
              "docs/api/std_iter.md": "ed532984799a2e648243e462813ab760a4dcb665",
              "docs/api/std_listx.md": "b981582360d7ba35c6e5cc47b230ec4ab896ac4e",
              "docs/api/std_map.md": "c6e416f9d8cfa173b15ccfc37ce26661da39f9a9",
              "docs/api/std_parse.md": "3f70fff2f6d028615c368c37159a57fbb6f5edf0",
              "docs/api/std_pathx.md": "b7013ef2a492cb83adbc9b1b3745056c79c311cb",
              "docs/api/std_process.md": "de4606da71353e05aaeec2f32047d5838b43aea5",
              "docs/api/std_processx.md": "8da338eb19722286159514693f0b5faee743c558",
              "docs/api/std_range.md": "f6f4403d52e0f335b5528b085ab1be758025765e",
              "docs/api/std_result.md": "747a03381856319657a68f68d183c0f9ace2508b",
              "docs/api/std_runtime.md": "c3711098b552a0522af88c7cbc86c703acb2e4eb",
              "docs/api/std_table.md": "a499dcfd72bb7e19236ece759f97af056f960893",
              "scripts/lsp_suite.sh": "a9f4e9817bc245ee152433ebb9c79cc1a70f6747",
              "scripts/ourosmith/native_inputs.py": "7279f4e6d4214125a91adfddd46c665f6a1c6657",
              "scripts/ourosmith/surface/doc_contract.py": "85273546239acbe383ffdc6ec651043d5b02bb76",
              "scripts/ourosmith/surface/tools.py": "3a036a6b815f0e20577b92da6a4247ac053b28bc",
              "tools/doc_model.ouro": "9834824946d30df7285cea37986d4eb973fae83c",
          }
          owner_blobs = {
              "tools/doc.ouro": "f06d09e1d39dc2af90df091d38e9684018b2eff3",
              "scripts/doc_suite.sh": "4a132cc94e774775957cba4ea2b0ec3a5ee3c7fd",
              "scripts/ci_gate.py": "16ea86bf60a3d3347c30af2f562a6b6b500b89ef",
              "scripts/ouro1.sh": "9665ebb00049d05c097a29d77ec5083b524f9e2d",
              "scripts/bootstrap_compiler.py": "937f93c11a055e42c0ecb22f8c10fce2d748817c",
              "scripts/native_tool_build.py": "0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce",
              "scripts/build_tool.sh": "ff83eec44937a8d9aa37c5af67aae2d57b93f4c3",
              "Ouro.seal": "f078fbe47670a948c96a1d8076761c2140455bbe",
              "scripts/ouro_smith.py": "e3ee39185a464afc28c269965cc940a14cde896a",
              "scripts/ourosmith/__init__.py": "caab58b443774a9a443c8682ccf1a167297f8f1f",
              "scripts/ourosmith/surface/gen.py": "eca764ccafa340f46cc065b1af805540fec49981",
              "scripts/python.sh": "10aa75dd1d4497cb90a1a7d225ff709cf60a4dd1",
              "tests/analyze/precision/absint.ouro": "e5e66a5704ef912e91d00987e9766b519514de3b",
          }
          paths = git("diff", "--name-only", os.environ["BASE_SHA"], product).splitlines()
          assert len(paths) == 29 and paths == sorted(changed_blobs), paths
          assert git("diff", "--name-only", os.environ["SOURCE_SHA"], product).splitlines() == sorted(
              path for path in changed_blobs if path.startswith("docs/api/"))
          for path, blob in {**changed_blobs, **owner_blobs}.items():
              assert git("hash-object", path) == blob, path
          generated = {
              path: {"sha256": hashlib.sha256(Path(path).read_bytes()).hexdigest(), "blob": git("hash-object", path)}
              for path in git("ls-files", "--", "docs/api").splitlines()}
          assert len(generated) == 70 and "docs/api/README.md" in generated
          sources = [{"path": path, "sha256": hashlib.sha256(Path(path).read_bytes()).hexdigest(),
                      "blob": git("hash-object", path)} for path in git("ls-files", "--", "std").splitlines()
                     if path.endswith(".ouro")]
          assert len(sources) == 69
          out = Path("_build/ci/doc-stability")
          out.mkdir(parents=True, exist_ok=True)
          report = {"workflow_sha": os.environ["GITHUB_SHA"], "product_sha": product,
              "source_sha": os.environ["SOURCE_SHA"], "base_sha": os.environ["BASE_SHA"],
              "changed_paths": paths, "changed_blobs": changed_blobs, "owner_blobs": owner_blobs,
              "generated_before": generated, "std_sources": sources,
              "host_run": 36357871841, "host_artifact": 10945092404,
              "compiler_archive_sha256": "3435db2adf6ab885c4279e56f2b2d24e0f54117cb997784bf12fdbe52567044d"}
          (out / "source.json").write_text(json.dumps(report, indent=2) + "\n")
          print("DOC_SOURCE: PASS exact29 paths,70 generated SHA/blobs,69 std sources")
          PY
      - name: Download official verified matching Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10945092404
          run-id: 36357871841
          github-token: ${{ github.token }}
          path: _build/ci
          merge-multiple: true
      - name: Verify unchanged compiler inputs and canonical import
        run: |
          set -euo pipefail
          python3 scripts/ci_gate.py --compiler-artifact key >_build/ci/doc-stability/key.stdout
          grep -Fx 'key=321c369d5ad5efe4b8c26cbd47c80973a223f750189a4bf0fe3d9814041ad428' _build/ci/doc-stability/key.stdout
          python3 scripts/ci_gate.py --compiler-artifact import \
            --compiler-sha256 3435db2adf6ab885c4279e56f2b2d24e0f54117cb997784bf12fdbe52567044d \
            >_build/ci/doc-stability/import.stdout 2>_build/ci/doc-stability/import.stderr
          cat _build/ci/doc-stability/import.stdout
          cat _build/ci/doc-stability/import.stderr >&2
          echo 'f3ff7228e72b20d4c065ea079e6716dcb4012280e203123900383b444916f5e7  _build/c/ouro1' | sha256sum -c -
      - name: Run canonical documentation suite without regeneration
        id: doc_check
        run: |
          set -euo pipefail
          set +e
          DOC_SUITE_OUT=_build/doc_stability /usr/bin/time -v -o _build/ci/doc-stability/doc-time.txt \
            sh scripts/doc_suite.sh >_build/ci/doc-stability/doc.stdout 2>_build/ci/doc-stability/doc.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/doc-stability/doc.rc
          cat _build/ci/doc-stability/doc.stdout
          cat _build/ci/doc-stability/doc.stderr >&2
          test "$rc" -eq 0
      - name: Require exact five-row verdict and no tracked drift
        if: ${{ always() && steps.doc_check.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, hashlib, json, subprocess
          out = Path("_build/ci/doc-stability")
          source = json.loads((out / "source.json").read_text())
          generated = {path: {"sha256": hashlib.sha256(Path(path).read_bytes()).hexdigest(),
              "blob": subprocess.check_output(["git", "hash-object", path], text=True).strip()}
              for path in subprocess.check_output(["git", "ls-files", "--", "docs/api"], text=True).splitlines()}
          drift = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          (out / "tracked-drift.patch").write_bytes(subprocess.check_output(["git", "diff", "--binary"]))
          result = {"command": "DOC_SUITE_OUT=_build/doc_stability sh scripts/doc_suite.sh",
              "doc_suite_rc": int((out / "doc.rc").read_text()), "tracked_drift": drift,
              "generated_after": generated, "generated_unchanged": generated == source["generated_before"]}
          (out / "result.json").write_text(json.dumps(result, indent=2) + "\n")
          assert result["doc_suite_rc"] == 0
          assert result["generated_unchanged"] and not drift
          assert not subprocess.check_output(["git", "status", "--porcelain"], text=True).strip()
          assert hashlib.sha256(Path("_build/c/ouro1").read_bytes()).hexdigest() == "f3ff7228e72b20d4c065ea079e6716dcb4012280e203123900383b444916f5e7"
          names = Path("_build/doc_stability/std.list").read_text().splitlines()
          assert names == sorted(row["path"] for row in source["std_sources"])
          rows = list(csv.DictReader(Path("_build/doc_stability/selftest-report.tsv").read_text().splitlines(), delimiter="\t"))
          assert [row["name"] for row in rows] == ["fixture", "missing-file", "missing-files-from", "files-from", "api modules=69"]
          assert all(row["pass"] == "true" and not row["issue"] for row in rows)
          print("DOC_STABILITY: PASS exact69 modules/5 rows and unchanged70 generated outputs/source tree")
          PY
          grep -Fx 'DOC_OK api modules=69' _build/ci/doc-stability/doc.stdout
          grep -E '^DOC_SUITE: PASS rows=5 out=' _build/ci/doc-stability/doc.stdout
          test ! -s _build/ci/doc-stability/doc.stderr
          ! grep -E 'DOC_SUITE: SKIP|DOC_SUITE: FAIL|DOC_REGEN' _build/ci/doc-stability/doc.stdout _build/ci/doc-stability/doc.stderr
      - name: Upload canonical suite and stability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-multiline-stability-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            _build/ci/doc-stability
            _build/doc_stability/*.log
            _build/doc_stability/*.diff
            _build/doc_stability/*.tsv
            _build/doc_stability/*.list
