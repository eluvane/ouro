name: Where local helper acceptance probe

on:
  push:
    branches: [ codef/where-local-helpers-probe ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: where-local-helpers-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  host-compiler:
    name: Matching Where Host compiler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Verify reviewed product and retained base
        run: |
          test "$(git rev-parse HEAD^)" = 1e4c9a2746628c1bd68a9e3eecb7dda7050cc213
          test "$(git rev-parse HEAD^^)" = 973c3a21342e9d6e029479fb33ed7207d010c1bd
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/where-local-helpers-probe.yml
          python3 - <<'PY'
          import json, subprocess
          expected = json.loads('["CHANGELOG.md", "compiler/parse_a.ouro", "compiler/parse_b.ouro", "compiler/parser_parse.ouro", "compiler/source_spans.ouro", "docs/language/ergonomic-syntax.md", "docs/syntax.md", "scripts/language_ergonomics_suite.py", "tests/language_ergonomics/cases.json", "tests/language_ergonomics/where_parser_laws.ouro", "tests/source_span_tests.ouro", "tools/test/suites.ouro"]')
          actual = subprocess.check_output(['git', 'diff', '--name-only', '973c3a21342e9d6e029479fb33ed7207d010c1bd', '1e4c9a2746628c1bd68a9e3eecb7dda7050cc213'], text=True).splitlines()
          assert actual == expected, (actual, expected)
          PY
          test "$(git hash-object CHANGELOG.md)" = 818642b457620d12f3822743b6090a944b48deb7
          test "$(git hash-object compiler/parse_a.ouro)" = 95c9be35ed61ed03d054316fdc9922058add3130
          test "$(git hash-object compiler/parse_b.ouro)" = 7081b010e9d28ac00049b59f25dc3eb48bec4ae2
          test "$(git hash-object compiler/parser_parse.ouro)" = ed14a19699c080c3a665369cce4b3685ee820106
          test "$(git hash-object compiler/source_spans.ouro)" = 9a9875d310f8db74e49e64c2344d2a3b28ae406e
          test "$(git hash-object docs/language/ergonomic-syntax.md)" = b1e622a55f2511b045758f710a2326ee2a005ccc
          test "$(git hash-object docs/syntax.md)" = d77afcd982573f6ab0511de234699db1939b8a83
          test "$(git hash-object scripts/language_ergonomics_suite.py)" = 43b75c10e7327aa5a5d4e0924ae3dfbdbee1c0d4
          test "$(git hash-object tests/language_ergonomics/cases.json)" = 2205b24fcf5d137cc7329c9a448603e7577b7a21
          test "$(git hash-object tests/language_ergonomics/where_parser_laws.ouro)" = ad537c52e77f38072a57cf48fb2671be1d9e8ccb
          test "$(git hash-object tests/source_span_tests.ouro)" = 9a8ffc7735f2d75d20740413a6f9c280c5ccff5d
          test "$(git hash-object tools/test/suites.ouro)" = 4c17fe0be13ce2d9a20c9bd0348e10e25a1a52f6
          test "$(git hash-object compiler/lexer.ouro)" = b73355a657c9cd09dd83d26c36eb128cfe004207
          test "$(git hash-object compiler/module_registry.ouro)" = e84c2d27c597e5e3617e9b1466983862acdb78e8
          test "$(git hash-object compiler/preprocess_record.ouro)" = b6e825c025838490e072ce4c6f08af47d72a0307
          test "$(git hash-object compiler/preprocess_record_text.ouro)" = 4d4ebb46a8f8a8c27d319906d2cd638fa4b6e78a
          test "$(git hash-object docs/tcb.md)" = 725c3c038f60f5816cb1523ded225041ab093e4b
          test "$(git hash-object quality/memory_budgets.json)" = 9257b185a175b64474d9c014086771035ac8394f
          python3 - <<'PY'
          from pathlib import Path
          import json, sys
          sys.path.insert(0, 'scripts')
          import ci_gate
          inventory = ci_gate.compiler_fixture_roots(Path.cwd())
          assert 'tests/language_ergonomics/where_parser_laws.ouro' in ci_gate.compiler_shard_entries(inventory, 6)
          assert ci_gate.compiler_shard_entries(inventory, 16) == ['tests/source_span_tests.ouro']
          assert json.loads(Path('quality/memory_budgets.json').read_text())['budgets']['strict-quality-gate']['peak_rss_kb'] == 1024000
          PY

      - name: Build fresh matching Host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Export verified Host and bootstrap evidence
        id: bundle
        run: |
          python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"
          echo "artifact=where-host-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload verified Host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/ci/host-compiler.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Host reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-host-reports-${{ github.run_id }}
          path: |
            _build/c/ouro1.bootstrap.json
            _build/bootstrap/**/*.json
            _build/bootstrap/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  acceptance:
    name: "Where (${{ matrix.group }})"
    needs: host-compiler
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [ native-where, compiler-6, compiler-16, ergonomics, strict ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Verify reviewed product and retained base
        run: |
          test "$(git rev-parse HEAD^)" = 1e4c9a2746628c1bd68a9e3eecb7dda7050cc213
          test "$(git rev-parse HEAD^^)" = 973c3a21342e9d6e029479fb33ed7207d010c1bd
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/where-local-helpers-probe.yml
          python3 - <<'PY'
          import json, subprocess
          expected = json.loads('["CHANGELOG.md", "compiler/parse_a.ouro", "compiler/parse_b.ouro", "compiler/parser_parse.ouro", "compiler/source_spans.ouro", "docs/language/ergonomic-syntax.md", "docs/syntax.md", "scripts/language_ergonomics_suite.py", "tests/language_ergonomics/cases.json", "tests/language_ergonomics/where_parser_laws.ouro", "tests/source_span_tests.ouro", "tools/test/suites.ouro"]')
          actual = subprocess.check_output(['git', 'diff', '--name-only', '973c3a21342e9d6e029479fb33ed7207d010c1bd', '1e4c9a2746628c1bd68a9e3eecb7dda7050cc213'], text=True).splitlines()
          assert actual == expected, (actual, expected)
          PY
          test "$(git hash-object CHANGELOG.md)" = 818642b457620d12f3822743b6090a944b48deb7
          test "$(git hash-object compiler/parse_a.ouro)" = 95c9be35ed61ed03d054316fdc9922058add3130
          test "$(git hash-object compiler/parse_b.ouro)" = 7081b010e9d28ac00049b59f25dc3eb48bec4ae2
          test "$(git hash-object compiler/parser_parse.ouro)" = ed14a19699c080c3a665369cce4b3685ee820106
          test "$(git hash-object compiler/source_spans.ouro)" = 9a9875d310f8db74e49e64c2344d2a3b28ae406e
          test "$(git hash-object docs/language/ergonomic-syntax.md)" = b1e622a55f2511b045758f710a2326ee2a005ccc
          test "$(git hash-object docs/syntax.md)" = d77afcd982573f6ab0511de234699db1939b8a83
          test "$(git hash-object scripts/language_ergonomics_suite.py)" = 43b75c10e7327aa5a5d4e0924ae3dfbdbee1c0d4
          test "$(git hash-object tests/language_ergonomics/cases.json)" = 2205b24fcf5d137cc7329c9a448603e7577b7a21
          test "$(git hash-object tests/language_ergonomics/where_parser_laws.ouro)" = ad537c52e77f38072a57cf48fb2671be1d9e8ccb
          test "$(git hash-object tests/source_span_tests.ouro)" = 9a8ffc7735f2d75d20740413a6f9c280c5ccff5d
          test "$(git hash-object tools/test/suites.ouro)" = 4c17fe0be13ce2d9a20c9bd0348e10e25a1a52f6
          test "$(git hash-object compiler/lexer.ouro)" = b73355a657c9cd09dd83d26c36eb128cfe004207
          test "$(git hash-object compiler/module_registry.ouro)" = e84c2d27c597e5e3617e9b1466983862acdb78e8
          test "$(git hash-object compiler/preprocess_record.ouro)" = b6e825c025838490e072ce4c6f08af47d72a0307
          test "$(git hash-object compiler/preprocess_record_text.ouro)" = 4d4ebb46a8f8a8c27d319906d2cd638fa4b6e78a
          test "$(git hash-object docs/tcb.md)" = 725c3c038f60f5816cb1523ded225041ab093e4b
          test "$(git hash-object quality/memory_budgets.json)" = 9257b185a175b64474d9c014086771035ac8394f
          python3 - <<'PY'
          from pathlib import Path
          import json, sys
          sys.path.insert(0, 'scripts')
          import ci_gate
          inventory = ci_gate.compiler_fixture_roots(Path.cwd())
          assert 'tests/language_ergonomics/where_parser_laws.ouro' in ci_gate.compiler_shard_entries(inventory, 6)
          assert ci_gate.compiler_shard_entries(inventory, 16) == ['tests/source_span_tests.ouro']
          assert json.loads(Path('quality/memory_budgets.json').read_text())['budgets']['strict-quality-gate']['peak_rss_kb'] == 1024000
          PY

      - name: Download matching verified Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.host-compiler.outputs.artifact }}
          path: _build/ci

      - name: Verify and install source-bound Host
        env:
          COMPILER_SHA256: ${{ needs.host-compiler.outputs.sha256 }}
        run: |
          mkdir -p _build/where_probe
          rc=0
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256" >_build/where_probe/import.stdout 2>_build/where_probe/import.stderr || rc=$?
          printf '%s\n' "$rc" >_build/where_probe/import.rc
          cat _build/where_probe/import.stdout
          cat _build/where_probe/import.stderr >&2
          test "$rc" -eq 0

      - name: Run retained acceptance gate
        env:
          PROBE_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p _build/where_probe
          run_logged() {
            probe_label=$1
            shift
            probe_status=0
            "$@" >"_build/where_probe/$probe_label.stdout" 2>"_build/where_probe/$probe_label.stderr" || probe_status=$?
            printf '%s\n' "$probe_status" >"_build/where_probe/$probe_label.rc"
            cat "_build/where_probe/$probe_label.stdout"
            cat "_build/where_probe/$probe_label.stderr" >&2
            return "$probe_status"
          }
          case "$PROBE_GROUP" in
            native-where)
              ulimit -s 131072
              run_logged native-check sh scripts/ouro1.sh check tests/language_ergonomics/where_parser_laws.ouro 200000
              grep -Fxq CHECK_OK _build/where_probe/native-check.stdout
              test ! -s _build/where_probe/native-check.stderr
              OURO_BUILD_TOOL_MODE=native run_logged native-build sh scripts/build_tool.sh tests/language_ergonomics/where_parser_laws.ouro _build/c/where-parser-laws 60000
              run_logged native-run _build/c/where-parser-laws
              printf 'ERGO_WHERE_PARSER_OK\n' | cmp - _build/where_probe/native-run.stdout
              test ! -s _build/where_probe/native-run.stderr
              ;;
            compiler-6|compiler-16)
              run_logged "$PROBE_GROUP" python3 scripts/ci_gate.py --profile pr --group "$PROBE_GROUP" --fail-fast --out "_build/ci/where-$PROBE_GROUP"
              ;;
            ergonomics)
              run_logged ergonomics python3 scripts/ouro_smith.py manifest --prefix=ERGO.,REC. --out=_build/ergonomics_suite --label=ERGONOMICS_SUITE
              ;;
            strict)
              run_logged strict python3 scripts/memory_budget_suite.py --case strict-quality-gate --out _build/memory
              ;;
            *) exit 2 ;;
          esac

      - name: Upload complete acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-${{ matrix.group }}-${{ github.run_id }}
          path: |
            _build/where_probe/
            _build/ci/where-*/
            _build/compiler_check_suite_6/
            _build/compiler_check_suite_16/
            _build/ergonomics_suite/
            _build/memory/
            _build/c/ouro1.bootstrap.json
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.err
            _build/**/*.stdout
            _build/**/*.stderr
            _build/**/*.sarif
            _build/**/*.md
          if-no-files-found: error
          retention-days: 14
