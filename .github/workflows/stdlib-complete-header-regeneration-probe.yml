name: Upstream focused stdlib complete-header regeneration
'on':
  push:
    branches:
    - codef/stdlib-complete-header-regeneration-probe
    paths:
    - .github/workflows/stdlib-complete-header-regeneration-probe.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: stdlib-complete-header-regeneration-probe
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  OURO_CI: '1'
  OURO_REPRODUCIBLE: '1'
  OURO_PACK_STRICT: '1'
  OURO_BUILD_TOOL_MODE: native
  OURO_JOBS: '1'
  OURO_FRONTEND_JOBS: '1'
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
jobs:
  coordinator:
    name: Workflow-only coordinator guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout diagnostic child
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Require exact combined parent and one workflow-only delta
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse HEAD^)" = f76607e330175895551791d2860a5da3498e8680
        test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/stdlib-complete-header-regeneration-probe.yml
        git diff --check HEAD^ HEAD
  host-maybe:
    name: Fresh Maybe Host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
    - name: Checkout exact focused source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 40fa9cf98f767ebc1b70a33214ffa7999acbd835
        fetch-depth: 2
        persist-credentials: false
    - name: Guard exact source and all 69 std inputs
      run: |
        python3 - <<'PY'
        feature = 'maybe'
        import hashlib, json, subprocess
        from pathlib import Path
        expected = {
            'maybe': {'sha': '40fa9cf98f767ebc1b70a33214ffa7999acbd835',
                      'tree': '6b5f94cffea2bce68477e6c855b4c75ed70837ff',
                      'module': 'std/data.ouro',
                      'std_sha256': '129376092f5d4b19b9dd87af1c61522566277df93faa5d1319d1dc2ad1b92cc3'},
            'iter': {'sha': '0d5662639983756b6f528f9ae96ac8ace19b1a2e',
                     'tree': '88cdb3cc525f4af06d38c685b4249be4b3735ce2',
                     'module': 'std/iter.ouro',
                     'std_sha256': '45b2cff4eca39c9d0a823f31bee21af3d6da6f5adaf44943ca4cfa6656c9febb'},
        }
        meta = expected[feature]
        def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
        assert git('rev-parse', 'HEAD') == meta['sha']
        assert git('rev-parse', 'HEAD^{tree}') == meta['tree']
        assert git('rev-parse', 'HEAD^') == '8229d98d3ab32f667f706d41b08616a7e1acb9a3'
        paths = git('diff', '--name-only', 'HEAD^', 'HEAD').splitlines()
        assert paths == ['CHANGELOG.md', 'docs/practical_stdlib.md', meta['module'],
                         'tests/practical_stdlib_tests.ouro'], paths
        assert not git('status', '--porcelain', '--untracked-files=no')
        blobs = {
            'scripts/api_baseline_regen.py': '3fde14909a852897117000207e445ed88906baba',
            'scripts/api_baseline_regen_test.py': '0528a766c8150644bc3ccbb0fee10659c6cee624',
            'scripts/analyze_bounded.py': '5563831d110465df780cb0cfc54f1b650ac68ee9',
            'tools/doc_model.ouro': '9834824946d30df7285cea37986d4eb973fae83c',
            'scripts/ourosmith/surface/doc_contract.py': '85273546239acbe383ffdc6ec651043d5b02bb76',
            'scripts/lsp_suite.sh': 'a9f4e9817bc245ee152433ebb9c79cc1a70f6747',
            'scripts/bootstrap_compiler.py': '937f93c11a055e42c0ecb22f8c10fce2d748817c',
            'scripts/ci_gate.py': '16ea86bf60a3d3347c30af2f562a6b6b500b89ef',
        }
        for path, digest in blobs.items(): assert git('rev-parse', 'HEAD:'+path) == digest, path
        sources = sorted(Path('std').rglob('*.ouro'))
        assert len(sources) == 69
        manifest = ''.join(path.as_posix()+'\t'+hashlib.sha256(path.read_bytes()).hexdigest()+'\n'
                           for path in sources)
        assert hashlib.sha256(manifest.encode()).hexdigest() == meta['std_sha256']
        report = Path('_build/ci/stdlib-regen')
        report.mkdir(parents=True, exist_ok=True)
        (report/'source.json').write_text(json.dumps({**meta, 'feature': feature,
            'base_sha': '973c3a21342e9d6e029479fb33ed7207d010c1bd', 'std_sources':69,
            'source_paths':paths, 'owner_blobs':blobs}, indent=2)+'\n')
        print('SOURCE_BOUND: PASS feature='+feature+' std_sources=69')
        PY
    - name: Require system C compiler
      run: |
        command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1
    - name: Record fresh compiler input key
      run: |
        python3 scripts/ci_gate.py --compiler-artifact key > _build/ci/stdlib-regen/key.stdout
        cat _build/ci/stdlib-regen/key.stdout
    - name: Build and verify fresh source-bound Host P1/P2, ABI and negative protocol
      id: host
      run: |
        python3 scripts/ouro_build.py build --verbosity quiet
    - name: Record exact 177 inputs, stage equality and binary SHA
      run: |
        python3 - <<'PY'
        feature = 'maybe'
        import hashlib, json
        from pathlib import Path
        receipt = json.loads(Path('_build/c/ouro1.bootstrap.json').read_text())
        selected = receipt['selected']
        assert receipt['kind'] == 'ouro.current-c-bootstrap.v1'
        assert len(selected['sources']) == 177 and len(selected['stage0']) == 2
        assert 'std/iter.ouro' not in selected['sources']
        for inputs in (selected['sources'], selected['stage0']):
            for name, expected in inputs.items():
                assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
        data_sha = selected['sources']['std/data.ouro']
        assert data_sha == ({'maybe':'aa251c559049440db1d2232683d6e90abc78304e44ca913083db36d19591ac85',
                             'iter':'7745331213e166b933cdf79b4e50cf0125bc616891cfb41232647dbae8f941c2'}[feature])
        if feature == 'iter':
            assert receipt['key'] == 'f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c'
            assert receipt['binary_sha256'] == '460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c'
        else:
            assert receipt['key'] != 'f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c'
        report = json.loads((Path(receipt['work'])/'report.json').read_text())
        assert report['pass'] and not report['changed_inputs']
        comparisons = report['complete_generated_c_comparison']
        assert set(comparisons) == {'driver_u.c','backend_u.c'}
        for row in comparisons.values(): assert row['p1_sha256'] == row['p2_sha256']
        Path('_build/ci/stdlib-regen/compiler-inputs.json').write_text(json.dumps({
            'feature':feature,'key':receipt['key'],'binary_sha256':receipt['binary_sha256'],
            'sources':selected['sources'],'stage0':selected['stage0'],
            'complete_generated_c_comparison':comparisons}, indent=2,sort_keys=True)+'\n')
        print('HOST_RECEIPT: PASS feature='+feature+' sources=177 stage0=2')
        PY
        sha256sum _build/c/ouro1 > _build/ci/stdlib-regen/compiler.sha256
    - name: Export verified compiler for this source snapshot
      id: bundle
      run: |
        python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"
        echo "artifact=stdlib-host-maybe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: Upload workflow-local verified Host
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.bundle.outputs.artifact }}
        path: _build/ci/host-compiler.tar.gz
        compression-level: 0
        if-no-files-found: error
        retention-days: 14
    - name: Upload source, bootstrap and suite reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: stdlib-host-maybe-reports-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          _build/ci/stdlib-regen/*.json
          _build/ci/stdlib-regen/*.stdout
          _build/ci/stdlib-regen/*.stderr
          _build/ci/stdlib-regen/*.sha256
          _build/c/ouro1.bootstrap.json
          _build/bootstrap/**/report.json
          _build/bootstrap/**/inputs.json
          _build/bootstrap/**/abi-laws.stdout
          _build/bootstrap/**/abi-laws.stderr
          _build/bootstrap/**/behavior-good.stdout
          _build/bootstrap/**/behavior-good.stderr
          _build/bootstrap/**/behavior-bad.stdout
          _build/bootstrap/**/behavior-bad.stderr
          _build/doc_suite/**/*.tsv
          _build/doc_suite/**/*.log
          _build/doc_suite/**/*.diff
          _build/lsp_suite/**/*.log
          _build/lsp_suite/**/*.out
          _build/lsp_suite/**/*.err
          _build/samples_suite/**/*.tsv
          _build/samples_suite/**/*.json
          _build/samples_suite/**/*.out
          _build/samples_suite/**/*.err
          _build/samples_suite/**/*.log
        if-no-files-found: error
        retention-days: 14
    needs: coordinator
  host-iter:
    name: Matching official Iter Host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
    - name: Checkout exact focused source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 0d5662639983756b6f528f9ae96ac8ace19b1a2e
        fetch-depth: 2
        persist-credentials: false
    - name: Guard exact source and all 69 std inputs
      run: |
        python3 - <<'PY'
        feature = 'iter'
        import hashlib, json, subprocess
        from pathlib import Path
        expected = {
            'maybe': {'sha': '40fa9cf98f767ebc1b70a33214ffa7999acbd835',
                      'tree': '6b5f94cffea2bce68477e6c855b4c75ed70837ff',
                      'module': 'std/data.ouro',
                      'std_sha256': '129376092f5d4b19b9dd87af1c61522566277df93faa5d1319d1dc2ad1b92cc3'},
            'iter': {'sha': '0d5662639983756b6f528f9ae96ac8ace19b1a2e',
                     'tree': '88cdb3cc525f4af06d38c685b4249be4b3735ce2',
                     'module': 'std/iter.ouro',
                     'std_sha256': '45b2cff4eca39c9d0a823f31bee21af3d6da6f5adaf44943ca4cfa6656c9febb'},
        }
        meta = expected[feature]
        def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
        assert git('rev-parse', 'HEAD') == meta['sha']
        assert git('rev-parse', 'HEAD^{tree}') == meta['tree']
        assert git('rev-parse', 'HEAD^') == '8229d98d3ab32f667f706d41b08616a7e1acb9a3'
        paths = git('diff', '--name-only', 'HEAD^', 'HEAD').splitlines()
        assert paths == ['CHANGELOG.md', 'docs/practical_stdlib.md', meta['module'],
                         'tests/practical_stdlib_tests.ouro'], paths
        assert not git('status', '--porcelain', '--untracked-files=no')
        blobs = {
            'scripts/api_baseline_regen.py': '3fde14909a852897117000207e445ed88906baba',
            'scripts/api_baseline_regen_test.py': '0528a766c8150644bc3ccbb0fee10659c6cee624',
            'scripts/analyze_bounded.py': '5563831d110465df780cb0cfc54f1b650ac68ee9',
            'tools/doc_model.ouro': '9834824946d30df7285cea37986d4eb973fae83c',
            'scripts/ourosmith/surface/doc_contract.py': '85273546239acbe383ffdc6ec651043d5b02bb76',
            'scripts/lsp_suite.sh': 'a9f4e9817bc245ee152433ebb9c79cc1a70f6747',
            'scripts/bootstrap_compiler.py': '937f93c11a055e42c0ecb22f8c10fce2d748817c',
            'scripts/ci_gate.py': '16ea86bf60a3d3347c30af2f562a6b6b500b89ef',
        }
        for path, digest in blobs.items(): assert git('rev-parse', 'HEAD:'+path) == digest, path
        sources = sorted(Path('std').rglob('*.ouro'))
        assert len(sources) == 69
        manifest = ''.join(path.as_posix()+'\t'+hashlib.sha256(path.read_bytes()).hexdigest()+'\n'
                           for path in sources)
        assert hashlib.sha256(manifest.encode()).hexdigest() == meta['std_sha256']
        report = Path('_build/ci/stdlib-regen')
        report.mkdir(parents=True, exist_ok=True)
        (report/'source.json').write_text(json.dumps({**meta, 'feature': feature,
            'base_sha': '973c3a21342e9d6e029479fb33ed7207d010c1bd', 'std_sources':69,
            'source_paths':paths, 'owner_blobs':blobs}, indent=2)+'\n')
        print('SOURCE_BOUND: PASS feature='+feature+' std_sources=69')
        PY
    - name: Require system C compiler
      run: |
        command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1
    - name: Require identical official Linux compiler input key
      run: |
        python3 scripts/ci_gate.py --compiler-artifact key > _build/ci/stdlib-regen/key.stdout
        test "$(cat _build/ci/stdlib-regen/key.stdout)" = key=f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c
    - name: Download official matching Host artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: 10946340921
        run-id: 36360415225
        github-token: ${{ github.token }}
        path: _build/ci
        merge-multiple: true
    - name: Verify and install official Host with current-input verifier
      id: host
      run: |
        python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7
    - name: Record exact 177 inputs, stage equality and binary SHA
      run: |
        python3 - <<'PY'
        feature = 'iter'
        import hashlib, json
        from pathlib import Path
        receipt = json.loads(Path('_build/c/ouro1.bootstrap.json').read_text())
        selected = receipt['selected']
        assert receipt['kind'] == 'ouro.current-c-bootstrap.v1'
        assert len(selected['sources']) == 177 and len(selected['stage0']) == 2
        assert 'std/iter.ouro' not in selected['sources']
        for inputs in (selected['sources'], selected['stage0']):
            for name, expected in inputs.items():
                assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
        data_sha = selected['sources']['std/data.ouro']
        assert data_sha == ({'maybe':'aa251c559049440db1d2232683d6e90abc78304e44ca913083db36d19591ac85',
                             'iter':'7745331213e166b933cdf79b4e50cf0125bc616891cfb41232647dbae8f941c2'}[feature])
        if feature == 'iter':
            assert receipt['key'] == 'f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c'
            assert receipt['binary_sha256'] == '460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c'
        else:
            assert receipt['key'] != 'f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c'
        report = json.loads((Path(receipt['work'])/'report.json').read_text())
        assert report['pass'] and not report['changed_inputs']
        comparisons = report['complete_generated_c_comparison']
        assert set(comparisons) == {'driver_u.c','backend_u.c'}
        for row in comparisons.values(): assert row['p1_sha256'] == row['p2_sha256']
        Path('_build/ci/stdlib-regen/compiler-inputs.json').write_text(json.dumps({
            'feature':feature,'key':receipt['key'],'binary_sha256':receipt['binary_sha256'],
            'sources':selected['sources'],'stage0':selected['stage0'],
            'complete_generated_c_comparison':comparisons}, indent=2,sort_keys=True)+'\n')
        print('HOST_RECEIPT: PASS feature='+feature+' sources=177 stage0=2')
        PY
        sha256sum _build/c/ouro1 > _build/ci/stdlib-regen/compiler.sha256
    - name: Export verified compiler for this source snapshot
      id: bundle
      run: |
        python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"
        echo "artifact=stdlib-host-iter-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: Upload workflow-local verified Host
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.bundle.outputs.artifact }}
        path: _build/ci/host-compiler.tar.gz
        compression-level: 0
        if-no-files-found: error
        retention-days: 14
    - name: Upload source, bootstrap and suite reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: stdlib-host-iter-reports-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          _build/ci/stdlib-regen/*.json
          _build/ci/stdlib-regen/*.stdout
          _build/ci/stdlib-regen/*.stderr
          _build/ci/stdlib-regen/*.sha256
          _build/c/ouro1.bootstrap.json
          _build/bootstrap/**/report.json
          _build/bootstrap/**/inputs.json
          _build/bootstrap/**/abi-laws.stdout
          _build/bootstrap/**/abi-laws.stderr
          _build/bootstrap/**/behavior-good.stdout
          _build/bootstrap/**/behavior-good.stderr
          _build/bootstrap/**/behavior-bad.stdout
          _build/bootstrap/**/behavior-bad.stderr
          _build/doc_suite/**/*.tsv
          _build/doc_suite/**/*.log
          _build/doc_suite/**/*.diff
          _build/lsp_suite/**/*.log
          _build/lsp_suite/**/*.out
          _build/lsp_suite/**/*.err
          _build/samples_suite/**/*.tsv
          _build/samples_suite/**/*.json
          _build/samples_suite/**/*.out
          _build/samples_suite/**/*.err
          _build/samples_suite/**/*.log
        if-no-files-found: error
        retention-days: 14
    needs: coordinator
  focused:
    name: ${{ matrix.feature }} / ${{ matrix.suite }}
    needs:
    - coordinator
    - host-maybe
    - host-iter
    if: ${{ always() && needs.coordinator.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        feature:
        - maybe
        - iter
        suite:
        - regeneration
        - practical
        - samples-1
        - samples-2
    env:
      FEATURE: ${{ matrix.feature }}
      SUITE: ${{ matrix.suite }}
      HOST_RESULT: ${{ matrix.feature == 'maybe' && needs.host-maybe.result || needs.host-iter.result }}
      COMPILER_SHA256: ${{ matrix.feature == 'maybe' && needs.host-maybe.outputs.sha256 || needs.host-iter.outputs.sha256
        }}
    steps:
    - name: Checkout exact focused source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ matrix.feature == 'maybe' && '40fa9cf98f767ebc1b70a33214ffa7999acbd835' || '0d5662639983756b6f528f9ae96ac8ace19b1a2e'
          }}
        fetch-depth: 2
        persist-credentials: false
    - name: Guard exact focused source and std inventory
      id: source
      run: |
        python3 - <<'PY'
        import os
        feature = os.environ['FEATURE']
        import hashlib, json, subprocess
        from pathlib import Path
        expected = {
            'maybe': {'sha': '40fa9cf98f767ebc1b70a33214ffa7999acbd835',
                      'tree': '6b5f94cffea2bce68477e6c855b4c75ed70837ff',
                      'module': 'std/data.ouro',
                      'std_sha256': '129376092f5d4b19b9dd87af1c61522566277df93faa5d1319d1dc2ad1b92cc3'},
            'iter': {'sha': '0d5662639983756b6f528f9ae96ac8ace19b1a2e',
                     'tree': '88cdb3cc525f4af06d38c685b4249be4b3735ce2',
                     'module': 'std/iter.ouro',
                     'std_sha256': '45b2cff4eca39c9d0a823f31bee21af3d6da6f5adaf44943ca4cfa6656c9febb'},
        }
        meta = expected[feature]
        def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
        assert git('rev-parse', 'HEAD') == meta['sha']
        assert git('rev-parse', 'HEAD^{tree}') == meta['tree']
        assert git('rev-parse', 'HEAD^') == '8229d98d3ab32f667f706d41b08616a7e1acb9a3'
        paths = git('diff', '--name-only', 'HEAD^', 'HEAD').splitlines()
        assert paths == ['CHANGELOG.md', 'docs/practical_stdlib.md', meta['module'],
                         'tests/practical_stdlib_tests.ouro'], paths
        assert not git('status', '--porcelain', '--untracked-files=no')
        blobs = {
            'scripts/api_baseline_regen.py': '3fde14909a852897117000207e445ed88906baba',
            'scripts/api_baseline_regen_test.py': '0528a766c8150644bc3ccbb0fee10659c6cee624',
            'scripts/analyze_bounded.py': '5563831d110465df780cb0cfc54f1b650ac68ee9',
            'tools/doc_model.ouro': '9834824946d30df7285cea37986d4eb973fae83c',
            'scripts/ourosmith/surface/doc_contract.py': '85273546239acbe383ffdc6ec651043d5b02bb76',
            'scripts/lsp_suite.sh': 'a9f4e9817bc245ee152433ebb9c79cc1a70f6747',
            'scripts/bootstrap_compiler.py': '937f93c11a055e42c0ecb22f8c10fce2d748817c',
            'scripts/ci_gate.py': '16ea86bf60a3d3347c30af2f562a6b6b500b89ef',
        }
        for path, digest in blobs.items(): assert git('rev-parse', 'HEAD:'+path) == digest, path
        sources = sorted(Path('std').rglob('*.ouro'))
        assert len(sources) == 69
        manifest = ''.join(path.as_posix()+'\t'+hashlib.sha256(path.read_bytes()).hexdigest()+'\n'
                           for path in sources)
        assert hashlib.sha256(manifest.encode()).hexdigest() == meta['std_sha256']
        report = Path('_build/ci/stdlib-regen')
        report.mkdir(parents=True, exist_ok=True)
        (report/'source.json').write_text(json.dumps({**meta, 'feature': feature,
            'base_sha': '973c3a21342e9d6e029479fb33ed7207d010c1bd', 'std_sources':69,
            'source_paths':paths, 'owner_blobs':blobs}, indent=2)+'\n')
        print('SOURCE_BOUND: PASS feature='+feature+' std_sources=69')
        PY
    - name: Require matching Host success and system C compiler
      id: ready
      run: |
        test "$HOST_RESULT" = success || { echo 'NOT_RUN: source-bound Host did not pass' >&2; exit 1; }
        command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1
    - name: Download this focused source Host
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.feature == 'maybe' && needs.host-maybe.outputs.artifact || needs.host-iter.outputs.artifact }}
        path: _build/ci
    - name: Import compiler with exact producer SHA and current inputs
      id: import
      run: |
        python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256"
        python3 - <<'PY'
        import hashlib
        from pathlib import Path
        out=Path('_build/ci/stdlib-regen/compiler.sha256')
        out.write_text(hashlib.sha256(Path('_build/c/ouro1').read_bytes()).hexdigest()+'  _build/c/ouro1\n')
        PY
    - name: Run Python complete-header contracts and native-input skeleton laws
      if: ${{ matrix.suite == 'regeneration' }}
      run: |
        python3 scripts/api_baseline_regen_test.py
        python3 scripts/analyze_bounded.py --self-test
    - name: Generate canonical complete API baseline from all 69 sources
      id: baseline
      if: ${{ matrix.suite == 'regeneration' }}
      run: |
        python3 scripts/api_baseline_regen.py --report _build/ci/stdlib-regen/api-write.json
        python3 scripts/api_baseline_regen.py --check --report _build/ci/stdlib-regen/api-check.json
        python3 - <<'PY'
        import json,os,subprocess,sys
        from pathlib import Path
        sys.path.insert(0,str(Path('scripts').resolve()))
        import api_baseline_regen as api
        feature=os.environ['FEATURE']
        owner,name,digest={'maybe':('std/data.ouro','maybe_bind','909c1a6000ba1b0c'),
                           'iter':('std/iter.ouro','iter_fold','72d816bd45dfb9eb')}[feature]
        report=json.loads(Path('_build/ci/stdlib-regen/api-check.json').read_text())
        assert report['pass'] and report['check_only'] and not report['drift']
        assert report['rows']==1173 and report['std_sources']==69
        def rows(text):return {tuple(line.split('\t')[:2]):line for line in text.splitlines()
                               if line and not line.startswith('#')}
        before=rows(subprocess.check_output(['git','show','HEAD:quality/api_surface.tsv'],text=True))
        after=rows(Path('quality/api_surface.tsv').read_text())
        assert len(before)==1172 and len(after)==1173
        assert after.keys()-before.keys()=={(owner,name)}
        assert all(after[key]==row for key,row in before.items())
        row=after[(owner,name)].split('\t')
        signature=next(sig for path,n,hash_,sig in api.rows_for(api.ROOT/owner) if n==name)
        assert row[2]==digest and row[3:5]==['std','public']
        assert row[5]=='# '+signature
        Path('_build/ci/stdlib-regen/new-api.json').write_text(json.dumps({
            'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'owner':owner,'name':name,'signature':signature,'fnv1a64':digest,
            'baseline_rows':1173,'std_sources':69},indent=2)+'\n')
        print('API_GENERATION: PASS rows=1173 sources=69 added='+name)
        PY
    - name: Run native Doc contract and regenerate all std API pages
      id: doc_regen
      if: ${{ matrix.suite == 'regeneration' }}
      env:
        DOC_SUITE_OUT: _build/doc_suite
      run: |
        sh scripts/doc_suite.sh --regen
        test -x _build/doc_suite/ouro-doc
    - name: Verify native Doc generation is current
      id: doc_check
      if: ${{ matrix.suite == 'regeneration' }}
      env:
        DOC_SUITE_OUT: _build/doc_suite
      run: |
        sh scripts/doc_suite.sh
    - name: Run independent LSP hover contract
      id: lsp
      if: ${{ always() && matrix.suite == 'regeneration' && steps.import.outcome == 'success' }}
      env:
        LSP_SUITE_OUT: _build/lsp_suite
      run: |
        sh scripts/lsp_suite.sh
        test -x _build/lsp_suite/ouro-lsp
    - name: Package exact focused owner-generated API outputs
      if: ${{ always() && matrix.suite == 'regeneration' && steps.baseline.outcome == 'success' && steps.doc_check.outcome
        == 'success' }}
      run: |
        python3 - <<'PY'
        import hashlib,json,os,re,shutil,subprocess
        from pathlib import Path
        feature=os.environ['FEATURE']
        owner,filename,name,count={'maybe':('std/data.ouro','std_data.md','maybe_bind',16),
                                   'iter':('std/iter.ouro','std_iter.md','iter_fold',9)}[feature]
        expected={'quality/api_surface.tsv','docs/api/README.md','docs/api/'+filename}
        changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
        assert changed==expected,(changed,expected)
        pages=sorted(Path('docs/api').glob('*.md'))
        assert len(pages)==70 and Path('_build/doc_suite/ouro-doc').is_file()
        std_list=[line for line in Path('_build/doc_suite/std.list').read_text().splitlines() if line]
        assert len(std_list)==69 and set(std_list)=={p.as_posix() for p in Path('std').rglob('*.ouro')}
        text=Path('docs/api',filename).read_text()
        assert 'Declarations: '+str(count)+'.' in text
        section=text.split('## def '+name+'\n',1)[1]
        signature=' '.join(section.split('```',2)[1].split())
        oracle=json.loads(Path('_build/ci/stdlib-regen/new-api.json').read_text())
        assert signature==oracle['signature'],(signature,oracle['signature'])
        index=Path('docs/api/README.md').read_text()
        assert '- ['+owner+']('+filename+') \u0432\u0402\u201d '+str(count)+' declarations' in index
        dest=Path('_build/stdlib-owner-output')
        shutil.copytree('docs/api',dest/'docs/api')
        (dest/'quality').mkdir(parents=True)
        shutil.copyfile('quality/api_surface.tsv',dest/'quality/api_surface.tsv')
        manifest=[{'path':p.as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in [Path('quality/api_surface.tsv'),*pages]]
        (dest/'manifest.json').write_text(json.dumps({**oracle,'feature':feature,
            'changed_paths':sorted(changed),'files':manifest},indent=2)+'\n')
        print('OWNER_OUTPUT: PASS pages=70 baseline_rows=1173 feature='+feature)
        PY
    - name: Check the changed module and practical import closure
      if: ${{ matrix.suite == 'practical' }}
      run: |
        case "$FEATURE" in maybe) owner=std/data.ouro;; iter) owner=std/iter.ouro;; esac
        sh scripts/ouro1.sh check "$owner" > _build/ci/stdlib-regen/owner-check.stdout 2> _build/ci/stdlib-regen/owner-check.stderr
        grep -Fx 'CHECK_OK' _build/ci/stdlib-regen/owner-check.stdout
        test ! -s _build/ci/stdlib-regen/owner-check.stderr
        sh scripts/ouro1.sh check tests/practical_stdlib_tests.ouro > _build/ci/stdlib-regen/practical-check.stdout 2> _build/ci/stdlib-regen/practical-check.stderr
        grep -Fx 'CHECK_OK' _build/ci/stdlib-regen/practical-check.stdout
        test ! -s _build/ci/stdlib-regen/practical-check.stderr
        sh scripts/build_tool.sh tests/practical_stdlib_tests.ouro _build/ci/stdlib-regen/practical-stdlib > _build/ci/stdlib-regen/practical-build.stdout 2> _build/ci/stdlib-regen/practical-build.stderr
        test -x _build/ci/stdlib-regen/practical-stdlib
    - name: Execute every practical shape assertion with canonical runtime limits
      if: ${{ matrix.suite == 'practical' }}
      run: |
        python3 - <<'PY'
        import dataclasses,json,os,re,sys
        from pathlib import Path
        sys.path.insert(0,str(Path('scripts').resolve()))
        from ourosmith.limits import run_limited
        feature=os.environ['FEATURE']
        source=Path('tests/practical_stdlib_tests.ouro').read_text()
        labels=re.findall(r'\bassert_(?:true|eq)\s+"([^"\n]+)"',source)
        expected_count={'maybe':81,'iter':85}[feature]
        assert len(labels)==expected_count and len(set(labels))==len(labels)
        root=Path('_build/ci/stdlib-regen')
        cpu=min(os.sched_getaffinity(0))
        result=run_limited(['taskset','-c',str(cpu),str((root/'practical-stdlib').resolve())],
                           timeout_s=300,memory_mb=3072,cwd=Path.cwd())
        (root/'practical-run.stdout').write_text(result.stdout)
        (root/'practical-run.stderr').write_text(result.stderr)
        (root/'practical-run.json').write_text(json.dumps({**dataclasses.asdict(result),
            'source_feature':feature,'expected_rows':expected_count,'timeout_s':300,
            'memory_mib':3072,'cpu_count':1},indent=2)+'\n')
        assert result.ok and result.returncode==0,(result.status,result.returncode)
        assert not result.stderr,result.stderr
        assert result.stdout.splitlines()==['ok '+label for label in labels],result.stdout
        print('PRACTICAL_SHAPES: PASS feature='+feature+' rows='+str(expected_count))
        PY
    - name: Run the canonical samples shard without changing its inventory or policy
      if: ${{ matrix.suite == 'samples-1' || matrix.suite == 'samples-2' }}
      env:
        SAMPLES_SUITE_OUT: _build/samples_suite
      run: |
        case "$SUITE" in samples-1) shard=1/2;; samples-2) shard=2/2;; esac
        sh scripts/samples_suite.sh "--shard=$shard"
        test -x _build/samples_suite/ouro-test-suite
    - name: Verify compiler binary remains unchanged
      if: ${{ always() && steps.import.outcome == 'success' }}
      run: |
        sha256sum --check _build/ci/stdlib-regen/compiler.sha256
    - name: Fail explicitly if source-bound Host was unavailable
      if: ${{ always() && steps.import.outcome != 'success' }}
      run: |
        echo 'NOT_RUN: owner regeneration and native suites require verified matching Host' >&2
        exit 1
    - name: Upload focused owner-generated outputs
      if: ${{ always() && matrix.suite == 'regeneration' && steps.doc_check.outcome == 'success' && steps.baseline.outcome
        == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: stdlib-owner-output-${{ matrix.feature }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: _build/stdlib-owner-output/
        if-no-files-found: error
        retention-days: 14
    - name: Upload source, bootstrap and suite reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: stdlib-${{ matrix.feature }}-${{ matrix.suite }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          _build/ci/stdlib-regen/*.json
          _build/ci/stdlib-regen/*.stdout
          _build/ci/stdlib-regen/*.stderr
          _build/ci/stdlib-regen/*.sha256
          _build/c/ouro1.bootstrap.json
          _build/bootstrap/**/report.json
          _build/bootstrap/**/inputs.json
          _build/bootstrap/**/abi-laws.stdout
          _build/bootstrap/**/abi-laws.stderr
          _build/bootstrap/**/behavior-good.stdout
          _build/bootstrap/**/behavior-good.stderr
          _build/bootstrap/**/behavior-bad.stdout
          _build/bootstrap/**/behavior-bad.stderr
          _build/doc_suite/**/*.tsv
          _build/doc_suite/**/*.log
          _build/doc_suite/**/*.diff
          _build/lsp_suite/**/*.log
          _build/lsp_suite/**/*.out
          _build/lsp_suite/**/*.err
          _build/samples_suite/**/*.tsv
          _build/samples_suite/**/*.json
          _build/samples_suite/**/*.out
          _build/samples_suite/**/*.err
          _build/samples_suite/**/*.log
        if-no-files-found: error
        retention-days: 14
