name: PR88 EVar dispatch retained gates

on:
  push:
    branches: [codef/pr88-evar-dispatch-probe]
    paths: [.github/workflows/pr88-evar-dispatch-probe.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr88-evar-dispatch-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "1"
  OURO_FRONTEND_JOBS: "1"
  OURO_CACHE: "0"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  OURO_MEM_TRACE: "0"

jobs:
  guard:
    name: Workflow-only guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Require immediate reviewed source and one workflow delta
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = eb2398df59458671fd060ccb80027fea75e570b7
          test "$(git rev-parse HEAD^^)" = df95a683c7a8d9a4cef04e40b8815e9ae5849e36
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/pr88-evar-dispatch-probe.yml
          git diff --check HEAD^ HEAD

  host:
    name: Fresh source-bound Host
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
      artifact: ${{ steps.bundle.outputs.artifact }}
      binary_sha256: ${{ steps.verify.outputs.binary_sha256 }}
      key: ${{ steps.verify.outputs.key }}
    steps:
      - name: Checkout exact combined candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eb2398df59458671fd060ccb80027fea75e570b7
          fetch-depth: 2
          persist-credentials: false
      - name: Bind source, owner blobs and all retained structural assertions
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(["git", *args], text=True).strip()
          source = "eb2398df59458671fd060ccb80027fea75e570b7"
          parent = "df95a683c7a8d9a4cef04e40b8815e9ae5849e36"
          assert git("rev-parse", "HEAD") == source
          assert git("rev-parse", "HEAD^") == parent
          assert git("rev-parse", "HEAD^{tree}") == "e2b09407103e3ea61622cde65560d5185bb12f4a"
          assert git("diff", "--name-only", parent, source).splitlines() == [
              "compiler/lower.ouro", "tests/compiler_structural_tests.ouro"]
          assert not git("status", "--porcelain")
          blobs = {
              "compiler/lower.ouro": "4a2198dca20fc6dcfbc047e5b7a7e42204659cb8",
              "tests/compiler_structural_tests.ouro": "e615de1316abd1df3934b001ba2be82c974e8b08",
              "compiler/lower_env.ouro": "56776adc3e2683aa51e01c9c54a608e18459b94a",
              "compiler/lower_support.ouro": "5975a3460c1e395b35dd8d298ea77a11c16af5ef",
              "compiler/lower_implicit.ouro": "d6b712898f76eb5c57987398aa22be8f03bb305e",
              "compiler/lower_implicit_function.ouro": "d2b568efa8be3dc1646c14847c6876c466e7eda0",
              "compiler/lower_decl_types.ouro": "9f03346412a7f5bad88600449b49f6b469b98c73",
              "compiler/pipeline.ouro": "470f65814e57200b02580131a0df786fa74b2e18",
              "compiler/file_check_work.ouro": "ffb661db478eca99c415bdfc3f31403aa3f60d29",
              "compiler/core.ouro": "9c854884896b4385c2046e61e3729b07d78c9476",
              "compiler/ast.ouro": "933f1f4cf57e3d72cbafff318957558baedd991b",
              "runtime/frontend_link.c": "f10104eb4bc30055dabb3163a82f181c6eae9f1a",
              "runtime/bootstrap.c": "5272a92d85d3f693407ec1f5d0e091fe461f8018",
              "runtime/ouro_rt.c": "5fa7a64f29ef9b25f23b9e322d111e7070516b36",
              "runtime/ouro_rt.h": "1d13494869a5a73abf38cc3e3c1fc7cf4ae0aa22",
              "scripts/bootstrap_compiler.py": "937f93c11a055e42c0ecb22f8c10fce2d748817c",
              "scripts/bootstrap_inputs.py": "e49f21cc8df6b7dac89fc853631a75d0a7e47458",
              "scripts/ci_gate.py": "16ea86bf60a3d3347c30af2f562a6b6b500b89ef",
              "scripts/ouro_build.py": "d42206ac82042ab3eddf2542689716e8a0c77cd4",
              "scripts/frontend_regen.py": "c585f858e9c75a17e6a797c25befa3f2773cc765",
              "scripts/frontend_host_suite.py": "0caab7695c6538e8d455f38802bd886b8f285a40",
              "scripts/frontend_security_suite.sh": "d56a1d3a0770399cd3ec1489a115bb03ffe54cab",
              "scripts/native_tool_build.py": "0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce",
              "scripts/kernel_scale.py": "8317bc5a2f060b8e98d8a79373d29f9a93110b85",
              "scripts/ourosmith/limits.py": "aa92339539ea580b0a2569d7df7f085f94765156",
              "scripts/ourosmith/native_inputs.py": "6aac4cbf0a287070af1c20d7a02d906b13ca6d97",
              "scripts/ouro_smith.py": "e3ee39185a464afc28c269965cc940a14cde896a",
              "scripts/test_suite.sh": "a880ebb888fbaf6c5a94f47db93e261e55bdd8b0",
              "scripts/build_tool.sh": "ff83eec44937a8d9aa37c5af67aae2d57b93f4c3",
              "scripts/bootstrap.sh": "2720168ea77f682fecefbb4accba32ae69fd6b26",
              "scripts/ouro1.sh": "9665ebb00049d05c097a29d77ec5083b524f9e2d",
              "tools/test/suites.ouro": "8d97994c3f3877fa94acb8797811ac17e87d78a0",
              "tools/test/main.ouro": "a6e02de90c2432c3857745f34c9c26f7c1a0f907",
              "std/data.ouro": "b0525f0b9f90f1692adbe6cd38af963e88d73022",
              "Ouro.seal": "f078fbe47670a948c96a1d8076761c2140455bbe",
          }
          for path, digest in blobs.items(): assert git("hash-object", path) == digest, path
          current = Path("tests/compiler_structural_tests.ouro").read_text()
          baseline = subprocess.check_output(["git", "show", parent + ":tests/compiler_structural_tests.ouro"], text=True)
          def definition(text, name):
              return re.search(r"^def " + re.escape(name) + r"\b.*?(?=^def |\Z)", text, re.M | re.S).group()
          for name in re.findall(r"^def (\w+)\b", baseline, re.M):
              if name != "main": assert definition(current, name) == definition(baseline, name), name
          labels = re.findall(r'assert_true\s+"([^"\n]*)"', definition(current, "structural_test_evar"))
          assert len(labels) == len(set(labels)) == 23
          assert definition(current, "main").count("structural_test_evar") == 1
          assert not Path("_build/c/ouro1").exists(), "Host must be freshly built"
          out = Path("_build/evar_probe")
          (out / "private").mkdir(parents=True)
          (out / "source.json").write_text(json.dumps({
              "source_sha": source, "source_parent": parent, "workflow_sha": os.environ["GITHUB_SHA"],
              "tree": git("rev-parse", "HEAD^{tree}"), "blobs": blobs,
              "new_structural_laws": 23, "old_structural_definitions_retained": True}, indent=2) + "\n")
          print("EVAR_SOURCE: PASS exact combined candidate and retained laws")
          PY
      - name: Require system C compiler and identify fresh inputs
        run: |
          command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1
          python3 scripts/ci_gate.py --compiler-artifact key > _build/evar_probe/key-before.stdout
      - name: Fresh canonical Host P1/P2, ABI and exact behavior
        run: |
          python3 scripts/ouro_build.py build --jobs 1 --no-cache --ccache disabled --verbosity quiet > _build/evar_probe/private/host.stdout 2> _build/evar_probe/private/host.stderr
      - name: Verify current receipt, complete stage equality and strict protocols
        id: verify
        run: |
          python3 - <<'PY'
          import argparse, hashlib, json, os, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import bootstrap_compiler as bootstrap
          import ouro_build as build
          from repo_support import sha256_file
          cfg = build.load_config(argparse.Namespace())
          selected = bootstrap.current_inputs(root, cfg, build)
          binary = root / "_build/c/ouro1"
          receipt_path = binary.with_name("ouro1.bootstrap.json")
          receipt = json.loads(receipt_path.read_text())
          assert bootstrap.installed_current(binary, receipt_path, selected)
          assert receipt["selected"] == selected
          assert selected["source_form"] == "original"
          assert len(selected["sources"]) == 177 and len(selected["stage0"]) == 2
          changed = []
          for path, digest in {**selected["sources"], **selected["stage0"]}.items():
              assert sha256_file(root / path) == digest, path
              baseline = subprocess.check_output(["git", "show", "df95a683c7a8d9a4cef04e40b8815e9ae5849e36:" + path])
              if hashlib.sha256(baseline).hexdigest() != digest: changed.append(path)
          assert changed == ["compiler/lower.ouro"], changed
          assert selected["sources"]["std/data.ouro"] == "7745331213e166b933cdf79b4e50cf0125bc616891cfb41232647dbae8f941c2"
          work = Path(receipt["work"])
          report = json.loads((work / "report.json").read_text())
          assert report["pass"] and report["changed_inputs"] == []
          assert report["workers"] == 1 and report["memory_mib"] == 3072 and report["timeout_s"] == 900
          assert [row["phase"] for row in report["phases"]] == ["c0", "bridge", "p1", "p2"]
          assert all(row["pass"] for row in report["phases"])
          comparisons = report["complete_generated_c_comparison"]
          assert set(comparisons) == {"driver_u.c", "backend_u.c"}
          for row in comparisons.values(): assert row["p1_sha256"] == row["p2_sha256"]
          rows = {row["label"]: row for row in report["phases"][-1]["commands"]}
          protocols = {
              "abi-laws": (0, "16bfd633ac142f812517f82604a5f083b387ea7f22399cd8d8cdeafb7d0cabe2",
                           "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"),
              "behavior-good": (0, "ffd3fb9993008a7c07f30d182bf381ba8582b93614ac78921c7031b4e189954e",
                                "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"),
              "behavior-bad": (1, "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
                               "885f2dbac26c585c151937b52231be5deb84894da6e64ef316dbec003f5bb0dd"),
          }
          for name, protocol in protocols.items():
              row = rows[name]
              assert row["status"] == "ok"
              assert (row["returncode"], row["stdout_sha256"], row["stderr_sha256"]) == protocol, name
              for stream in ("stdout", "stderr"): assert sha256_file(work / row[stream]) == row[stream + "_sha256"]
          assert (root / "_build/evar_probe/key-before.stdout").read_text().strip() == "key=" + receipt["key"]
          (root / "_build/evar_probe/host.json").write_text(json.dumps({
              "source_sha": "eb2398df59458671fd060ccb80027fea75e570b7", "key": receipt["key"],
              "binary_sha256": sha256_file(binary), "selected": selected,
              "complete_generated_c_comparison": comparisons, "protocols": protocols,
              "bootstrap_report_sha256": sha256_file(work / "report.json")}, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("key=" + receipt["key"] + "\nbinary_sha256=" + sha256_file(binary) + "\n")
          print("EVAR_HOST: PASS source-bound P1/P2, ABI and exact positive/negative behavior")
          PY
      - name: Export verified compiler with canonical evidence
        id: bundle
        run: |
          python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"
          echo "artifact=pr88-evar-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload official verified Host archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: _build/ci/host-compiler.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Record private Host output hashes
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("_build/evar_probe")
          root.mkdir(parents=True, exist_ok=True)
          rows = {}
          for name in ("host.stdout", "host.stderr"):
              path = root / "private" / name
              if path.is_file():
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1048576), b""): digest.update(chunk)
                  rows[name] = {"bytes": path.stat().st_size, "sha256": digest.hexdigest()}
          (root / "host-stream-hashes.json").write_text(json.dumps(rows, indent=2) + "\n")
          PY
      - name: Upload source, bootstrap and protocol evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr88-evar-host-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/evar_probe/*.json
            _build/evar_probe/*.stdout
            _build/c/ouro1.bootstrap.json
            _build/bootstrap/**/report.json
            _build/bootstrap/**/inputs.json
            _build/bootstrap/**/abi-laws.stdout
            _build/bootstrap/**/abi-laws.stderr
            _build/bootstrap/**/behavior-good.stdout
            _build/bootstrap/**/behavior-good.stderr
            _build/bootstrap/**/behavior-bad.stdout
            _build/bootstrap/**/behavior-bad.stderr
          if-no-files-found: error
          retention-days: 14

  retained:
    name: Retained ${{ matrix.suite }}
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [frontend, ergonomics, compiler-11]
    env:
      EVAR_SUITE: ${{ matrix.suite }}
      HOST_BINARY_SHA256: ${{ needs.host.outputs.binary_sha256 }}
      HOST_KEY: ${{ needs.host.outputs.key }}
    steps:
      - name: Checkout exact combined candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eb2398df59458671fd060ccb80027fea75e570b7
          fetch-depth: 2
          persist-credentials: false
      - name: Require exact source and system C compiler
        run: |
          test "$(git rev-parse HEAD)" = eb2398df59458671fd060ccb80027fea75e570b7
          test "$(git rev-parse HEAD^{tree})" = e2b09407103e3ea61622cde65560d5185bb12f4a
          test -z "$(git status --porcelain)"
          command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1
          mkdir -p _build/evar_probe
      - name: Download this workflow's verified Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.host.outputs.artifact }}
          path: _build/ci
      - name: Canonical fail-closed source-bound compiler import
        id: import
        env:
          COMPILER_SHA256: ${{ needs.host.outputs.sha256 }}
        run: |
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256" > _build/evar_probe/import.stdout 2> _build/evar_probe/import.stderr
          python3 scripts/ci_gate.py --compiler-artifact key > _build/evar_probe/key.stdout
          test "$(cat _build/evar_probe/key.stdout)" = "key=$HOST_KEY"
          test "$(sha256sum _build/c/ouro1 | cut -d ' ' -f 1)" = "$HOST_BINARY_SHA256"
          sha256sum _build/c/ouro1 > _build/evar_probe/compiler-before.sha256
      - name: Run unchanged canonical suite and preserve its exact exit
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, time
          from pathlib import Path
          name = os.environ["EVAR_SUITE"]
          commands = {
              "frontend": ["sh", "scripts/frontend_security_suite.sh"],
              "ergonomics": [sys.executable, "scripts/ouro_smith.py", "manifest", "--prefix=ERGO.,REC.",
                             "--out=_build/ergonomics_suite", "--label=ERGONOMICS_SUITE"],
              "compiler-11": ["sh", "scripts/test_suite.sh", "--compiler-checking", "--shard=11/16"],
          }
          env = dict(os.environ)
          if name == "frontend": env["FRONTEND_SECURITY_OUT"] = "_build/frontend_security"
          if name == "compiler-11": env["TEST_SUITE_OUT"] = "_build/compiler_check_suite_11"
          root = Path("_build/evar_probe")
          started = time.monotonic()
          with (root / "suite.stdout").open("wb") as output, (root / "suite.stderr").open("wb") as errors:
              result = subprocess.run(commands[name], env=env, stdout=output, stderr=errors, check=False)
          record = {"source_sha": "eb2398df59458671fd060ccb80027fea75e570b7", "suite": name,
                    "command": commands[name], "returncode": result.returncode,
                    "elapsed_s": round(time.monotonic() - started, 6), "pass": result.returncode == 0,
                    "host_key": os.environ["HOST_KEY"], "host_binary_sha256": os.environ["HOST_BINARY_SHA256"]}
          (root / "suite.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, sort_keys=True))
          sys.exit(result.returncode if result.returncode >= 0 else 1)
          PY
      - name: Verify producer and tracked source remain unchanged
        if: ${{ always() && steps.import.conclusion == 'success' }}
        run: |
          sha256sum --check _build/evar_probe/compiler-before.sha256
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 scripts/ci_gate.py --compiler-artifact key > _build/evar_probe/key-after.stdout
          test "$(cat _build/evar_probe/key-after.stdout)" = "key=$HOST_KEY"
          if [ "$EVAR_SUITE" = frontend ] && [ "$(python3 -c 'import json; print(json.load(open("_build/evar_probe/suite.json"))["returncode"])')" = 0 ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("_build/frontend_security/host/frontend-host.json").read_text())
          assert report["pass"] and report["inputs_unchanged"]
          assert report["workers"] == 1 and report["memory_mib"] == 3072 and report["build_timeout_s"] == 900
          assert len(report["cpu"]) == 1
          assert report["producer"]["sha256"] == report["producer"]["sha256_after"] == os.environ["HOST_BINARY_SHA256"]
          print("EVAR_FRONTEND: PASS stock 900s/3072MiB/one-worker budget and producer")
          PY
          fi
      - name: Upload complete suite evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr88-evar-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/evar_probe/*.json
            _build/evar_probe/*.stdout
            _build/evar_probe/*.stderr
            _build/evar_probe/*.sha256
            _build/frontend_security/**/*.json
            _build/frontend_security/**/*.stdout
            _build/frontend_security/**/*.stderr
            _build/frontend_security/**/*.out
            _build/frontend_security/**/*.err
            _build/ergonomics_suite/**/*.json
            _build/ergonomics_suite/**/*.tsv
            _build/ergonomics_suite/**/*.log
            _build/ergonomics_suite/**/*.out
            _build/ergonomics_suite/**/*.err
            _build/compiler_check_suite_11/**/*.json
            _build/compiler_check_suite_11/**/*.log
            _build/compiler_check_suite_11/**/*.out
            _build/compiler_check_suite_11/**/*.err
            _build/compiler_check_suite_11/**/*.build
          if-no-files-found: error
          retention-days: 14

