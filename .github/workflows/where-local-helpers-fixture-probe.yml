name: Where fixture acceptance probe

on:
  push:
    branches: [ codef/where-local-helpers-fixture-probe ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: where-local-helpers-fixture-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  acceptance:
    name: "Where (${{ matrix.group }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [ native-where, compiler-6, compiler-16, ergonomics, analyzer-precision ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Verify reviewed product and retained base
        run: |
          test "$(git rev-parse HEAD^)" = 5382273a8b7205fec986e1378a9315cc4328c9a7
          test "$(git rev-parse HEAD^^)" = 206817ae12594ca66b0925104207980c8ea91230
          test "$(git rev-parse HEAD^^^)" = 1e4c9a2746628c1bd68a9e3eecb7dda7050cc213
          test "$(git rev-parse HEAD^^^^)" = 973c3a21342e9d6e029479fb33ed7207d010c1bd
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/where-local-helpers-fixture-probe.yml
          python3 - <<'PY'
          import json, subprocess
          expected = json.loads('["CHANGELOG.md", "compiler/parse_a.ouro", "compiler/parse_b.ouro", "compiler/parser_parse.ouro", "compiler/source_spans.ouro", "docs/language/ergonomic-syntax.md", "docs/syntax.md", "scripts/language_ergonomics_suite.py", "tests/analyze/precision/host.ouro", "tests/language_ergonomics/cases.json", "tests/language_ergonomics/where_parser_laws.ouro", "tests/source_span_tests.ouro", "tools/test/suites.ouro"]')
          actual = subprocess.check_output(['git', 'diff', '--name-only', '973c3a21342e9d6e029479fb33ed7207d010c1bd', '5382273a8b7205fec986e1378a9315cc4328c9a7'], text=True).splitlines()
          assert actual == expected, (actual, expected)
          PY
          test "$(git hash-object CHANGELOG.md)" = 818642b457620d12f3822743b6090a944b48deb7
          test "$(git hash-object compiler/parse_a.ouro)" = 95c9be35ed61ed03d054316fdc9922058add3130
          test "$(git hash-object compiler/parse_b.ouro)" = 7081b010e9d28ac00049b59f25dc3eb48bec4ae2
          test "$(git hash-object compiler/parser_parse.ouro)" = ed14a19699c080c3a665369cce4b3685ee820106
          test "$(git hash-object compiler/source_spans.ouro)" = 9a9875d310f8db74e49e64c2344d2a3b28ae406e
          test "$(git hash-object docs/language/ergonomic-syntax.md)" = b1e622a55f2511b045758f710a2326ee2a005ccc
          test "$(git hash-object docs/syntax.md)" = d77afcd982573f6ab0511de234699db1939b8a83
          test "$(git hash-object scripts/language_ergonomics_suite.py)" = 43b75c10e7327aa5a5d4e0924ae3dfbdbee1c0d4
          test "$(git hash-object tests/analyze/precision/host.ouro)" = a16e66ed3ea2bf0b73cd1ff72db8f66f90564fe4
          test "$(git hash-object scripts/analyze_precision_suite.sh)" = 9122ae9507eb3358b62e4519d0892d8055d5a127
          test "$(git hash-object tests/language_ergonomics/cases.json)" = 23000d9a39775a3266b518321a1e12d8c6c784c3
          test "$(git hash-object tests/language_ergonomics/where_parser_laws.ouro)" = 226b2fe140ad257abd2ccf81bd8a9a632007dee6
          test "$(git hash-object tests/source_span_tests.ouro)" = 9a8ffc7735f2d75d20740413a6f9c280c5ccff5d
          test "$(git hash-object tools/test/suites.ouro)" = 4c17fe0be13ce2d9a20c9bd0348e10e25a1a52f6
          test "$(git hash-object compiler/lexer.ouro)" = b73355a657c9cd09dd83d26c36eb128cfe004207
          test "$(git hash-object compiler/module_registry.ouro)" = e84c2d27c597e5e3617e9b1466983862acdb78e8
          test "$(git hash-object compiler/preprocess_record.ouro)" = b6e825c025838490e072ce4c6f08af47d72a0307
          test "$(git hash-object compiler/preprocess_record_text.ouro)" = 4d4ebb46a8f8a8c27d319906d2cd638fa4b6e78a
          test "$(git hash-object docs/tcb.md)" = 725c3c038f60f5816cb1523ded225041ab093e4b
          test "$(git hash-object quality/memory_budgets.json)" = 9257b185a175b64474d9c014086771035ac8394f
          python3 - <<'PY'
          from pathlib import Path
          import json, sys
          sys.path.insert(0, 'scripts')
          import ci_gate
          inventory = ci_gate.compiler_fixture_roots(Path.cwd())
          assert 'tests/language_ergonomics/where_parser_laws.ouro' in ci_gate.compiler_shard_entries(inventory, 6)
          assert ci_gate.compiler_shard_entries(inventory, 16) == ['tests/source_span_tests.ouro']
          assert json.loads(Path('quality/memory_budgets.json').read_text())['budgets']['strict-quality-gate']['peak_rss_kb'] == 1024000
          PY

      - name: Download exact verified Where Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10946962780
          run-id: 36363696845
          github-token: ${{ github.token }}
          merge-multiple: true
          path: _build/ci

      - name: Verify and install source-bound Host
        env:
          COMPILER_SHA256: e3401e3175dd34b50dcbb07783a6d9ec61299d0e729e2cc822b7a40c9c69dc31
        run: |
          test "$(python3 scripts/ci_gate.py --compiler-artifact key)" = key=4c8eb573030089136fb89d2f97b0acb566475bade322b0495c817b611af99276
          mkdir -p _build/where_probe
          rc=0
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256" >_build/where_probe/import.stdout 2>_build/where_probe/import.stderr || rc=$?
          printf '%s\n' "$rc" >_build/where_probe/import.rc
          cat _build/where_probe/import.stdout
          cat _build/where_probe/import.stderr >&2
          test "$rc" -eq 0
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path('_build/c/ouro1.bootstrap.json').read_text())
          assert receipt['key'] == '4c8eb573030089136fb89d2f97b0acb566475bade322b0495c817b611af99276'
          sources = receipt['selected']['sources']
          assert len(sources) == 177, len(sources)
          changed = [name for name, digest in sources.items()
                     if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest]
          assert not changed, changed
          print('WHERE_HOST_INPUTS_OK sources=177')
          PY

      - name: Run retained acceptance gate
        env:
          PROBE_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p _build/where_probe
          run_logged() {
            probe_label=$1
            shift
            probe_status=0
            "$@" >"_build/where_probe/$probe_label.stdout" 2>"_build/where_probe/$probe_label.stderr" || probe_status=$?
            printf '%s\n' "$probe_status" >"_build/where_probe/$probe_label.rc"
            cat "_build/where_probe/$probe_label.stdout"
            cat "_build/where_probe/$probe_label.stderr" >&2
            return "$probe_status"
          }
          case "$PROBE_GROUP" in
            native-where)
              ulimit -s 131072
              run_logged native-check sh scripts/ouro1.sh check tests/language_ergonomics/where_parser_laws.ouro 200000
              grep -Fxq CHECK_OK _build/where_probe/native-check.stdout
              test ! -s _build/where_probe/native-check.stderr
              OURO_BUILD_TOOL_MODE=native run_logged native-build sh scripts/build_tool.sh tests/language_ergonomics/where_parser_laws.ouro _build/c/where-parser-laws 60000
              run_logged native-run _build/c/where-parser-laws
              printf 'ERGO_WHERE_PARSER_OK\n' | cmp - _build/where_probe/native-run.stdout
              test ! -s _build/where_probe/native-run.stderr
              ;;
            compiler-6|compiler-16)
              run_logged "$PROBE_GROUP" python3 scripts/ci_gate.py --profile pr --group "$PROBE_GROUP" --fail-fast --out "_build/ci/where-$PROBE_GROUP"
              ;;
            ergonomics)
              run_logged ergonomics python3 scripts/ouro_smith.py manifest --prefix=ERGO.,REC. --out=_build/ergonomics_suite --label=ERGONOMICS_SUITE
              ;;
            analyzer-precision)
              run_logged analyzer-precision sh scripts/analyze_precision_suite.sh
              grep -Fxq 'PRECISION_SUITE host rows=68' _build/analyze_precision/precision_run_host.out
              test "$(grep -c '^PRECISION_OK ' _build/analyze_precision/precision_run_host.out)" -eq 68
              grep -Fxq 'PRECISION_OK effects/where-unhandled-operation' _build/analyze_precision/precision_run_host.out
              grep -Fxq 'PRECISION_OK effects/where-handled-operation' _build/analyze_precision/precision_run_host.out
              test ! -s _build/analyze_precision/precision_run_host.err
              ;;
            *) exit 2 ;;
          esac

      - name: Upload complete acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-${{ matrix.group }}-${{ github.run_id }}
          path: |
            _build/where_probe/
            _build/ci/where-*/
            _build/compiler_check_suite_6/
            _build/compiler_check_suite_16/
            _build/ergonomics_suite/
            _build/analyze_precision/
            _build/c/ouro1.bootstrap.json
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.err
            _build/**/*.stdout
            _build/**/*.stderr
            _build/**/*.sarif
            _build/**/*.md
          if-no-files-found: error
          retention-days: 14
