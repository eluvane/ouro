name: Clippy qualified alias precision probe v2

on:
  push:
    branches: [codef/clippy-qualified-alias-probe-v2]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  precision-and-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD^)" = "d51482026442e5c6df294b902ba5b4361c2bcbe6"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/clippy-qualified-alias-probe-v2.yml"

      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Build semantic worker
        run: OURO_BUILD_TOOL_MODE=native sh scripts/build_tool.sh tools/clippy/structural_main.ouro _build/c/ouro-clippy-structural

      - name: Check semantic precision
        run: python3 scripts/clippy_grade_suite.py --precision-only --worker _build/c/ouro-clippy-structural --out _build/quality/clippy-alias-probe

      - name: Check lint launcher good fixtures
        run: |
          set -eu
          root="$PWD"
          fixtures=$(python3 scripts/ouro_smith.py prepare --group lint)
          mkdir -p _build/quality/clippy-alias-probe
          (cd "$fixtures" && sh "$root/scripts/ouro1.sh" lint --deny good) \
            >_build/quality/clippy-alias-probe/launcher-good.out \
            2>_build/quality/clippy-alias-probe/launcher-good.err
          test ! -s _build/quality/clippy-alias-probe/launcher-good.out
          test ! -s _build/quality/clippy-alias-probe/launcher-good.err

      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clippy-alias-probe-v2
          if-no-files-found: ignore
          retention-days: 7
          path: |
            _build/quality/clippy-alias-probe/**/*.json
            _build/quality/clippy-alias-probe/**/*.stdout
            _build/quality/clippy-alias-probe/**/*.stderr
            _build/quality/clippy-alias-probe/**/*.out
            _build/quality/clippy-alias-probe/**/*.err
