# Diagnostic four-group evidence only; this is not the full canonical CI matrix.
name: Focused span oracle diagnostics

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed I source commit after the span fixture correction
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  PYTHONDONTWRITEBYTECODE: "1"
  COMPILER_SHA256: f45f5d6f167ea47b6970e88fbf50ea70a2ec2914c495d60215946c918dc4398a

jobs:
  focused:
    name: Diagnostic (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Keep independent diagnostic results when one canonical group fails.
      fail-fast: false
      matrix:
        group: [compiler-7, compiler-14, compiler-16, checks-quality]
    steps:
      - name: Checkout diagnostic child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Require exact source and workflow-only child
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = eluvane/ouro
          test "$GITHUB_REF" = refs/heads/codef/pr98-span-oracle-focused-probe
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ouro-pr.yml
          test -z "$(git status --porcelain)"
          git checkout --detach "$SOURCE_SHA"
          mkdir -p _build/ci
          git rev-parse HEAD HEAD^{tree} > _build/ci/focused-source.txt

      - name: Download authentic completed Host producer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: eluvane/ouro
          run-id: 36431205672
          name: host-compiler-36431205672-1
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify archive and current compiler inputs through canonical import
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256"

      - name: Run complete unfiltered canonical group
        env:
          CI_GROUP: ${{ matrix.group }}
        run: python3 scripts/ci_gate.py --profile pr --group "$CI_GROUP" --fail-fast --out "_build/ci/focused-$CI_GROUP"

      - name: Upload diagnostic reports without binaries or generated C
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-spans-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.txt
            _build/**/*.err
            _build/**/*.stdout
            _build/**/*.stderr
            _build/**/*.check
            _build/**/*.build
