name: Clippy nullary source probe

on:
  push:
    branches: [ codef/clippy-nullary-source-probe ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clippy-nullary-source-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled
  PRODUCT_SHA: 9cefb7f5bb49408260736ac52a7457e625b3a043
  BASE_SHA: 973c3a21342e9d6e029479fb33ed7207d010c1bd

jobs:
  probe:
    name: "Nullary contracts (${{ matrix.check }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [ acceptance, laws, precision ]
    steps:
      - name: Checkout diagnostic child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Verify exact lineage, scope and product blobs
        run: |
          set -euo pipefail
          mkdir -p _build/ci/clippy-nullary
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          expected = {
              "CHANGELOG.md": "60c218263443afc0b953e508a3c90768e53255bc",
              "docs/clippy_grade_firewall.md": "12a43c7aacf1bf34436bd34a1589e88988136eb1",
              "quality/clippy_grade_rules.json": "40aa1b918f89ea012c890ee3934aaaa94345df55",
              "quality/fixtures/clippy_grade/manifest.json": "ebb843d707c49204c871a8a76c66d8bd62af1025",
              "tests/clippy_semantic/cases.json": "86732c160369dff2b626c282a1c501706ce8edec",
              "tests/clippy_semantic/contracts.ouro": "d76da4603d97ed062947f3289501c9d7b5813db6",
              "tests/clippy_semantic/fixtures/pure-parse-alias-discard.ouro": "0d9a524a7e0f26cbb31838a9f861af109ca00c8a",
              "tests/clippy_semantic/fixtures/pure-parse-bool-discard.ouro": "adea95c283da83aedcbe28a58119c7531f5a75f3",
              "tests/clippy_semantic/fixtures/pure-parse-constructor-shadow.ouro": "70659f7fb200e5dba257443cede672db357da48e",
              "tests/clippy_semantic/fixtures/pure-parse-default.ouro": "94f4c04d69a3fd60967406ef75809ccc754799b6",
              "tests/clippy_semantic/fixtures/pure-parse-escape.ouro": "6e58a42869673ab6c89ced64311f855c0107e9e6",
              "tests/clippy_semantic/fixtures/pure-parse-global-function-helper.ouro": "f1e28fd9170e069cc934e7cfdf07f26d86d08a43",
              "tests/clippy_semantic/fixtures/pure-parse-ignored-helper.ouro": "ebb7ed3bacf093ddbb2ce33616d003978de1df0b",
              "tests/clippy_semantic/fixtures/pure-parse-json-discard.ouro": "5bba79d4890b66327274323bf58eb9ae4cfa2d91",
              "tests/clippy_semantic/fixtures/pure-parse-local-name.ouro": "50dfd1ccfab37407da965c82f2426109758471b2",
              "tests/clippy_semantic/fixtures/pure-parse-match.ouro": "279aa8566c023e9f246024f56c9b20002e387736",
              "tests/clippy_semantic/fixtures/pure-parse-nat-discard.ouro": "b22bba12504496e23900ee2d2aa3e34baba757f9",
              "tests/clippy_semantic/fixtures/pure-parse-nonnullary-helper.ouro": "0b6999cb04a0d8603f1cebfdff5f185b54984742",
              "tests/clippy_semantic/fixtures/pure-parse-nullary-helper.ouro": "d641a6fa2b6c3fe9e9306dabc2fd541461d613db",
              "tests/clippy_semantic/fixtures/pure-parse-partial.ouro": "627e25688fbfbb708989e096534d750f73bf0a44",
              "tests/clippy_semantic/fixtures/pure-parse-return.ouro": "032427d1841676cd7130d1899ca8ccb20e068fe5",
              "tests/clippy_semantic/fixtures/pure-parse-shadowed-name.ouro": "bfd74441637d34ff73d1a65f40a44643ee156dbe",
              "tests/clippy_semantic/imported_contracts.ouro": "5bf2a954908ae6d7becafefe0d8f1c8a8ab3ef64",
              "tests/clippy_semantic/performance.ouro": "15d2cd23f235696e562643c9fbd8869b09e95796",
              "tests/clippy_semantic/proofs.ouro": "5934398cfc04ba66f1b5203f041c5b6340a10ae3",
              "tests/clippy_semantic/pure_parse_laws.ouro": "1656689e49d2b0fae9ef8905543e6c37f1ee68d2",
              "tools/clippy/semantic_calls.ouro": "a58f5797e15d062f047864e444236720ea347af8",
              "tools/clippy/semantic_contract_model.ouro": "a5626a8e1e541c03addfa39d21987c11f00cb2ea",
              "tools/clippy/semantic_contracts.ouro": "9826e2a7b3067100823838e5a1360634045e37bd",
              "tools/clippy/semantic_definition.ouro": "252e4d069d0410f750997eb3afc29e2ad3a06d3b",
              "tools/clippy/semantic_model.ouro": "c7087cf9eacc28b35e19174cda6d5a81054f5473",
              "tools/clippy/semantic_origins.ouro": "b58faa232e65556a69c7e2a18feb44f717d8745a",
              "tools/clippy/semantic_proof.ouro": "6bf538cdeeacd051add6c7c3f5f6aee688c9414d",
              "tools/clippy/semantic_rules.ouro": "86e3657ed38be5513399d3eb258be90e2ab5046d"
          }
          owners = {
              "scripts/ci_gate.py": "16ea86bf60a3d3347c30af2f562a6b6b500b89ef",
              "scripts/bootstrap_compiler.py": "937f93c11a055e42c0ecb22f8c10fce2d748817c",
              "scripts/bootstrap_inputs.py": "e49f21cc8df6b7dac89fc853631a75d0a7e47458",
              "scripts/clippy_grade_suite.py": "e1c7832d99b38f87d4e1556968104cb1050dba52",
              "scripts/ouro1.sh": "9665ebb00049d05c097a29d77ec5083b524f9e2d",
              "scripts/build_tool.sh": "ff83eec44937a8d9aa37c5af67aae2d57b93f4c3",
              "scripts/native_tool_build.py": "0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce",
              "scripts/ourosmith/host.py": "289fd1e88a7f3f0927f6ceca5b6f559ba1cd071c",
              "scripts/ourosmith/limits.py": "aa92339539ea580b0a2569d7df7f085f94765156",
              "scripts/analyze_core_checks.py": "7bcd6e929af98d34c731197f9b81ad53ecae7e90",
              "tests/quality_test_support.ouro": "2c6a2cf8d2746af0da965ab8562e465fb9f19f0d"
          }
          product, base = os.environ["PRODUCT_SHA"], os.environ["BASE_SHA"]
          blobs = {path: git("rev-parse", "HEAD:" + path) for path in {**expected, **owners}}
          scope = git("diff", "--name-only", base, product).splitlines()
          report = {"product": product, "base": base, "probe": git("rev-parse", "HEAD"),
                    "parent": git("rev-parse", "HEAD^"), "product_parent": git("rev-parse", product + "^"),
                    "product_paths": scope, "blobs": blobs, "host_run": 36360415225,
                    "host_artifact": 10946340921}
          Path("_build/ci/clippy-nullary/source.json").write_text(json.dumps(report, indent=2) + "\n")
          assert report["probe"] == os.environ["GITHUB_SHA"]
          assert report["parent"] == product and report["product_parent"] == base
          assert git("diff", "--name-only", "HEAD^", "HEAD") == ".github/workflows/clippy-nullary-source-probe.yml"
          assert scope == sorted(expected) and len(scope) == 34, scope
          assert blobs == {**expected, **owners}, blobs
          assert not git("status", "--porcelain", "--untracked-files=no")
          manifest = json.loads(Path("tests/clippy_semantic/cases.json").read_text())["cases"]
          assert len(manifest) == 212 and len({row["path"] for row in manifest}) == 212
          labels = re.findall(r'MkPair String Bool "([^"]+)"',
                              Path("tests/clippy_semantic/contracts.ouro").read_text())
          assert len(labels) == len(set(labels)) == 54
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Verify the source-bound Linux compiler input key
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci_gate.py --compiler-artifact key >_build/ci/clippy-nullary/key.stdout 2>_build/ci/clippy-nullary/key.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/clippy-nullary/key.rc
          cat _build/ci/clippy-nullary/key.stdout
          cat _build/ci/clippy-nullary/key.stderr >&2
          test "$rc" -eq 0
          test ! -s _build/ci/clippy-nullary/key.stderr
          test "$(cat _build/ci/clippy-nullary/key.stdout)" = key=f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c

      - name: Download verified official Host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10946340921
          run-id: 36360415225
          github-token: ${{ github.token }}
          path: _build/ci
          merge-multiple: true

      - name: Verify and install official source-bound compiler
        id: import
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7 >_build/ci/clippy-nullary/import.stdout 2>_build/ci/clippy-nullary/import.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/clippy-nullary/import.rc
          cat _build/ci/clippy-nullary/import.stdout
          cat _build/ci/clippy-nullary/import.stderr >&2
          test "$rc" -eq 0
          test ! -s _build/ci/clippy-nullary/import.stderr
          grep -Fx 'CI_COMPILER: PASS current source, host compiler, binary and bootstrap evidence' _build/ci/clippy-nullary/import.stdout
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path("_build/c/ouro1.bootstrap.json").read_text())
          selected = receipt["selected"]
          assert receipt["kind"] == "ouro.current-c-bootstrap.v1"
          assert receipt["key"] == "f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c"
          assert receipt["binary_sha256"] == "460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c"
          assert len(selected["sources"]) == 177 and len(selected["stage0"]) == 2
          for inputs in (selected["sources"], selected["stage0"]):
              for path, expected in inputs.items():
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          Path("_build/ci/clippy-nullary/compiler-inputs.json").write_text(json.dumps(
              {"key": receipt["key"], "sources": selected["sources"], "stage0": selected["stage0"]},
              indent=2, sort_keys=True) + "\n")
          PY
          sha256sum _build/c/ouro1 >_build/ci/clippy-nullary/compiler-before.sha256
          test "$(cut -d ' ' -f 1 _build/ci/clippy-nullary/compiler-before.sha256)" = 460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c

      - name: Compiler acceptance of all six fixtures
        if: ${{ always() && matrix.check == 'acceptance' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          from analyze_core_checks import command_environment
          from ourosmith.host import shell
          from ourosmith.limits import run_limited

          files = [
              "tests/clippy_semantic/fixtures/pure-parse-nullary-helper.ouro",
              "tests/clippy_semantic/fixtures/pure-parse-constructor-shadow.ouro",
              "tests/clippy_semantic/fixtures/pure-parse-global-function-helper.ouro",
              "tests/clippy_semantic/fixtures/pure-parse-nonnullary-helper.ouro",
              "tests/clippy_semantic/fixtures/pure-parse-ignored-helper.ouro",
              "tests/clippy_semantic/fixtures/pure-parse-local-name.ouro",
          ]
          out = Path("_build/ci/clippy-nullary/acceptance")
          out.mkdir(parents=True, exist_ok=True)
          rows = []
          env = command_environment()
          for index, source in enumerate(files):
              command = [shell().as_posix(), "scripts/ouro1.sh", "check", source, "200000"]
              result = run_limited(command, cwd=Path.cwd(), env=env, timeout_s=300, memory_mb=2944)
              stem = f"{index:02}-{Path(source).stem}"
              (out / (stem + ".stdout")).write_text(result.stdout)
              (out / (stem + ".stderr")).write_text(result.stderr)
              passed = result.ok and result.stdout == "CHECK_OK\n" and not result.stderr
              rows.append({"file": source, "command": command, "pass": passed,
                           "exit_code": result.returncode, "resource": result.classify(),
                           "seconds": result.elapsed_s, "peak_mb": result.peak_rss_mb})
              report = {"kind": "ouro.clippy-nullary-acceptance.v1",
                        "pass": len(rows) == 6 and all(row["pass"] for row in rows),
                        "requested_checks": 6, "checks": rows}
              (out / "report.json").write_text(json.dumps(report, indent=2) + "\n")
              print("NATIVE_ACCEPT " + source + (" PASS" if passed else " FAIL"), flush=True)
          raise SystemExit(0 if report["pass"] else 1)
          PY

      - name: Run all canonical native law groups
        if: ${{ always() && matrix.check == 'laws' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          python3 scripts/clippy_grade_suite.py --laws-only --out _build/ci/clippy-nullary/laws >_build/ci/clippy-nullary/laws.stdout 2>_build/ci/clippy-nullary/laws.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/clippy-nullary/laws.rc
          cat _build/ci/clippy-nullary/laws.stdout
          cat _build/ci/clippy-nullary/laws.stderr >&2
          test "$rc" -eq 0
          test ! -s _build/ci/clippy-nullary/laws.stderr
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          out = Path("_build/ci/clippy-nullary/laws")
          report = json.loads((out / "semantic-laws.json").read_text())
          groups = ["base", "pure-parse", "quality", "expansion", "result", "collection",
                    "premises-0", "premises-1", "premises-2", "premises-3"]
          expected = [("tests/clippy_semantic/proofs.ouro", group) for group in groups]
          expected += [("tests/clippy_semantic/" + name + ".ouro", "")
                       for name in ("contracts", "resources", "lifetime", "precision", "process_status")]
          assert report["pass"] and len(report["cases"]) == 15
          assert [(row["entry"], row["group"]) for row in report["cases"]] == expected
          assert all(row["pass"] and row["exit_code"] == 0 for row in report["cases"])
          assert (out / "proofs-groups.stdout").read_text().splitlines() == groups
          assert not (out / "proofs-groups.stderr").read_bytes()
          for entry, group in expected:
              label = Path(entry).stem + ("-" + group if group else "")
              assert not (out / (label + "-laws.stderr")).read_bytes(), label
          labels = re.findall(r'MkPair String Bool "([^"]+)"',
                              Path("tests/clippy_semantic/contracts.ouro").read_text())
          assert len(labels) == 54
          assert (out / "contracts-laws.stdout").read_text().splitlines() == ["PASS " + label for label in labels]
          print("CLIPPY_LAWS_EXACT PASS groups=15 contracts=54")
          PY

      - name: Run full canonical precision manifest and aliases
        if: ${{ always() && matrix.check == 'precision' && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          python3 scripts/clippy_grade_suite.py --precision-only --out _build/ci/clippy-nullary/precision >_build/ci/clippy-nullary/precision.stdout 2>_build/ci/clippy-nullary/precision.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" >_build/ci/clippy-nullary/precision.rc
          cat _build/ci/clippy-nullary/precision.stdout
          cat _build/ci/clippy-nullary/precision.stderr >&2
          test "$rc" -eq 0
          test ! -s _build/ci/clippy-nullary/precision.stderr
          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path("_build/ci/clippy-nullary/precision")
          manifest = json.loads(Path("tests/clippy_semantic/cases.json").read_text())["cases"]
          report = json.loads((out / "semantic-precision/results.json").read_text())
          assert len(manifest) == 212 and report["pass"] and len(report["cases"]) == 212
          assert [row["path"] for row in report["cases"]] == [row["path"] for row in manifest]
          assert all(row["pass"] and not row["failure"] for row in report["cases"])
          assert all(sorted(row["codes"]) == sorted(case["codes"])
                     for row, case in zip(report["cases"], manifest))
          for case in manifest:
              assert not (out / "semantic-precision" / (Path(case["path"]).stem + ".stderr")).read_bytes()
          aliases = json.loads((out / "alias-scope/semantic-precision/results.json").read_text())
          expected = ["qualified.ouro", "selected.ouro", "selected-hidden.ouro", "missing-member.ouro",
                      "transitive.ouro", "unknown-alias.ouro"]
          assert aliases["pass"] and len(aliases["cases"]) == 6
          assert [row["path"] for row in aliases["cases"]] == expected
          assert all(row["pass"] and not row["failure"] for row in aliases["cases"])
          for path in expected:
              assert not (out / "alias-scope/semantic-precision" / (Path(path).stem + ".stderr")).read_bytes()
          print("CLIPPY_PRECISION_EXACT PASS cases=212 aliases=6")
          PY

      - name: Preserve compiler identity and source snapshot after tests
        if: ${{ always() && steps.import.outcome == 'success' }}
        run: |
          set -euo pipefail
          sha256sum _build/c/ouro1 >_build/ci/clippy-nullary/compiler-after.sha256
          cmp _build/ci/clippy-nullary/compiler-before.sha256 _build/ci/clippy-nullary/compiler-after.sha256
          git diff --exit-code "$PRODUCT_SHA" -- . ':!.github/workflows/clippy-nullary-source-probe.yml'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload complete focused reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clippy-nullary-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            _build/ci/clippy-nullary/
            _build/c/ouro-collect.build.log
