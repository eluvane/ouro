      - name: Download matching verified Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.host-compiler.outputs.artifact }}
          path: _build/ci

      - name: Verify and install source-bound Host
        env:
          COMPILER_SHA256: ${{ needs.host-compiler.outputs.sha256 }}
        run: |
          mkdir -p _build/char_probe
          rc=0
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$COMPILER_SHA256" >_build/char_probe/import.stdout 2>_build/char_probe/import.stderr || rc=$?
          printf '%s\n' "$rc" >_build/char_probe/import.rc
          cat _build/char_probe/import.stdout
          cat _build/char_probe/import.stderr >&2
          test "$rc" -eq 0

      - name: Run retained Character acceptance gate
        env:
          PROBE_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p _build/char_probe
          run_logged() {
            probe_label=$1
            shift
            probe_status=0
            "$@" >"_build/char_probe/$probe_label.stdout" 2>"_build/char_probe/$probe_label.stderr" || probe_status=$?
            printf '%s\n' "$probe_status" >"_build/char_probe/$probe_label.rc"
            cat "_build/char_probe/$probe_label.stdout"
            cat "_build/char_probe/$probe_label.stderr" >&2
            return "$probe_status"
          }
          case "$PROBE_GROUP" in
            native-canonical|native-codec|native-format)
              ulimit -s 131072
              case "$PROBE_GROUP" in
                native-canonical) entry=tests/compiler_structural_tests.ouro; rows=120; suite=std-test ;;
                native-codec) entry=tests/source_span_tests.ouro; rows=41; suite=source-spans ;;
                native-format) entry=tests/analyze/precision/format_fix.ouro; rows=41; suite=format-fix ;;
              esac
              run_logged native-check sh scripts/ouro1.sh check "$entry" 16000
              printf 'CHECK_OK\n' | cmp - _build/char_probe/native-check.stdout
              test ! -s _build/char_probe/native-check.stderr
              OURO_BUILD_TOOL_MODE=native run_logged native-build sh scripts/build_tool.sh "$entry" "_build/c/$PROBE_GROUP" 60000
              case "$PROBE_GROUP" in
                native-codec) run_logged native-run "_build/c/$PROBE_GROUP" --source-span-laws ;;
                *) run_logged native-run "_build/c/$PROBE_GROUP" ;;
              esac
              CHAR_ENTRY="$entry" CHAR_ROWS="$rows" CHAR_SUITE="$suite" python3 - <<'PY'
          import os, re
          from pathlib import Path
          suite = os.environ['CHAR_SUITE']
          source = Path(os.environ['CHAR_ENTRY']).read_text(encoding='utf-8')
          pattern = r'assert_(?:true|eq)\s*(?:\(\s*)?"([^"\n]+)"' if suite == 'std-test' else r'MkPair String Bool "([^"\n]+)"'
          labels = re.findall(pattern, source)
          assert len(labels) == int(os.environ['CHAR_ROWS']), labels
          if suite == 'std-test':
              assert labels.count('canonical source smoke behavior') == 1
              expected = ''.join('ok ' + label + '\n' for label in labels)
          else:
              expected = ''.join('PRECISION_OK ' + label + '\n' for label in labels)
              expected += 'PRECISION_SUITE ' + suite + ' rows=' + os.environ['CHAR_ROWS'] + '\n'
          actual = Path('_build/char_probe/native-run.stdout').read_bytes()
          assert actual == expected.encode(), actual.decode(errors='replace')
          assert not Path('_build/char_probe/native-run.stderr').read_bytes()
          print('CHAR_NATIVE_OUTPUT_OK suite=' + suite + ' rows=' + os.environ['CHAR_ROWS'])
          PY
              ;;
            compiler-6|compiler-14|compiler-16)
              run_logged "$PROBE_GROUP" python3 scripts/ci_gate.py --profile pr --group "$PROBE_GROUP" --fail-fast --out "_build/ci/char-$PROBE_GROUP"
              ;;
            fmt)
              command -v "${CC:-cc}"
              run_logged fmt sh scripts/fmt_suite.sh
              ! grep -F 'FMT_SUITE: SKIP' _build/char_probe/fmt.stderr
              ;;
            fix)
              run_logged fix sh scripts/fix_suite.sh
              ;;
            ergonomics)
              run_logged ergonomics python3 scripts/ouro_smith.py manifest --prefix=ERGO.,REC. --out=_build/ergonomics_suite --label=ERGONOMICS_SUITE
              ;;
            smith-character)
              run_logged smith-inventory python3 scripts/ouro_smith.py inventory --out _build/smith/char-inventory
              for seed in 0 1 2 3; do
                run_logged "smith-$seed" python3 scripts/ouro_smith.py replay --layer surface --seed "$seed" --case "surface-$seed-form-character-scalar" --out "_build/smith/char-$seed"
              done
              python3 - <<'PY'
          import json
          from pathlib import Path
          for seed in range(4):
              report = json.loads(Path('_build/smith/char-' + str(seed) + '/report.json').read_text(encoding='utf-8'))
              assert report['kind'] == 'ouro.smith-report.v1' and report['pass'], report
              assert report['seeds'] == [seed], report['seeds']
              assert not report['findings'] and not report['skips']
              assert not any(gap.get('blocking') for gap in report['gaps'])
              layers = report['summary']['layers']
              assert set(layers) == {'surface'}, layers
              surface = layers['surface']
              assert surface['cases'] == 1 and surface['positive_checks'] == 1 and surface['negative_checks'] == 0, surface
              assert not surface['abstentions'] and surface['findings'] == 0 and surface['property_checks'] > 0, surface
              assert surface['coverage']['features'] == {'form:character-scalar': 1}, surface['coverage']
          print('CHAR_SMITH_SELECTED_OUTPUT_OK seeds=4 cases=4')
          PY
              ;;
            strict)
              run_logged strict python3 scripts/memory_budget_suite.py --case strict-quality-gate --out _build/memory
              ;;
            *) exit 2 ;;
          esac

      - name: Upload complete Character acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: char-${{ matrix.group }}-${{ github.run_id }}
          path: |
            _build/char_probe/
            _build/ci/char-*/
            _build/compiler_check_suite_6/
            _build/compiler_check_suite_14/
            _build/compiler_check_suite_16/
            _build/fmt_suite/
            _build/fix_suite/
            _build/ergonomics_suite/
            _build/smith/char-*/
            _build/memory/
            _build/source_spans.progress
            _build/c/ouro1.bootstrap.json
            _build/**/*.json
            _build/**/*.log
            _build/**/*.out
            _build/**/*.err
            _build/**/*.stdout
            _build/**/*.stderr
            _build/**/*.sarif
            _build/**/*.md
          if-no-files-found: error
          retention-days: 14
