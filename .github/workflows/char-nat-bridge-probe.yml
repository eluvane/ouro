name: Unicode scalar Nat bridge acceptance probe

on:
  push:
    branches: [ codef/char-nat-bridge-probe ]
    paths: [ .github/workflows/char-nat-bridge-probe.yml ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: char-nat-bridge-probe-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"
  OURO_CACHE_DIR: _cache/ouro
  OURO_BUILD_DIR: _build
  OURO_C_BUILD_DIR: _build/c
  OURO_CCACHE: disabled

jobs:
  host-compiler:
    name: Fresh matching Character Host compiler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Verify reviewed Character product and retained Nat base
        run: |
          test "$(git rev-parse HEAD^)" = 1344d4c703442f42d545d9607bbbaa991002a930
          test "$(git rev-parse HEAD^^)" = 6b1bfb211199415b1a4a60771796037ad460e504
          test "$(git rev-parse HEAD^^^)" = a9cfa54f09c3b02ffb22ff1b423c04a78d380764
          test "$(git rev-parse HEAD^^^^)" = 973c3a21342e9d6e029479fb33ed7207d010c1bd
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/char-nat-bridge-probe.yml
          python3 - <<'PY'
          import json, subprocess
          expected = json.loads('["CHANGELOG.md", "compiler/canonical_model.ouro", "compiler/lexer.ouro", "compiler/pipeline.ouro", "compiler/preprocess_import.ouro", "compiler/preprocess_record.ouro", "compiler/preprocess_record_decls.ouro", "compiler/preprocess_record_expr.ouro", "compiler/preprocess_record_text.ouro", "compiler/preprocess_record_text_base.ouro", "compiler/preprocess_record_update.ouro", "compiler/source_text.ouro", "docs/language/ergonomic-syntax.md", "docs/syntax.md", "docs/tcb.md", "quality/smith/strategies.json", "scripts/bootstrap_compiler_test.py", "scripts/compact_source.py", "scripts/ourosmith/surface/forms.py", "scripts/selfhost_module_cache.py", "scripts/structural_quality_legacy.py", "tests/analyze/precision/format_fix.ouro", "tests/canonical.ouro", "tests/character_literal_cases.ouro", "tests/compiler_driver_tests.ouro", "tests/language_ergonomics/cases.json", "tests/source_span_tests.ouro", "tools/analyze/format.ouro", "tools/collect_core.ouro", "tools/fix/lex.ouro", "tools/structural/lex.ouro"]')
          actual = subprocess.check_output(['git', 'diff', '--name-only', '6b1bfb211199415b1a4a60771796037ad460e504', '1344d4c703442f42d545d9607bbbaa991002a930'], text=True).splitlines()
          assert actual == expected, (actual, expected)
          refresh_paths = ['compiler/bootstrap/c-bootstrap-v1.json', 'compiler/bootstrap/c-bootstrap-v1.tar.gz', 'docs/build.md', 'scripts/refresh_nat_bridge.py', 'scripts/refresh_nat_bridge_test.py']
          assert subprocess.check_output(['git', 'diff', '--name-only', 'a9cfa54f09c3b02ffb22ff1b423c04a78d380764', '6b1bfb211199415b1a4a60771796037ad460e504'], text=True).splitlines() == refresh_paths
          assert not subprocess.check_output(['git', 'diff', '--name-only', 'a9cfa54f09c3b02ffb22ff1b423c04a78d380764', '6b1bfb211199415b1a4a60771796037ad460e504', '--', 'compiler/stage0', 'runtime'], text=True).strip()
          assert not subprocess.check_output(['git', 'diff', '--name-only', '6b1bfb211199415b1a4a60771796037ad460e504', '1344d4c703442f42d545d9607bbbaa991002a930', '--', *refresh_paths], text=True).strip()
          retained = json.loads('["compiler/lower_nat.ouro", "compiler/core.ouro", "compiler/base.ouro", "compiler/ast.ouro", "compiler/pipeline_abi.ouro", "docs/generated_artifact_hashes.sha256", "tools/test/suites.ouro", "tests/compiler_structural_tests.ouro", "tests/analyze/precision/assertions.ouro", "scripts/ci_gate.py", "scripts/build_tool.sh", "scripts/fmt_suite.sh", "scripts/fix_suite.sh", "scripts/memory_budget_suite.py", "scripts/ouro_smith.py", "scripts/bootstrap_compiler.py", "compiler/bootstrap/c-bootstrap-v1.json", "quality/memory_budgets.json"]')
          assert not subprocess.check_output(['git', 'diff', '--name-only', '6b1bfb211199415b1a4a60771796037ad460e504', '1344d4c703442f42d545d9607bbbaa991002a930', '--', *retained], text=True).strip()
          assert not subprocess.check_output(['git', 'diff', '--name-only', '6b1bfb211199415b1a4a60771796037ad460e504', '1344d4c703442f42d545d9607bbbaa991002a930', '--', 'compiler/stage0', 'runtime'], text=True).strip()
          PY
          test "$(git hash-object CHANGELOG.md)" = b332a35a32b2c2b406234189703c5390f4d99932
          test "$(git hash-object compiler/canonical_model.ouro)" = 7624161696472f205958ef2421d37e0440296f5f
          test "$(git hash-object compiler/lexer.ouro)" = 03f0296aeb10ee8315950aace4579eb457a3b3cd
          test "$(git hash-object compiler/pipeline.ouro)" = 22dcd900c0fffee36bbaf42fe2bd3e187c8e430d
          test "$(git hash-object compiler/preprocess_import.ouro)" = fd9fa1a8d078b0a040cbfcd875e43759aa9bc3a6
          test "$(git hash-object compiler/preprocess_record.ouro)" = 347b50d62361cd6f88956868c22e0e221595348a
          test "$(git hash-object compiler/preprocess_record_decls.ouro)" = 793a3d7bcf55b2162413b5227f419fe842cbb597
          test "$(git hash-object compiler/preprocess_record_expr.ouro)" = 10682414f4e3b833057f7a5a354ced04efa00c06
          test "$(git hash-object compiler/preprocess_record_text.ouro)" = 3dc1738b745164ebd62395df9640a2e6a1a20fef
          test "$(git hash-object compiler/preprocess_record_text_base.ouro)" = 28dbb4b897766b619d1a40720f2da0229b1cc0d0
          test "$(git hash-object compiler/preprocess_record_update.ouro)" = 9f4efecaaaf643245534daf7dbf28edd6086975f
          test "$(git hash-object compiler/source_text.ouro)" = 7c4386311e28fe003caad722c0c84be253f47ce2
          test "$(git hash-object docs/language/ergonomic-syntax.md)" = 53b39f332c2142207d25ccd9a90fc3e467ee7a78
          test "$(git hash-object docs/syntax.md)" = 286d51065f7f4058f870c57ace164b56a0b57402
          test "$(git hash-object docs/tcb.md)" = e39b1651881a3707b357e71aa8b1fb33412e4a1b
          test "$(git hash-object quality/smith/strategies.json)" = 28f5672d3a1a60c2f1307cf0a78c6e4e79b03e3a
          test "$(git hash-object scripts/bootstrap_compiler_test.py)" = 3fad22936ec14ae97f598fd598aaddff3e2670f1
          test "$(git hash-object scripts/compact_source.py)" = f9e6d1e39b8a61e22be4fa4c3bd370f8ebff2d3b
          test "$(git hash-object scripts/ourosmith/surface/forms.py)" = bc7c9562dbe3492bb4befc4e200292429e96f8bf
          test "$(git hash-object scripts/selfhost_module_cache.py)" = 4a09b93515e77c0ab88b83fdd7a2872de6f584b4
          test "$(git hash-object scripts/structural_quality_legacy.py)" = 26ad45ba36de2552da10988a95cb8cd66c65fdbd
          test "$(git hash-object tests/analyze/precision/format_fix.ouro)" = 2e8c8355990acc586b7867baaa181ddcc16d923d
          test "$(git hash-object tests/canonical.ouro)" = 5b33044a2b0a69fd77a99382ac446e02b4222557
          test "$(git hash-object tests/character_literal_cases.ouro)" = b0e0d52423da4a6e28354907feed5b1f5aefc851
          test "$(git hash-object tests/compiler_driver_tests.ouro)" = b00dca6901d927592fbbb9b727b7b2ed15c576b6
          test "$(git hash-object tests/language_ergonomics/cases.json)" = 19acb0f4392c676f2cae742ecf017f18f325f4b4
          test "$(git hash-object tests/source_span_tests.ouro)" = 6b7202f49e54064f8bf545c8b44a74158f52af89
          test "$(git hash-object tools/analyze/format.ouro)" = 1331d988f303fbc14f9e3a2030aa80d98e4c85a7
          test "$(git hash-object tools/collect_core.ouro)" = 59b102e062a90f46947e90f086c627cfea764fb8
          test "$(git hash-object tools/fix/lex.ouro)" = 121c1847b1ab5e163d33d38e1001405e7216663a
          test "$(git hash-object tools/structural/lex.ouro)" = 00a8b3c4a701f57f73570e8a6cb37b82e961249a
          test "$(git hash-object compiler/lower_nat.ouro)" = a106c758642f92c5329b81912a2f58b6582da411
          test "$(git hash-object compiler/core.ouro)" = 9c854884896b4385c2046e61e3729b07d78c9476
          test "$(git hash-object compiler/base.ouro)" = 7623a642c157773e3e276a5b00dffbced63ba5eb
          test "$(git hash-object compiler/ast.ouro)" = 933f1f4cf57e3d72cbafff318957558baedd991b
          test "$(git hash-object compiler/pipeline_abi.ouro)" = fe13cdaeb13617501ad217cfe751c8e41d884ac2
          test "$(git hash-object docs/generated_artifact_hashes.sha256)" = ede8b5e9e67ea566bef9497fe4e84ffdd36776ff
          test "$(git hash-object tools/test/suites.ouro)" = c3e7348a79969d8199a459049d9ba8caa1798335
          test "$(git hash-object tests/compiler_structural_tests.ouro)" = 6d5aa5df32c894abeabb529d4035e3aebb886ff1
          test "$(git hash-object tests/analyze/precision/assertions.ouro)" = 6e1ebb98a3b8ecf76487456d78e4ad82e393f330
          test "$(git hash-object scripts/ci_gate.py)" = 16ea86bf60a3d3347c30af2f562a6b6b500b89ef
          test "$(git hash-object scripts/build_tool.sh)" = ff83eec44937a8d9aa37c5af67aae2d57b93f4c3
          test "$(git hash-object scripts/fmt_suite.sh)" = 5d008377de63cf88f7a098d753ae73a5e19e02a2
          test "$(git hash-object scripts/fix_suite.sh)" = 054830893c0f05abafcc73d0f9453cf4de9f8d50
          test "$(git hash-object scripts/memory_budget_suite.py)" = a29775d83ad58c79fca093db1eafae97b77e2fc5
          test "$(git hash-object scripts/ouro_smith.py)" = e3ee39185a464afc28c269965cc940a14cde896a
          test "$(git hash-object scripts/bootstrap_compiler.py)" = 937f93c11a055e42c0ecb22f8c10fce2d748817c
          test "$(git hash-object compiler/bootstrap/c-bootstrap-v1.json)" = f3b14f5028a701028d29c79dc9b0fc2327a484ce
          test "$(git hash-object compiler/bootstrap/c-bootstrap-v1.tar.gz)" = b0d9871286450364ac6da322a1c4c8f65ab9368e
          test "$(git hash-object docs/build.md)" = 13dfc39c4e46c7ec8a1040ce398566e3d2889ebc
          test "$(git hash-object scripts/refresh_nat_bridge.py)" = 5430f2eb26ab2783fceeb19f0ec1da18349afe1d
          test "$(git hash-object scripts/refresh_nat_bridge_test.py)" = e737cce52975f7ba95a7f93419651da8c495c340
          test "$(git hash-object quality/memory_budgets.json)" = 9257b185a175b64474d9c014086771035ac8394f
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess, sys
          sys.path.insert(0, 'scripts')
          import ci_gate
          import hashlib
          manifest = json.loads(Path('compiler/bootstrap/c-bootstrap-v1.json').read_text(encoding='utf-8'))
          archive = Path(manifest['archive']).read_bytes()
          assert manifest['kind'] == 'ouro.c-bootstrap-inputs.v1'
          assert manifest['file_count'] == len(manifest['files']) == 68
          assert manifest['source_bytes'] == 1215146
          assert manifest['archive_bytes'] == len(archive) == 217061
          assert manifest['archive_sha256'] == hashlib.sha256(archive).hexdigest() == '863025d32d0a9c46b3d2e5cc5e8d8def1c636975685808bedcf0c4f22dea6aee'
          refresh = manifest['provenance']['compact_nat_refresh']
          assert refresh['base_revision'] == '973c3a21342e9d6e029479fb33ed7207d010c1bd'
          assert refresh['feature_revisions'] == ['a9cfa54f09c3b02ffb22ff1b423c04a78d380764']
          assert set(refresh['files']) == {'bridge/compiler/lower.ouro'}
          assert refresh['reviewed_patch_sha256'] == hashlib.sha256(refresh['reviewed_patch'].encode('utf-8')).hexdigest() == '6307dcf412f1fa9298c26b735ebe60594f25b027df4ea72b3d1994d6e1acb1b6'
          assert [row['name'] for row in refresh['source_copies']] == ['fallible_max_var', 'named_locals_max', 'spread_max_names', 'literal_nat_helpers', 'lower_xvnat']
          for path, digest in refresh['source_blobs'].items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == digest, path
          for row in refresh['source_copies']:
              assert hashlib.sha256(Path(row['source']).read_bytes()).hexdigest() == row['source_sha256'], row['source']
          for path, row in manifest['stage0'].items():
              seed = Path(path).read_bytes()
              assert len(seed) == row['bytes'] and hashlib.sha256(seed).hexdigest() == row['sha256'], path
          inventory = ci_gate.compiler_fixture_roots(Path.cwd())
          assert len(inventory) == 98, len(inventory)
          assert 'tests/compiler_nat_literal_tests.ouro' in ci_gate.compiler_shard_entries(inventory, 6)
          assert 'tests/compiler_driver_tests.ouro' in ci_gate.compiler_shard_entries(inventory, 14)
          assert 'tests/compiler_native_lint_tests.ouro' in ci_gate.compiler_shard_entries(inventory, 14)
          assert ci_gate.compiler_shard_entries(inventory, 16) == ['tests/source_span_tests.ouro']
          assert json.loads(Path('quality/memory_budgets.json').read_text(encoding='utf-8'))['budgets']['strict-quality-gate']['peak_rss_kb'] == 1024000
          vectors = Path('tests/character_literal_cases.ouro').read_text(encoding='utf-8')
          assert len(re.findall(r'MkPair \(List Nat\) Nat', vectors)) == 28
          assert len(re.findall(r'MkPair String \(List Nat\)', vectors)) == 29
          for name, pattern, count in [
              ('tests/compiler_structural_tests.ouro', r'assert_(?:true|eq)\s*(?:\(\s*)?"([^"\n]+)"', 120),
              ('tests/source_span_tests.ouro', r'MkPair String Bool "([^"\n]+)"', 41),
              ('tests/analyze/precision/format_fix.ouro', r'MkPair String Bool "([^"\n]+)"', 41),
          ]:
              assert len(re.findall(pattern, Path(name).read_text(encoding='utf-8'))) == count, name
          from ourosmith.surface.forms import programs
          for seed, scalar in enumerate(('A', 'é', '€', '😀')):
              selected = [case for case in programs(seed) if case[0] == 'character-scalar']
              assert len(selected) == 1, seed
              _, source, expected, units = selected[0]
              assert "'" + scalar + "'" in source and expected == 2 * ord(scalar) and not units
          PY

      - name: Verify refreshed historical Nat bridge without promotion
        run: |
          mkdir -p _build/char_probe
          python3 -B scripts/bootstrap_inputs.py verify >_build/char_probe/bridge-inventory.stdout 2>_build/char_probe/bridge-inventory.stderr
          python3 -B scripts/refresh_nat_bridge_test.py >_build/char_probe/bridge-source-tests.stdout 2>_build/char_probe/bridge-source-tests.stderr
          cat _build/char_probe/bridge-inventory.stdout
          cat _build/char_probe/bridge-source-tests.stderr >&2

      - name: Build fresh matching Host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Export verified Host and bootstrap evidence
        id: bundle
        run: |
          python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"
          echo "artifact=char-host-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload verified Host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: char-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/ci/host-compiler.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Host reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: char-host-reports-${{ github.run_id }}
          path: |
            _build/char_probe/bridge-*.stdout
            _build/char_probe/bridge-*.stderr
            _build/c/ouro1.bootstrap.json
            _build/bootstrap/**/*.json
            _build/bootstrap/**/*.log
          if-no-files-found: ignore
          retention-days: 14

