name: PR88 frontend lower cost probe

on:
  push:
    branches: [codef/pr88-frontend-lower-cost-probe]
    paths: [.github/workflows/pr88-frontend-lower-cost-probe.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr88-frontend-lower-cost-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "1"
  OURO_CACHE: "0"
  OURO_CCACHE: disabled
  OURO_MEM_TRACE: "0"
  OURO_FE_STITCH_TRACE: "0"
  OURO_FE_LOWER_COST_TRACE: "0"

jobs:
  frontend-lower-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout diagnostic-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Pin exact reviewed source and measurement owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          source = "973c3a21342e9d6e029479fb33ed7207d010c1bd"
          parent = "a5edb6eb7263b657f1823a12cb842e1f94d6b848"
          workflow = ".github/workflows/pr88-frontend-lower-cost-probe.yml"
          child = git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^") == source
          assert git("diff", "--name-only", "HEAD^", "HEAD").splitlines() == [workflow, "runtime/frontend_link.c"]
          assert git("rev-parse", "HEAD^^") == parent
          assert git("rev-parse", source + "^{tree}") == "2b4b6d86eba6b80060132c4f40ba80bff0106a14"
          assert git("rev-parse", "HEAD^:runtime/frontend_link.c") == "f10104eb4bc30055dabb3163a82f181c6eae9f1a"
          assert not git("status", "--porcelain")
          blobs = {
              "runtime/bootstrap.c": "5272a92d85d3f693407ec1f5d0e091fe461f8018",
              "runtime/frontend_link.c": "f1e5a9d335b1556ac6924966498dc8388a932aa9",
              "runtime/ouro_rt.c": "5fa7a64f29ef9b25f23b9e322d111e7070516b36",
              "runtime/ouro_rt.h": "1d13494869a5a73abf38cc3e3c1fc7cf4ae0aa22",
              "compiler/lexer.ouro": "b73355a657c9cd09dd83d26c36eb128cfe004207",
              "compiler/lower_support.ouro": "5975a3460c1e395b35dd8d298ea77a11c16af5ef",
              "compiler/pipeline_support.ouro": "ce04ad29ec81655e471aab29ad7310b1f6aba384",
              "compiler/pipeline.ouro": "470f65814e57200b02580131a0df786fa74b2e18",
              "compiler/file_check_work.ouro": "ffb661db478eca99c415bdfc3f31403aa3f60d29",
              "compiler/ast.ouro": "933f1f4cf57e3d72cbafff318957558baedd991b",
              "compiler/desugar_match.ouro": "ed9432519cb4faaf0805ef17914d0cbddc29c0dc",
              "compiler/lower_rewrite.ouro": "9d631e854b4e067624044eace39fcd20a57b4163",
              "compiler/lower_decl_types.ouro": "9f03346412a7f5bad88600449b49f6b469b98c73",
              "compiler/pipeline_check.ouro": "34e44bcf24902bfbdb1c4b70305aaf0a16c9847f",
              "compiler/lower_env.ouro": "56776adc3e2683aa51e01c9c54a608e18459b94a",
              "compiler/lower_implicit.ouro": "d6b712898f76eb5c57987398aa22be8f03bb305e",
              "compiler/lower_implicit_function.ouro": "d2b568efa8be3dc1646c14847c6876c466e7eda0",
              "std/data.ouro": "b0525f0b9f90f1692adbe6cd38af963e88d73022",
              "scripts/ci_gate.py": "16ea86bf60a3d3347c30af2f562a6b6b500b89ef",
              "scripts/frontend_host_suite.py": "0caab7695c6538e8d455f38802bd886b8f285a40",
              "scripts/frontend_security_suite.sh": "d56a1d3a0770399cd3ec1489a115bb03ffe54cab",
              "scripts/native_tool_build.py": "0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce",
              "scripts/ouro_build.py": "d42206ac82042ab3eddf2542689716e8a0c77cd4",
              "scripts/ourosmith/limits.py": "aa92339539ea580b0a2569d7df7f085f94765156",
              "scripts/ourosmith/exec_child.py": "f04496548bed88cbe99f47eb951e7ece945138b7",
              "scripts/memory_watch.py": "41365c4e4667e52880ddbda90c011f6dd31c7645",
              "scripts/kernel_scale.py": "8317bc5a2f060b8e98d8a79373d29f9a93110b85",
              "scripts/repo_support.py": "212bdfb18a1c25d45d4794afff19e9a0ae46036f",
              "Ouro.seal": "f078fbe47670a948c96a1d8076761c2140455bbe",
          }
          for path, blob in blobs.items():
              assert git("hash-object", path) == blob, path
          out = Path("_build/frontend_lower_cost/reports")
          out.mkdir(parents=True, exist_ok=True)
          (out / "source.json").write_text(json.dumps({"source_sha": child,
              "reviewed_base": source, "reviewed_base_parent": parent, "blobs": blobs,
              "diagnostic_paths": [workflow, "runtime/frontend_link.c"],
              "baseline_host_run": 36360415225,
              "baseline_input_key": "f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c",
              "baseline_binary_sha256": "460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c"}, indent=2) + "\n")
          print("PROBE_SOURCE: PASS exact source tree and owners")
          PY
      - name: Fresh source-bound Host with unchanged bootstrap checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import argparse, hashlib, json, os, subprocess, sys, time

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import bootstrap_compiler as bootstrap
          import ouro_build as build
          from repo_support import sha256_file, write_json_atomic

          reports = root / "_build/frontend_lower_cost/reports"
          private = root / "_build/frontend_lower_cost/private"
          private.mkdir(parents=True)
          env = dict(os.environ)
          for key in ("OURO_MEM_TRACE", "OURO_FE_STITCH_TRACE", "OURO_FE_LOWER_COST_TRACE", "OURO_EMIT_IO_SHIMS"):
              env.pop(key, None)
          command = [sys.executable, "scripts/ouro_build.py", "build", "--jobs", "1",
                     "--no-cache", "--ccache", "disabled", "--verbosity", "quiet"]
          record = {"kind": "ouro.frontend-lower-cost-host.v1", "pass": False, "fresh": True,
                    "trace_enabled": False, "command": command}
          started = time.monotonic()
          try:
              with (private / "host.stdout").open("wb") as output, (private / "host.stderr").open("wb") as errors:
                  result = subprocess.run(command, cwd=root, env=env, stdout=output, stderr=errors, check=False)
              record.update(returncode=result.returncode, elapsed_s=round(time.monotonic() - started, 6),
                            stdout_sha256=sha256_file(private / "host.stdout"),
                            stderr_sha256=sha256_file(private / "host.stderr"))
              candidates = list((root / "_build/bootstrap").glob("*/report.json"))
              assert len(candidates) == 1, "expected one fresh bootstrap report"
              raw = json.loads(candidates[0].read_text())
              record.update(report_sha256=sha256_file(candidates[0]), workers=raw["workers"],
                            memory_mib=raw["memory_mib"], timeout_s=raw["timeout_s"],
                            bootstrap_pass=raw["pass"])
              record["phases"] = [{"phase": phase["phase"], "pass": phase["pass"],
                  "commands": [{key: row[key] for key in ("label", "status", "returncode", "elapsed_s",
                                                         "stdout_sha256", "stderr_sha256")}
                               for row in phase["commands"]]} for phase in raw["phases"]]
              assert result.returncode == 0 and raw["pass"], "fresh Host bootstrap failed"
              assert (raw["workers"], raw["memory_mib"], raw["timeout_s"]) == (1, 3072, 900)
              assert [phase["phase"] for phase in raw["phases"]] == ["c0", "bridge", "p1", "p2"]
              assert all(phase["pass"] for phase in raw["phases"])
              expected = {"backend_u.c": "921d54bc4c750fa987651dbb991d42f3f899a43773edcb3a586199860f769cb9",
                          "driver_u.c": "1e251688f9a571f78201f537db1409e4afff015443a76358868d54805b799d25"}
              comparison = raw["complete_generated_c_comparison"]
              assert set(comparison) == set(expected)
              for name, digest in expected.items():
                  assert comparison[name]["p1_sha256"] == comparison[name]["p2_sha256"] == digest, name
                  for phase in ("p1", "p2"):
                      assert sha256_file(candidates[0].parent / "out" / phase / name) == digest
              record["complete_generated_c_comparison"] = comparison
              rows = {row["label"]: row for row in raw["phases"][-1]["commands"]}
              protocols = {
                  "abi-laws": (0, "16bfd633ac142f812517f82604a5f083b387ea7f22399cd8d8cdeafb7d0cabe2",
                               "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"),
                  "behavior-good": (0, "ffd3fb9993008a7c07f30d182bf381ba8582b93614ac78921c7031b4e189954e",
                                    "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"),
                  "behavior-bad": (1, "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
                                   "885f2dbac26c585c151937b52231be5deb84894da6e64ef316dbec003f5bb0dd"),
              }
              for name, protocol in protocols.items():
                  row = rows[name]
                  assert row["status"] == "ok"
                  assert (row["returncode"], row["stdout_sha256"], row["stderr_sha256"]) == protocol, name
              binary = root / "_build/c/ouro1"
              receipt_path = binary.with_name("ouro1.bootstrap.json")
              receipt = json.loads(receipt_path.read_text())
              cfg = build.load_config(argparse.Namespace())
              selected = bootstrap.current_inputs(root, cfg, build)
              assert bootstrap.installed_current(binary, receipt_path, selected), "Host receipt not source-bound"
              assert len(selected["sources"]) == 177 and len(selected["stage0"]) == 2
              changes = []
              for name, digest in {**selected["sources"], **selected["stage0"]}.items():
                  baseline = subprocess.check_output(["git", "show", "973c3a21342e9d6e029479fb33ed7207d010c1bd:" + name])
                  if hashlib.sha256(baseline).hexdigest() != digest:
                      changes.append(name)
              assert changes == ["runtime/frontend_link.c"], changes
              assert selected["sources"]["runtime/frontend_link.c"] == "5407156c4048047f8049fd5f7c88d7021bba5d59130d0302cc6279a1ec2cf5df"
              assert receipt["key"] != "f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c"
              assert sha256_file(binary) != "460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c"
              record.update(input_key=receipt["key"], receipt_sha256=sha256_file(receipt_path),
                            binary_sha256=sha256_file(binary), source_bound=True,
                            selected_sources=selected["sources"], selected_stage0=selected["stage0"],
                            source_changes=changes, **{"pass": True})
          except Exception as error:
              record["validation_error"] = str(error)
              raise
          finally:
              write_json_atomic(reports / "host.json", record)
          print("LOWER_COST_HOST: PASS fresh source-bound Host; unchanged P1/P2, ABI and String protocols")
          PY
      - name: Measure stock worker at unchanged frontend limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import argparse, hashlib, json, os, re, sys, time

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import frontend_host_suite as frontend
          import memory_watch
          import ouro_build as build
          from kernel_scale import pin_one_cpu
          from ourosmith.limits import run_limited
          from repo_support import configure_native_stack, sha256_file, write_json_atomic

          work = root / "_build/frontend_lower_cost/work"
          reports = root / "_build/frontend_lower_cost/reports"
          work.mkdir(parents=True)
          configure_native_stack()
          parser = argparse.ArgumentParser()
          build.add_common(parser)
          args = parser.parse_args(["--jobs", "1", "--no-cache", "--ccache", "disabled", "--opt-level", "O0"])
          args.compiler = root / "_build/c/ouro1"
          args.out = work
          args.fuel = 200000
          cfg = build.load_config(args)
          before = frontend.snapshot(args, cfg)
          source_hashes = {str(Path(path).relative_to(root)) if Path(path).is_absolute() else path: digest
                           for path, digest in before["inputs"]["sources"].items()}
          digest = lambda value: hashlib.sha256(json.dumps(value, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          assert len(source_hashes) == 289
          assert digest(source_hashes) == "a23bbaeac73874063646d094316dfe74f04cd0fd843f6b770f98594e09b3d17a"
          units = before["units"]
          assert len(units) == 255 and units[-1] == "tools/native_build.ouro"
          assert digest(units) == "a8e7df9dfba66334c7a06e41576a1ecdcdcb02316dffe10f07a395697df550c0"
          host = json.loads((reports / "host.json").read_text())
          assert host["pass"] and host["source_bound"]
          binary_sha = host["binary_sha256"]
          assert before["inputs"]["compiler_sha256"] == binary_sha
          write_json_atomic(work / "inputs-before.json", before)
          write_json_atomic(reports / "inputs.json", {"units_count": len(units), "units_sha256": digest(units),
              "sources_count": len(source_hashes), "sources_sha256": digest(source_hashes),
              "snapshot_sha256": digest(before), "compiler_sha256": binary_sha, "sources": source_hashes})
          cpus = pin_one_cpu()
          assert len(cpus) == 1
          temporary = work / "tmp"
          temporary.mkdir()
          env = dict(os.environ, OURO_JOBS="1", OURO_FRONTEND_JOBS="1", OURO_CACHE="0",
                     OURO_CCACHE="disabled", OURO_MEM_TRACE="1", OURO_FE_STITCH_TRACE="1", OURO_FE_LOWER_COST_TRACE="1", PYTHONDONTWRITEBYTECODE="1",
                     TEMP=str(temporary), TMP=str(temporary), TMPDIR=str(temporary))
          command = [sys.executable, "-B", str(root / "scripts/frontend_host_suite.py"),
                     "--compiler", str(args.compiler), "--out", str(work.parent), "--jobs", "1",
                     "--worker", "--compiler", str(args.compiler), "--out", str(work),
                     "--jobs", "1", "--no-cache", "--ccache", "disabled", "--opt-level", "O0"]
          label_pattern = re.compile(r"OURO_MEM_HEAP label=(\S+) live_bytes=(\d+) phase_blocks=(\d+) perm_blocks=(\d+) static_blocks=(\d+) total_alloc_bytes=(\d+) reclaimed_bytes=(\d+)")
          fields = ["live_bytes", "phase_blocks", "perm_blocks", "static_blocks", "total_alloc_bytes", "reclaimed_bytes"]
          stitch_fields = ["index", "live_bytes", "total_alloc_bytes", "reclaimed_bytes", "lower_calls",
                           "compile_calls", "elaborate_surfaces_calls", "elaborate_calls", "check_calls"]
          stitch_pattern = re.compile(r"OURO_FE_STITCH label=(\S+) " + " ".join(name + r"=(\d+)" for name in stitch_fields))
          budget_fields = ["valid", "decl_types", "io_payloads", "definitions", "checker"]
          budget_pattern = re.compile(r"OURO_FE_LOWER_BUDGET " + " ".join(name + r"=(\d+)" for name in budget_fields))
          cost_fields = ["checkpoint", "valid", "class", "first", "last", "calls", "eval_ns", "clone_ns", "reset_ns",
                         "eval_alloc_bytes", "clone_alloc_bytes"]
          cost_pattern = re.compile(r"OURO_FE_LOWER_COST label=(window|total) " + " ".join(name + r"=(\d+)" for name in cost_fields))
          counts = {"preprocess": 0, "parse": 0}
          offsets, pending = {}, {}
          phases, samples = [], []
          started = time.monotonic()
          result = None
          report = {"kind": "ouro.frontend-lower-cost-probe.v1", "measurement_only": True,
                    "canonical_frontend_verdict": "not run by this diagnostic", "cpu": cpus,
                    "workers": 1, "build_timeout_s": 900, "memory_mib": 3072,
                    "trace": "OURO_MEM_TRACE=1 OURO_FE_STITCH_TRACE=1 OURO_FE_LOWER_COST_TRACE=1; OURO_EMIT_IO_SHIMS=1 only in emit-child",
                    "callback_sample_stride": {"lower": 512, "compile": 1, "elaborate_surfaces": 1,
                                               "elaborate": 128, "check": 64}, "stock_command": command}

          def phase_record(line, elapsed):
              match = budget_pattern.fullmatch(line)
              if match is not None:
                  return {"elapsed_s": round(elapsed, 6), "kind": "lower_budget", "label": "budget",
                          **dict(zip(budget_fields, map(int, match.groups())))}
              match = cost_pattern.fullmatch(line)
              if match is not None:
                  return {"elapsed_s": round(elapsed, 6), "kind": "lower_cost", "label": match.group(1),
                          **dict(zip(cost_fields, map(int, match.groups()[1:])))}
              if line.startswith(("OURO_FE_LOWER_BUDGET ", "OURO_FE_LOWER_COST ")):
                  raise ValueError("malformed lower-cost metric")
              match = stitch_pattern.fullmatch(line)
              if match is not None:
                  return {"elapsed_s": round(elapsed, 6), "kind": "stitch", "label": match.group(1),
                          **dict(zip(stitch_fields, map(int, match.groups()[1:])))}
              match = label_pattern.fullmatch(line)
              if match is None:
                  return None
              label = match.group(1)
              event = {"elapsed_s": round(elapsed, 6), "kind": "heap", "label": label,
                       **dict(zip(fields, map(int, match.groups()[1:])))}
              for phase, order in [("preprocess", list(reversed(units))), ("parse", units)]:
                  prefix = "frontend-after-" + phase + "-unit"
                  if label == prefix or label.startswith(prefix + "-"):
                      index = counts[phase]
                      assert index < len(order), (label, index)
                      event.update(unit_index=index, unit_path=order[index], completed=label == prefix)
                      if label == prefix:
                          counts[phase] += 1
              return event

          def collect_trace(handle):
              for path in sorted(work.glob("emit.*.err")):
                  offset = offsets.get(path, 0)
                  with path.open("rb") as stream:
                      stream.seek(offset)
                      new = stream.read()
                      offsets[path] = stream.tell()
                  lines = (pending.get(path, b"") + new).split(b"\n")
                  pending[path] = lines.pop()
                  assert len(pending[path]) <= 4096, "unexpected unbounded trace line"
                  for line in lines:
                      event = phase_record(line.decode("utf-8", errors="replace"), time.monotonic() - started)
                      if event is not None:
                          assert len(phases) < 4096, "unexpected trace volume"
                          phases.append(event)
                          handle.write(json.dumps(event, sort_keys=True) + "\n")
                  handle.flush()

          def sample_rss(handle):
              nodes = []
              for pid in memory_watch.process_tree(os.getpid()):
                  try:
                      argv = Path(f"/proc/{pid}/cmdline").read_bytes().split(b"\0")
                      executable = Path(os.fsdecode(argv[0])).name
                  except (OSError, IndexError):
                      continue
                  nodes.append({"pid": pid, "executable": executable,
                                "rss_kib": memory_watch.read_rss_kb(pid)})
              row = {"elapsed_s": round(time.monotonic() - started, 6),
                     "rss_kib": sum(node["rss_kib"] for node in nodes), "nodes": nodes}
              samples.append(row)
              handle.write(json.dumps(row, sort_keys=True) + "\n")
              handle.flush()

          def output_metadata(path):
              return {"name": path.name, "bytes": path.stat().st_size, "sha256": sha256_file(path)}

          def summarize_cost():
              budgets = [event for event in phases if event["kind"] == "lower_budget"]
              rows = [event for event in phases if event["kind"] == "lower_cost"]
              summary = {"kind": "ouro.frontend-lower-cost.v1", "valid": False, "complete": False,
                  "clock": "emitter CLOCK_MONOTONIC nanoseconds; elapsed_s is observer read time",
                  "eval_scope": "existing heap mark and argument applications; clone/reset retain their existing order",
                  "attribution": "actual resolved declaration kinds/list sizes, guarded collector contracts, structural expected presence",
                  "classes": {0: "unattributed", 1: "populate_decl_types", 2: "collect_io_payloads",
                              3: "lower_decls_env_signature", 4: "lower_decls_env_body", 5: "build_check_plan"},
                  "budgets": budgets, "rows": rows}
              try:
                  assert len(budgets) == 1 and budgets[0]["valid"] == 1
                  budget = budgets[0]
                  expected = [0, budget["decl_types"], budget["io_payloads"], budget["definitions"],
                              budget["definitions"], budget["checker"]]
                  assert budget["definitions"] > 0
                  assert budget["decl_types"] >= budget["definitions"] and budget["io_payloads"] >= budget["definitions"]
                  assert rows and all(row["valid"] == 1 and row["class"] in range(6) for row in rows)
                  assert all(row["calls"] == 0 for row in rows if row["class"] == 0)
                  metrics = ["calls", "eval_ns", "clone_ns", "reset_ns", "eval_alloc_bytes", "clone_alloc_bytes"]
                  groups = {}
                  for row in rows:
                      key = (row["label"], row["checkpoint"], row["first"], row["last"])
                      group = groups.setdefault(key, {})
                      assert row["class"] not in group, "duplicate metric class"
                      group[row["class"]] = row
                  assert all(set(group) == set(range(6)) for group in groups.values()), "incomplete metric group"
                  window_sums = [{name: 0 for name in metrics} for _ in range(6)]
                  next_first = 1
                  for (label, checkpoint, first, last), group in groups.items():
                      if label != "window":
                          continue
                      assert checkpoint == 0 and first == next_first and first <= last < first + 512
                      assert sum(row["calls"] for row in group.values()) == last - first + 1
                      for class_id, row in group.items():
                          for name in metrics:
                              window_sums[class_id][name] += row[name]
                      next_first = last + 1
                  totals = {}
                  for (label, checkpoint, first, last), group in groups.items():
                      if label != "total":
                          continue
                      assert first == 1 and checkpoint in (1, 2) and checkpoint not in totals
                      calls = expected if checkpoint == 2 else [*expected[:5], 0]
                      assert last == sum(calls)
                      assert [group[i]["calls"] for i in range(6)] == calls
                      totals[checkpoint] = group
                  assert all(window_sums[i]["calls"] <= expected[i] for i in range(6))
                  if 2 in totals:
                      assert 1 in totals and next_first == sum(expected) + 1
                      assert all(window_sums[i][name] == totals[2][i][name] for i in range(6) for name in metrics)
                      summary["complete"] = True
                  for checkpoint, group in totals.items():
                      marker = next(event for event in phases if event["kind"] == "stitch" and
                                    event["label"] == ("compile-begin" if checkpoint == 1 else "apply-end"))
                      assert marker["lower_calls"] == sum(row["calls"] for row in group.values())
                  if result is not None and result.ok:
                      assert summary["complete"], "successful worker needs complete lower-cost accounting"
                  summary.update(valid=True, accounted_calls=next_first - 1,
                                 expected_calls=sum(expected), complete_checkpoints=sorted(totals))
              except Exception as error:
                  summary["validation_error"] = str(error) or type(error).__name__
              write_json_atomic(reports / "lower-cost.json", summary)
              return summary

          try:
              with (reports / "phases.jsonl").open("w") as trace, (reports / "rss.jsonl").open("w") as rss:
                  with ThreadPoolExecutor(max_workers=1) as pool:
                      future = pool.submit(run_limited, command, cwd=root, env=env, timeout_s=900, memory_mb=3072)
                      next_sample = 0.0
                      while not future.done():
                          collect_trace(trace)
                          if time.monotonic() - started >= next_sample:
                              sample_rss(rss)
                              next_sample += 5.0
                          time.sleep(0.25)
                      result = future.result()
                      collect_trace(trace)
                      sample_rss(rss)
              report["stock_result"] = {"status": result.status, "returncode": result.returncode,
                  "elapsed_s": result.elapsed_s, "peak_rss_mb": result.peak_rss_mb,
                  "stdout_bytes": len(result.stdout.encode()), "stdout_sha256": hashlib.sha256(result.stdout.encode()).hexdigest(),
                  "stderr_bytes": len(result.stderr.encode()), "stderr_sha256": hashlib.sha256(result.stderr.encode()).hexdigest()}
              assert phases, "stock emitter produced no internal heap/phase markers"
              assert len(offsets) == 1, sorted(str(path) for path in offsets)
          except Exception as error:
              report["measurement_error"] = str(error)
              raise
          finally:
              lower_cost = summarize_cost()
              stitch_events = [event for event in phases if event["kind"] == "stitch"]
              report.update(inputs_unchanged=False, compiler_binary_unchanged=False,
                  elapsed_s=round(time.monotonic() - started, 6), completed_units=counts,
                  phase_events=len(phases), last_phase=phases[-1] if phases else None,
                  stitch_events=len(stitch_events), last_stitch=stitch_events[-1] if stitch_events else None,
                  sampled_peak_kib=max((sample["rss_kib"] for sample in samples), default=None),
                  lower_cost_valid=lower_cost["valid"], lower_cost_complete=lower_cost["complete"])
              try:
                  after = frontend.snapshot(args, cfg)
                  report["snapshot_after_sha256"] = digest(after)
                  report.update(inputs_unchanged=after == before,
                      compiler_binary_unchanged=sha256_file(args.compiler) == binary_sha,
                      compiler_stdout=[output_metadata(path) for path in sorted(work.glob("*.c"))],
                      compiler_stderr=[output_metadata(path) for path in sorted(work.glob("emit.*.err"))])
              except Exception as error:
                  report["finalization_error"] = str(error)
                  raise
              finally:
                  write_json_atomic(reports / "result.json", report)
          assert report["inputs_unchanged"] and report["compiler_binary_unchanged"]
          assert report["lower_cost_valid"], "invalid lower-pass attribution or timing accounting"
          if result.ok:
              assert result.stdout.endswith("FRONTEND_HOST_BUILD: PASS\n")
              assert counts == {"preprocess": 255, "parse": 255}
              labels = {event["label"] for event in stitch_events}
              assert {"binding-begin", "binding-end", "apply-begin", "apply-end", "result-clone-begin",
                      "result-clone-end", "discard-begin", "discard-end"} <= labels
          print("FRONTEND_LOWER_COST_MEASUREMENT:", result.status, "rc=" + str(result.returncode),
                "phase_events=" + str(len(phases)), "completed_units=" + json.dumps(counts, sort_keys=True))
          raise SystemExit(0 if result.ok else 1)
          PY
      - name: Upload phase counters and source-bound status reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-frontend-lower-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/frontend_lower_cost/reports
          if-no-files-found: error
          retention-days: 14
