name: PR80 compiler-16 (diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [codef/pr80-pr88-compiler16-diagnostic]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compiler-16:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CCACHE: disabled
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Run compiler-16 gate
        run: python3 scripts/ci_gate.py --profile pr --group compiler-16 --fail-fast --out _build/ci/pr-compiler-16

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr80-compiler16-${{ github.sha }}
          path: |
            _build/ci/pr-compiler-16
            _build/compiler_check_suite_16
          if-no-files-found: warn
          retention-days: 7
