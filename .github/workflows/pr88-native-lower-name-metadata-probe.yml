          }, indent=2)+'\n')
          (out / 'payload-proof.json').write_text(json.dumps({
              'frozen_payloads': {name: sha for name, (sha, _) in payload.items()},
              'original_relink_sha256': 'c6dbc04290e7a2314866d162c251c68b910ba0884a4c32b879ab6e562212782c',
              'adapted_relink_sha256': payload['relink_diagnostic.py'][0],
              'relink_adaptation': 'OBSERVED source SHA only; all relink and receipt checks retained',
              'default_controls_unchanged': True,
          }, indent=2)+'\n')
          PY
          printf '%s  %s\n' "$OBSERVED_LINK_SHA256" _build/diag-inputs/frontend_link.observed.c | sha256sum --check
          printf '%s  %s\n' "$OBSERVED_PATCH_SHA256" _build/diag-inputs/frontend-link-observed.patch | sha256sum --check

      - name: Relink immutable P2 C with only the disposable metadata reader
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from ourosmith.limits import run_limited
          out=Path('_build/ci/native-lower-name-metadata')
          argv=[sys.executable,'-B','_build/diag-inputs/relink_diagnostic.py',
                '--checkout',str(Path.cwd()),'--observed-link','_build/diag-inputs/frontend_link.observed.c']
          launcher=['sh','-c','ulimit -s unlimited 2>/dev/null || true; exec "$@"','diagnostic-relink',*argv]
          child_env=dict(os.environ,OURO_JOBS='1',OURO_FRONTEND_JOBS='1',
                         OURO_CACHE='0',OURO_ROOT=str(Path.cwd()),PYTHONDONTWRITEBYTECODE='1')
          allowed=os.sched_getaffinity(0)
          os.sched_setaffinity(0,{min(allowed)})
          record={'phase':'diagnostic-relink','status':'running','pass':False,'argv':argv,
                  'policy':{'timeout_s':1800,'memory_mib':3072,'cpu_count':1,'stack':'stock unlimited'}}
          def save():
              (out/'relink.json').write_text(json.dumps(record,indent=2)+'\n')
          save()
          try:
              result=run_limited(launcher,timeout_s=1800,memory_mb=3072,
                                 cwd=Path.cwd(),env=child_env,stdin_text='')
              (out/'relink.stdout').write_text(result.stdout)
              (out/'relink.stderr').write_text(result.stderr)
              (out/'relink.rc').write_text(str(result.returncode)+'\n')
              record.update(status=result.status,rc=result.returncode,elapsed_s=result.elapsed_s,
                            peak_rss_mb=result.peak_rss_mb,peak_rss_measured=False,**{'pass':result.ok})
              save()
              assert result.ok,record
          finally:
              os.sched_setaffinity(0,allowed)
          PY

      - name: Require exact stock and metadata-mode-OFF GOOD BAD protocols
        run: |
          set -euo pipefail
          OURO_MEM_TRACE=0 OURO_NATIVE_LOWER_NAME_ONLY=0 python3 -B _build/diag-inputs/run_default_controls.py --checkout "$PWD"

      - name: Borrow exact names after resolve and exit before all declaration checks
        run: |
          set -euo pipefail
          sha256sum --check _build/ci/native-lower-name-metadata/compiler.sha256
          python3 -B - <<'PY'
          import argparse, hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import bootstrap_compiler as bootstrap
          import ouro_build as build
          from ourosmith.limits import run_limited
          out = Path('_build/ci/native-lower-name-metadata')
          source = json.loads((out/'source.json').read_text())
          diagnostic = Path('_build/diag/native-lower-bounds/ouro1-bounds-diagnostic')
          diag = json.loads((diagnostic.parent/'diagnostic-manifest.json').read_text())
          assert diag['compiler_receipt'] is False and diag['official_inputs_and_receipt_unchanged'] is True
          assert diag['observer_sha256'] == os.environ['OBSERVED_LINK_SHA256']
          assert hashlib.sha256(diagnostic.read_bytes()).hexdigest() == diag['binary_sha256']
          units = source['ordered_units']
          assert len(units) == 172 and hashlib.sha256((''.join(u+'\n' for u in units)).encode()).hexdigest() == os.environ['UNIT_LIST_SHA256']
          argv = [str(diagnostic.resolve()), 'check', units[-1], '999999']
          for unit in units: argv.extend(['--unit', unit])
          launcher = ['sh', '-c', 'ulimit -s unlimited 2>/dev/null || true; exec "$@"', 'name-metadata', *argv]
          child_env = dict(os.environ, OURO_JOBS='1', OURO_FRONTEND_JOBS='1', OURO_BUILD_TOOL_MODE='native',
              OURO_CACHE='0', OURO_MEM_TRACE='1', OURO_NATIVE_LOWER_NAME_ONLY='1',
              OURO_ROOT=str(Path.cwd()), PYTHONDONTWRITEBYTECODE='1')
          allowed = os.sched_getaffinity(0)
          os.sched_setaffinity(0, {min(allowed)})
          record = {'status': 'not-run', 'pass': False, 'diagnostic_complete': False, 'compiler_receipt': False,
              'checker': 'NOT_RUN', 'acceptance': 'NOT_TESTED', 'acceptance_status': 'NOT_RUN',
              'source_sha': source['source_sha'], 'source_tree': source['source_tree'], 'ordered_units': units,
              'policy': {'timeout_s': 1800, 'memory_mib': 3072, 'cpu_count': 1, 'trace': '1', 'stack': 'stock unlimited'},
              'mode': 'OURO_NATIVE_LOWER_NAME_ONLY=1', 'expected_complete_exit': 86, 'expected_incomplete_exit': 87,
              'argv': argv, 'diagnostic_binary_sha256': diag['binary_sha256']}
          def save():
              (out/'manifest.json').write_text(json.dumps(record, indent=2, sort_keys=True)+'\n')
          save()
          try:
              record['status'] = 'running'; save()
              result = run_limited(launcher, timeout_s=1800, memory_mb=3072, cwd=Path.cwd(), env=child_env, stdin_text='')
              (out/'name-metadata.stdout').write_text(result.stdout)
              (out/'name-metadata.stderr').write_text(result.stderr)
              (out/'name-metadata.rc').write_text(str(result.returncode)+'\n')
              lines = result.stderr.splitlines()
              heaps = [line for line in lines if line.startswith('OURO_MEM_HEAP ')]
              metadata = [line for line in lines if line.startswith('NLT_NAME_META ')]
              rows = []
              for line in metadata[:-1]:
                  match = re.fullmatch(r'NLT_NAME_META sid=(\d+) found=([01]) length=(\d+) name_hex=([0-9a-f]*)', line)
                  if match:
                      sid, found, length = map(int, match.group(1, 2, 3))
                      raw = bytes.fromhex(match.group(4))
                      try: name = raw.decode('utf-8')
                      except UnicodeDecodeError: name = None
                      rows.append({'sid': sid, 'found': found, 'length': length, 'name_hex': match.group(4),
                                   'name_utf8': name, 'length_exact': len(raw) == length})
              final = 'NLT_NAME_META complete=1 stage=after-resolve-imports checker=NOT_RUN acceptance=NOT_TESTED'
              complete = (result.status == 'ok' and result.returncode == 86 and result.stdout == ''
                  and len(metadata) == 5 and metadata[-1] == final
                  and [row['sid'] for row in rows] == [5063, 5057, 5058, 5060]
                  and all(row['found'] == 1 and 0 < row['length'] <= 512 and row['length_exact'] for row in rows)
                  and any('label=frontend-after-resolve-imports ' in line for line in heaps)
                  and not any('label=frontend-after-check-decls ' in line or 'label=bound/' in line for line in heaps)
                  and 'ouro_rt: out of memory (' not in result.stderr)
              record.update(status=result.status, rc=result.returncode, elapsed_s=result.elapsed_s,
                  peak_rss_mb=result.peak_rss_mb, peak_rss_measured=False,
                  stdout_bytes=len(result.stdout.encode()), stderr_bytes=len(result.stderr.encode()),
                  diagnostic_complete=complete, metadata_rows=rows, last_heap=heaps[-1] if heaps else None,
                  allocator_oom='ouro_rt: out of memory (' in result.stderr)
              (out/'name-metadata.json').write_text(json.dumps({'records': metadata, 'rows': rows,
                  'diagnostic_complete': complete, 'checker': 'NOT_RUN', 'acceptance': 'NOT_TESTED'}, indent=2)+'\n')
              save()
              assert record['stdout_bytes'] == 0 and record['stderr_bytes'] <= 16*1024*1024
              assert complete, record
          finally:
              os.sched_setaffinity(0, allowed)
              after = bootstrap.current_inputs(Path.cwd(), build.load_config(argparse.Namespace()), build)
              (out/'current-inputs-after.json').write_text(json.dumps(after, indent=2, sort_keys=True)+'\n')
              integrity = {
                  'selected_inputs_unchanged': after == json.loads((out/'current-inputs-before.json').read_text()),
                  'compiler_unchanged': hashlib.sha256(Path('_build/c/ouro1').read_bytes()).hexdigest() == os.environ['HOST_BINARY_SHA256'],
                  'source_inputs_unchanged': all(hashlib.sha256(Path(row['path']).read_bytes()).hexdigest() == row['sha256'] for row in source['inputs']),
                  'tracked_tree_unchanged': not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).strip(),
                  'no_cache_files': not any(path.is_file() for path in Path('_cache').rglob('*')),
              }
              record.update(integrity=integrity)
              save()
              assert all(integrity.values()), integrity
          print('NATIVE_LOWER_NAME_METADATA: diagnostic complete; checker NOT_RUN; acceptance NOT_TESTED')
          raise SystemExit(result.returncode)
          PY

      - name: Preserve actual diagnostic exit names and immutable provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-lower-name-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/ci/native-lower-name-metadata/*.json
            _build/ci/native-lower-name-metadata/*.stdout
            _build/ci/native-lower-name-metadata/*.stderr
            _build/ci/native-lower-name-metadata/*.rc
            _build/ci/native-lower-name-metadata/*.sha256
            _build/ci/native-lower-name-metadata/*.units
            _build/diag-inputs/observer-proof.json
            _build/diag-inputs/payload-proof.json
            _build/diag/native-lower-bounds/diagnostic-manifest.json
            _build/diag/native-lower-bounds/c_build_report.json
            _build/diag/native-lower-bounds/generated_c_shards_report.json
            _build/diag/native-lower-bounds/default-controls.json
            _build/diag/native-lower-bounds/*-good.stdout
            _build/diag/native-lower-bounds/*-good.stderr
            _build/diag/native-lower-bounds/*-bad.stdout
            _build/diag/native-lower-bounds/*-bad.stderr
          if-no-files-found: error
          retention-days: 14
