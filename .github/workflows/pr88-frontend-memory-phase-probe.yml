name: PR88 frontend memory phase probe

on:
  push:
    branches: [codef/pr88-frontend-memory-phase-probe]
    paths: [.github/workflows/pr88-frontend-memory-phase-probe.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr88-frontend-memory-phase-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OURO_CI: "1"
  OURO_REPRODUCIBLE: "1"
  OURO_PACK_STRICT: "1"
  OURO_JOBS: "2"

jobs:
  frontend-memory-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Pin exact reviewed source and measurement owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          source = "973c3a21342e9d6e029479fb33ed7207d010c1bd"
          parent = "a5edb6eb7263b657f1823a12cb842e1f94d6b848"
          workflow = ".github/workflows/pr88-frontend-memory-phase-probe.yml"
          child = git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^") == source
          assert git("diff", "--name-only", "HEAD^", "HEAD").splitlines() == [workflow]
          subprocess.run(["git", "checkout", "--detach", source], check=True)
          assert git("rev-parse", "HEAD^") == parent
          assert git("rev-parse", "HEAD^{tree}") == "2b4b6d86eba6b80060132c4f40ba80bff0106a14"
          assert not git("status", "--porcelain")
          blobs = {
              "runtime/bootstrap.c": "5272a92d85d3f693407ec1f5d0e091fe461f8018",
              "runtime/frontend_link.c": "f10104eb4bc30055dabb3163a82f181c6eae9f1a",
              "runtime/ouro_rt.c": "5fa7a64f29ef9b25f23b9e322d111e7070516b36",
              "runtime/ouro_rt.h": "1d13494869a5a73abf38cc3e3c1fc7cf4ae0aa22",
              "compiler/lexer.ouro": "b73355a657c9cd09dd83d26c36eb128cfe004207",
              "compiler/lower_support.ouro": "5975a3460c1e395b35dd8d298ea77a11c16af5ef",
              "compiler/pipeline_support.ouro": "ce04ad29ec81655e471aab29ad7310b1f6aba384",
              "compiler/pipeline.ouro": "470f65814e57200b02580131a0df786fa74b2e18",
              "compiler/file_check_work.ouro": "ffb661db478eca99c415bdfc3f31403aa3f60d29",
              "scripts/ci_gate.py": "16ea86bf60a3d3347c30af2f562a6b6b500b89ef",
              "scripts/frontend_host_suite.py": "0caab7695c6538e8d455f38802bd886b8f285a40",
              "scripts/frontend_security_suite.sh": "d56a1d3a0770399cd3ec1489a115bb03ffe54cab",
              "scripts/native_tool_build.py": "0e6ebc0d0eb31f773ed8c94dcb0c1ab27285d8ce",
              "scripts/ouro_build.py": "d42206ac82042ab3eddf2542689716e8a0c77cd4",
              "scripts/ourosmith/limits.py": "aa92339539ea580b0a2569d7df7f085f94765156",
              "scripts/ourosmith/exec_child.py": "f04496548bed88cbe99f47eb951e7ece945138b7",
              "scripts/memory_watch.py": "41365c4e4667e52880ddbda90c011f6dd31c7645",
              "scripts/kernel_scale.py": "8317bc5a2f060b8e98d8a79373d29f9a93110b85",
              "scripts/repo_support.py": "212bdfb18a1c25d45d4794afff19e9a0ae46036f",
              "Ouro.seal": "f078fbe47670a948c96a1d8076761c2140455bbe",
          }
          for path, blob in blobs.items():
              assert git("hash-object", path) == blob, path
          out = Path("_build/frontend_memory_phase/reports")
          out.mkdir(parents=True, exist_ok=True)
          (out / "source.json").write_text(json.dumps({"source_sha": source,
              "source_parent": parent, "workflow_sha": child, "blobs": blobs,
              "host_run": 36360415225, "host_artifact": 10946340921,
              "compiler_archive_sha256": "e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7",
              "compiler_input_key": "f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c",
              "compiler_binary_sha256": "460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c"}, indent=2) + "\n")
          print("PROBE_SOURCE: PASS exact source tree and owners")
          PY
      - name: Download official verified reviewed Host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10946340921
          run-id: 36360415225
          github-token: ${{ github.token }}
          path: _build/ci
          merge-multiple: true
      - name: Verify unchanged current input key and canonical import
        run: |
          test "$(python3 scripts/ci_gate.py --compiler-artifact key)" = \
            'key=f555bfcaed518aea0e7bc97f04bc5a00638073c071a8ce37388644c9f766934c'
          python3 scripts/ci_gate.py --compiler-artifact import \
            --compiler-sha256 e72a0940bb011243611bacc8bc348a4352e55c81017ec36e7d9c1ad1e6524da7
          echo '460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c  _build/c/ouro1' | sha256sum -c -
      - name: Measure stock worker at unchanged frontend limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import argparse, hashlib, json, os, re, sys, time

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          import frontend_host_suite as frontend
          import memory_watch
          import ouro_build as build
          from kernel_scale import pin_one_cpu
          from ourosmith.limits import run_limited
          from repo_support import configure_native_stack, sha256_file, write_json_atomic

          work = root / "_build/frontend_memory_phase/work"
          reports = root / "_build/frontend_memory_phase/reports"
          work.mkdir(parents=True)
          configure_native_stack()
          parser = argparse.ArgumentParser()
          build.add_common(parser)
          args = parser.parse_args(["--jobs", "1", "--no-cache", "--ccache", "disabled", "--opt-level", "O0"])
          args.compiler = root / "_build/c/ouro1"
          args.out = work
          args.fuel = 200000
          cfg = build.load_config(args)
          before = frontend.snapshot(args, cfg)
          source_hashes = {str(Path(path).relative_to(root)) if Path(path).is_absolute() else path: digest
                           for path, digest in before["inputs"]["sources"].items()}
          digest = lambda value: hashlib.sha256(json.dumps(value, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          assert len(source_hashes) == 289
          assert digest(source_hashes) == "fb29dbb014b0d7fe8758796e545a3d048c51cf0044bf16977479a8d421dfd4e1"
          units = before["units"]
          assert len(units) == 255 and units[-1] == "tools/native_build.ouro"
          assert digest(units) == "a8e7df9dfba66334c7a06e41576a1ecdcdcb02316dffe10f07a395697df550c0"
          binary_sha = "460904e03e90958461ca1c007505ae76209fdc68727feca32f834f6b0fbe019c"
          assert before["inputs"]["compiler_sha256"] == binary_sha
          write_json_atomic(work / "inputs-before.json", before)
          write_json_atomic(reports / "inputs-before.json", before)
          write_json_atomic(reports / "units.json", {"units": units, "sources": source_hashes})
          cpus = pin_one_cpu()
          assert len(cpus) == 1
          temporary = work / "tmp"
          temporary.mkdir()
          env = dict(os.environ, OURO_JOBS="1", OURO_FRONTEND_JOBS="1", OURO_CACHE="0",
                     OURO_CCACHE="disabled", OURO_MEM_TRACE="1", PYTHONDONTWRITEBYTECODE="1",
                     TEMP=str(temporary), TMP=str(temporary), TMPDIR=str(temporary))
          command = [sys.executable, "-B", str(root / "scripts/frontend_host_suite.py"),
                     "--compiler", str(args.compiler), "--out", str(work.parent), "--jobs", "1",
                     "--worker", "--compiler", str(args.compiler), "--out", str(work),
                     "--jobs", "1", "--no-cache", "--ccache", "disabled", "--opt-level", "O0"]
          label_pattern = re.compile(r"OURO_MEM_HEAP label=(\S+) live_bytes=(\d+) phase_blocks=(\d+) perm_blocks=(\d+) static_blocks=(\d+) total_alloc_bytes=(\d+) reclaimed_bytes=(\d+)")
          fields = ["live_bytes", "phase_blocks", "perm_blocks", "static_blocks", "total_alloc_bytes", "reclaimed_bytes"]
          counts = {"preprocess": 0, "parse": 0}
          offsets, pending = {}, {}
          phases, samples = [], []
          started = time.monotonic()
          result = None
          report = {"kind": "ouro.frontend-memory-phase-probe.v1", "measurement_only": True,
                    "canonical_frontend_verdict": "not run by this diagnostic", "cpu": cpus,
                    "workers": 1, "build_timeout_s": 900, "memory_mib": 3072,
                    "trace": "OURO_MEM_TRACE=1", "stock_command": command}

          def phase_record(line, elapsed):
              match = label_pattern.fullmatch(line)
              if match is None:
                  return None
              label = match.group(1)
              event = {"elapsed_s": round(elapsed, 6), "label": label,
                       **dict(zip(fields, map(int, match.groups()[1:])))}
              for phase, order in [("preprocess", list(reversed(units))), ("parse", units)]:
                  prefix = "frontend-after-" + phase + "-unit"
                  if label == prefix or label.startswith(prefix + "-"):
                      index = counts[phase]
                      assert index < len(order), (label, index)
                      event.update(unit_index=index, unit_path=order[index], completed=label == prefix)
                      if label == prefix:
                          counts[phase] += 1
              return event

          def collect_trace(handle):
              for path in sorted(work.glob("emit.*.err")):
                  offset = offsets.get(path, 0)
                  with path.open("rb") as stream:
                      stream.seek(offset)
                      new = stream.read()
                      offsets[path] = stream.tell()
                  lines = (pending.get(path, b"") + new).split(b"\n")
                  pending[path] = lines.pop()
                  for line in lines:
                      event = phase_record(line.decode("utf-8", errors="replace"), time.monotonic() - started)
                      if event is not None:
                          phases.append(event)
                          handle.write(json.dumps(event, sort_keys=True) + "\n")
                  handle.flush()

          def sample_rss(handle):
              nodes = []
              for pid in memory_watch.process_tree(os.getpid()):
                  try:
                      argv = Path(f"/proc/{pid}/cmdline").read_bytes().split(b"\0")
                      executable = Path(os.fsdecode(argv[0])).name
                  except (OSError, IndexError):
                      continue
                  nodes.append({"pid": pid, "executable": executable,
                                "rss_kib": memory_watch.read_rss_kb(pid)})
              row = {"elapsed_s": round(time.monotonic() - started, 6),
                     "rss_kib": sum(node["rss_kib"] for node in nodes), "nodes": nodes}
              samples.append(row)
              handle.write(json.dumps(row, sort_keys=True) + "\n")
              handle.flush()

          def output_metadata(path):
              return {"name": path.name, "bytes": path.stat().st_size, "sha256": sha256_file(path)}

          try:
              with (reports / "phases.jsonl").open("w") as trace, (reports / "rss.jsonl").open("w") as rss:
                  with ThreadPoolExecutor(max_workers=1) as pool:
                      future = pool.submit(run_limited, command, cwd=root, env=env, timeout_s=900, memory_mb=3072)
                      next_sample = 0.0
                      while not future.done():
                          collect_trace(trace)
                          if time.monotonic() - started >= next_sample:
                              sample_rss(rss)
                              next_sample += 5.0
                          time.sleep(0.25)
                      result = future.result()
                      collect_trace(trace)
                      sample_rss(rss)
              report["stock_result"] = {"status": result.status, "returncode": result.returncode,
                  "elapsed_s": result.elapsed_s, "peak_rss_mb": result.peak_rss_mb,
                  "stdout_bytes": len(result.stdout.encode()), "stdout_sha256": hashlib.sha256(result.stdout.encode()).hexdigest(),
                  "stderr_bytes": len(result.stderr.encode()), "stderr_sha256": hashlib.sha256(result.stderr.encode()).hexdigest()}
              assert phases, "stock emitter produced no internal heap/phase markers"
              assert len(offsets) == 1, sorted(str(path) for path in offsets)
          except Exception as error:
              report["measurement_error"] = str(error)
              raise
          finally:
              report.update(inputs_unchanged=False, compiler_binary_unchanged=False,
                  elapsed_s=round(time.monotonic() - started, 6), completed_units=counts,
                  phase_events=len(phases), last_phase=phases[-1] if phases else None,
                  sampled_peak_kib=max((sample["rss_kib"] for sample in samples), default=None))
              try:
                  after = frontend.snapshot(args, cfg)
                  write_json_atomic(reports / "inputs-after.json", after)
                  report.update(inputs_unchanged=after == before,
                      compiler_binary_unchanged=sha256_file(args.compiler) == binary_sha,
                      compiler_stdout=[output_metadata(path) for path in sorted(work.glob("*.c"))],
                      compiler_stderr=[output_metadata(path) for path in sorted(work.glob("emit.*.err"))])
              except Exception as error:
                  report["finalization_error"] = str(error)
                  raise
              finally:
                  write_json_atomic(reports / "result.json", report)
          assert report["inputs_unchanged"] and report["compiler_binary_unchanged"]
          print("FRONTEND_MEMORY_MEASUREMENT:", result.status, "rc=" + str(result.returncode),
                "phase_events=" + str(len(phases)), "completed_units=" + json.dumps(counts, sort_keys=True))
          raise SystemExit(0 if result.ok else 1)
          PY
      - name: Upload phase counters and source-bound status reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-frontend-memory-phase-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/frontend_memory_phase/reports
          if-no-files-found: error
          retention-days: 14
