name: PR 90 do pure let probe

on:
  push:
    branches: [codef/pr90-do-pure-let-probe]

permissions:
  actions: read
  contents: read

concurrency:
  group: ouro-pr90-do-pure-let-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    if: ${{ github.repository == 'eluvane/ouro' && github.ref == 'refs/heads/codef/pr90-do-pure-let-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_JOBS: '2'
      OURO_C_BUILD_DIR: ${{ github.workspace }}/_build/c
      ARCHIVE_SHA256: 6de89e3a5eb2dd870758661ed7ffe2829a6209a399002c550ed5451b58afc70e
    steps:
      - name: Checkout exact PR 90 source for compiler verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8
          persist-credentials: false

      - name: Download pinned PR 90 host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36326040046-1
          run-id: 36326040046
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _build/ci

      - name: Verify compiler archive and source-bound bootstrap evidence
        run: |
          printf '%s  %s\n' "$ARCHIVE_SHA256" '_build/ci/host-compiler.tar.gz' | sha256sum -c -
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$ARCHIVE_SHA256"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _build/ci/pr90-candidate
          fetch-depth: 3
          persist-credentials: false

      - name: Verify exact candidate lineage and scope
        working-directory: _build/ci/pr90-candidate
        run: |
          test "$(git rev-parse HEAD^)" = d0fbefd15651091015e9330d15f4ad7a6586cbf3
          test "$(git rev-parse HEAD^^)" = 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8
          git diff --check 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8 HEAD
          mkdir -p _build/ci/pr90-do-pure-let
          git diff --name-only 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8 HEAD | sort > _build/ci/pr90-do-pure-let/actual-paths
          printf '%s\n' '.github/workflows/ouro-pr90-do-pure-let-probe.yml' 'compiler/parse_b.ouro' 'tests/language_ergonomics/parser_laws.ouro' | sort > _build/ci/pr90-do-pure-let/expected-paths
          diff -u _build/ci/pr90-do-pure-let/expected-paths _build/ci/pr90-do-pure-let/actual-paths

      # The verified PR 90 compiler compiles candidate sources as a predecessor.
      # This focused probe does not claim a current-source self-hosted bootstrap.
      - name: Compile and run candidate parser laws
        working-directory: _build/ci/pr90-candidate
        run: |
          set -euo pipefail
          sh scripts/build_tool.sh tests/language_ergonomics/parser_laws.ouro _build/ci/pr90-do-pure-let/parser-laws 60000
          _build/ci/pr90-do-pure-let/parser-laws | tee _build/ci/pr90-do-pure-let/parser-laws.log
          grep -Fx ERGO_PARSER_OK _build/ci/pr90-do-pure-let/parser-laws.log

      - name: Compile candidate native test tool
        working-directory: _build/ci/pr90-candidate
        run: sh scripts/build_tool.sh tools/test/main.ouro _build/ci/pr90-do-pure-let/ouro-test 60000

      - name: Run focused do pure let manifest
        working-directory: _build/ci/pr90-candidate
        run: |
          set -euo pipefail
          fixture_root="$(python3 scripts/ouro_smith.py prepare --group manifest --out _build/ci/pr90-do-pure-let/inputs)"
          _build/ci/pr90-do-pure-let/ouro-test \
            --manifest="$fixture_root/manifest.tsv" \
            --prefix=ERGO.expansion-do-pure-let- \
            --root="$fixture_root" \
            --out=_build/ci/pr90-do-pure-let/results \
            --suite-label=ERGONOMICS_SUITE | tee _build/ci/pr90-do-pure-let/manifest.log

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr90-do-pure-let-probe
          path: _build/ci/pr90-candidate/_build/ci/pr90-do-pure-let
          if-no-files-found: error
          retention-days: 7
