name: PR 90 do pure let probe

on:
  push:
    branches: [codef/pr90-do-pure-let-probe]

permissions:
  actions: read
  contents: read

concurrency:
  group: ouro-pr90-do-pure-let-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    if: ${{ github.repository == 'eluvane/ouro' && github.ref == 'refs/heads/codef/pr90-do-pure-let-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: '1'
      OURO_REPRODUCIBLE: '1'
      OURO_PACK_STRICT: '1'
      OURO_JOBS: '2'
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: ${{ github.workspace }}/_build/c
      OURO_CCACHE: disabled
      ARCHIVE_SHA256: 6de89e3a5eb2dd870758661ed7ffe2829a6209a399002c550ed5451b58afc70e
      CANDIDATE_ARCHIVE_SHA256: e43033a82f33de7ca55a2a98ad24053ec7f0663cd8cdd0ff474bd7215ef7c40d
    steps:
      - name: Checkout exact PR 90 source for compiler verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8
          persist-credentials: false

      - name: Download pinned PR 90 host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36326040046-1
          run-id: 36326040046
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _build/ci

      - name: Verify compiler archive and source-bound bootstrap evidence
        run: |
          printf '%s  %s\n' "$ARCHIVE_SHA256" '_build/ci/host-compiler.tar.gz' | sha256sum -c -
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$ARCHIVE_SHA256"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _build/ci/pr90-candidate
          fetch-depth: 9
          persist-credentials: false

      - name: Verify exact candidate lineage and scope
        working-directory: _build/ci/pr90-candidate
        run: |
          test "$(git rev-parse HEAD^)" = 679560483fb2df21d02edf82117adbd6fe50f679
          test "$(git rev-parse HEAD^^)" = f77ef17794f70385576a32957fd272d972b30027
          test "$(git rev-parse HEAD^^^)" = 755a3eae9b3d22e482dc0da15158d0b8263ea0da
          test "$(git rev-parse HEAD^^^^)" = 84b3717de124426d819190924fa4f7ef579a0568
          test "$(git rev-parse HEAD^^^^^)" = 6151ec48977d5d412aba9d32d5c39e745d35dff0
          test "$(git rev-parse HEAD^^^^^^)" = 4626218a847c679dea26f8b9d647b04360719740
          test "$(git rev-parse HEAD^^^^^^^)" = d0fbefd15651091015e9330d15f4ad7a6586cbf3
          test "$(git rev-parse HEAD^^^^^^^^)" = 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ouro-pr90-do-pure-let-probe.yml
          git diff --check 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8 HEAD
          mkdir -p _build/ci/pr90-do-pure-let
          git diff --name-only 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8 HEAD | sort > _build/ci/pr90-do-pure-let/actual-paths
          printf '%s\n' '.github/workflows/ouro-pr90-do-pure-let-probe.yml' 'compiler/parse_b.ouro' 'tests/language_ergonomics/parser_laws.ouro' | sort > _build/ci/pr90-do-pure-let/expected-paths
          diff -u _build/ci/pr90-do-pure-let/expected-paths _build/ci/pr90-do-pure-let/actual-paths

      - name: Download pinned candidate compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr90-do-pure-let-probe
          run-id: 36332858403
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _build/ci/pr90-prior

      - name: Verify and import candidate compiler artifact
        working-directory: _build/ci/pr90-candidate
        env:
          OURO_C_BUILD_DIR: ${{ github.workspace }}/_build/ci/pr90-candidate/_build/c
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/_build/ci/pr90-isolation"
          archive="$GITHUB_WORKSPACE/_build/ci/pr90-prior/pr90-candidate/_build/ci/host-compiler.tar.gz"
          mkdir -p "$report" _build/ci
          test "$OURO_C_BUILD_DIR" = "$PWD/_build/c"
          printf '%s  %s\n' "$CANDIDATE_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          cp "$archive" _build/ci/host-compiler.tar.gz
          python3 scripts/ci_gate.py --compiler-artifact import \
            --compiler-sha256 "$CANDIDATE_ARCHIVE_SHA256" > "$report/candidate-import.log" 2>&1
          sha256sum "$OURO_C_BUILD_DIR/ouro1" > "$report/candidate-compiler-before.sha256"
          cat "$report/candidate-import.log"

      - name: Attribute parser-law error to an import or entry unit
        working-directory: _build/ci/pr90-candidate
        env:
          OURO_C_BUILD_DIR: ${{ github.workspace }}/_build/ci/pr90-candidate/_build/c
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/_build/ci/pr90-isolation"
          test "$OURO_C_BUILD_DIR" = "$PWD/_build/c"
          sha256sum compiler/parser.ouro std/io.ouro \
            tests/language_ergonomics/parser_laws.ouro > "$report/unit-sources.sha256"
          python3 - <<'PY' > "$report/closure-difference.txt"
          import sys
          sys.path.insert(0, "scripts")
          import frontend_regen
          root = set(frontend_regen.collect_units("tests/language_ergonomics/parser_laws.ouro"))
          imports = (set(frontend_regen.collect_units("compiler/parser.ouro"))
                     | set(frontend_regen.collect_units("std/io.ouro")))
          print("law_units=", len(root), "import_units=", len(imports))
          print("root_only=", sorted(root - imports))
          PY
          cat "$report/closure-difference.txt"
          grep -Fxq "root_only= ['tests/language_ergonomics/parser_laws.ouro']" \
            "$report/closure-difference.txt"
          : > "$report/unit-status.txt"
          all_ok=0
          for label in parser io law; do
            case "$label" in
              parser) unit=compiler/parser.ouro ;;
              io) unit=std/io.ouro ;;
              law) unit=tests/language_ergonomics/parser_laws.ouro ;;
            esac
            if sh scripts/ouro1.sh check "$unit" 60000 \
                > "$report/$label-check.log" 2>&1; then
              check_rc=0
            else
              check_rc=$?
            fi
            printf '%s_check_rc=%s\n' "$label" "$check_rc" >> "$report/unit-status.txt"
            if [ "$check_rc" -ne 0 ]; then
              all_ok=1
            fi
            tail -n 8 "$report/$label-check.log"
          done
          sha256sum "$OURO_C_BUILD_DIR/ouro1" > "$report/candidate-compiler-after.sha256"
          cmp "$report/candidate-compiler-before.sha256" "$report/candidate-compiler-after.sha256"
          cat "$report/unit-status.txt"
          exit "$all_ok"

      - name: Upload split evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr90-parser-law-units
          path: |
            _build/ci/pr90-isolation
          if-no-files-found: error
          retention-days: 7
