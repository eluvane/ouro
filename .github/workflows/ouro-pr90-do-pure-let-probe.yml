name: PR 90 do pure let probe

on:
  push:
    branches: [codef/pr90-do-pure-let-probe]

permissions:
  actions: read
  contents: read

concurrency:
  group: ouro-pr90-do-pure-let-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr88_lint_control:
    if: ${{ github.repository == 'eluvane/ouro' && github.ref == 'refs/heads/codef/pr90-do-pure-let-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: '1'
      OURO_REPRODUCIBLE: '1'
      OURO_PACK_STRICT: '1'
      OURO_JOBS: '2'
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: ${{ github.workspace }}/_build/c
      OURO_CCACHE: disabled
      PR88_ARCHIVE_SHA256: 565c82bdf5c0dc9d5afab272db9b75fe800330a62c64fc0658ed9d3d9fc79e9a
    steps:
      - name: Checkout exact PR 88 source at workspace root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 83daa56fafb7aa56ffd5fa9ab687c2d867aa1ddf
          persist-credentials: false

      - name: Download pinned PR 88 host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36334723667-1
          run-id: 36334723667
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _build/ci

      - name: Import source-bound compiler and render exact lint cases
        run: |
          set -euo pipefail
          report=_build/ci/pr88-lint-control
          mkdir -p "$report"
          test "$(git rev-parse HEAD)" = 83daa56fafb7aa56ffd5fa9ab687c2d867aa1ddf
          test "$OURO_C_BUILD_DIR" = "$PWD/_build/c"
          printf '%s  %s\n' "$PR88_ARCHIVE_SHA256" _build/ci/host-compiler.tar.gz | sha256sum -c - > "$report/archive-check.log" 2>&1
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$PR88_ARCHIVE_SHA256" > "$report/import.log" 2>&1
          sha256sum "$OURO_C_BUILD_DIR/ouro1" > "$report/compiler-before.sha256"
          sha256sum compiler/lint.ouro tools/lint_host.ouro compiler/parse_b.ouro tests/language_ergonomics/cases.json tests/language_ergonomics/support.ouro scripts/ourosmith/ergonomics_inputs.py > "$report/source-sha256.txt"
          python3 - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          from ourosmith.ergonomics_inputs import load_cases, render, support_source

          report = Path(sys.argv[1])
          cases = {case["name"]: case for case in load_cases()["positive"]}
          names = ("inferred-helper-parameter-shadows-outer", "parameter-shadows-outer")
          for name in names:
              case = cases[name]
              folder = report / (name + "-lint-candidate")
              folder.mkdir()
              (folder / "support.ouro").write_text(support_source(), encoding="utf-8")
              lint_case = dict(case, source=f'def ergo_expansion_candidate : ({case["type"]}) := {case["sugar"]};')
              (folder / "main.ouro").write_text(render(lint_case, folder), encoding="utf-8")
          (report / "cases.json").write_text(json.dumps([cases[name] for name in names], ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          sha256sum "$report"/*/main.ouro "$report"/*/support.ouro > "$report/fixture-sha256.txt"
          printf '%s  %s\n' bce73f225b50c02b6a906665a707520894705278edaf1030ecb0ab326179d715 "$report/inferred-helper-parameter-shadows-outer-lint-candidate/main.ouro" | sha256sum -c -
          printf '%s  %s\n' f5279fcc205a721f4f556420789185d0cac40eb9afaaa7b9423e8ab6c7c298a7 "$report/parameter-shadows-outer-lint-candidate/main.ouro" | sha256sum -c -
          printf '%s  %s\n' 6e21730627e5844e5990916232a15d7207dd6d4ffaad17139d7d247ff5748c1e "$report/inferred-helper-parameter-shadows-outer-lint-candidate/support.ouro" | sha256sum -c -
          cat "$report/import.log"

      - name: Run exact inferred and explicit helper language lint
        run: |
          set -euo pipefail
          report=_build/ci/pr88-lint-control
          python3 scripts/ouro_build.py build > "$report/build.log" 2>&1
          inferred="$report/inferred-helper-parameter-shadows-outer-lint-candidate/main.ouro"
          explicit="$report/parameter-shadows-outer-lint-candidate/main.ouro"
          if timeout 1200s sh scripts/ouro1.sh lint --family language "$inferred" > "$report/inferred-lint.log" 2>&1; then
            inferred_rc=0
          else
            inferred_rc=$?
          fi
          if timeout 1200s sh scripts/ouro1.sh lint --family language "$explicit" > "$report/explicit-lint.log" 2>&1; then
            explicit_rc=0
          else
            explicit_rc=$?
          fi
          printf 'inferred_lint_rc=%s\nexplicit_lint_rc=%s\n' "$inferred_rc" "$explicit_rc" > "$report/status.txt"
          sha256sum "$OURO_C_BUILD_DIR/ouro1" > "$report/compiler-after.sha256"
          cmp "$report/compiler-before.sha256" "$report/compiler-after.sha256"
          python3 - "$report" <<'PY'
          import re
          import sys
          from pathlib import Path
          report = Path(sys.argv[1])
          status = dict(line.split("=", 1) for line in (report / "status.txt").read_text().splitlines())
          expected = {"inferred": ["OURO-LINT003", "OURO-LINT004"],
                      "explicit": ["OURO-LINT003", "OURO-LINT004", "OURO-LINT004"]}
          for label, codes in expected.items():
              assert status[label + "_lint_rc"] == "1", (label, status)
              output = (report / (label + "-lint.log")).read_text()
              actual = re.findall(r"warning\[(OURO-LINT[0-9]+)\]", output)
              assert actual == codes, (label, actual, output)
              print(label, actual)
          print("PR88_LINT_BASELINE_REPRODUCED")
          PY
          cat "$report/status.txt"
          cat "$report/inferred-lint.log" "$report/explicit-lint.log"

      - name: Upload PR 88 lint control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-inferred-helper-lint-control
          path: _build/ci/pr88-lint-control
          if-no-files-found: error
          retention-days: 7
