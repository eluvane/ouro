name: PR 90 do pure let probe

on:
  push:
    branches: [codef/pr90-do-pure-let-probe]

permissions:
  actions: read
  contents: read

concurrency:
  group: ouro-pr90-do-pure-let-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    if: ${{ github.repository == 'eluvane/ouro' && github.ref == 'refs/heads/codef/pr90-do-pure-let-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: '1'
      OURO_REPRODUCIBLE: '1'
      OURO_PACK_STRICT: '1'
      OURO_JOBS: '2'
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: ${{ github.workspace }}/_build/c
      OURO_CCACHE: disabled
      ARCHIVE_SHA256: 6de89e3a5eb2dd870758661ed7ffe2829a6209a399002c550ed5451b58afc70e
    steps:
      - name: Checkout exact PR 90 source for compiler verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8
          persist-credentials: false

      - name: Download pinned PR 90 host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36326040046-1
          run-id: 36326040046
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _build/ci

      - name: Verify compiler archive and source-bound bootstrap evidence
        run: |
          printf '%s  %s\n' "$ARCHIVE_SHA256" '_build/ci/host-compiler.tar.gz' | sha256sum -c -
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$ARCHIVE_SHA256"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _build/ci/pr90-candidate
          fetch-depth: 6
          persist-credentials: false

      - name: Verify exact candidate lineage and scope
        working-directory: _build/ci/pr90-candidate
        run: |
          test "$(git rev-parse HEAD^)" = 84b3717de124426d819190924fa4f7ef579a0568
          test "$(git rev-parse HEAD^^)" = 6151ec48977d5d412aba9d32d5c39e745d35dff0
          test "$(git rev-parse HEAD^^^)" = 4626218a847c679dea26f8b9d647b04360719740
          test "$(git rev-parse HEAD^^^^)" = d0fbefd15651091015e9330d15f4ad7a6586cbf3
          test "$(git rev-parse HEAD^^^^^)" = 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ouro-pr90-do-pure-let-probe.yml
          git diff --check 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8 HEAD
          mkdir -p _build/ci/pr90-do-pure-let
          git diff --name-only 7fddb024bc5d555a4ea8b37f29e8fe7479e6c3b8 HEAD | sort > _build/ci/pr90-do-pure-let/actual-paths
          printf '%s\n' '.github/workflows/ouro-pr90-do-pure-let-probe.yml' 'compiler/parse_b.ouro' 'tests/language_ergonomics/parser_laws.ouro' | sort > _build/ci/pr90-do-pure-let/expected-paths
          diff -u _build/ci/pr90-do-pure-let/expected-paths _build/ci/pr90-do-pure-let/actual-paths

      # The verified PR 90 compiler compiles candidate sources as a predecessor.
      # This focused probe does not claim a current-source self-hosted bootstrap.
      - name: Compare baseline and candidate parser laws
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/_build/ci/pr90-isolation"
          mkdir -p "$report"
          sha256sum tests/language_ergonomics/parser_laws.ouro compiler/parse_b.ouro \
            _build/ci/pr90-candidate/tests/language_ergonomics/parser_laws.ouro \
            _build/ci/pr90-candidate/compiler/parse_b.ouro > "$report/source-sha256.txt"
          baseline_build_rc=0
          if sh scripts/build_tool.sh tests/language_ergonomics/parser_laws.ouro \
              "$report/baseline-parser-laws" 60000 > "$report/baseline-build.log" 2>&1; then
            baseline_build_rc=0
          else
            baseline_build_rc=$?
          fi
          candidate_build_rc=0
          if (cd _build/ci/pr90-candidate && sh scripts/build_tool.sh \
              tests/language_ergonomics/parser_laws.ouro \
              _build/ci/pr90-do-pure-let/parser-laws 60000) > "$report/candidate-build.log" 2>&1; then
            candidate_build_rc=0
          else
            candidate_build_rc=$?
          fi
          baseline_run_rc=125
          baseline_marker_rc=125
          if [ "$baseline_build_rc" -eq 0 ]; then
            if "$report/baseline-parser-laws" > "$report/baseline-run.log" 2>&1; then
              baseline_run_rc=0
              if grep -Fxq ERGO_PARSER_OK "$report/baseline-run.log"; then
                baseline_marker_rc=0
              else
                baseline_marker_rc=$?
              fi
            else
              baseline_run_rc=$?
            fi
          fi
          candidate_run_rc=125
          candidate_marker_rc=125
          if [ "$candidate_build_rc" -eq 0 ]; then
            if _build/ci/pr90-candidate/_build/ci/pr90-do-pure-let/parser-laws \
                > "$report/candidate-run.log" 2>&1; then
              candidate_run_rc=0
              if grep -Fxq ERGO_PARSER_OK "$report/candidate-run.log"; then
                candidate_marker_rc=0
              else
                candidate_marker_rc=$?
              fi
            else
              candidate_run_rc=$?
            fi
          fi
          printf 'baseline_build_rc=%s\nbaseline_run_rc=%s\nbaseline_marker_rc=%s\ncandidate_build_rc=%s\ncandidate_run_rc=%s\ncandidate_marker_rc=%s\n' \
            "$baseline_build_rc" "$baseline_run_rc" "$baseline_marker_rc" \
            "$candidate_build_rc" "$candidate_run_rc" "$candidate_marker_rc" > "$report/status.txt"
          cat "$report/status.txt"
          tail -n 12 "$report/baseline-build.log"
          tail -n 12 "$report/candidate-build.log"
          test "$baseline_build_rc" -eq 0
          test "$baseline_run_rc" -eq 0
          test "$baseline_marker_rc" -eq 0
          test "$candidate_build_rc" -eq 0
          test "$candidate_run_rc" -eq 0
          test "$candidate_marker_rc" -eq 0

      - name: Compile candidate native test tool
        working-directory: _build/ci/pr90-candidate
        run: sh scripts/build_tool.sh tools/test/main.ouro _build/ci/pr90-do-pure-let/ouro-test 60000

      - name: Run focused do pure let manifest
        working-directory: _build/ci/pr90-candidate
        run: |
          set -euo pipefail
          fixture_root="$(python3 scripts/ouro_smith.py prepare --group manifest --out _build/ci/pr90-do-pure-let/inputs)"
          _build/ci/pr90-do-pure-let/ouro-test \
            --manifest="$fixture_root/manifest.tsv" \
            --prefix=ERGO.expansion-do-pure-let- \
            --root="$fixture_root" \
            --out=_build/ci/pr90-do-pure-let/results \
            --suite-label=ERGONOMICS_SUITE | tee _build/ci/pr90-do-pure-let/manifest.log

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr90-do-pure-let-probe
          path: |
            _build/ci/pr90-candidate/_build/ci/pr90-do-pure-let
            _build/ci/pr90-isolation
          if-no-files-found: error
          retention-days: 7
