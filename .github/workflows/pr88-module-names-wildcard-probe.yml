name: PR88 module names wildcard fixture probe

on:
  push:
    branches: [codef/pr88-module-names-wildcard-fixture]

permissions:
  contents: read
  actions: read

jobs:
  module-names:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source snapshot
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 83daa56fafb7aa56ffd5fa9ab687c2d867aa1ddf
          changed="$(git diff --name-only HEAD^ HEAD)"
          expected="$(printf '.github/workflows/pr88-module-names-wildcard-probe.yml\ntests/compiler_module_names_tests.ouro')"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:tests/compiler_module_names_tests.ouro)" = 7e82658ea78394930d33c652657dc3104a31e1a2
          test "$(git rev-parse HEAD:compiler/ast.ouro)" = 933f1f4cf57e3d72cbafff318957558baedd991b
          test "$(git rev-parse HEAD:compiler/parse_b.ouro)" = 0bba12af2a7180ef958ac5367ef588f260456ca3
          test "$(git rev-parse HEAD:scripts/ci_gate.py)" = 16ea86bf60a3d3347c30af2f562a6b6b500b89ef

      - name: Download source-matching Host compiler
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-compiler-36331124412-1
          run-id: 36331124412
          github-token: ${{ github.token }}
          path: _build/ci

      - name: Verify and install Host compiler
        shell: bash
        run: |
          echo "e337fb7e0780c124ec6fbd2837c07c75f6f963802d0134c7d7751ba505221cfa  _build/ci/host-compiler.tar.gz" | sha256sum -c -
          python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 e337fb7e0780c124ec6fbd2837c07c75f6f963802d0134c7d7751ba505221cfa

      - name: Check module names fixture
        shell: bash
        run: |
          mkdir -p _build/diag-module-names
          rc=0
          sh scripts/ouro1.sh check tests/compiler_module_names_tests.ouro 200000 \
            > _build/diag-module-names/check.out 2> _build/diag-module-names/check.err || rc=$?
          printf '%s\n' "$rc" > _build/diag-module-names/check.rc
          cat _build/diag-module-names/check.out _build/diag-module-names/check.err
          test "$rc" -eq 0
          grep -Fxq CHECK_OK _build/diag-module-names/check.out
          test ! -s _build/diag-module-names/check.err

      - name: Upload module names evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-module-names-wildcard-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: _build/diag-module-names/
