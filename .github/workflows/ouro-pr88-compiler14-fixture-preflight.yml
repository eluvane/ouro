name: PR88 compiler-14 fixture preflight (diagnostic)

on:
  push:
    branches: [codef/pr88-compiler14-fixture-diagnostic]
    paths:
      - .github/workflows/ouro-pr88-compiler14-fixture-preflight.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
      EXPECTED_SOURCE_SHA: 961e6a5ddba21166827df16b6b6704f900c0ce01
      EXPECTED_PARENT_SHA: f99c647627f262a0efabd985ef3e7cf2003371c5
      EXPECTED_DRIVER_BLOB: 69ba2e9c42dbc439d60510ec77a1f7e1d7e0196f
      EXPECTED_LINT_BLOB: a2e26f7d0fbb4541f045650ed23f1ea9a333b39d
      EXPECTED_LINT_HOST_BLOB: 8a1be23bc0561976ac5d8fe7d11618652e0f51c0
    steps:
      - name: Checkout exact test-source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 961e6a5ddba21166827df16b6b6704f900c0ce01
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact source and two-file test delta
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git hash-object tests/compiler_driver_tests.ouro)" = "$EXPECTED_DRIVER_BLOB"
          test "$(git hash-object tests/compiler_native_lint_tests.ouro)" = "$EXPECTED_LINT_BLOB"
          test "$(git hash-object tools/lint_host.ouro)" = "$EXPECTED_LINT_HOST_BLOB"
          changed="$(git diff --name-only HEAD^ HEAD)"
          expected="$(printf 'tests/compiler_driver_tests.ouro\ntests/compiler_native_lint_tests.ouro')"
          test "$changed" = "$expected"

      - name: Build and verify exact host compiler
        run: |
          python3 scripts/ouro_build.py build --verbosity quiet
          python3 scripts/ci_gate.py --compiler-artifact export

      - name: Check the two affected compiler-14 sources
        run: |
          mkdir -p _build/ci/compiler14-preflight
          set +e
          sh scripts/ouro1.sh check tests/compiler_driver_tests.ouro \
            >_build/ci/compiler14-preflight/driver.out \
            2>_build/ci/compiler14-preflight/driver.err
          driver_rc=$?
          sh scripts/ouro1.sh check tests/compiler_native_lint_tests.ouro \
            >_build/ci/compiler14-preflight/native-lint.out \
            2>_build/ci/compiler14-preflight/native-lint.err
          lint_rc=$?
          set -e
          cat _build/ci/compiler14-preflight/driver.out
          cat _build/ci/compiler14-preflight/driver.err >&2
          cat _build/ci/compiler14-preflight/native-lint.out
          cat _build/ci/compiler14-preflight/native-lint.err >&2
          printf 'driver rc=%s; native-lint rc=%s\n' "$driver_rc" "$lint_rc"
          test "$driver_rc" -eq 0
          test "$lint_rc" -eq 0
          grep -Fxq CHECK_OK _build/ci/compiler14-preflight/driver.out
          grep -Fxq CHECK_OK _build/ci/compiler14-preflight/native-lint.out

      - name: Upload preflight reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-compiler14-fixture-preflight
          path: _build/ci/compiler14-preflight/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bootstrap reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr88-compiler14-fixture-bootstrap
          path: |
            _build/bootstrap/**/*.json
            _build/bootstrap/**/*.log
          if-no-files-found: ignore
          retention-days: 7
