name: PR89 record text parser (diagnostic)

on:
  push:
    branches: [codef/pr89-nested-source-probe]
    paths:
      - .github/workflows/ouro-pr89-record-text-parse-probe.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  record-text-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURO_CI: "1"
      OURO_REPRODUCIBLE: "1"
      OURO_PACK_STRICT: "1"
      OURO_JOBS: "2"
      OURO_FRONTEND_JOBS: "1"
      OURO_CACHE_DIR: _cache/ouro
      OURO_BUILD_DIR: _build
      OURO_C_BUILD_DIR: _build/c
      OURO_CCACHE: disabled
    steps:
      - name: Checkout exact fixed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b18bf30bb7f893589a8e56c622c0f3ab04bd4432
          persist-credentials: false

      - name: Verify exact fixed source
        run: |
          test "$(git rev-parse HEAD)" = b18bf30bb7f893589a8e56c622c0f3ab04bd4432
          test "$(git rev-parse HEAD^)" = 3818faab63b4b6a1c4ec7cf08cde0739d4397f8c
          test "$(git hash-object tests/compiler_record_destructure_text.ouro)" = 8e92ae97162a8460298a93bee8819773e493900b
          test "$(git hash-object tests/compiler_record_text_tests.ouro)" = 57a011efd35c051f7e4339f1295677fd8553079c
          test "$(git hash-object compiler/preprocess_record_expr.ouro)" = 10cd42b3641f0398b7b69e38d19f8bbef403cfb5
          test "$(git hash-object runtime/bootstrap.c)" = 5272a92d85d3f693407ec1f5d0e091fe461f8018

      - name: Build and verify matching host compiler
        run: python3 scripts/ouro_build.py build --verbosity quiet

      - name: Export matching host evidence
        id: bundle
        run: python3 scripts/ci_gate.py --compiler-artifact export >> "$GITHUB_OUTPUT"

      - name: Verify and install matching host compiler
        env:
          EXPECTED_BUNDLE_SHA: ${{ steps.bundle.outputs.sha256 }}
        run: python3 scripts/ci_gate.py --compiler-artifact import --compiler-sha256 "$EXPECTED_BUNDLE_SHA"

      - name: Check record text fixture import closure
        run: |
          mkdir -p _build/pr89-record-text
          status=0
          sh scripts/ouro1.sh check tests/compiler_record_text_tests.ouro \
            >_build/pr89-record-text/check.stdout \
            2>_build/pr89-record-text/check.stderr || status=$?
          cat _build/pr89-record-text/check.stdout
          cat _build/pr89-record-text/check.stderr >&2
          test "$status" -eq 0
          grep -Fxq CHECK_OK _build/pr89-record-text/check.stdout

      - name: Upload focused reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr89-record-text-parse
          path: |
            _build/pr89-record-text/*.stdout
            _build/pr89-record-text/*.stderr
            _build/bootstrap/**/*.json
            _build/bootstrap/**/*.log
          if-no-files-found: warn
          retention-days: 7
