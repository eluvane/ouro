name: Performance report
description: Report a reproducible compiler, tool, runtime, memory, or build regression.
title: "performance: "
labels: ["kind/performance", "area/performance", "needs/triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - check or elaboration
        - evaluation or generated program
        - build or bootstrap
        - memory usage
        - formatter, analyzer, linter, or LSP
        - package or documentation tool
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the exact command, input, and whether the run was cold or warm.
      render: shell
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: Measurements
      description: Include elapsed time, peak RSS, baseline commit, and current commit where available.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Operating system, CPU, RAM, C compiler, Python version"
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Reports or profiler output
      description: Attach or paste the smallest relevant report. Remove secrets and unrelated data.
