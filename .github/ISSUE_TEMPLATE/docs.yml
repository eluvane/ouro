name: Documentation issue
description: Report missing, incorrect, outdated, or hard-to-find documentation.
title: "docs: "
labels: ["kind/docs", "area/docs", "needs/triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page or path
      placeholder: "README.md, docs/getting_started.md, or a URL"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is missing, inaccurate, or confusing.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Optional wording, example, or navigation improvement.
