name: Compiler crash or diagnostic failure
description: Report an internal error, crash, hang, or unusable diagnostic.
title: "diagnostic: "
labels: ["kind/diagnostic-ice", "needs/triage"]
body:
  - type: dropdown
    id: failure
    attributes:
      label: Failure type
      options:
        - crash or internal error
        - hang or timeout
        - missing diagnostic
        - wrong source location
        - misleading or incomplete message
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: Paste the smallest source that triggers the failure.
      render: ouro
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Include the exact command and complete output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ouro version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Operating system, C compiler, Python version"
