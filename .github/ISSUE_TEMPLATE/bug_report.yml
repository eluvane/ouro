name: Bug report
description: Report incorrect compiler, runtime, standard-library, package, or tooling behavior.
title: "bug: "
labels: ["kind/bug", "needs/triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - compiler or checker
        - parser or elaborator
        - kernel
        - runtime or standard library
        - formatter, analyzer, linter, or LSP
        - package manager
        - build or CI
        - examples or documentation
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproduction
      description: Include the smallest Ouro source and exact command that show the problem.
      placeholder: |
        sh scripts/ouro1.sh check path/to/example.ouro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the complete diagnostic or relevant log excerpt.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ouro version or commit
      placeholder: "0.1.0 or commit SHA"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Operating system, C compiler, Python version"
