name: Language proposal
description: Propose a change to Ouro syntax, semantics, types, modules, or effects.
title: "proposal: "
labels: ["kind/proposal", "area/language", "needs/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Show the programming problem in current Ouro.
      render: ouro
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include syntax or typing examples where useful.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: What existing code, tools, or artifacts would change?
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Kernel or trust-boundary impact
      description: State whether the proposal changes core rules, runtime assumptions, or generated artifacts.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
