changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking language / CLI changes
      labels:
        - risk/breaking-change
    - title: Compiler, kernel, and TCB
      labels:
        - area/compiler
        - area/kernel
        - risk/tcb
    - title: Tooling, stdlib, docs
      labels:
        - area/tooling
        - area/std
        - area/docs
    - title: Build, CI, release engineering
      labels:
        - area/ci
        - area/release
        - kind/dependency
    - title: Other changes
      labels:
        - "*"
